  <!-- ═══════════════════════════════════════════════════════════════════════
       PAGE LOAD INITIALIZATION
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
    // Show app container once DOM is ready
    document.addEventListener('DOMContentLoaded', function () {
      const container = document.getElementById('app-container');
      if (container) {
        container.classList.add('loaded');
      }

      // Dark mode toggle logic
      const THEME_KEY = 'maharaja-erp-theme';
      const html = document.documentElement;
      const toggleBtn = document.getElementById('dark-mode-toggle');
      const moonIcon = document.getElementById('dm-icon-moon');
      const sunIcon = document.getElementById('dm-icon-sun');

      function isDark() {
        return html.getAttribute('data-theme') === 'dark';
      }

      function syncToggleIcon() {
        if (!toggleBtn) return;
        if (isDark()) {
          moonIcon.style.display = 'none';
          sunIcon.style.display = '';
          toggleBtn.title = 'Switch to Light Mode';
        } else {
          moonIcon.style.display = '';
          sunIcon.style.display = 'none';
          toggleBtn.title = 'Switch to Dark Mode';
        }
      }

      if (toggleBtn) {
        syncToggleIcon();
        toggleBtn.addEventListener('click', function () {
          document.body.classList.add('theme-transitioning');
          if (isDark()) {
            html.removeAttribute('data-theme');
            localStorage.setItem(THEME_KEY, 'light');
          } else {
            html.setAttribute('data-theme', 'dark');
            localStorage.setItem(THEME_KEY, 'dark');
          }
          syncToggleIcon();
          setTimeout(() => {
            document.body.classList.remove('theme-transitioning');
          }, 350);
        });
      }

      // Sidebar collapse/expand logic
      const SIDEBAR_KEY = 'maharaja-erp-sidebar-collapsed';
      const sidebar = document.getElementById('app-sidebar');
      const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
      const sidebarBackdrop = document.getElementById('sidebar-backdrop');
      const MOBILE_BREAKPOINT = 768;

      function isMobile() {
        return window.innerWidth <= MOBILE_BREAKPOINT;
      }

      function openMobileSidebar() {
        sidebar.classList.add('mobile-open');
        sidebarBackdrop.classList.add('show');
        sidebarToggleBtn.setAttribute('aria-expanded', 'true');
      }

      function closeMobileSidebar() {
        sidebar.classList.remove('mobile-open');
        sidebarBackdrop.classList.remove('show');
        sidebarToggleBtn.setAttribute('aria-expanded', 'false');
      }

      if (sidebar && sidebarToggleBtn) {
        // Restore collapsed state on desktop (mobile always starts closed)
        if (!isMobile() && localStorage.getItem(SIDEBAR_KEY) === 'true') {
          sidebar.classList.add('collapsed');
          sidebarToggleBtn.setAttribute('aria-expanded', 'false');
        }

        sidebarToggleBtn.addEventListener('click', function () {
          if (isMobile()) {
            sidebar.classList.contains('mobile-open') ? closeMobileSidebar() : openMobileSidebar();
          } else {
            const collapsed = sidebar.classList.toggle('collapsed');
            sidebarToggleBtn.setAttribute('aria-expanded', String(!collapsed));
            localStorage.setItem(SIDEBAR_KEY, String(collapsed));
          }
        });

        sidebarBackdrop.addEventListener('click', closeMobileSidebar);

        // Auto-close the mobile drawer after picking a tab
        sidebar.addEventListener('click', function (e) {
          if (isMobile() && e.target.closest('[data-action="show-tab"]')) {
            closeMobileSidebar();
          }
        });
      }
    });

    // Handle page unload warnings for unsaved changes
    window.addEventListener('beforeunload', function (e) {
      // Add logic here if needed to warn about unsaved changes
      // e.preventDefault();
      // e.returnValue = 'You have unsaved changes!';
    });
  </script>
