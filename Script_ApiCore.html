<script>
  'use strict';
  // Script_ApiCore.html — tiny pieces shared, unchanged, by BOTH the desktop
  // (Script_Core.html/Script_PO.html) and mobile (Mobile_Script.html)
  // shells. Included by both Index.html (before Script_Core.html) and
  // Mobile_Index.html (before Mobile_Script.html).

  // The one google.script.run Promise wrapper — desktop's Api.call and
  // mobile's MApp.Api.call were byte-identical copies of this same
  // function (see Phase 4's dedupe guideline).
  function _apiCall(method, ...args) {
    return new Promise((resolve, reject) => {
      try {
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject);

        if (typeof runner[method] !== 'function') {
          reject(new Error(`Backend method "${method}" is unavailable.`));
          return;
        }

        runner[method](...args);
      } catch (err) {
        reject(err);
      }
    });
  }

  // Mirrors config.js#PO_STATUS (server) exactly — the one client-side copy
  // of the 3 status strings module_po.js#_attachPoStatus derives from the
  // Bill ledger. Badge/chip classes and filter logic in both shells key off
  // this instead of repeating the literal strings.
  const PO_STATUS = Object.freeze({
    ISSUED: 'PO Issued',
    PARTIAL: 'Partially Received',
    COMPLETED: 'Completed'
  });
</script>
