<!--
  Mobile_Views.html — screen & sheet markup for the mobile shell.

  Two kinds of content live here:
  1. Tab-root screens: <template id="tpl-*"> — cloned into #mapp-content
     by MApp.Shell.showTab() on every tab switch, so each visit starts
     from a clean skeleton state.
  2. Sheets/pickers: plain top-level <div class="mb-sheet"> — persistent,
     full-viewport overlays (they sit above the tab bar, so a tab can't be
     switched out from under one) opened via MApp.Sheet.open()/close().
-->

<!-- Shared backdrop behind every open sheet -->
<div class="mb-sheet-backdrop" id="mapp-sheet-backdrop"></div>

<!-- ═══════════════════════════════════════════════════════════════════
     GENERIC FULL-SCREEN SEARCHABLE PICKER
     Driven by MApp.Picker.open({title, items, selectedValue, searchable})
     — replaces Select2 everywhere in the mobile bundle per the "no
     Select2 in mobile" rule.
     ═══════════════════════════════════════════════════════════════════ -->
<div class="mb-sheet mb-picker-screen" id="mapp-picker-sheet" role="dialog" aria-modal="true">
  <div class="mb-sheet-header">
    <h2 id="mapp-picker-title">Choose</h2>
    <button type="button" class="mapp-topbar-btn" aria-label="Close" onclick="MApp.Picker.cancel()">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="mb-sheet-body">
    <div id="mapp-picker-search-wrap" style="padding:var(--mb-sp-4) var(--mb-sp-4) 0;">
      <div class="mb-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="mapp-picker-search" placeholder="Search..." oninput="MApp.Picker.onSearch(this.value)" autocomplete="off">
      </div>
    </div>
    <div id="mapp-picker-list"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════

     ═══════════════════════════════════════════════════════════════════ -->
<div class="mb-sheet" id="sheet-stock-adjust" role="dialog" aria-modal="true">
  <div class="mb-sheet-header">
    <h2>Adjust Stock</h2>
    <button type="button" class="mapp-topbar-btn" aria-label="Close" onclick="MApp.Stock.closeAdjustSheet()">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="mb-sheet-body" id="stock-adjust-body">
    <div class="mb-offline-banner" style="background:var(--mb-safety-faint);color:var(--mb-ink);margin-bottom:var(--mb-sp-4);">
      <span>Use this only to correct stock errors (e.g. after a physical recount). The correction is logged in the audit log.</span>
    </div>
    <div class="mb-field">
      <label>Item</label>
      <input type="text" id="stock-adjust-item-label" readonly>
    </div>
    <div class="mb-field">
      <label>Current stock (system value)</label>
      <input type="text" id="stock-adjust-old-value" readonly>
    </div>
    <div class="mb-field">
      <label for="stock-adjust-new-value">Corrected stock value</label>
      <input type="number" id="stock-adjust-new-value" inputmode="decimal" step="any">
    </div>
    <div class="mb-field">
      <label for="stock-adjust-reason">Reason for adjustment</label>
      <textarea id="stock-adjust-reason" rows="2" placeholder="e.g. Physical recount found 49 units"></textarea>
    </div>
  </div>
  <div class="mb-sheet-footer">
    <button type="button" class="mb-btn mb-btn-primary" id="stock-adjust-save-btn" onclick="MApp.Stock.submitAdjust()">Save Correction</button>
  </div>
</div>

     ═══════════════════════════════════════════════════════════════════ -->
<div class="mb-sheet" id="sheet-po-ledger" role="dialog" aria-modal="true">
  <div class="mb-sheet-header">
    <h2>PO Ledger</h2>
    <button type="button" class="mapp-topbar-btn" aria-label="Close" onclick="MApp.PO.closeLedgerSheet()">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="mb-sheet-body">
    <div class="mb-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="po-ledger-search" placeholder="Search PO number or vendor..." oninput="MApp.PO.onSearch(this.value)" autocomplete="off">
    </div>
    <!-- The 3 literal data-status/onclick values below must match
         config.js#PO_STATUS (server) and its client mirror in
         Script_ApiCore.html#PO_STATUS exactly — static markup can't
         reference that JS constant directly. -->
    <div class="mb-filter-chip-row" id="po-ledger-status-bar">
      <button type="button" class="mb-filter-chip active" data-status="all" onclick="MApp.PO.filterByStatus('all')">All</button>
      <button type="button" class="mb-filter-chip" data-status="PO Issued" onclick="MApp.PO.filterByStatus('PO Issued')">PO Issued</button>
      <button type="button" class="mb-filter-chip" data-status="Partially Received" onclick="MApp.PO.filterByStatus('Partially Received')">Partial</button>
      <button type="button" class="mb-filter-chip" data-status="Completed" onclick="MApp.PO.filterByStatus('Completed')">Completed</button>
    </div>
    <div id="po-ledger-list"></div>
  </div>
  <button type="button" class="mb-fab" onclick="MApp.PO.openNewSheet()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    New PO
