<script>
  'use strict';
  // Script_Dispatch.html -- App.Dispatch

    // ==========================================
    // DISPATCH NAMESPACE
    // ==========================================
    App.State.globalReadyToDispatch = [];
    App.State.filteredReadyToDispatch = [];
    // globalDispatch stays a FLAT array — one entry per line item, exactly
    // the shape getDispatchData() returns — so every other consumer
    // (Client Ledger dispatch history, dashboard trend/activity,
    // recalculateWarehousePool's server-side reads) keeps working unchanged
    // even though one Dispatch Number can now span several line-item rows
    // ("bills"). globalDispatchBills/filteredDispatchBills are a client-side
    // grouping of that flat array, by Dispatch Number, used only to render
    // the Dispatched Goods ledger as one row per bill (mirrors Client
    // Orders' header+lines PI/Estimate list).
    App.State.globalDispatch = [];
    App.State.globalDispatchBills = [];
    App.State.filteredDispatchBills = [];
    // Set only while editing a bill — this bill's own per-product qty
    // (already-saved, about to be replaced), added back onto the
    // Ready-to-Dispatch "Available" hint shown per item row so editing a
    // bill doesn't show a falsely-low number for its own products.
    App.State.dispatchEditOriginalQtyByProduct = {};

    App.Dispatch = {
      async enterTab() {
        const fetches = [
          App.Contractor.ensureLoaded(),
          this.loadReadyData(),
          this.loadDispatchData()
        ];

        if (!App.State.globalOrders || !App.State.globalOrders.length) {
          fetches.push(
            Api.call('getClientOrdersData')
              .then(res => { if (res.success) App.State.globalOrders = res.data; })
              .catch(() => { /* Ignored — order dropdown will simply be empty until PI/Estimates load elsewhere. */ })
          );
        }
        if (!App.State.globalClients || !App.State.globalClients.length) {
          fetches.push(
            Api.call('getClientsData')
              .then(res => { if (res.success) App.State.globalClients = res.data; })
              .catch(() => { /* Ignored — client dropdown will simply be empty until Clients load elsewhere. */ })
          );
        }

        await Promise.all(fetches);

        this.switchSubTab('readyToDispatchSubTab');
      },

      switchSubTab(id) {
        $$('.dispatch-sub-tab').forEach(t => t.style.display = 'none');
        const target = document.getElementById(id);
        if (target) target.style.display = 'block';

        $$('#dispatchSubTabs .nav-link').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + id)?.classList.add('active');
      },

      // ── Ready to Dispatch ──────────────────────────────────────
      async loadReadyData() {
        const tbody = document.getElementById('readyToDispatchTableBody');
        if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4">Loading Ready to Dispatch Data...</td></tr>';

        try {
          const response = await Api.call('getReadyToDispatchData');
          if (!response.success) {
            App.Utils.showToast(response.message, true);
            return;
          }
          App.State.globalReadyToDispatch = response.data;
          App.State.filteredReadyToDispatch = response.data;
          this.renderReadyTable();
        } catch (err) {
          App.Utils.showToast(err.message || 'Failed to load Ready to Dispatch data', true);
        }
      },

      filterReady(searchTerm) {
        const term = String(searchTerm || '').toLowerCase().trim();
        App.State.filteredReadyToDispatch = term
          ? App.State.globalReadyToDispatch.filter(r => App.Utils.matchesKeywords(`${r.productId} ${r.productName}`, term))
          : App.State.globalReadyToDispatch;
        this.renderReadyTable();
      },

      renderReadyTable() {
        const tbody = document.getElementById('readyToDispatchTableBody');
        if (!tbody) return;

        const emptyState = document.getElementById('readyToDispatchEmptyState');
        if (App.State.filteredReadyToDispatch.length === 0) {
          tbody.innerHTML = '';
          if (emptyState) emptyState.style.display = 'block';
          return;
        }
        if (emptyState) emptyState.style.display = 'none';

        let html = '';
        App.State.filteredReadyToDispatch.forEach(r => {
          const readyClass = r.readyQty > 0 ? 'text-success fw-bold' : 'text-muted';
          // A Product Tag stays ONE aggregate row here even when it spans
          // several Completed lots logged under different Colors to
          // Produce combinations (e.g. one batch "Blue-White / BCP",
          // another "Red-White / Black") — the row itself never splits by
          // color (see getReadyToDispatchData), but the operator still
          // needs to see which color batch they're actually about to
          // dispatch. Only worth a button when there's real color info to
          // show: 2+ distinct entries, or a single one that isn't just the
          // blank/untagged bucket.
          const breakdown = r.colorBreakdown || [];
          const hasColorInfo = breakdown.length > 1 || (breakdown.length === 1 && breakdown[0].color);
          const colorsCell = hasColorInfo
            ? `<button type="button" class="btn btn-sm btn-outline-dark" onclick="App.Dispatch.openColorBreakdown('${escapeHtml(r.productId)}')">
                 <i class="bi bi-palette me-1"></i>${breakdown.length}
               </button>`
            : '<span class="text-muted">&#8211;</span>';
          html += `<tr>
        <td><span class="badge bg-dark fs-6 shadow-sm">${escapeHtml(r.productId)}</span></td>
        <td><strong>${escapeHtml(r.productName)}</strong></td>
        <td class="text-center">${App.Production.formatQty(r.producedQty)}</td>
        <td class="text-center">${App.Production.formatQty(r.dispatchedQty)}</td>
        <td class="text-center ${readyClass}">${App.Production.formatQty(r.readyQty)}</td>
        <td class="text-center">${colorsCell}</td>
        <td class="text-center">
          <button class="btn btn-sm btn-success btn-action" ${r.readyQty > 0 ? '' : 'disabled'} onclick="App.Dispatch.openCreateDispatchModal('${escapeHtml(r.productId)}')">Add to Bill</button>
        </td>
      </tr>`;
        });

        tbody.innerHTML = html;
      },

      // Read-only detail popup for one Product Tag's own color makeup —
      // see getReadyToDispatchData's colorBreakdown. Reads straight from
      // the already-loaded globalReadyToDispatch (no extra API round trip)
      // since the breakdown is already included in that same response.
      openColorBreakdown(productId) {
        const record = (App.State.globalReadyToDispatch || []).find(r => r.productId === productId);
        if (!record) return;

        const titleEl = document.getElementById('dispatchColorBreakdownTitle');
        if (titleEl) titleEl.innerText = `Color Breakdown: ${record.productName} (${record.productId})`;

        const body = document.getElementById('dispatchColorBreakdownBody');
        if (body) {
          const rows = (record.colorBreakdown || []).map(c => {
            const readyClass = c.readyQty > 0 ? 'text-success fw-bold' : 'text-muted';
            const colorCell = c.color
              ? `<span class="badge bg-info text-dark">${escapeHtml(c.color)}</span>`
              : '<span class="text-muted">&#8211; (no color recorded)</span>';
            return `<tr>
          <td>${colorCell}</td>
          <td class="text-center">${App.Production.formatQty(c.producedQty)}</td>
          <td class="text-center">${App.Production.formatQty(c.dispatchedQty)}</td>
          <td class="text-center ${readyClass}">${App.Production.formatQty(c.readyQty)}</td>
        </tr>`;
          }).join('');
          body.innerHTML = rows || '<tr><td colspan="4" class="text-center text-muted p-3">No color data recorded for this product.</td></tr>';
        }

        safeModalShow('dispatchColorBreakdownModal');
      },

      // ── Dispatched Goods ───────────────────────────────────────
      // Groups the flat globalDispatch array (one entry per line item) into
      // one object per Dispatch Number, for the ledger table's one-row-per-
      // bill display — same header+lines shape as Client Orders' globalOrders,
      // just derived client-side instead of returned pre-grouped by the
      // server (getDispatchData() stays flat so every other consumer of it
      // is unaffected by the multi-item-bill change).
      buildDispatchBills() {
        const map = new Map();
        const order = [];
        (App.State.globalDispatch || []).forEach(d => {
          if (!map.has(d.dispatchNumber)) {
            map.set(d.dispatchNumber, {
              dispatchNumber: d.dispatchNumber,
              dispatchDate: d.dispatchDate,
              dateRaw: d.dateRaw,
              orderNumber: d.orderNumber,
              clientName: d.clientName,
              transport: d.transport,
              remarks: d.remarks,
              invoiceNumber: d.invoiceNumber,
              privateMark: d.privateMark,
              grNumber: d.grNumber,
              logisticsContractor: d.logisticsContractor,
              items: [],
              totalQty: 0,
              totalAmount: 0,
              totalLogisticsCost: 0
            });
            order.push(d.dispatchNumber);
          }
          const bill = map.get(d.dispatchNumber);
          bill.items.push(d);
          bill.totalQty += (Number(d.qty) || 0);
          bill.totalAmount += (Number(d.amount) || 0);
          bill.totalLogisticsCost += (Number(d.logisticsCost) || 0);
        });
        App.State.globalDispatchBills = order.map(num => map.get(num));
      },

      async loadDispatchData() {
        const tbody = document.getElementById('dispatchTableBody');
        if (tbody) tbody.innerHTML = '<tr><td colspan="12" class="text-center p-4">Loading Dispatched Goods...</td></tr>';

        try {
          const response = await Api.call('getDispatchData');
          if (!response.success) {
            App.Utils.showToast(response.message, true);
            return;
          }
          App.State.globalDispatch = response.data;
          this.buildDispatchBills();
          App.State.filteredDispatchBills = App.State.globalDispatchBills;
          App.State.dispatchCurrentPage = 1;
          App.State.dispatchSortBy = App.State.dispatchSortBy || 'dateDesc';
          App.State.selectedDispatch = [];
          this.sortFilteredDispatch();
          this.renderDispatchTable();
        } catch (err) {
          App.Utils.showToast(err.message || 'Failed to load dispatch data', true);
        }
      },

      filterDispatch(searchTerm) {
        const term = String(searchTerm || '').toLowerCase().trim();
        App.State.filteredDispatchBills = term
          ? App.State.globalDispatchBills.filter(b => {
              const itemsHaystack = b.items.map(it => `${it.productId} ${it.productName}`).join(' ');
              return App.Utils.matchesKeywords(
                `${b.dispatchNumber} ${b.orderNumber} ${b.clientName} ${itemsHaystack} ${b.dispatchDate || ''} ${b.transport || ''} ${b.invoiceNumber || ''} ${b.grNumber || ''} ${b.logisticsContractor || ''}`,
                term
              );
            })
          : App.State.globalDispatchBills;
        this.sortFilteredDispatch();
        App.State.dispatchCurrentPage = 1;
        this.renderDispatchTable();
      },

      // Field/direction combos selectable via the "Sort by" dropdown
      // (View_Dispatch.html#dispatchSortBy). Applied to filteredDispatchBills
      // after every filter pass, before the pagination slice in renderDispatchTable.
      DISPATCH_SORT_COMPARATORS: {
        dateDesc: (a, b) => parseRecordDate(b.dateRaw, b.dispatchDate) - parseRecordDate(a.dateRaw, a.dispatchDate),
        dateAsc: (a, b) => parseRecordDate(a.dateRaw, a.dispatchDate) - parseRecordDate(b.dateRaw, b.dispatchDate),
        clientAsc: (a, b) => String(a.clientName || '').localeCompare(String(b.clientName || '')),
        clientDesc: (a, b) => String(b.clientName || '').localeCompare(String(a.clientName || '')),
        qtyDesc: (a, b) => (b.totalQty || 0) - (a.totalQty || 0),
        qtyAsc: (a, b) => (a.totalQty || 0) - (b.totalQty || 0),
        dispatchNumberDesc: (a, b) => (parseInt(String(b.dispatchNumber).replace(/\D/g, ''), 10) || 0) - (parseInt(String(a.dispatchNumber).replace(/\D/g, ''), 10) || 0),
        dispatchNumberAsc: (a, b) => (parseInt(String(a.dispatchNumber).replace(/\D/g, ''), 10) || 0) - (parseInt(String(b.dispatchNumber).replace(/\D/g, ''), 10) || 0)
      },

      sortFilteredDispatch() {
        const cmp = this.DISPATCH_SORT_COMPARATORS[App.State.dispatchSortBy];
        if (cmp) App.State.filteredDispatchBills.sort(cmp);
      },

      sortDispatchBy(value) {
        App.State.dispatchSortBy = value;
        this.sortFilteredDispatch();
        App.State.dispatchCurrentPage = 1;
        this.renderDispatchTable();
      },

      changeDispatchPage(page) {
        App.State.dispatchCurrentPage = App.Utils.clampPage(page, App.State.filteredDispatchBills.length, App.State.dispatchRowsPerPage);
        this.renderDispatchTable();
      },

      renderDispatchTable() {
        const tbody = document.getElementById('dispatchTableBody');
        if (!tbody) return;

        const emptyState = document.getElementById('dispatchEmptyState');
        if (App.State.filteredDispatchBills.length === 0) {
          tbody.innerHTML = '';
          if (emptyState) emptyState.style.display = 'block';
          App.Utils.renderPagination('dispatchPagination', 0, 1, App.State.dispatchRowsPerPage, 'dispatch-page', 'Dispatch Bills');
          this.updateDispatchBulkButtons();
          return;
        }
        if (emptyState) emptyState.style.display = 'none';

        const { filteredDispatchBills, dispatchCurrentPage: cur, dispatchRowsPerPage: rpp } = App.State;
        const start = (cur - 1) * rpp;
        const pageItems = filteredDispatchBills.slice(start, start + rpp);

        const selectAllChk = document.getElementById('selectAllDispatch');
        if (selectAllChk) {
          selectAllChk.checked = pageItems.length > 0 &&
            pageItems.every(b => App.Selection.isSelected(App.State.selectedDispatch, b.dispatchNumber));
        }

        let html = '';
        pageItems.forEach(b => {
          html += this.billRowHtml(b);
        });

        tbody.innerHTML = html;

        App.Utils.renderPagination('dispatchPagination', filteredDispatchBills.length, cur, rpp, 'dispatch-page', 'Dispatch Bills');
        this.updateDispatchBulkButtons();
      },

      // Renders one <tr> for a dispatch bill (one Dispatch Number, one-or-
      // more items). Shared by renderDispatchTable's full rebuild and
      // patchBillInPlace's single-row swap below.
      billRowHtml(bill) {
        const key = bill.dispatchNumber;
        const checked = App.Selection.isSelected(App.State.selectedDispatch, key) ? 'checked' : '';
        const itemsSummary = (bill.items || [])
          .map(it => `${escapeHtml(it.productName)} <span class="text-muted">x${App.Production.formatQty(it.qty)}</span>${it.rate ? ` <span class="text-muted">@ ${formatCurrency(it.rate)}</span>` : ''}`)
          .join('<br>');

        return `<tr data-key="${escapeHtml(key)}">
        <td class="text-center">
          <input type="checkbox" class="form-check-input dispatch-select-chk" data-key="${escapeHtml(key)}" ${checked} onchange="App.Dispatch.onDispatchRowSelectChange()">
        </td>
        <td><span class="badge bg-dark fs-6 shadow-sm">${escapeHtml(bill.dispatchNumber)}</span></td>
        <td>${escapeHtml(bill.dispatchDate)}</td>
        <td>${bill.orderNumber ? escapeHtml(bill.orderNumber) : '<span class="text-muted">&mdash;</span>'}</td>
        <td>${escapeHtml(bill.clientName) || '-'}</td>
        <td><small>${itemsSummary || '-'}</small></td>
        <td class="text-center fw-bold">${App.Production.formatQty(bill.totalQty)}</td>
        <td class="text-end">${bill.totalAmount ? formatCurrency(bill.totalAmount) : '<span class="text-muted">&mdash;</span>'}</td>
        <td>${escapeHtml(bill.transport) || '-'}</td>
        <td><small>${bill.invoiceNumber ? `Inv: ${escapeHtml(bill.invoiceNumber)}` : '<span class="text-muted">No Invoice #</span>'}${bill.grNumber ? `<br>GR: ${escapeHtml(bill.grNumber)}` : ''}</small></td>
        <td class="text-end">${bill.totalLogisticsCost ? `${formatCurrency(bill.totalLogisticsCost)}<br><small class="text-muted">${escapeHtml(bill.logisticsContractor)}</small>` : '<span class="text-muted">&mdash;</span>'}</td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-dark btn-action w-100 mb-1" onclick="App.Dispatch.print('${escapeHtml(key)}')">Print Challan</button>
          <button class="btn btn-sm btn-outline-primary btn-action w-100 mb-1" onclick="App.Dispatch.openEditDispatchModal('${escapeHtml(key)}')">Edit</button>
          <button class="btn btn-sm btn-danger btn-action w-100" onclick="App.Dispatch.delete('${escapeHtml(key)}')">Delete</button>
        </td>
      </tr>`;
      },

      // Patches one already-loaded bill's data + its rendered <tr> after an
      // edit save, instead of a full loadDispatchData() reload — see
      // App.Production.patchRowInPlace's doc comment (Script_Production.html)
      // for the full rationale/trade-offs this mirrors. Dispatch Number is
      // stable across an in-place edit (only the underlying sheet rows are
      // replaced), so it's a safe key. Returns false — caller should fall
      // back to loadDispatchData() — if the bill isn't currently loaded or
      // isn't on the displayed page.
      patchBillInPlace(freshRows) {
        if (!freshRows || !freshRows.length) return false;
        const dispatchNumber = freshRows[0].dispatchNumber;

        const firstOldIdx = App.State.globalDispatch.findIndex(d => d.dispatchNumber === dispatchNumber);
        if (firstOldIdx === -1) return false;

        const withoutOld = App.State.globalDispatch.filter(d => d.dispatchNumber !== dispatchNumber);
        withoutOld.splice(firstOldIdx, 0, ...freshRows);
        App.State.globalDispatch = withoutOld;
        this.buildDispatchBills();

        const freshBill = App.State.globalDispatchBills.find(b => b.dispatchNumber === dispatchNumber);
        if (!freshBill) return false;

        const existingIdx = App.State.filteredDispatchBills.findIndex(b => b.dispatchNumber === dispatchNumber);
        if (existingIdx === -1) return false;
        App.State.filteredDispatchBills[existingIdx] = freshBill;

        const tr = document.querySelector(`#dispatchTableBody tr[data-key="${dispatchNumber}"]`);
        if (!tr) return false;

        tr.outerHTML = this.billRowHtml(freshBill);
        return true;
      },

      toggleSelectAllDispatch(masterChk) {
        App.Selection.toggleAll(App.State.selectedDispatch, 'dispatch-select-chk', masterChk);
        this.updateDispatchBulkButtons();
      },

      onDispatchRowSelectChange() {
        App.Selection.syncFromRows(App.State.selectedDispatch, 'dispatch-select-chk', 'selectAllDispatch');
        this.updateDispatchBulkButtons();
      },

      updateDispatchBulkButtons() {
        const count = App.State.selectedDispatch.length;
        App.Selection.updateButton('btnBulkDeleteDispatch', count, '<i class="bi bi-trash"></i> Delete Selected');
        App.Selection.updateButton('btnBulkPrintDispatch', count, '<i class="bi bi-printer"></i> Print Selected');
        App.Selection.updateButton('btnBulkDownloadPdfDispatch', count, '<i class="bi bi-file-earmark-pdf"></i> Download PDFs');
      },

      // Populates #print-dispatch-container's fields from one Dispatch bill
      // (identified by Dispatch Number) for the per-row "Print Challan"
      // button — a GST delivery challan, since goods physically leave the
      // factory on a Dispatch. Consignee address/GSTIN aren't stored on the
      // Dispatch row itself (only clientName is), so they're looked up from
      // Client Master here. One <tr> per item line, same table used for a
      // single-item bill as a multi-item one.
      populateDispatchPrintData(dispatchNumber) {
        const bill = (App.State.globalDispatchBills || []).find(b => b.dispatchNumber === dispatchNumber);
        if (!bill) return null;

        const setText = (id, val) => {
          const el = document.getElementById(id);
          if (el) el.innerText = val ?? '';
        };

        const client = (App.State.globalClients || []).find(c => App.Utils.sameText(c.name, bill.clientName));

        setText('print-dispatch-number', bill.dispatchNumber || '');
        setText('print-dispatch-date', bill.dispatchDate || '');
        setText('print-dispatch-client', bill.clientName || '');
        setText('print-dispatch-client-address', client?.address || '');
        setText('print-dispatch-client-gstin', client?.gstin || '');
        setText('print-dispatch-transport', bill.transport || '');
        setText('print-dispatch-order-ref', bill.orderNumber || '');

        const grRefParts = [];
        if (bill.invoiceNumber) grRefParts.push(`Inv: ${bill.invoiceNumber}`);
        if (bill.grNumber) grRefParts.push(`GR: ${bill.grNumber}`);
        setText('print-dispatch-gr-ref', grRefParts.join(' | '));
        setText('print-dispatch-remarks', bill.remarks || '');

        const tbody = document.getElementById('print-dispatch-items-body');
        if (tbody) tbody.innerHTML = this.dispatchPrintItemRowsHtml(bill.items);

        return bill;
      },

      // Shared by the single-record print's live DOM table and the bulk
      // print/PDF page builder below.
      dispatchPrintItemRowsHtml(items) {
        return (items || []).map((it, i) => {
          const item = (App.State.globalItems || []).find(x => App.Utils.sameText(x.name, it.productName));
          return `<tr>
            <td style="padding:7px 6px;border:1px solid #e5e5e5;text-align:center;color:#999;font-weight:600;">${i + 1}</td>
            <td style="padding:7px 6px;border:1px solid #e5e5e5;text-align:left;font-weight:600;">${escapeHtml(it.productName || '')}${it.productId ? ` <small style="color:#888;">(${escapeHtml(it.productId)})</small>` : ''}</td>
            <td style="padding:7px 6px;border:1px solid #e5e5e5;">${escapeHtml(item?.hsn || '')}</td>
            <td style="padding:7px 6px;border:1px solid #e5e5e5;font-weight:600;">${escapeHtml(String(toNumber(it.qty)))}</td>
            <td style="padding:7px 6px;border:1px solid #e5e5e5;">Pcs</td>
            <td style="padding:7px 6px;border:1px solid #e5e5e5;">${it.rate ? escapeHtml(String(toNumber(it.rate))) : '-'}</td>
            <td style="padding:7px 6px;border:1px solid #e5e5e5;font-weight:600;">${it.amount ? formatCurrency(it.amount) : '-'}</td>
          </tr>`;
        }).join('');
      },

      print(dispatchNumber) {
        const bill = this.populateDispatchPrintData(dispatchNumber);
        if (!bill) return;

        const title = `Delivery_Challan_${bill.dispatchNumber}_${String(bill.clientName || '')
          .replace(/[^a-zA-Z0-9 \-]/g, '')
          .trim()
          .replace(/\s+/g, '_')}`;
        App.Print.trigger('print-dispatch-container', title);
      },

      bulkPrint() {
        const selected = App.State.selectedDispatch;
        if (!selected.length) {
          App.Utils.showToast('No dispatch bills selected.', true);
          return;
        }

        const bills = (App.State.globalDispatchBills || []).filter(b => App.Selection.isSelected(selected, b.dispatchNumber));
        if (!bills.length) return;

        App.Print.triggerBulk(bills, b => this.buildDispatchPrintPageHtml(b), 'Delivery_Challans_Selected');
      },

      async bulkDownloadPDF() {
        const selected = App.State.selectedDispatch;
        if (!selected.length) {
          App.Utils.showToast('No dispatch bills selected.', true);
          return;
        }

        const bills = (App.State.globalDispatchBills || []).filter(b => App.Selection.isSelected(selected, b.dispatchNumber));
        if (!bills.length) return;

        App.Print.renderBulkPages(bills, b => this.buildDispatchPrintPageHtml(b));
        const filename = App.Print.bulkPdfFilename('Delivery_Challans', bills.length);
        const ok = await App.Print.downloadElementAsPDF('print-bulk-container', filename);
        if (ok) App.Utils.showToast(`${bills.length} delivery challan(s) exported to PDF!`, false);
      },

      // Builds a fully self-contained "Delivery Challan" page (mirrors
      // #print-dispatch-container's markup/styling) for use in bulk printing.
      buildDispatchPrintPageHtml(bill) {
        const BRAND = '#0D6EFD';
        const client = (App.State.globalClients || []).find(c => App.Utils.sameText(c.name, bill.clientName));

        const grRefParts = [];
        if (bill.invoiceNumber) grRefParts.push(`Inv: ${escapeHtml(bill.invoiceNumber)}`);
        if (bill.grNumber) grRefParts.push(`GR: ${escapeHtml(bill.grNumber)}`);

        return `
        <div style="background:#fff;color:#1a1a1a;font-family:'Segoe UI',Arial,sans-serif;font-size:12px;line-height:1.5;padding:14px 20px 12px 20px;margin:0;box-sizing:border-box;width:100%;border-top:5px solid ${BRAND};border-bottom:3px solid ${BRAND};-webkit-print-color-adjust:exact;print-color-adjust:exact;">
          <div style="text-align:center;padding:4px 0 8px 0;">
            ${App.Print.brandHeaderHtml(BRAND)}
            <div style="font-size:10px;color:#555;margin-top:3px;letter-spacing:0.3px;">
              6-B, SHIV SHAKTI ESTATE, VERKA CHOWK, DEHLON ROAD, BHAGWANPURA, 141114 LUDHIANA
            </div>
            <div style="font-size:10px;color:#555;margin-top:2px;letter-spacing:0.3px;">
              Ph : 86996-42398, 91546-94000, 94170-42398 &nbsp;|&nbsp; E-mail : maharaja.bikes@gmail.com
              &nbsp;&nbsp; GSTIN : 03AFIPS4089J1Z1
            </div>
          </div>
          <div style="height:2px;background:${BRAND};margin:0 0 12px 0;-webkit-print-color-adjust:exact;print-color-adjust:exact;"></div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div style="flex:1;text-align:left;">
              <span style="font-size:10px;color:#666;text-transform:uppercase;letter-spacing:0.5px;">Challan Number</span>

      async bulkDeleteDispatch() {
        const selected = App.State.selectedDispatch.slice();
        if (!selected.length) return;

        App.Utils.confirmAction(
          `Are you sure you want to permanently delete ${selected.length} selected dispatch bill(s)? This will increase the Ready to Dispatch quantity for the affected products.`,
          async () => {
            try {
              const res = await Api.call('deleteDispatchBulk', selected);
              App.Utils.showToast(res.message, !res.success);
              if (res.success) {
                App.State.selectedDispatch = [];
                await this.loadDispatchData();
                await this.loadReadyData();
              }
            } catch (err) {
              App.Utils.showToast(err.message || 'Failed to delete dispatch bills', true);
            }
          }
        );
      },

      delete(dispatchNumber) {
        const bill = (App.State.globalDispatchBills || []).find(b => b.dispatchNumber === dispatchNumber);
        const itemCount = bill ? bill.items.length : 0;
        const totalQty = bill ? bill.totalQty : 0;

        App.Utils.confirmAction(
          `Are you sure you want to permanently delete Dispatch "${dispatchNumber}" (${itemCount} item(s), total qty ${App.Production.formatQty(totalQty)})? This will increase the Ready to Dispatch quantity for these products.`,
          async () => {
            try {
              const res = await Api.call('deleteDispatch', dispatchNumber, itemCount, totalQty);
              App.Utils.showToast(res.message, !res.success);
              if (res.success) {
                await this.loadDispatchData();
                await this.loadReadyData();
              }
            } catch (err) {
              App.Utils.showToast(err.message || 'Failed to delete dispatch bill', true);
            }
          }
        );
      },

      // ── Modal: Record New Bill (Create / Edit) ─────────────────
      // Populates the optional PI/Order dropdown with confirmed orders
      // (header-level for the whole bill — one bill can carry several items
      // fulfilling one PI/Estimate at once). Picking an order just sets the
      // Client; each item's own availability against that order's lines is
      // validated server-side on save.
      populateDispatchOrderSelect(currentValue) {
        const select = document.getElementById('dispatchOrderSelect');
        if (!select) return;

        let html = '<option value="">— Direct Supply (No Order) —</option>';
        (App.State.globalOrders || []).forEach(o => {
          if (o.status !== 'Order Confirmed') return;
          html += `<option value="${escapeHtml(o.orderNumber)}" data-client="${escapeHtml(o.clientName)}">${escapeHtml(o.orderNumber)} - ${escapeHtml(o.clientName)}</option>`;
        });

        select.innerHTML = html;
        if (currentValue) select.value = currentValue;
      },

      handleDispatchOrderChange(value) {
        const select = document.getElementById('dispatchOrderSelect');
        const option = select?.selectedOptions?.[0];

        document.getElementById('dispatchOrderNumber').value = value || '';
        if (!value || !option) return;

        const clientSelect = document.getElementById('dispatchClientSelect');
        if (clientSelect) {
          clientSelect.value = option.dataset.client || '';
          if (window.jQuery?.fn?.select2 && window.jQuery(clientSelect).data('select2'))
            window.jQuery(clientSelect).trigger('change.select2');
        }
      },

      // ── Modal: Item lines ───────────────────────────────────────
      populateDispatchLineProductSelect(selectEl, currentProductId) {
        if (!selectEl) return;

        if (window.jQuery?.fn?.select2 && window.jQuery(selectEl).data('select2'))
          window.jQuery(selectEl).select2('destroy');

        let html = '<option value="">Choose a Product...</option>';
        (App.State.globalReadyToDispatch || []).forEach(r => {
          html += `<option value="${escapeHtml(r.productId)}" data-product-name="${escapeHtml(r.productName)}">${escapeHtml(r.productName)} (${escapeHtml(r.productId)}) — Ready: ${App.Production.formatQty(r.readyQty)}</option>`;
        });

        selectEl.innerHTML = html;
        if (currentProductId) selectEl.value = currentProductId;
        App.Utils.autoSelectOnlyOption(selectEl);

        if (window.jQuery?.fn?.select2) {
          const $s = window.jQuery(selectEl);
          $s.select2({
            placeholder: 'Choose a Product...',
            width: '100%',
            matcher: App.Utils.select2Matcher,
            dropdownParent: App.Utils.select2DropdownParent($s)
          });
        }
      },

      // Appends an item-line row. `line` (if provided) pre-fills the row
      // from an existing bill's item ({productId, qty, rate}).
      addDispatchLineRow(line = null) {
        const tbody = document.getElementById('dispatchLinesBody');
        if (!tbody) return;

        const row = document.createElement('tr');

        const productSelect = document.createElement('select');
        productSelect.className = 'form-select dispatch-line-product';
        productSelect.required = true;
        productSelect.onchange = function () { App.Dispatch.handleDispatchLineProductChange(this); };

        const qtyInput = document.createElement('input');
        qtyInput.type = 'number';
        qtyInput.className = 'form-control dispatch-line-qty';
        qtyInput.min = '0.001';
        qtyInput.step = 'any';
        qtyInput.placeholder = '0';
        qtyInput.required = true;
        qtyInput.oninput = function () { App.Dispatch.handleDispatchLineQtyOrRateChange(this); };

        const qtyHelp = document.createElement('small');
        qtyHelp.className = 'text-muted d-block dispatch-line-qty-help';

        const rateInput = document.createElement('input');
        rateInput.type = 'number';
        rateInput.className = 'form-control dispatch-line-rate';
        rateInput.min = '0';
        rateInput.step = 'any';
        rateInput.placeholder = '0';
        rateInput.oninput = function () { App.Dispatch.handleDispatchLineQtyOrRateChange(this); };

        const tdProduct = document.createElement('td');
        tdProduct.appendChild(productSelect);
        const tdQty = document.createElement('td');
        tdQty.appendChild(qtyInput);
        tdQty.appendChild(qtyHelp);
        const tdRate = document.createElement('td');
        tdRate.appendChild(rateInput);
        const tdAmount = document.createElement('td');
        tdAmount.className = 'text-end dispatch-line-amount';
        tdAmount.innerText = '—';
        const tdAction = document.createElement('td');
        tdAction.className = 'text-center';

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'btn btn-outline-danger btn-sm';
        removeBtn.innerText = '✕';
        removeBtn.onclick = function () {
          const tr = this.closest('tr');
          const select = tr.querySelector('.dispatch-line-product');
          if (window.jQuery?.fn?.select2 && window.jQuery(select).data('select2'))
            window.jQuery(select).select2('destroy');
          tr.remove();
          App.Dispatch.recalcDispatchLinesTotal();
          App.Dispatch.refreshDispatchLineHints();
        };
        tdAction.appendChild(removeBtn);

        row.appendChild(tdProduct);
        row.appendChild(tdQty);
        row.appendChild(tdRate);
        row.appendChild(tdAmount);
        row.appendChild(tdAction);
        tbody.appendChild(row);

        this.populateDispatchLineProductSelect(productSelect, line ? line.productId : '');

        if (line) {
          if (line.qty !== undefined && line.qty !== '') qtyInput.value = line.qty;
          if (line.rate) rateInput.value = line.rate;
        }

        this.updateDispatchLineAmount(row);
      },

      handleDispatchLineProductChange(selectEl) {
        this.refreshDispatchLineHints();
        this.updateDispatchLineAmount(selectEl.closest('tr'));
      },

      handleDispatchLineQtyOrRateChange(inputEl) {
        this.updateDispatchLineAmount(inputEl.closest('tr'));
        this.recalcDispatchLinesTotal();
        this.refreshDispatchLineHints();
        this.refreshLogisticsCostHint();
      },

      updateDispatchLineAmount(row) {
        if (!row) return;
        const qty = toNumber(row.querySelector('.dispatch-line-qty')?.value);
        const rate = toNumber(row.querySelector('.dispatch-line-rate')?.value);
        const amountCell = row.querySelector('.dispatch-line-amount');
        if (amountCell) amountCell.innerText = (qty && rate) ? formatCurrency(qty * rate) : '—';
      },

      recalcDispatchLinesTotal() {
        let total = 0;
        let anyRate = false;
        document.querySelectorAll('#dispatchLinesBody tr').forEach(tr => {
          const qty = toNumber(tr.querySelector('.dispatch-line-qty')?.value);
          const rate = toNumber(tr.querySelector('.dispatch-line-rate')?.value);
          if (rate) anyRate = true;
          total += qty * rate;
        });
        const el = document.getElementById('dispatchLinesTotalAmount');
        if (el) el.innerText = anyRate ? formatCurrency(total) : '—';
      },

      // Informational only (server is authoritative at save time) — shows
      // how much of each product is still Ready to Dispatch after
      // subtracting what OTHER rows in this same open form have already
      // claimed for that product, plus (when editing) adding back this
      // bill's own previously-saved qty for it.
      refreshDispatchLineHints() {
        const rows = Array.from(document.querySelectorAll('#dispatchLinesBody tr'));
        const usedByProduct = {};
        rows.forEach(tr => {
          const pid = tr.querySelector('.dispatch-line-product')?.value;
          if (!pid) return;
          usedByProduct[pid] = (usedByProduct[pid] || 0) + toNumber(tr.querySelector('.dispatch-line-qty')?.value);
        });

        rows.forEach(tr => {
          const select = tr.querySelector('.dispatch-line-product');
          const help = tr.querySelector('.dispatch-line-qty-help');
          if (!select || !help) return;
          const pid = select.value;
          if (!pid) { help.innerText = ''; return; }

          const entry = (App.State.globalReadyToDispatch || []).find(r => r.productId === pid);
          const ready = (entry ? entry.readyQty : 0) + (App.State.dispatchEditOriginalQtyByProduct[pid] || 0);
          const usedElsewhere = (usedByProduct[pid] || 0) - toNumber(tr.querySelector('.dispatch-line-qty')?.value);
          const remaining = ready - usedElsewhere;
          help.innerText = `Available: ${App.Production.formatQty(Math.max(remaining, 0))} unit(s)`;
        });
      },

      serializeDispatchLines() {
        const lines = [];
        document.querySelectorAll('#dispatchLinesBody tr').forEach(tr => {
          const select = tr.querySelector('.dispatch-line-product');
          const productId = select?.value || '';
          if (!productId) return;

          const option = select.selectedOptions?.[0];
          lines.push({
            productId,
            productName: option?.dataset.productName || '',
            qty: toNumber(tr.querySelector('.dispatch-line-qty')?.value),
            rate: toNumber(tr.querySelector('.dispatch-line-rate')?.value)
          });
        });
        return lines;
      },

      openCreateDispatchModal(prefillProductId) {
        const form = document.getElementById('dispatchForm');
        if (form) form.reset();

        document.getElementById('dispatchNumberField').value = '';
        document.getElementById('dispatchVisibleNumber').value = '';
        document.getElementById('dispatchDate').value = todayIso();
        App.State.dispatchEditOriginalQtyByProduct = {};

        this.populateDispatchOrderSelect('');
        document.getElementById('dispatchOrderNumber').value = '';

        const dispatchClientEl = document.getElementById('dispatchClientSelect');
        if (window.jQuery?.fn?.select2 && window.jQuery(dispatchClientEl).data('select2'))
          window.jQuery(dispatchClientEl).select2('destroy');
        App.Client.populateClientSelect(dispatchClientEl);
        if (dispatchClientEl && window.jQuery?.fn?.select2) {
          window.jQuery(dispatchClientEl).select2({
            placeholder: 'Choose a Client...',
            width: '100%',
            matcher: App.Utils.select2Matcher,
            dropdownParent: App.Utils.select2DropdownParent(window.jQuery(dispatchClientEl))
          });
        }

        const tbody = document.getElementById('dispatchLinesBody');
        if (tbody) tbody.innerHTML = '';
        this.addDispatchLineRow(prefillProductId ? { productId: prefillProductId } : null);
        this.recalcDispatchLinesTotal();
        this.refreshDispatchLineHints();

        this.initLogisticsContractorSelect2('');
        document.getElementById('dispatchLogisticsCostHint').innerText = '';

        document.getElementById('dispatchFormTitle').innerText = 'Record New Bill';
        App.Utils.setFormButtonsForMode('dispatchCancelBtn', 'dispatchExitBtn', 'dispatchSubmitBtn', false, 'Save Bill');

        safeModalShow('dispatchModal');
      },

      // Initializes a searchable Select2 on Logistics Contractor, same pattern
      // as Production's Assigned To and BOM's cost-row Contractor fields.
      initLogisticsContractorSelect2(currentValue) {
        const selectEl = document.getElementById('dispatchLogisticsContractor');
        if (!selectEl || !window.jQuery?.fn?.select2) return;

        const $select = window.jQuery(selectEl);
        if ($select.data('select2')) $select.select2('destroy');
        selectEl.innerHTML = '';
        if (currentValue) selectEl.add(new Option(currentValue, currentValue, true, true));

        $select.select2({
          placeholder: 'Search or type a logistics contractor...',
          width: '100%',
          tags: true,
          allowClear: true,
          matcher: App.Utils.select2Matcher,
          dropdownParent: App.Utils.select2DropdownParent($select),
          data: (App.State.globalContractors || []).map(c => ({ id: c.name, text: c.name })),
          createTag(params) {
            const term = (params.term || '').trim();
            if (!term) return null;
            // Resolve to an existing contractor differing only by case/whitespace
            // instead of minting a second, differently-cased entry for the
            // same real contractor (e.g. typing "seat" when "Seat" is on file).
            const existing = (App.State.globalContractors || []).find(c => App.Utils.sameText(c.name, term));
            if (existing) return { id: existing.name, text: existing.name };
            return { id: term, text: term, newTag: true };
          }
        });

        // Same Select2 v4 synchronous re-entrant double-'change' quirk as
        // Production's initContractorSelect2 — see its comment for details.
        // Namespaced for the same reason too: plain `.off('change')` strips
        // Select2's own internal 'change.select2' listener that repaints the
        // visible selection box, leaving the underlying value updated but
        // the on-screen label frozen on the old selection.
        let handlingChange = false;
        $select.off('change.dispatchLogisticsContractor').on('change.dispatchLogisticsContractor', () => {
          if (handlingChange) return;
          handlingChange = true;
          Promise.resolve().then(() => { handlingChange = false; });
          this.refreshLogisticsCostHint();
        });
      },

      // Fetches and displays the logistics cost estimate for the current
      // Logistics Contractor + this bill's total Qty (summed across every
      // item line), so the operator sees the cost before save.
      async refreshLogisticsCostHint() {
        const hintEl = document.getElementById('dispatchLogisticsCostHint');
        if (!hintEl) return;

        const contractorName = document.getElementById('dispatchLogisticsContractor')?.value;
        const qty = this.serializeDispatchLines().reduce((sum, l) => sum + (l.qty || 0), 0);

        if (!contractorName || !qty) {
          hintEl.innerText = '';
          return;
        }

        try {
          const res = await Api.call('getContractorRateForProcess', contractorName, 'Dispatch / Logistics');
          const rate = res.success ? toNumber(res.data?.ratePerUnit) : 0;
          if (!rate) {
            hintEl.innerText = `No rate card entry for "${contractorName}" / Dispatch / Logistics — cost will be 0.`;
            return;
          }
          hintEl.innerText = `Logistics Cost: ${formatCurrency(qty * rate)} (${qty} x ${rate}/unit, across this bill)`;
        } catch (err) {
          hintEl.innerText = '';
        }
      },

      openEditDispatchModal(dispatchNumber) {
        const items = (App.State.globalDispatch || []).filter(d => d.dispatchNumber === dispatchNumber);
        if (!items.length) return;
        const d = items[0]; // header fields — identical across every item of this bill

        const form = document.getElementById('dispatchForm');
        if (form) form.reset();

        document.getElementById('dispatchNumberField').value = d.dispatchNumber;
        document.getElementById('dispatchVisibleNumber').value = d.dispatchNumber;

        let inputDateStr = todayIso();
        if (d.dispatchDate && d.dispatchDate.includes('/')) {
          const [day, month, year] = d.dispatchDate.split('/');
          inputDateStr = `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
        } else if (d.dateRaw) {
          inputDateStr = d.dateRaw.split('T')[0];
        }
        document.getElementById('dispatchDate').value = inputDateStr;
        document.getElementById('dispatchTransport').value = d.transport || '';
        document.getElementById('dispatchInvoiceNumber').value = d.invoiceNumber || '';
        document.getElementById('dispatchPrivateMark').value = d.privateMark || '';
        document.getElementById('dispatchGrNumber').value = d.grNumber || '';
        document.getElementById('dispatchRemarks').value = d.remarks || '';

        this.populateDispatchOrderSelect(d.orderNumber || '');
        document.getElementById('dispatchOrderNumber').value = d.orderNumber || '';

        const editDispatchClientEl = document.getElementById('dispatchClientSelect');
        if (window.jQuery?.fn?.select2 && window.jQuery(editDispatchClientEl).data('select2'))
          window.jQuery(editDispatchClientEl).select2('destroy');
        App.Client.populateClientSelect(editDispatchClientEl);
        if (editDispatchClientEl) editDispatchClientEl.value = d.clientName || '';
        if (editDispatchClientEl && window.jQuery?.fn?.select2) {
          window.jQuery(editDispatchClientEl).select2({
            placeholder: 'Choose a Client...',
            width: '100%',
            matcher: App.Utils.select2Matcher,
            dropdownParent: App.Utils.select2DropdownParent(window.jQuery(editDispatchClientEl))
          });
          window.jQuery(editDispatchClientEl).trigger('change.select2');
        }

        // This bill's own per-product qty, added back onto each item row's
        // "Available" hint (see refreshDispatchLineHints) so re-selecting
        // the same product doesn't show a falsely-low remaining qty.
        App.State.dispatchEditOriginalQtyByProduct = {};
        items.forEach(it => {
          App.State.dispatchEditOriginalQtyByProduct[it.productId] =
            (App.State.dispatchEditOriginalQtyByProduct[it.productId] || 0) + (Number(it.qty) || 0);
        });

        const tbody = document.getElementById('dispatchLinesBody');
        if (tbody) tbody.innerHTML = '';
        items.forEach(it => this.addDispatchLineRow({ productId: it.productId, qty: it.qty, rate: it.rate }));
        this.recalcDispatchLinesTotal();
        this.refreshDispatchLineHints();

        this.initLogisticsContractorSelect2(d.logisticsContractor || '');
        this.refreshLogisticsCostHint();

        document.getElementById('dispatchFormTitle').innerText = `Edit Bill: ${d.dispatchNumber}`;
        App.Utils.setFormButtonsForMode('dispatchCancelBtn', 'dispatchExitBtn', 'dispatchSubmitBtn', true, 'Save');

        App.Nav.register(
          'dispatchModal',
          App.State.filteredDispatchBills.map(b => b.dispatchNumber),
          d.dispatchNumber,
          (num) => this.openEditDispatchModal(num)
        );

        safeModalShow('dispatchModal');
      }
    };

    // Wire up Dispatch form submission
    document.addEventListener('DOMContentLoaded', function () {
      const dispatchForm = document.getElementById('dispatchForm');
      if (dispatchForm) {
        dispatchForm.onsubmit = async function (e) {
          e.preventDefault();

          const lines = App.Dispatch.serializeDispatchLines();
          if (lines.length === 0) {
            App.Utils.showToast('Please add at least one item to this bill.', true);
            return;
          }

          const formData = Object.fromEntries(new FormData(this));
          formData.lines = JSON.stringify(lines);
          const isEdit = !!formData.dispatchNumber;

          const btn = document.getElementById('dispatchSubmitBtn');
          if (btn) btn.disabled = true;

          try {
            const res = await Api.call('saveDispatch', formData);
            if (res.success) {
              await App.Dispatch.loadReadyData();

              const savedDispatchNumber = res.data?.dispatchNumber || formData.dispatchNumber;

              if (isEdit) {
                // Save (edit mode): patch just this one bill's data + <tr>
                // in place instead of a full loadDispatchData() reload.
                const patched = res.data && res.data.rows
                  ? App.Dispatch.patchBillInPlace(res.data.rows)
                  : false;
                if (!patched) await App.Dispatch.loadDispatchData();

                // Stay open on the SAME bill instead of closing — Exit
                // (App.Nav.exit) is the only way to close from here now.
                if ((App.State.globalDispatch || []).some(d => d.dispatchNumber === savedDispatchNumber)) {
                  App.Dispatch.openEditDispatchModal(savedDispatchNumber);
                } else {
                  safeModalHide('dispatchModal');
                }
              } else {
                // A brand-new bill's sorted/paginated position can't be
                // determined cheaply on the client — full reload here (see
                // App.Dispatch.patchBillInPlace's doc comment for why an
                // edit doesn't need to).
                await App.Dispatch.loadDispatchData();
                App.Dispatch.openCreateDispatchModal('');
              }
            }
            App.Utils.showToast(res.message, !res.success, res.success
              ? { type: 'dispatch', value: res.data?.dispatchNumber || formData.dispatchNumber }
              : null);
          } catch (err) {
            App.Utils.showToast(err.message || 'Failed to save dispatch', true);
          } finally {
            if (btn) btn.disabled = false;
          }
        };
      }
    });
</script>
