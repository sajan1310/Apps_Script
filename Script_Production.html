                if (!row) row = this.addMergedMatrixRow({ itemName: c.displayName, size: c.size, sourceType: c.sourceType, narration: c.narration });
                const cell = row.children[colIndex];
                const qty = thisColorQty > 0 ? thisColorQty * c.qtyPerUnit : c.qtyPerUnit;
                this._setMergedCellItem(cell, { itemName: c.itemName, size: c.size, sourceType: c.sourceType }, qty, c.qtyPerUnit);
              });

              // A Common item that's the same physical item as one of this
              // color's siblings elsewhere in the recipe (see
              // _getCommonItemsWithColorOverride) gets ITS OWN per-color
              // quantity here too, for every color that doesn't already have
              // an explicit override above — instead of being left as a
              // separate flat Common Components row.
              const overriddenKeys = new Set(colorComps.map(c => this._itemSlotKey(c.displayName, c.size)));
              commonOverrideComps.forEach(c => {
                if (overriddenKeys.has(this._itemSlotKey(c.itemName, c.size))) return;
                let row = this.findMatrixRowByDisplayName(c.itemName, c.size || '');
                if (!row) row = this.addMergedMatrixRow({ itemName: c.itemName, size: c.size, sourceType: c.sourceType, narration: c.narration });
                const cell = row.children[colIndex];
                const qty = thisColorQty > 0 ? thisColorQty * c.qtyPerUnit : c.qtyPerUnit;
                this._setMergedCellItem(cell, { itemName: c.itemName, size: c.size, sourceType: c.sourceType }, qty, c.qtyPerUnit);
              });
            }

            this.refreshPoolColorGroupCells(color, thisColorQty, axisKey);
          });
        } catch (err) {
          App.Utils.showToast(err.message || 'Failed to load process recipe', true);
        }
      },

      // Updates every Per-Process Pool Components table's cell for one
      // color (a column only exists there if that group's item set actually
      // has stock in that color — see renderPoolColorSplitGroups), to
      // qtyPerUnit x the SUM of every checked color sharing that column.
      // Fired on checkbox toggle and on that color's own Qty input changing.
      // `color` may be a composite of 2+ independent pool axes (e.g.
      // "BCP / Blue-White" — see COLOR_COMBO_DELIMITER in config.js) when
      // this process draws from multiple independently-colored pool inputs
      // at once; each axis table only ever has columns for its OWN literal
      // colors (e.g. just BCP/Black for a Fitted Rim), so one column (e.g.
      // "Blue-White") is shared by every composite color that pairs it with
      // a different value on the other axis (both "BCP / Blue-White" and
      // "Black / Blue-White" draw from the same Blue-White pool bucket).
      // The cell must therefore be the SUM of every currently checked color
      // whose own tokens include that column, not just whichever single
      // color triggered this refresh — otherwise checking/editing a later
      // color overwrites the total instead of adding to it.
      //
      // `axisKey` (the row that actually changed — see onColorQtyChanged/
      // handleColorCheckToggle/toggleColorGroup) scopes this per TABLE, via
      // each table's own stamped data-axis-key (see _buildPoolColorGroupTable/
      // _axisKeyForPoolItemNames): a table whose resolved axis differs from
      // the changed row's axis is skipped entirely, and the sum for a table
      // that IS touched only ever draws from ITS OWN axis's checked rows.
      // Without this, editing e.g. a Rim axis's "Purple" qty summed a
      // coincidentally same-named Frame axis "Purple" row into BOTH tables'
      // cells — silently inflating the suggested (and, if unnoticed,
      // actually submitted) Warehouse Pool consumption for whichever table
      // was touched. A table with no resolved axis (legacy/single-axis
      // process) is never skipped and stays fully unscoped, unchanged from
      // the original behavior.
      refreshPoolColorGroupCells(color, colorQty, axisKey) {
        const container = document.getElementById('productionPoolColorGroupsContainer');
        if (!container) return;
        const tokensLower = (color || '').split(' / ').map(t => t.trim().toLowerCase()).filter(Boolean);
        container.querySelectorAll('table.prod-color-table').forEach(table => {
          const tableAxisKey = table.dataset.axisKey || '';
          if (axisKey && tableAxisKey && axisKey !== tableAxisKey) return;
          const checkedColorQtys = this._axisScopedCheckedColorQtys(tableAxisKey);
          table.querySelectorAll('.pool-group-qty').forEach(input => {
            const inputColorLower = (input.dataset.color || '').toLowerCase();
            if (!tokensLower.includes(inputColorLower)) return;
            const qtyPerUnit = input.dataset.qtyPerUnit;
            if (qtyPerUnit === undefined || qtyPerUnit === '') return;
            const total = checkedColorQtys.reduce((sum, cc) => {
              const ccTokens = (cc.color || '').split(' / ').map(t => t.trim().toLowerCase()).filter(Boolean);
              return ccTokens.includes(inputColorLower) ? sum + cc.qty : sum;
            }, 0);
            input.value = total > 0 ? this.formatQty(total * toNumber(qtyPerUnit)) : '';
          });
        });
      },

      // Reads the Per-Color matrix into flat {itemName, size, color, sourceType,
      // qty, colorGroup} entries — one per non-blank cell — for submission
      // alongside the Common table's serializeComponentsConsumed() output.
      // A merged row (see addMergedMatrixRow) has no single item identity:
      // each color cell has its OWN item-select, read independently here, so
      // Stock/Pool still debits the correct literal item per color despite
      // the rows being collapsed for display. A manual row (addMatrixItemRow)
      // uses its one real item-select for every color cell, same as before.
      serializeColorMatrix() {
        const components = [];
        const headerColors = this.getMatrixColors();
        document.querySelectorAll('#productionColorMatrixBody tr').forEach(row => {
          const isMerged = row.dataset.merged === 'true';
          const size = row.querySelector('.prod-comp-size')?.value.trim() || '';
          // One shared Narration per row, even for a merged row whose color
          // cells are secretly different literal items — same simplification
          // as the row's own read-only display name (see addMergedMatrixRow).
          const narration = row.querySelector('.prod-comp-narration')?.value.trim() || '';
          const sourceType = row.querySelector('.prod-comp-source')?.value === 'POOL' ? 'POOL' : 'ITEM';

          let rowItemName = '';
          if (!isMerged) {
            const itemSelect = row.querySelector('.prod-comp-item-select');
            if (!itemSelect || itemSelect.value === '') return;
            const itemOpt = itemSelect.options[itemSelect.selectedIndex];
            rowItemName = (itemOpt.dataset.name || itemOpt.textContent || '').trim();
            if (!rowItemName) return;
          }

          headerColors.forEach(({ color, index }) => {
            const cell = row.children[index];
            const qtyInput = cell?.querySelector('.matrix-qty');
            // An untouched cell (blank) is skipped, not counted as an
            // explicit zero — toNumber('') is 0, indistinguishable from a
            // typed "0", so the skip decision must be made on the raw text
            // instead. A typed 0 or negative value IS kept (correction/
            // reversal consumption, mirroring the output qty's own
            // zero/negative handling).
            if (!qtyInput || qtyInput.value.trim() === '') return;
            const qty = toNumber(qtyInput.value);

            let itemName = rowItemName;
            if (isMerged) {
              const cellSelect = cell?.querySelector('.prod-comp-item-select');
              if (!cellSelect || cellSelect.value === '') return;
              const cellOpt = cellSelect.options[cellSelect.selectedIndex];
              itemName = (cellOpt.dataset.name || cellOpt.textContent || '').trim();
            }
            if (!itemName) return;
            components.push({ itemName, size, narration, color: '', sourceType, qty, colorGroup: color });
          });
        });
        return components;
      },

      // Reads every Per-Process Pool Components table (see
      // renderPoolColorSplitGroups) into the same flat
      // {itemName, size, color, sourceType, qty, colorGroup} shape as
      // serializeColorMatrix — one entry per non-blank cell, colorGroup set
      // to that cell's column color so the save path debits the matching
      // Warehouse Pool bucket.
      serializePoolColorGroups() {
        const components = [];
        document.querySelectorAll('#productionPoolColorGroupsContainer tbody tr').forEach(row => {
          const itemSelect = row.querySelector('.prod-comp-item-select');
          if (!itemSelect || itemSelect.value === '') return;
          const itemOpt = itemSelect.options[itemSelect.selectedIndex];
          const itemName = (itemOpt.dataset.name || itemOpt.textContent || '').trim();
          if (!itemName) return;
          const size = row.querySelector('.prod-comp-size')?.value.trim() || '';
          const narration = row.querySelector('.prod-comp-narration')?.value.trim() || '';

          row.querySelectorAll('.pool-group-qty').forEach(input => {
            // See serializeColorMatrix's matching comment — blank is
            // skipped, but a typed 0 or negative value is kept.
            if (input.value.trim() === '') return;
            const qty = toNumber(input.value);
            const color = input.dataset.color || '';
            if (!color) return;
            components.push({ itemName, size, narration, color: '', sourceType: 'POOL', qty, colorGroup: color });
          });
        });
        return components;
      },

      // Populates the Common table + Per-Color matrix directly from a saved
      // lot's actual recorded Components Consumed (not recipe defaults) —
      // used when editing an existing multi-color batch. A legacy lot saved
      // before this item was recognized as pool-color-aware (one combined
      // Common-tagged row, e.g. "Painted Frame" at the full lot qty) is
      // upgraded on the fly: its quantity is split evenly across this lot's
      // colors as a starting point in the matrix instead of staying flat —
      // the operator should adjust each color's cell to what was actually
      // used, then re-save to fix this lot's stored data going forward.
      async populateComponentsConsumedDirect(components, colors) {
        this.clearComponentsTable();
        this.clearColorMatrix();
        colors.forEach(c => this.addMatrixColorColumn(c));

        const processId = document.getElementById('productionProcessId')?.value;
        const poolColorMap = processId ? await this.getPoolColorAwareItemNames(processId) : new Map();
        let upgradedAny = false;
        let upgradedCommonOverride = false;
        const poolGroupAccum = new Map();

        // A legacy lot saved before Common-vs-per-color-override items were
        // merged (see _getCommonItemsWithColorOverride) still has one flat
        // 'COMMON' row for an item that's really the same physical part as
        // one of its own explicit per-color siblings — checked against THIS
        // lot's own saved components, not the current recipe (which may have
        // since changed).
        const commonOverrideComps = this._getCommonItemsWithColorOverride(components || []);

        (components || []).forEach(c => {
          const colorGroup = c.colorGroup || 'COMMON';
          // Pool-color-aware (multi-color split) applies whether this row's
          // colorGroup is still the legacy 'COMMON' (saved before this item
          // was recognized as multi-color) or already a real color name
          // (saved correctly by the current Create-form matrix) — either way
          // it's the SAME literal item across colors, so it always belongs in
          // its own Per-Process Pool Components table (see
          // renderPoolColorGroupsFromAccum), never a merged per-cell-dropdown
          // row. An item with only ONE pool color isn't a real per-color
          // choice (see getPoolColorAwareItemNames) — it falls through to the
          // Common-table branch below instead.
          const isPoolColorAware = c.sourceType === 'POOL'
            && (poolColorMap.get((c.itemName || '').trim().toLowerCase()) || []).length > 1;

          if (isPoolColorAware) {
            const key = `${(c.itemName || '').toLowerCase()}|${(c.size || '').toLowerCase()}`;
            let entry = poolGroupAccum.get(key);
            if (!entry) {
              entry = { itemName: c.itemName, size: c.size, narration: c.narration, sourceType: c.sourceType, colorsQty: {} };
              poolGroupAccum.set(key, entry);
            }

            if (colorGroup === 'COMMON') {
              // Legacy shape: one combined qty — split evenly across colors
              // as a starting point for the operator to correct and re-save.
              upgradedAny = true;
              const perColorQty = colors.length > 0 ? c.qty / colors.length : c.qty;
              colors.forEach(color => { entry.colorsQty[color.toLowerCase()] = perColorQty; });
            } else {
              // Already a correctly saved per-color quantity. colorGroup is
              // this item's own literal axis color (e.g. "BCP"), which won't
              // appear verbatim in `colors` when the lot's output color is a
              // multi-axis composite (e.g. "BCP / Blue-White" — see
              // COLOR_COMBO_DELIMITER in config.js), so no membership check
              // against `colors` here: any non-COMMON colorGroup on a
              // pool-color-aware row is by construction one of this item's
              // real pool colors.
              entry.colorsQty[colorGroup.toLowerCase()] = c.qty;
            }
            return;
          }

          if (commonOverrideComps.includes(c)) {
            // Split this lot's one combined saved qty evenly across every
            // color that doesn't have its own explicit override entry (the
            // ones that DO are handled by their own row further down this
            // same forEach) — a starting point for the operator to correct.
            upgradedCommonOverride = true;
            const overriddenColors = new Set(
              (components || [])
                .filter(o => o.colorGroup && o.colorGroup !== 'COMMON' &&
                  this._itemSlotKey(this._stripColorSubstring(o.itemName || '', o.colorGroup), o.size) === this._itemSlotKey(c.itemName, c.size))
                .map(o => o.colorGroup)
            );
            const fallbackColors = colors.filter(col => !overriddenColors.has(col));
            const perColorQty = fallbackColors.length > 0 ? c.qty / fallbackColors.length : c.qty;
            let row = this.findMatrixRowByDisplayName(c.itemName, c.size || '');
            if (!row) row = this.addMergedMatrixRow({ itemName: c.itemName, size: c.size, sourceType: c.sourceType, narration: c.narration });
            fallbackColors.forEach(col => {
              const colIndex = this.getMatrixColumnIndex(col);
              if (colIndex === -1) return;
              const cell = row.children[colIndex];
              this._setMergedCellItem(cell, { itemName: c.itemName, size: c.size, sourceType: c.sourceType }, perColorQty);
            });
            return;
          }

          if (colorGroup === 'COMMON' || !colors.includes(colorGroup)) {
            // A saved row whose colorGroup is a real single pool color (not
            // 'COMMON', and not one of this lot's own output colors) is the
            // single-pool-color case — re-lock it the same way addComponentRow
            // does for a freshly populated recipe row.
            const isLockedPoolColor = c.sourceType === 'POOL' && colorGroup !== 'COMMON';
            this.addComponentRow({
              itemName: c.itemName,
              size: c.size,
              narration: c.narration,
              sourceType: c.sourceType,
              qty: c.qty,
              color: isLockedPoolColor ? colorGroup : c.color,
              colorScope: isLockedPoolColor ? colorGroup : undefined,
              unit: c.unit
            });
            return;
          }
          // Explicitly color-tagged, not pool-color-aware: a genuinely
          // different literal item per color (e.g. "Frame---Red" /
          // "Frame---Blue") — keep on a merged row, one real item picker
          // per color cell.
          const displayName = this._stripColorSubstring(c.itemName || '', colorGroup);
          let row = this.findMatrixRowByDisplayName(displayName, c.size || '');
          if (!row) row = this.addMergedMatrixRow({ itemName: displayName, size: c.size, sourceType: c.sourceType, narration: c.narration });
          const colIndex = this.getMatrixColumnIndex(colorGroup);
          const cell = row.children[colIndex];
          this._setMergedCellItem(cell, { itemName: c.itemName, size: c.size, sourceType: c.sourceType }, c.qty);
        });

        // Seed a table for EVERY pool-color-aware recipe item (see
        // getPoolColorAwareItemNames), not just ones this saved lot
        // happened to use before — otherwise checking a color belonging to
        // an axis/item this lot never used previously (e.g. adding
        // Mudguard usage to a lot that originally only used Painted Frame)
        // has no table to land in at all: the checkbox gets checked, but
        // there's nowhere to record its actual component consumption. Left
        // blank (no colorsQty entries) for an item this lot didn't already
        // use — renderPoolColorGroupsFromAccum still shows a column for any
        // color the operator newly checks via its own checked-state check.
        if (processId) {
          const recipeRes = await this._fetchProcessComponents(processId);
          const recipeComps = recipeRes.success ? (recipeRes.data || []) : [];
          recipeComps
            .filter(c => c.sourceType === 'POOL' && (!c.colorGroup || c.colorGroup === 'COMMON'))
            .forEach(c => {
              const itemColors = poolColorMap.get((c.itemName || '').trim().toLowerCase()) || [];
              if (itemColors.length <= 1) return;
              const key = `${(c.itemName || '').toLowerCase()}|${(c.size || '').toLowerCase()}`;
              if (!poolGroupAccum.has(key)) {
                poolGroupAccum.set(key, { itemName: c.itemName, size: c.size, narration: c.narration, sourceType: c.sourceType, colorsQty: {} });
              }
            });
        }

        this.renderPoolColorGroupsFromAccum(Array.from(poolGroupAccum.values()), poolColorMap);

        if (upgradedAny && upgradedCommonOverride) {
          App.Utils.showToast('This lot had a pool item and a Common item now tracked per-color, both split evenly across colors as a starting point — adjust each color\'s quantity to match what was actually used, then save.', false);
        } else if (upgradedAny) {
          App.Utils.showToast('This lot had a pool item now tracked per-color split evenly across colors as a starting point — adjust each color\'s quantity to match what was actually used, then save.', false);
        } else if (upgradedCommonOverride) {
          App.Utils.showToast('This lot had a Common item that\'s really the same part as one of its per-color siblings — merged into one row, split evenly across colors as a starting point; adjust each color\'s quantity to match what was actually used, then save.', false);
        }
      },

      // Same grouping/rendering as renderPoolColorSplitGroups, but for the
      // Edit Lot path: cells show this lot's actual saved qty per
      // (item, color) instead of a recipe-suggested estimate. `entries` is
      // [{ itemName, size, sourceType, colorsQty: { colorLower: qty } }],
      // built by populateComponentsConsumedDirect from the saved
      // Components Consumed array.
      renderPoolColorGroupsFromAccum(entries, poolColorMap) {
        const wrapper = document.getElementById('productionPoolColorGroupsWrapper');
        const container = document.getElementById('productionPoolColorGroupsContainer');
        if (!container) return;

        container.querySelectorAll('tr').forEach(row => this.destroyComponentItemSelect2(row));
        container.innerHTML = '';
        this._poolColorGroupDefs = [];

        if (!entries || entries.length === 0) {
          if (wrapper) wrapper.style.display = 'none';
          return;
        }
        if (wrapper) wrapper.style.display = '';

        const groups = new Map();
        entries.forEach(entry => {
          const itemColors = poolColorMap.get((entry.itemName || '').trim().toLowerCase()) || [];
          const signature = itemColors.slice().sort((a, b) => a.localeCompare(b)).join('|').toLowerCase();
          if (!groups.has(signature)) groups.set(signature, { colors: itemColors, entries: [] });
          groups.get(signature).entries.push(entry);
        });

        let groupIdx = 0;
        groups.forEach(({ colors: groupColors, entries: groupEntries }) => {
          groupIdx++;
          const tableId = `productionPoolColorGroup_${groupIdx}`;
          const axisKey = this._axisKeyForPoolItemNames(groupEntries.map(e => e.itemName));
          this._poolColorGroupDefs.push({ tableId, colors: groupColors, rows: groupEntries, mode: 'edit', axisKey });
          // A color is visible if it's checked right now (scoped to THIS
          // table's own axis — see _axisKeyForPoolItemNames/
          // syncPoolColorGroupColumns's comment on the same leak) OR this
          // lot already has a saved value for it — so reopening an existing
          // lot doesn't hide one of its own already-recorded columns just
          // because something upstream changed since it was saved.
          const checkedLower = this._checkedColorTokensLower(axisKey);
          const savedLower = new Set();
          groupEntries.forEach(e => Object.keys(e.colorsQty || {}).forEach(c => savedLower.add(c)));
          const visibleColors = groupColors.filter(c => checkedLower.has(c.toLowerCase()) || savedLower.has(c.toLowerCase()));
          container.insertAdjacentHTML('beforeend', this._buildPoolColorGroupTable(tableId, groupColors, visibleColors, groupEntries, 'edit', axisKey));
          document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => this.initComponentItemSelect2(row));
        });
      },

      // Fired when a row's Source select changes between ITEM/POOL — Stock
      // item names and Warehouse Pool output names are different namespaces,
      // so the previously picked item is cleared before refreshing availability.
      handleSourceChange(selectEl) {
        const row = selectEl.closest('tr');
        const itemSelect = row?.querySelector('.prod-comp-item-select');
        if (itemSelect && window.jQuery?.fn?.select2) {
          window.jQuery(itemSelect).val(null).trigger('change');
        }
        const sizeInput = row?.querySelector('.prod-comp-size');
        if (sizeInput) sizeInput.value = '';
        const narrationInput = row?.querySelector('.prod-comp-narration');
        if (narrationInput) narrationInput.value = '';
        this.refreshPoolAvailability();
      },

      // Fired when a component row's Size is typed/changed by hand (the Item
      // picker itself only carries a name — see _wireItemSelect2 — so Size
      // is this row's own free-text field, not a per-item dropdown like
      // Process's). Re-syncs Narration to Item Master for this exact
      // item+size, same as picking the item fresh would (see
      // _refillNarrationForRow), then refreshes the availability hint as before.
      handleProdSizeChange(input) {
        this._refillNarrationForRow(input?.closest('tr'));
        this.refreshPoolAvailability();
      },

      // Looks up this row's current item+size in Item Master and syncs its
      // Narration field to match — mirrors App.Process.handleComponentSizeChange.
      // No-ops for a Pool-sourced row (Warehouse Pool output items have no
      // Item Master entry/narration of their own) and for a row with no
      // narration input at all (e.g. a Per-Process Pool Components row).
      // `itemSelect`, if given, is used instead of the row's own (first)
      // item-select — required for a merged matrix row (see
      // addMergedMatrixRow), where every color cell has its OWN item-select
      // but they all share this one row-level Narration field; without it,
      // picking the 2nd+ color cell's item would always re-derive Narration
      // from the 1st cell instead of the one actually just changed.
      _refillNarrationForRow(row, itemSelect) {
        if (!row) return;
        const narrationInput = row.querySelector('.prod-comp-narration');
        if (!narrationInput) return;
        const sourceSel = row.querySelector('.prod-comp-source');
        if (sourceSel && sourceSel.value === 'POOL') return;

        const selectEl = itemSelect || row.querySelector('.prod-comp-item-select');
        const itemOpt = selectEl ? selectEl.options[selectEl.selectedIndex] : null;
        const itemName = (itemOpt?.dataset.name || itemOpt?.textContent || '').trim();
        if (!itemName) return;

        const size = row.querySelector('.prod-comp-size')?.value.trim() || '';
        const match = (App.State.globalItems || []).find(it =>
          App.Utils.sameText(it.name, itemName) && App.Utils.sameText(it.size || '', size));
        narrationInput.value = (match && match.narration) || '';
      },

      // Searchable Select2 for a component row's item picker (Common table,
      // or a manually added matrix row — one item for the whole row).
      initComponentItemSelect2(rowEl) {
        this._wireItemSelect2(rowEl?.querySelector('.prod-comp-item-select'));
      },

      // Searchable Select2 for ONE color cell's item picker inside a merged
      // matrix row (see addMergedMatrixRow) — every color column gets its
      // own picker since each color secretly uses a different real item.
      initMergedCellItemSelect2(selectEl) {
        this._wireItemSelect2(selectEl);
      },

      // Shared Select2 wiring for one item-name <select> element. Source
      // list switches with the row's Source select: ITEM -> App.State.globalItems
      // (Stock), POOL -> distinct Output Item Names from Process Master
      // (Warehouse Pool). tags:true still lets the operator free-type a name
      // that isn't in either list.
      _wireItemSelect2(selectEl) {
        if (!selectEl || !window.jQuery?.fn?.select2) return;

        const $select = window.jQuery(selectEl);
        const PAGE_SIZE = 40;

        $select.select2({
          placeholder: 'Search or type an item/pool name...',
          width: '100%',
          tags: true,
          dropdownParent: App.Utils.select2DropdownParent($select),
          ajax: {
            delay: 150,
            data(params) {
              return { q: params.term || '', page: params.page || 1 };
            },
            transport(params, success) {
              const q = (params.data.q || '').trim();
              const page = params.data.page || 1;
              const isPool = selectEl.closest('tr')?.querySelector('.prod-comp-source')?.value === 'POOL';
              const items = isPool
                ? App.Process.getDistinctOutputItemNames().map(name => ({ name, size: '' }))
                : (App.State.globalItems || []);
              const start = (page - 1) * PAGE_SIZE;

              const pool = q
                ? items.map((item, idx) => ({ idx, item })).filter(({ item }) =>
                  App.Utils.matchesKeywords(`${item.name} ${item.size || ''}`, q))
                : items.map((item, idx) => ({ idx, item }));

              const pageItems = pool.slice(start, start + PAGE_SIZE);
              success({
                results: pageItems.map(({ idx, item }) => ({
                  id: (isPool ? 'pool:' : 'item:') + idx,
                  text: `${item.name}${item.size ? ` [${item.size}]` : ''}`,
                  _itemName: item.name, _size: item.size || ''
                })),
                pagination: { more: (start + PAGE_SIZE) < pool.length }
              });
            },
            processResults(data) { return data; }
          },
          createTag(params) {
            const term = (params.term || '').trim();
            if (!term) return null;
            // Resolve to an existing Item Master / Warehouse Pool name
            // differing only by case/whitespace, matching whichever
            // namespace this row's current Source is set to.
            const isPool = selectEl.closest('tr')?.querySelector('.prod-comp-source')?.value === 'POOL';
            const items = isPool
              ? App.Process.getDistinctOutputItemNames().map(name => ({ name, size: '' }))
              : (App.State.globalItems || []);
            const existing = items.find(it => App.Utils.sameText(it.name, term));
            if (existing) {
              return {
                id: (isPool ? 'pool:' : 'item:') + existing.name, text: `${existing.name}${existing.size ? ` [${existing.size}]` : ''}`,
                _itemName: existing.name, _size: existing.size || ''
              };
            }
            return { id: 'custom:' + term, text: term, newTag: true, _itemName: term, _size: '' };
          }
        });

        $select.on('select2:select', function (e) {
          const data = e.params.data;
          const opt = selectEl.options[selectEl.selectedIndex];
          if (opt) opt.dataset.name = data._itemName || data.text;

          const row = selectEl.closest('tr');
          const sizeInput = row?.querySelector('.prod-comp-size');
          if (sizeInput && !sizeInput.value) sizeInput.value = data._size || '';
          // Narration is shown/autofilled from Item Master for this exact
          // item+size, matching what App.Process does for a recipe's own
          // component rows — see _refillNarrationForRow. No-ops for a Pool
          // row (no Item Master entry to look up). selectEl (not just the
          // row) is passed explicitly since a merged row's color cells each
          // have their own item-select sharing one row-level Narration field.
          App.Production._refillNarrationForRow(row, selectEl);
          App.Production.refreshPoolAvailability();
        });
      },

      // Destroys every item-picker Select2 instance in a row — a Common
      // table row or manual matrix row has exactly one, but a merged matrix
      // row (see addMergedMatrixRow) has one per color cell.
      destroyComponentItemSelect2(rowEl) {
        if (!rowEl || !window.jQuery?.fn?.select2) return;
        rowEl.querySelectorAll('.prod-comp-item-select').forEach(selectEl => {
          const $select = window.jQuery(selectEl);
          if ($select.data('select2')) $select.select2('destroy');
        });
      },

      // Fetches current availability for every component row and shows it
      // inline, so the operator sees the ceiling before saving: "Pool"
      // sources check the Warehouse Pool, "Item" sources check Stock.
      async refreshPoolAvailability() {
        const processId = document.getElementById('productionProcessId')?.value;

        try {
          const [wipRes, stockRes] = await Promise.all([
            processId ? Api.call('getProcessWipData', processId) : Promise.resolve({ success: true, data: [] }),
            Api.call('getStockData')
          ]);
          const wip = wipRes.success ? (wipRes.data || []) : [];
          const stock = stockRes.success ? (stockRes.data || []) : [];
          if (stockRes.success) {
            App.State.globalStock = stock;
            App.State.filteredStock = [...stock];
          }

          document.querySelectorAll('#productionComponentsBody tr').forEach(row => {
            const sourceSel = row.querySelector('.prod-comp-source');
            const availEl = row.querySelector('.prod-comp-available');
            if (!sourceSel || !availEl) return;

            const itemSelect = row.querySelector('.prod-comp-item-select');
            const itemOpt = itemSelect ? itemSelect.options[itemSelect.selectedIndex] : null;
            const itemName = (itemOpt?.dataset.name || itemOpt?.textContent || '').trim().toLowerCase();
            const size = row.querySelector('.prod-comp-size')?.value.trim().toLowerCase();

            let qty = 0;
            if (sourceSel.value === 'POOL') {
              const entry = wip.find(w => w.outputItemName.toLowerCase() === itemName);
              qty = entry ? entry.availableQty : 0;
              availEl.innerText = entry ? `${this.formatQty(entry.availableQty)} avail. (Pool)` : '0 avail. (Pool)';
            } else {
              const entry = stock.find(s =>
                s.name.toLowerCase() === itemName && (!size || (s.size || '').toLowerCase() === size)
              );
              qty = entry ? entry.currentStock : 0;
              availEl.innerText = entry ? `${this.formatQty(entry.currentStock)} avail.` : '0 avail.';
            }
            // Negative available stock/pool is allowed to save (see
            // saveProduction), but easy to miss as plain gray text — flag it
            // in red so the operator sees it before committing, instead of
            // discovering it later via a summary elsewhere that nets it
            // against an unrelated color/tag bucket (see Warehouse Pool's
            // per-Process Total Available column).
            availEl.classList.toggle('text-danger', qty < 0);
            availEl.classList.toggle('fw-bold', qty < 0);
            availEl.classList.toggle('text-muted', qty >= 0);
          });
        } catch (err) {
          // Ignored — availability hints are advisory, not blocking.
        }
      },

      // Reads one row from the Common Components table into a plain object.
      // Most rows here are colorGroup 'COMMON' (applies to every color in the
      // batch) — including manually added rows via "+ Add Component", which
      // have no dataset.colorScope at all and must still default to COMMON
      // rather than an empty string, so they're never silently dropped from a
      // multi-color batch. A row for a single-pool-color item (see
      // addComponentRow's colorScope param) instead carries that one real
      // color name as its colorGroup, so it debits the correct Warehouse
      // Pool bucket. Per-color matrix rows live separately (see
      // serializeColorMatrix). Shared by serializeComponentsConsumed.
      _readProdComponentRow(row) {
        const itemSelect = row.querySelector('.prod-comp-item-select');
        if (!itemSelect || itemSelect.value === '') return null;
        const itemOpt = itemSelect.options[itemSelect.selectedIndex];
        const itemName = (itemOpt.dataset.name || itemOpt.textContent || '').trim();
        if (!itemName) return null;

        return {
          itemName,
          size: row.querySelector('.prod-comp-size')?.value.trim() || '',
          narration: row.querySelector('.prod-comp-narration')?.value.trim() || '',
          color: row.querySelector('.prod-comp-color')?.value.trim() || '',
          sourceType: row.querySelector('.prod-comp-source')?.value === 'POOL' ? 'POOL' : 'ITEM',
          qty: toNumber(row.querySelector('.prod-comp-qty')?.value),
          colorGroup: row.dataset.colorScope || 'COMMON',
          // Blank = "already in the item's Base Unit" — see addComponentRow's
          // unitAttr and module_stock.js#_getBilledAndConsumedQtyMaps.
          unit: row.dataset.unit || ''
        };
      },

      // Reads the Components Consumed table into a plain array for submission.
      serializeComponentsConsumed() {
        const components = [];
        document.querySelectorAll('#productionComponentsBody tr').forEach(row => {
          const comp = this._readProdComponentRow(row);
          if (comp) components.push(comp);
        });
        return components;
      },

      // Initializes a searchable Select2 on Assigned To, allowing the operator
      // to either pick an existing Contractor (for billing) or type a new
      // free-text name (in-house supervisor/lead, no rate card entry needed).
      // Mirrors App.BOM.initCustomVendorSelect2's pattern.
      initContractorSelect2(currentValue) {
        const selectEl = document.getElementById('productionAssignedTo');
        if (!selectEl || !window.jQuery?.fn?.select2) return;

        const $select = window.jQuery(selectEl);
        if ($select.data('select2')) $select.select2('destroy');
        selectEl.innerHTML = '';

        if (currentValue) {
          selectEl.add(new Option(currentValue, currentValue, true, true));
        }

        $select.select2({
          placeholder: 'Search or type a contractor/staff name...',
          width: '100%',
          tags: true,
          allowClear: true,
          matcher: App.Utils.select2Matcher,
          dropdownParent: App.Utils.select2DropdownParent($select),
          data: (App.State.globalContractors || []).map(c => ({ id: c.name, text: c.name })),
          createTag(params) {
            const term = (params.term || '').trim();
            if (!term) return null;
            // Resolve to an existing contractor differing only by case/whitespace
            // instead of minting a second, differently-cased entry for the
            // same real contractor (e.g. typing "seat" when "Seat" is on file).
            const existing = (App.State.globalContractors || []).find(c => App.Utils.sameText(c.name, term));
            if (existing) return { id: existing.name, text: existing.name };
            return { id: term, text: term, newTag: true };
          }
        });

        // Select2 v4 can synchronously re-trigger a second 'change' event on
        // this element as part of its own internal reaction to a
        // programmatic value set (confirmed via both $.trigger('change') and
        // raw el.dispatchEvent()) — without a guard, one real contractor
        // selection fires refreshPayableHint (and its getContractorRateForProcess
        // API call) twice. `handlingChange` is a fresh closure variable per
        // init call, so it can't go stale across resetCreateForm()'s repeated
        // re-initializations, and clearing it on the next microtask (rather
        // than leaving it set) still lets a genuinely separate, later change
        // refresh normally.
        // Namespaced ('change.prodAssignedTo') so `.off()` only ever removes
        // OUR OWN prior binding on re-init — plain `.off('change')` removes
        // EVERY 'change' handler regardless of namespace, including Select2's
        // own internal 'change.select2' listener that repaints the visible
        // selection box. That silently broke the box's on-screen text: the
        // underlying <select>.value updated correctly on every click/keyboard
        // selection, but the rendered label never refreshed to show it,
        // making the dropdown look completely unresponsive despite the
        // selection actually having taken effect.
        let handlingChange = false;
        $select.off('change.prodAssignedTo').on('change.prodAssignedTo', () => {
          if (handlingChange) return;
          handlingChange = true;
          Promise.resolve().then(() => { handlingChange = false; });
          this.refreshPayableHint();
        });
      },

      // Initializes a searchable Select2 on the "+ Add Custom Sub-Group"
      // color field (see addCustomColorRow), allowing the operator to
      // either pick an existing Color Master name or type a new one —
      // same pick-or-create pattern as initContractorSelect2 above. A
      // brand-new name gets auto-registered into Color Master server-side
      // the moment the lot is saved (see saveProduction's
      // _ensureColorMasterEntries call, module_production.js/module_tags.js)
      // so it's available as a real suggestion everywhere else Color
      // Master feeds a picker from then on, not just on this one lot.
      initCustomColorInputSelect2() {
        const selectEl = document.getElementById('productionCustomColorInput');
        if (!selectEl || !window.jQuery?.fn?.select2) return;

        const $select = window.jQuery(selectEl);
        if ($select.data('select2')) $select.select2('destroy');
        selectEl.innerHTML = '';

        $select.select2({
          placeholder: 'Search or type a color name...',
          width: '220px',
          tags: true,
          allowClear: true,
          matcher: App.Utils.select2Matcher,
          dropdownParent: App.Utils.select2DropdownParent($select),
          data: (App.State.globalColors || []).map(c => ({ id: c.name, text: c.name })),
          createTag(params) {
            const term = (params.term || '').trim();
            if (!term) return null;
            // Resolve to an existing Color Master name differing only by
            // case/whitespace instead of minting a second, differently-cased
            // entry for the same real color (e.g. typing "red" when "Red" is
            // already on file) — same reasoning as initContractorSelect2.
            const existing = (App.State.globalColors || []).find(c => App.Utils.sameText(c.name, term));
            if (existing) return { id: existing.name, text: existing.name };
            return { id: term, text: term, newTag: true };
          }
        });
      },

      // Fetches and displays the contractor payable estimate for the current
      // Assigned To + Process + Qty, so the operator sees the cost before save.
      // For a multi-color (Color Axis / checklist) lot the plain Qty field is
      // hidden and left blank (see populateColorChecklist) — the real lot
      // quantity lives in the checked colors' own total instead (see
      // _currentLotTotalQty, which already applies the same primary-axis-only
      // summing saveProduction uses), so reading productionQty there always
      // read 0 and left this hint permanently blank for every color lot.
      // Debounced — this is called from onColorQtyChanged on every keystroke
      // in a color qty input, and each call hits the server
      // (getContractorRateForProcess). Without debouncing, typing a
      // multi-digit quantity fired one network round trip per digit; only
      // the last keystroke's resulting hint is ever seen, so the
      // intermediate calls were pure waste. None of this function's 5 call
      // sites await it or depend on its return value, so delaying the
      // actual fetch is safe everywhere it's used.
      refreshPayableHint() {
        clearTimeout(this._payableHintDebounceTimer);
        this._payableHintDebounceTimer = setTimeout(() => this._refreshPayableHintNow(), 300);
      },

      async _refreshPayableHintNow() {
        const hintEl = document.getElementById('productionPayableHint');
        if (!hintEl) return;

        const contractorName = document.getElementById('productionAssignedTo')?.value;
        const processId = document.getElementById('productionProcessId')?.value;
        const colorWrapper = document.getElementById('productionColorWrapper');
        const isMultiColor = !!colorWrapper && colorWrapper.style.display !== 'none';
        const qty = isMultiColor ? this._currentLotTotalQty() : toNumber(document.getElementById('productionQty')?.value);
        const process = (App.State.globalProcesses || []).find(p => p.processId === processId);

        if (!contractorName || !process || !qty) {
          hintEl.innerText = '';
          return;
        }

        try {
          const res = await Api.call('getContractorRateForProcess', contractorName, process.processName);
          const rate = res.success ? toNumber(res.data?.ratePerUnit) : 0;
          if (!rate) {
            hintEl.innerText = `No rate card entry for "${contractorName}" / ${process.processName} — Payable will be 0.`;
            return;
          }
          hintEl.innerText = `Payable: ${formatCurrency(qty * rate)} (${qty} x ${rate}/unit)`;
        } catch (err) {
          hintEl.innerText = '';
        }
      },

      // Clears the form back to a blank "new lot" state. Shared by
      // openCreateModal (first open) and the submit handler's "Save & log
      // another" path (re-arm without closing the modal), so both stay in
      // sync instead of drifting into two slightly different reset routines.
      async resetCreateForm() {
        // Tear down the previous lot's in-flight/rendered state FIRST, before
        // rebuilding anything — bumping _compLoadSeq invalidates any
        // still-in-flight fetch this same reset just triggered (e.g. a
        // handleProcessChange chain kicked off right before Save was
        // clicked), so a late-arriving response for the OLD lot can never
        // paint over the freshly reset form for the NEW one. Clearing the
        // checklist/components/matrix/pool containers up front (rather than
        // leaving them for the cascade to eventually overwrite) means a
        // stray/aborted cascade leaves the form visibly blank instead of
        // showing the previous lot's stale rows.
        ++this._compLoadSeq;
        this._resetProcDataCache();
        this.clearComponentsTable();
        this.hideColorMatrix();
        const checklistEl = document.getElementById('productionColorChecklist');
        if (checklistEl) checklistEl.innerHTML = '';
        const colorWrapper = document.getElementById('productionColorWrapper');
        if (colorWrapper) colorWrapper.style.display = 'none';
        const revertColorsBtn = document.getElementById('productionRevertColorsBtn');
        if (revertColorsBtn) revertColorsBtn.style.display = 'none';

        const form = document.getElementById('productionForm');
        if (form) form.reset();

        await Promise.all([App.Process.ensureLoaded(), App.Contractor.ensureLoaded(), App.ProcessType.ensureLoaded(), App.Model.ensureLoaded(), App.Color.ensureLoaded()]);

        document.getElementById('productionRowIdx').value = '';
        document.getElementById('productionDate').value = todayIso();

        this.populateProductSelect();
        document.getElementById('productionProductTagWrapper').style.display = 'none';
        document.getElementById('productionProductIdHidden').value = '';
        document.getElementById('productionProductNameHidden').value = '';

        this.initContractorSelect2('');
        this.initCustomColorInputSelect2();
        document.getElementById('productionPayableHint').innerText = '';

        this.populateSizeSelect();
        const sizeSelect = document.getElementById('productionSize');
        if (sizeSelect) {
          sizeSelect.value = '';
          if (window.jQuery?.fn?.select2 && window.jQuery(sizeSelect).data('select2'))
            window.jQuery(sizeSelect).trigger('change.select2');
          App.Utils.autoSelectOnlyOption(sizeSelect);
        }
        // Drives the same Model -> Process Type -> Process cascade (auto-
        // selecting at any level narrowed to one option, exactly like a real
        // pick would) instead of duplicating that reset-to-blank logic here.
        // Awaited (the whole chain now returns its tail promise down to
        // handleProcessChange) so this function doesn't resolve — re-arming
        // the form for the caller — until the checklist/components table for
        // whatever auto-selected is actually done rendering.
        await this.handleSizeChange(sizeSelect ? sizeSelect.value : '');
        document.getElementById('productionLotNumber').value = '';

        document.getElementById('productionFormTitle').innerText = 'Log Production Lot';
        App.Utils.setFormButtonsForMode('productionCancelBtn', 'productionExitBtn', 'productionSubmitBtn', false, 'Record Production Run');
      },

      async openCreateModal() {
        await this.resetCreateForm();

        const modalEl = document.getElementById('editProductionModal');
        if (modalEl && typeof bootstrap !== 'undefined') {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
        }
      },

      async openEditModal(idx) {
        const p = App.State.globalProduction[idx];
        if (!p) return;
        const seq = ++this._compLoadSeq;
        this._resetProcDataCache();

        const form = document.getElementById('productionForm');
        if (form) form.reset();

        await Promise.all([App.Process.ensureLoaded(), App.Contractor.ensureLoaded(), App.ProcessType.ensureLoaded(), App.Model.ensureLoaded(), App.Color.ensureLoaded()]);

        document.getElementById('productionRowIdx').value = p.rowIdx;

        // Normalize date string (DD/MM/YYYY) to YYYY-MM-DD input value
        let inputDateStr = todayIso();
        if (p.date && p.date.includes('/')) {
          const [day, month, year] = p.date.split('/');
          inputDateStr = `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
        } else if (p.dateRaw) {
          inputDateStr = p.dateRaw.split('T')[0];
        }
        document.getElementById('productionDate').value = inputDateStr;

        document.getElementById('productionAssignedBy').value = p.assignedBy;
        this.initContractorSelect2(p.assignedTo);
        this.initCustomColorInputSelect2();
        document.getElementById('productionStatus').value = p.status;
        document.getElementById('productionRemarks').value = p.remarks;

        const editProcess = (App.State.globalProcesses || []).find(pr => pr.processId === p.processId);
        const editSize = App.Utils.getSizeFromOutputItemName(editProcess ? editProcess.outputItemName : '');
        const editModel = App.Utils.getModelFromOutputItemName(editProcess ? editProcess.outputItemName : '');
        const editType = editProcess ? (editProcess.processType || 'General') : '';

        // Suppressed for this whole prefill block: setting .value directly on
        // the (about-to-be-locked) Size/Model/Process Type selects and then
        // nudging Select2 to redraw must not re-run the Size->Model->Type
        // cascade — this lot's own saved values are the source of truth, and
        // letting the cascade fire corrupts _compLoadSeq and aborts this very
        // function before it can show the modal (see _suppressCascade).
        this._suppressCascade = true;
        try {
        this.populateSizeSelect();
        const sizeSelect = document.getElementById('productionSize');
        if (sizeSelect) {
          sizeSelect.value = editSize;
          sizeSelect.disabled = true;
          if (window.jQuery?.fn?.select2 && window.jQuery(sizeSelect).data('select2'))
            window.jQuery(sizeSelect).trigger('change.select2');
        }

        this.populateModelSelect(editSize);
        const modelSelect = document.getElementById('productionModel');
        if (modelSelect) {
          modelSelect.value = editModel;
          modelSelect.disabled = true;
          if (window.jQuery?.fn?.select2 && window.jQuery(modelSelect).data('select2'))
            window.jQuery(modelSelect).trigger('change.select2');
        }

        this.populateProcessTypeSelect(editSize, editModel);
        const typeSelect = document.getElementById('productionProcessType');
        if (typeSelect) {
          typeSelect.value = editType;
          typeSelect.disabled = true;
          if (window.jQuery?.fn?.select2 && window.jQuery(typeSelect).data('select2'))
            window.jQuery(typeSelect).trigger('change.select2');
        }

        // populateProcessSelect + initProcessSelect2 stay inside this same
        // suppressed block: populateProcessSelect doesn't manage its own
        // Select2 instance (initProcessSelect2 does, separately, unlike
        // populateSizeSelect/populateModelSelect/populateProcessTypeSelect
        // above, which each destroy their Select2 instance before touching
        // .value) — so its internal autoSelectOnlyOption call can hit an
        // already-live Select2 instance from a prior open and fire a real
        // change event if left unsuppressed here (see handleProcessTypeChange's
        // matching guard for the same hazard).
        this.populateProcessSelect(editSize, editType, editModel);
        const processSelect = document.getElementById('productionProcessId');
        if (processSelect) {
          processSelect.value = p.processId;
          processSelect.disabled = true; // Process cannot be changed on an existing lot
        }
        this.initProcessSelect2();
        } finally {
          this._suppressCascade = false;
        }

        document.getElementById('productionLotNumber').value = p.lotNumber || '';

        this.populateProductSelect();
        document.getElementById('productionProductId').value = p.productId || '';
        document.getElementById('productionProductIdHidden').value = p.productId || '';
        document.getElementById('productionProductNameHidden').value = p.productName || '';

        document.getElementById('productionOutputItemName').value = editProcess ? (editProcess.outputItemName || '') : '';
        const tagWrapper = document.getElementById('productionProductTagWrapper');
        if (tagWrapper) tagWrapper.style.display = (p.productId || (editProcess && editProcess.isFinalStage)) ? '' : 'none';

        let colors = await this.populateColorChecklist(p.processId, seq);
        if (seq !== this._compLoadSeq) return;

        // The Add Colors / Revert toggles only make sense while the process
        // can still be changed; this lot's process is locked, so hide both.
        const addColorsBtn = document.getElementById('productionAddColorsBtn');
        if (addColorsBtn) addColorsBtn.style.display = 'none';
        const revertColorsBtn = document.getElementById('productionRevertColorsBtn');
        if (revertColorsBtn) revertColorsBtn.style.display = 'none';

        // This process has no auto-detected color sub-groups, but the saved
        // lot still carries a colorBreakdown — it must have been recorded
        // via "Add Colors to this Lot" (enableManualColors). Rebuild the
        // checklist from the full Color Master list so those saved colors
        // have a row to check/restore against.
        if (colors.length === 0 && p.colorBreakdown && p.colorBreakdown.length > 0) {
          await App.Color.ensureLoaded();
          const breakdownColors = p.colorBreakdown.map(c => c.color).filter(Boolean);
          const allColors = Array.from(new Set([
            ...(App.State.globalColors || []).map(c => c.name),
            ...breakdownColors
          ]));

          const wrapper = document.getElementById('productionColorWrapper');
          const checklistEl = document.getElementById('productionColorChecklist');
          checklistEl.innerHTML = '';
          this.renderColorChecklistRows(allColors);

          document.getElementById('productionQtyWrapper').style.display = 'none';
          document.getElementById('productionQty').required = false;
          wrapper.style.display = '';
          document.getElementById('productionComponentsSectionLabel').innerText = 'Common Components';
          this.showColorMatrix();

          colors = allColors;
        }

        if (colors.length > 0) {
          // A saved multi-color batch (colorBreakdown) drives the checklist;
          // a legacy single-color lot (just p.color/p.qty, no breakdown) is
          // treated as a one-color breakdown so it upgrades to the new model
          // as soon as it's saved again.
          const breakdown = (p.colorBreakdown && p.colorBreakdown.length > 0)
            ? p.colorBreakdown
            : (p.color ? [{ color: p.color, qty: p.qty }] : []);

          // Match each saved entry to its checklist row by axis IDENTITY
          // (dataset.group === entry.axisKey) first, falling back to a
          // plain color-name match only for legacy entries with no axisKey.
          // Matching by color name alone breaks the moment two independent
          // Color Axes share a literal color name (see
          // bug_axis_color_name_collision_qty in project memory) — `.find()`
          // always resolves to the FIRST same-named row, so re-opening a
          // lot with a colliding pair could check/fill the SAME row twice
          // for two different saved entries while its true counterpart row
          // stayed blank. `claimedRows` additionally guards the legacy
          // fallback path itself: two same-named legacy entries must not
          // both land on the very same first-found row.
          const claimedRows = new Set();
          const findChecklistRow = (color, axisKey) => {
            const rows = $$('#productionColorChecklist .production-color-row').filter(r => !claimedRows.has(r));
            let row = axisKey ? rows.find(r => r.dataset.group === axisKey && r.dataset.color === color) : null;
            if (!row) row = rows.find(r => r.dataset.color === color);
            return row || null;
          };

          breakdown.forEach(entry => {
            const color = entry.color;
            const qty = entry.qty;
            let colorRow = findChecklistRow(color, entry.axisKey);

            if (!colorRow) {
              // No row exists for this saved color at all — either a
              // one-off custom sub-group (see addCustomColorRow) with no
              // recipe/pool backing, or a color the process's recipe has
              // since dropped. populateColorChecklist only ever renders
              // rows for colors the PROCESS currently knows about (see
              // getProcessColorGroups/getProcessColorAxes), never this
              // lot's own saved breakdown — without this fallback, such a
              // color's checked/qty state silently vanished from the Edit
              // form, and re-saving the edit would then permanently drop
              // it from the lot's record with no warning at all. Synthesize
              // a row for it (same markup as a real custom sub-group) so
              // it's visible, checked, and its quantity survives the edit.
              const checklistEl = document.getElementById('productionColorChecklist');
              if (checklistEl) {
                if (!checklistEl.querySelector('[data-group-master="custom"]')) {
                  checklistEl.insertAdjacentHTML('beforeend', this._buildColorGroupHeader('custom', 'Custom'));
                }
                // Preserve this entry's original total-counting behavior
                // (see getCheckedColorQtys/saveProduction) — a restored row
                // that previously did NOT count toward the lot total (a
                // non-primary axis row, or a legacy "Other" duplicate) must
                // not suddenly start double-counting just because its own
                // axis/group no longer exists to explain why not.
                const isPrimaryFlag = entry.countsTowardTotal !== false;
                checklistEl.insertAdjacentHTML('beforeend', this._colorRowHtml(color, 'custom', true, isPrimaryFlag));
                colorRow = $$('#productionColorChecklist .production-color-row')
                  .find(r => r.dataset.group === 'custom' && r.dataset.color === color && !claimedRows.has(r));
              }
            }

            if (colorRow) claimedRows.add(colorRow);
            const chk = colorRow?.querySelector('.production-color-check');
            const qtyInput = colorRow?.querySelector('.production-color-qty');
            if (chk) chk.checked = true;
            if (qtyInput) { qtyInput.disabled = false; qtyInput.value = qty; }
          });
          this._syncColorGroupMasterCheckbox('custom');

          if (p.componentsConsumed && p.componentsConsumed.length > 0) {
            await this.populateComponentsConsumedDirect(p.componentsConsumed, breakdown.map(b => b.color));
          } else {
            // No saved consumption recorded (shouldn't normally happen) — fall
            // back to recipe defaults for the saved colors.
            this.clearComponentsTable();
            this.clearColorMatrix();
            for (const { color, axisKey } of breakdown) {
              this.addMatrixColorColumn(color);
              await this.populateColorMatrixForColor(color, seq, axisKey);
            }
            await this.populateCommonComponentsFromProcess(p.processId, seq);
          }
          await this.refreshPoolAvailability();
        } else {
          document.getElementById('productionQty').value = p.qty;
          // Use this lot's actual saved Components Consumed if present; only
          // fall back to fetching the process's default recipe otherwise.
          if (p.componentsConsumed && p.componentsConsumed.length > 0) {
            this.clearComponentsTable();
            p.componentsConsumed.forEach(c => this.addComponentRow(c));
            await this.refreshPoolAvailability();
          } else {
            await this.populateComponentsFromProcess(p.processId, p.color || '', seq);
          }
        }
        if (seq !== this._compLoadSeq) return;

        document.getElementById('productionFormTitle').innerText = `Edit Production Lot: Row #${p.rowIdx}`;
        App.Utils.setFormButtonsForMode('productionCancelBtn', 'productionExitBtn', 'productionSubmitBtn', true, 'Save');

        App.Nav.register(
          'editProductionModal',
          App.State.filteredProduction.map(row => App.State.globalProduction.indexOf(row)),
          Number(idx),
          (i) => this.openEditModal(i)
        );

        const modalEl = document.getElementById('editProductionModal');
        if (modalEl && typeof bootstrap !== 'undefined') {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
        }
      },

      delete(rowIdx, productId, qty) {
        App.Utils.confirmAction(
          `Are you sure you want to permanently delete this Production Lot (Qty: ${qty})?`,
          async () => {
            try {
              const res = await Api.call('deleteProduction', rowIdx, productId, qty);
              App.Utils.showToast(res.message, !res.success);
              if (res.success) {
                await this.loadData();
              }
            } catch (err) {
              App.Utils.showToast(err.message || 'Failed to delete Production Log', true);
            }
          }
        );
      },

      // Trims floating-point noise (e.g. 0.1 * 3 = 0.30000000000000004) for display.
      formatQty(value) {
        const n = toNumber(value);
        return Number(n.toFixed(4)).toString();
      },

      viewProductionSheet(idx) {
        const p = App.State.globalProduction[idx];
        if (!p) return;

        // This lot's own recorded consumption (set when it was logged) is the
        // source of truth — production lots are tied to a Process recipe, not
        // a Product BOM, so there is no BOM to fall back to here.
        const defaultComponents = p.componentsConsumed || [];
        const components = (p.customComponents && p.customComponents.length > 0)
          ? p.customComponents
          : defaultComponents;

        // p.colorBreakdown is this lot's authoritative color list — a color
        // with no component explicitly tagged to it (entirely covered by a
        // Common fallback, see _getCommonItemsWithColorOverride) still needs
        // to be known here, or that fallback item's qty would have nowhere
        // to be split into for that color.
        const knownColors = (p.colorBreakdown || []).map(c => c.color).filter(Boolean);
        const { common, matrixSlots, colors } = this.groupComponentsForSheet(components, knownColors);

        // Remember context so Save/Reset/Add-row/Add-color actions know which
        // lot and which color columns are currently in play.
        App.State.currentProductionSheet = { idx, lotQty: p.qty, defaultComponents, colors, lotColor: p.color || '' };

        const label = p.productName || p.outputItemName || p.processId;
        const tag = p.productId || p.lotNumber;
        document.getElementById('productionSheetTitle').innerText = `Production Sheet: ${label} (${tag})`;
        document.getElementById('prodSheetDate').innerText = p.date;
        document.getElementById('prodSheetProductId').innerText = tag;
        document.getElementById('prodSheetProductName').innerText = label;
        document.getElementById('prodSheetLotQty').innerText = this.formatQty(p.qty);

        this.renderProductionSheetTable(common, matrixSlots, colors);

        document.getElementById('productionSheetRemarks').value = p.sheetRemarks || '';

        const modalEl = document.getElementById('productionSheetModal');
        if (modalEl && typeof bootstrap !== 'undefined') {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
        }
      },

      // Which color bucket a Production Sheet component belongs to: its
      // structured colorGroup (set on every lot created by the Create/Edit
      // Lot form — 'COMMON' or a specific Color Master name) if present,
      // else its legacy free-text Color field (older customized sheets,
      // predating colorGroup). '' means Common.
      _resolveSheetColorKey(comp) {
        const colorGroup = String(comp.colorGroup || '').trim();
        if (colorGroup && colorGroup.toUpperCase() !== 'COMMON') return colorGroup;
        return String(comp.color || '').trim();
      },

      // Removes one occurrence of `color` from `itemName` (case-insensitive)
      // and tidies up the leftover whitespace/separators, so e.g. "Red Fabric"
      // with color "Red" displays as just "Fabric". Tries the full color name
      // first, then each of its individual words (e.g. "Orange-White" ->
      // "Orange", "White") since an item is sometimes only named after one
      // half of a compound Color Master name (e.g. "Frame Sticker---Orange"
      // for the "Orange-White" color) — falling back word-by-word still lets
      // those merge into one matrix row instead of staying split per color.
      // If no candidate is found in the name verbatim, it's returned
      // unchanged (the row simply won't merge with that item's other color
      // variants, rather than risk stripping the wrong thing).
      _stripColorSubstring(itemName, color) {
        if (!color || !itemName) return itemName;
        const lowerName = itemName.toLowerCase();
        const candidates = [color, ...color.split(/[\s\-_]+/)].filter(Boolean);

        for (const candidate of candidates) {
          const idx = lowerName.indexOf(candidate.toLowerCase());
          if (idx === -1) continue;
          const stripped = (itemName.slice(0, idx) + itemName.slice(idx + candidate.length))
            .replace(/[\s\-_]+/g, ' ')
            .trim();
          return stripped || itemName;
        }
        return itemName;
      },

      // Key for "is this the same physical item slot" — a stripped/raw item
      // name + size, case/whitespace-insensitive. Shared by the Common-vs-
      // Per-Color merge detection below and the matrix row lookups.
      _itemSlotKey(name, size) {
        return `${(name || '').trim().toLowerCase()}|${(size || '').trim().toLowerCase()}`;
      },

      // A Common-tagged (ITEM-sourced) component "collides" with an explicit
      // per-color sibling when its own name matches that sibling's name once
      // the sibling's own color word is stripped — e.g. "Chain Cover"
      // (Common) and "Chain Cover Green" (colorGroup Green) are the same
      // physical item, just entered as the "every other color" fallback
      // instead of its own per-color row. Rendering the Common one as a
      // separate flat row makes what's really one item look like two
      // unrelated ones split across the Common Components table and the
      // Per-Color matrix. Components returned here are routed into the
      // matrix instead (see populateCommonComponentsFromProcess /
      // populateColorMatrixForColors / populateComponentsConsumedDirect,
      // which all consult this), getting a genuine per-color quantity for
      // every color that doesn't have its own override. Pool-sourced items
      // are excluded — they already have their own multi-color handling
      // (see getPoolColorAwareItemNames/renderPoolColorSplitGroups).
      _getCommonItemsWithColorOverride(components) {
        const overrideKeys = new Set((components || [])
          .filter(c => c.colorGroup && c.colorGroup !== 'COMMON' && c.sourceType !== 'POOL')
          .map(c => this._itemSlotKey(this._stripColorSubstring(c.itemName || '', c.colorGroup), c.size))
        );
        return (components || []).filter(c =>
          (!c.colorGroup || c.colorGroup === 'COMMON') &&
          c.sourceType !== 'POOL' &&
          overrideKeys.has(this._itemSlotKey(c.itemName, c.size))
        );
      },

      // Splits a lot's components into the Common table (no color, shown
      // once) and the Per-Color matrix (one row per de-duplicated item, one
      // quantity column per color) — mirroring the Create/Edit Lot form's
      // layout. Each color-specific component has its color's name substring
      // stripped from its item name before being used as the matrix row key,
      // so e.g. "Red Fabric" (colorGroup Red) and "Blue Fabric" (colorGroup
      // Blue) collapse into a single "Fabric" row with separate Red/Blue
      // columns instead of two unrelated-looking flat rows.
      groupComponentsForSheet(components, knownColors) {
        const common = [];
        const matrixIndex = new Map();
        const matrixSlots = [];
        const colors = new Set(knownColors || []);

        // A Common item that's really the same physical item as an explicit
        // per-color sibling elsewhere in this lot (see
        // _getCommonItemsWithColorOverride — e.g. a legacy lot saved before
        // that merge existed) is deferred until every color in this lot has
        // been seen below, then split across whichever colors AREN'T
        // already covered by their own sibling row — display-only, doesn't
        // touch the lot's actual saved data.
        const commonOverrideComps = this._getCommonItemsWithColorOverride(components || []);
        const pendingCommonOverrides = [];

        (components || []).forEach(comp => {
          const colorKey = this._resolveSheetColorKey(comp);
          const qty = comp.requiredQty !== undefined ? toNumber(comp.requiredQty) : toNumber(comp.qty);

          if (!colorKey) {
            if (commonOverrideComps.includes(comp)) {
              const overriddenColors = new Set(
                (components || [])
                  .filter(o => o !== comp && this._resolveSheetColorKey(o) &&
                    this._itemSlotKey(this._stripColorSubstring(o.itemName || '', this._resolveSheetColorKey(o)), o.size) === this._itemSlotKey(comp.itemName, comp.size))
                  .map(o => this._resolveSheetColorKey(o))
              );
              pendingCommonOverrides.push({ comp, qty, overriddenColors });
              return;
            }
            common.push({ itemName: comp.itemName || '', size: comp.size || '', narration: comp.narration || '', qty });
            return;
          }

          colors.add(colorKey);
          const displayName = this._stripColorSubstring(comp.itemName || '', colorKey);
          const slotKey = [displayName, comp.size || '', comp.narration || ''].join('|').toLowerCase();
          let slot = matrixIndex.get(slotKey);
          if (!slot) {
            slot = { itemName: displayName, size: comp.size || '', narration: comp.narration || '', colors: {} };
            matrixIndex.set(slotKey, slot);
            matrixSlots.push(slot);
          }
          slot.colors[colorKey] = (slot.colors[colorKey] || 0) + qty;
        });

        const allColors = Array.from(colors);
        pendingCommonOverrides.forEach(({ comp, qty, overriddenColors }) => {
          const fallbackColors = allColors.filter(c => !overriddenColors.has(c));
          if (fallbackColors.length === 0) return;
          const perColorQty = qty / fallbackColors.length;
          const displayName = comp.itemName || '';
          const slotKey = [displayName, comp.size || '', comp.narration || ''].join('|').toLowerCase();
          let slot = matrixIndex.get(slotKey);
          if (!slot) {
            slot = { itemName: displayName, size: comp.size || '', narration: comp.narration || '', colors: {} };
            matrixIndex.set(slotKey, slot);
            matrixSlots.push(slot);
          }
          fallbackColors.forEach(c => { slot.colors[c] = (slot.colors[c] || 0) + perColorQty; });
        });

        return { common, matrixSlots, colors: allColors.sort((a, b) => a.localeCompare(b)) };
      },

      // Renders the Common table + the Per-Color matrix for the given
      // grouped data. The matrix is split into one table per distinct set
      // of colors its rows actually carry a value for (see
      // _groupMatrixSlotsForSheet), instead of one shared table with every
      // color in the lot as a column — which got very wide/sparse once a
      // lot had several colors split unevenly across items (e.g. a Painted
      // Frame's 6 colors vs a Mudguard's other 6). A perpetual "manual"
      // table (full color list) is always rendered too, as the target for
      // "+ Add Per-Color Component" / "+ Add Color Column". Hides the
      // matrix card entirely when this lot has no color-specific
      // components at all.
      renderProductionSheetTable(common, matrixSlots, colors) {
        const commonBody = document.getElementById('productionSheetCommonBody');
        if (commonBody) {
          commonBody.innerHTML = (common && common.length > 0)
            ? common.map(row => this.renderCommonSheetRow(row)).join('')
            : `<tr><td colspan="5" class="text-center text-muted p-3">No common components recorded.</td></tr>`;
        }

        const matrixCard = document.getElementById('productionSheetMatrixCard');
        if (matrixCard) matrixCard.style.display = colors.length > 0 ? '' : 'none';

        const tablesContainer = document.getElementById('productionSheetMatrixTables');
        if (!tablesContainer) return;
        tablesContainer.innerHTML = '';

        const { autoGroups, manualSlots } = this._groupMatrixSlotsForSheet(matrixSlots);
        autoGroups.forEach((group, idx) => {
          tablesContainer.insertAdjacentHTML('beforeend', this._buildSheetMatrixTable(`group_${idx}`, group.colors, group.slots));
        });
        tablesContainer.insertAdjacentHTML('beforeend', this._buildSheetMatrixTable('manual', colors, manualSlots));
      },

      // Splits matrixSlots into signature-based auto groups (rows that
      // already carry real saved/customized values, grouped by exactly
      // which colors those are) plus a `manualSlots` leftover list (rows
      // with no recorded color values at all — shouldn't normally happen
      // from real saved data, but kept safe). The manual/catch-all table
      // rendered alongside these always shows the FULL color list
      // regardless of this grouping, since it's the perpetual target for
      // ad-hoc additions.
      _groupMatrixSlotsForSheet(matrixSlots) {
        const groups = new Map();
        const manualSlots = [];
        (matrixSlots || []).forEach(slot => {
          const slotColors = Object.keys(slot.colors || {});
          if (slotColors.length === 0) { manualSlots.push(slot); return; }
          const sortedColors = slotColors.slice().sort((a, b) => a.localeCompare(b));
          const signature = sortedColors.join('|').toLowerCase();
          if (!groups.has(signature)) groups.set(signature, { colors: sortedColors, slots: [] });
          groups.get(signature).slots.push(slot);
        });
        return { autoGroups: Array.from(groups.values()), manualSlots };
      },

      // Builds one Per-Color table block: a header with this group's own
      // colors, and a tbody tagged with data-matrix-group so
      // addMatrixSheetRow/addProductionSheetColor/serializeProductionSheet
      // can target the right table (or read across all of them).
      _buildSheetMatrixTable(groupKey, colors, slots) {
        // Header is just the color name (no "Req. Qty" suffix repeated on
        // every column) and Item/Size/Narration get fixed, modest widths so
        // the color columns — now narrower without that suffix — have a
        // better chance of fitting on screen without horizontal scroll,
        // while table-sm keeps per-cell padding tight without making text
        // unreadably small.
        const headHtml = colors.map(c => `<th class="text-end" style="min-width:70px;" data-color="${escapeHtml(c)}">${escapeHtml(c)}</th>`).join('');
        const bodyHtml = slots.map(slot => this.renderMatrixSheetRow(slot, colors)).join('');
        return `
      <div class="table-responsive mb-3" data-matrix-group="${escapeHtml(groupKey)}">
        <table class="table table-sm table-hover table-striped align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th style="width:18%;">Item Name</th><th style="width:8%;">Size</th><th style="width:14%;">Narration</th>
              ${headHtml}
              <th class="text-center" style="width:30px;">✕</th>
            </tr>
          </thead>
          <tbody class="prod-sheet-matrix-tbody" data-matrix-group="${escapeHtml(groupKey)}">${bodyHtml}</tbody>
        </table>
      </div>`;
      },

      // Builds one editable Common-table <tr>: item/size/narration + a single Required Qty input.
      renderCommonSheetRow(row) {
        const display = row.qty !== undefined ? this.formatQty(row.qty) : '';
        return `<tr>
      <td><input type="text" class="form-control form-control-sm prod-sheet-item-name" value="${escapeHtml(row.itemName || '')}" placeholder="Item name"></td>
      <td><input type="text" class="form-control form-control-sm prod-sheet-size" value="${escapeHtml(row.size || '')}" placeholder="-"></td>
      <td><input type="text" class="form-control form-control-sm prod-sheet-narration" value="${escapeHtml(row.narration || '')}" placeholder="-"></td>
      <td><input type="number" class="form-control form-control-sm text-end prod-sheet-qty" value="${display}" step="any" min="0" placeholder="-"></td>
      <td class="text-center"><button type="button" class="btn btn-outline-danger btn-sm" onclick="this.closest('tr').remove()">✕</button></td>
    </tr>`;
      },

      // Builds one editable matrix <tr>: item/size/narration text inputs, plus
      // one Required Qty number input per color column (blank = not
      // applicable to that color, rather than a misleading 0).
      renderMatrixSheetRow(slot, colors) {
        const qtyCell = (color) => {
          const val = slot.colors ? slot.colors[color] : undefined;
          const display = (val === undefined) ? '' : this.formatQty(val);
          return `<td><input type="number" class="form-control form-control-sm text-end prod-sheet-color-qty" data-color="${escapeHtml(color)}" value="${display}" step="any" min="0" placeholder="-"></td>`;
        };

        let html = `<tr>
      <td><input type="text" class="form-control form-control-sm prod-sheet-item-name" value="${escapeHtml(slot.itemName || '')}" placeholder="Item name"></td>
