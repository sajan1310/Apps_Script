        let targetGroup = selectedKey ? (this._customColorGroupOptions || []).find(o => o.key === selectedKey) : null;

        // No explicit choice (picker hidden — 0 or 1 real group at all, see
        // _refreshCustomColorGroupSelect) but there IS exactly one real
        // group: treat it as the implicit target, mirroring
        // _poolDefForCustomColor's own "unambiguous when only one exists"
        // fallback below. Without this, the row itself fell into the flat,
        // disconnected 'custom' bucket while the Pool Components table
        // extension a few lines down correctly attached to that one real
        // group — so checking this row could never satisfy that table's
        // own axis-scoped checked-color detection (see
        // syncPoolColorGroupColumns/_checkedPoolGroupColors) and its column
        // would never actually appear, no matter how long it stayed checked.
        if (!targetGroup && (this._customColorGroupOptions || []).length === 1) {
          targetGroup = this._customColorGroupOptions[0];
        }

        // A custom color assigned to (or defaulting to, when there's only
        // one group so the picker never showed at all) a POOL-sourced group
        // is additional output of that SAME real pool item — e.g. a not-yet-
        // catalogued color of "Painted Frame Rider 14 inch D/Gaddi" — so its
        // own Per-Process Pool Components table needs a matching column to
        // record how many units of it were actually produced/consumed, or
        // the operator has no way to enter that at all (see
        // renderPoolColorSplitGroups / syncPoolColorGroupColumns, which only
        // ever recognizes a color already present in that item's real
        // Warehouse Pool history). Extending the def's own `colors` here is
        // enough — the checkbox toggle right below calls
        // syncPoolColorGroupColumns, which picks up the new entry itself.
        const poolDef = this._poolDefForCustomColor(targetGroup);
        if (poolDef && !poolDef.colors.some(c => c.toLowerCase() === name.toLowerCase())) {
          poolDef.colors.push(name);
          poolDef.colors.sort((a, b) => a.localeCompare(b));
        }

        let groupKey;
        if (targetGroup) {
          // Insert right after that group's own last row so it sits visually
          // alongside its real colors, not appended at the very bottom of an
          // unrelated later group.
          groupKey = targetGroup.key;
          const groupRows = $$('#productionColorChecklist .production-color-row')
            .filter(r => r.dataset.group === groupKey);
          const anchor = groupRows[groupRows.length - 1];
          const html = this._colorRowHtml(name, groupKey, true, targetGroup.isPrimary);
          if (anchor) anchor.insertAdjacentHTML('afterend', html);
          else checklistEl.insertAdjacentHTML('beforeend', html);
        } else {
          groupKey = 'custom';
          if (!checklistEl.querySelector('[data-group-master="custom"]')) {
            checklistEl.insertAdjacentHTML('beforeend', this._buildColorGroupHeader('custom', 'Custom'));
          }
          this.renderColorChecklistRows([name], 'custom', true);
        }
        // input is now a Select2-enhanced <select> (see
        // initCustomColorInputSelect2) — a plain .value='' leaves the
        // visible Select2 selection box showing the just-added name, since
        // Select2 only repaints its own display in reaction to a real
        // 'change' event, not a raw DOM property set (same reasoning as
        // initContractorSelect2's own change-handler comment above).
        if (input) {
          if (window.jQuery?.fn?.select2 && window.jQuery(input).data('select2')) {
            window.jQuery(input).val(null).trigger('change');
          } else {
            input.value = '';
          }
        }
        if (groupSelect) groupSelect.value = '';

        const row = $$('#productionColorChecklist .production-color-row')
          .find(r => r.dataset.group === groupKey && App.Utils.sameColor(r.dataset.color, name));
        const checkbox = row?.querySelector('.production-color-check');
        if (checkbox) {
          checkbox.checked = true;
          this.handleColorCheckToggle(checkbox);
        }
        this._syncColorGroupMasterCheckbox(groupKey);
      },

      // Finds which Per-Process Pool Components table def (see
      // renderPoolColorSplitGroups / _poolColorGroupDefs), if any, a custom
      // color's chosen checklist group corresponds to — so addCustomColorRow
      // can extend that table's own recognized colors with the new one.
      //   - No group picked (picker was never shown because this process
      //     has 0 or 1 pool group at all — see _refreshCustomColorGroupSelect):
      //     unambiguous, use that one pool def if it's the only one.
      //   - A pool-sourced group explicitly picked (targetGroup.source ===
      //     'pool'): match by item name — a pool axis's own label is built
      //     server-side as itemNames.join(', ') (see
      //     computeColorAxesForProcess), so splitting on the same separator
      //     recovers the real item name(s) to match against each def's own
      //     rows.
      //   - A tag-based axis, or "Independent" picked among 2+ groups where
      //     more than one pool def exists: genuinely ambiguous or not
      //     pool-related at all — no def to extend, custom color stays
      //     checklist/matrix-only (its old behavior).
      _poolDefForCustomColor(targetGroup) {
        const defs = this._poolColorGroupDefs || [];
        if (!targetGroup) {
          return defs.length === 1 ? defs[0] : null;
        }
        if (targetGroup.source !== 'pool') return null;
        const itemNames = targetGroup.label.split(',').map(s => s.trim().toLowerCase());
        return defs.find(def => (def.rows || []).some(r => itemNames.includes((r.itemName || '').trim().toLowerCase()))) || null;
      },

      // Fired by a group's "Select all" checkbox (see renderGroupedColorChecklist)
      // — checks/unchecks every not-already-matching color row tagged with
      // this groupKey, then applies the matrix-column/Per-Process Pool
      // Components updates for all of them in one batch (via
      // populateColorMatrixForColors) instead of one full round-trip per
      // color, which is what made toggling a whole group visibly laggy.
      async toggleColorGroup(checkboxEl, groupKey) {
        const seq = this._compLoadSeq;
        const checked = checkboxEl.checked;
        const rows = $$('#productionColorChecklist .production-color-row').filter(row => row.dataset.group === groupKey);
        const toggledColors = [];
        const toggledPrimaryColors = [];

        rows.forEach(row => {
          const chk = row.querySelector('.production-color-check');
          if (!chk || chk.checked === checked) return;
          chk.checked = checked;
          const qtyInput = row.querySelector('.production-color-qty');
          if (qtyInput) {
            qtyInput.disabled = !checked;
            if (!checked) {
              qtyInput.value = '';
              delete row.dataset.autoSynced;
            } else if (row.dataset.primary === 'false') {
              // Prefer the ONE matching primary color's own qty (e.g. a
              // "Red" mudguard matching a checked "Red-White" frame) over
              // the grand total across every checked primary color — see
              // _matchingPrimaryColorQty for why a lump-sum default here
              // was a real calculation mistake once 2+ primary colors are
              // checked at once.
              const matched = this._matchingPrimaryColorQty(row.dataset.color);
              const fillQty = matched !== null ? matched : this._primaryColorAxisTotal();
              if (fillQty > 0) qtyInput.value = this.formatQty(fillQty);
              // Keep tracking afterward either way — a genuine 1:1 match
              // (see onColorQtyChanged) or, just like a real Common
              // Component, the running grand total for a row with no
              // specific color counterpart (e.g. a Fitted Rim always in
              // Black regardless of frame color).
              row.dataset.autoSynced = 'true';
            }
          }
          toggledColors.push(row.dataset.color);
          if (row.dataset.primary === 'true') toggledPrimaryColors.push(row.dataset.color);
        });

        if (toggledColors.length === 0) return;

        const processId = document.getElementById('productionProcessId')?.value;
        if (checked) {
          toggledColors.forEach(color => this.addMatrixColorColumn(color));
          this.syncPoolColorGroupColumns();
          if (processId) await this.populateColorMatrixForColors(processId, toggledColors, seq, groupKey);
        } else {
          toggledColors.forEach(color => {
            this.removeMatrixColorColumn(color);
            this.refreshPoolColorGroupCells(color, 0, groupKey);
          });
          this.syncPoolColorGroupColumns();
        }

        this.refreshCommonSuggestedQty();
        this.refreshPayableHint();
        checkboxEl.indeterminate = false;

        // Same "primary drives matching secondary rows" behavior as a
        // single checkbox click (see handleColorCheckToggle) — a bulk
        // "select all" on a primary group must cascade too, or select-
        // alling the frame colors would leave the matching mudguards
        // requiring a separate, manual pass. Cascade runs BEFORE the single
        // availability refresh below (see handleColorCheckToggle's
        // refreshAvailability param) so this whole bulk toggle — however
        // many rows and matches it touches — costs exactly one WIP/Stock
        // round trip, not one per row.
        for (const primaryColor of toggledPrimaryColors) {
          await this._syncMatchingNonPrimaryRows(primaryColor, checked);
        }
        if (toggledPrimaryColors.length > 0) this._refreshAutoSyncedNonPrimaryRows();

        this._pruneRedundantMatrixColumns();
        await this.refreshPoolAvailability();
      },

      // Splits the Colors to Produce checklist into the same sub-groups as
      // the Per-Process Pool Components tables (see renderPoolColorSplitGroups)
      // — output colors that match a multi-color pool item's own color set
      // are shown under that item's name, purely to declutter a long flat
      // list; any color that doesn't match a pool item's color set (e.g. a
      // genuinely process-defined color with no live pool history yet) falls
      // into a final "Other" block. Falls back to one flat list (unchanged
      // behavior) if no grouping is possible.
      //
      // When this process has 2+ independent Color Axes configured (see
      // getProcessColorAxes / the Process editor's "Group"/"Primary Axis"
      // fields), this instead renders one independent group PER AXIS — no
      // composite "Base / Color" strings anywhere — with the primary axis's
      // group flagged so its rows sum into the lot's total quantity and every
      // other axis's rows don't (see saveProduction's quantity derivation and
      // handleColorCheckToggle's auto-fill for non-primary rows). A process
      // with 0 or 1 axis has nothing to split, so it falls through unchanged
      // to the pool-item-set grouping below.
      async renderGroupedColorChecklist(processId, colors, seq) {
        const checklistEl = document.getElementById('productionColorChecklist');
        if (!checklistEl) return;

        try {
          const axesRes = await Api.call('getProcessColorAxes', processId);
          if (seq !== undefined && seq !== this._compLoadSeq) return;
          const axes = (axesRes.success && axesRes.data && Array.isArray(axesRes.data.axes)) ? axesRes.data.axes : [];
          if (axes.length >= 2) {
            checklistEl.innerHTML = '';
            const primaryAxisKey = axesRes.data.primaryAxisKey || '';
            // groupKey IS the axis's own key (not a synthetic index) so a
            // later Primary pick (setPrimaryColorAxisChoice) can re-tag rows
            // by comparing dataset.group straight to the radio's value —
            // same lookup toggleColorGroup/_syncColorGroupMasterCheckbox
            // already do for every other group flavor.
            axes.forEach(axis => {
              const isPrimary = !!primaryAxisKey && axis.key === primaryAxisKey;
              checklistEl.insertAdjacentHTML('beforeend', this._buildColorAxisGroupHeader(axis, isPrimary));
              this.renderColorChecklistRows(axis.colors, axis.key, false, isPrimary);
              this._customColorGroupOptions.push({ key: axis.key, label: axis.label, isPrimary, source: axis.source });
            });

            // `colors` (this function's own param) is the widened list from
            // getProcessColorGroups — every real axis color PLUS the full
            // Color Master (see computeColorGroupsForProcess) — so anything
            // left over here is a Color Master color that isn't part of any
            // real axis yet. Offered as its own non-primary "Other" bucket,
            // same catch-all role/semantics as the pool-item-grouping
            // fallback's own "Other" bucket below: getCheckedColorQtys only
            // counts a checked "other" row toward the lot total when it
            // ISN'T currently segment-matching a checked primary row (see
            // _matchingPrimaryColorQty), so picking one of these never
            // double-counts against a real axis color that means the same
            // physical batch.
            const axisColorsLower = new Set();
            axes.forEach(axis => axis.colors.forEach(c => axisColorsLower.add(c.toLowerCase())));
            const extraColors = (colors || []).filter(c => !axisColorsLower.has(c.toLowerCase()));
            if (extraColors.length > 0) {
              checklistEl.insertAdjacentHTML('beforeend', this._buildColorGroupHeader('other', 'Other Colors (Color Master)'));
              this.renderColorChecklistRows(extraColors, 'other', false, false);
            }

            // A process that has never had a Primary Axis configured no
            // longer arrives with none — getProcessColorAxes resolves the
            // first axis in recipe order as the default and flags it
            // primaryIsDefault (see _defaultPrimaryColorAxisLabel,
            // module_process.js), so the radio below is already on it and
            // quantities can't silently double-count across axes. Say which
            // one was picked, since the operator never chose it; the old
            // "nothing is primary, pick one" warning is only reachable now if
            // the axes list itself came back empty.
            if (!primaryAxisKey) {
              checklistEl.insertAdjacentHTML('afterbegin',
                '<div class="alert alert-warning py-1 px-2 small mb-2" style="flex: 1 0 100%;" id="productionPrimaryAxisWarning">' +
                'Pick which group below is <b>Primary</b> — its checked quantities become this lot\'s total. The others are recorded per-color but won\'t add to it.</div>');
            } else if (axesRes.data.primaryIsDefault) {
              const primaryLabel = (axes.find(a => a.key === primaryAxisKey) || {}).label || '';
              checklistEl.insertAdjacentHTML('afterbegin',
                '<div class="alert alert-info py-1 px-2 small mb-2" style="flex: 1 0 100%;" id="productionPrimaryAxisWarning">' +
                '<b>' + escapeHtml(primaryLabel) + '</b> is this process\'s Primary group by default — its checked quantities become this lot\'s total, ' +
                'and the other groups are recorded per-color without adding to it. Pick a different <b>Primary</b> below if that\'s not right.</div>');
            }
            return;
          }
        } catch (err) {
          if (seq !== undefined && seq !== this._compLoadSeq) return;
          // Fall through to the legacy grouping below on any failure.
        }

        let comps = [];
        let poolColorMap = new Map();
        try {
          const [compRes, pcm] = await Promise.all([
            this._fetchProcessComponents(processId),
            this.getPoolColorAwareItemNames(processId)
          ]);
          if (seq !== undefined && seq !== this._compLoadSeq) return;
          comps = compRes.success ? (compRes.data || []) : [];
          poolColorMap = pcm;
        } catch (err) {
          if (seq !== undefined && seq !== this._compLoadSeq) return;
          checklistEl.innerHTML = '';
          this.renderColorChecklistRows(colors);
          return;
        }

        checklistEl.innerHTML = '';

        const multiColorItems = comps.filter(c => c.sourceType === 'POOL' && (!c.colorGroup || App.Utils.isCommonColorGroup(c.colorGroup))
          && (poolColorMap.get((c.itemName || '').trim().toLowerCase()) || []).length > 1);

        const groups = new Map();
        multiColorItems.forEach(c => {
          const itemColors = poolColorMap.get((c.itemName || '').trim().toLowerCase()) || [];
          const signature = itemColors.slice().sort((a, b) => a.localeCompare(b)).join('|').toLowerCase();
          if (!groups.has(signature)) groups.set(signature, { colorSet: new Set(itemColors.map(x => x.toLowerCase())), itemNames: [] });
          groups.get(signature).itemNames.push(c.itemName);
        });

        if (groups.size === 0) {
          this.renderColorChecklistRows(colors);
          return;
        }

        const usedColors = new Set();
        let groupIdx = 0;
        groups.forEach(({ colorSet, itemNames }) => {
          // Exclude colors a prior group already claimed — two pool items
          // with overlapping-but-different color sets (e.g. {Red,Blue} and
          // {Red,Blue,Green}) would otherwise both match "Red", rendering it
          // as a duplicate checkbox row under two group headers. A double
          // check-in there would double-count that color's qty into the
          // saved colorBreakdown and double-credit it in the Warehouse Pool.
          const matching = colors.filter(col => colorSet.has(col.toLowerCase()) && !usedColors.has(col.toLowerCase()));
          if (matching.length === 0) return;
          matching.forEach(c => usedColors.add(c.toLowerCase()));
          groupIdx++;
          const groupKey = `group_${groupIdx}`;
          checklistEl.insertAdjacentHTML('beforeend', this._buildColorGroupHeader(groupKey, itemNames.join(', ')));
          // data-primary="true" — same flag axis mode uses on its Primary
          // group — so a pool-backed group's checked rows keep summing into
          // the lot total exactly as before (unchanged), and so an "Other"
          // row below that segment-matches one of these can auto-check /
          // auto-fill from it (see _matchingPrimaryColorQty /
          // _syncMatchingNonPrimaryRows, both generic over data-primary).
          this.renderColorChecklistRows(matching, groupKey, false, true);
          this._customColorGroupOptions.push({ key: groupKey, label: itemNames.join(', '), isPrimary: true, source: 'pool' });
        });

        const remaining = colors.filter(c => !usedColors.has(c.toLowerCase()));
        if (remaining.length > 0) {
          checklistEl.insertAdjacentHTML('beforeend', this._buildColorGroupHeader('other', 'Other'));
          // data-primary="false" reuses the exact axis-mode "non-primary row"
          // machinery for this leftover bucket too: checking a pool-backed
          // group's row above auto-checks/auto-fills any "Other" row whose
          // name segment-matches it (e.g. "Pink" <- "Pink / BCP / Pink-White"),
          // since that's virtually always the same physical color tagged two
          // different ways, not a second, additional quantity. An "Other" row
          // that never finds a match is instead still counted toward the lot
          // total by getCheckedColorQtys/_currentLotTotalQty (see their
          // comments) — this bucket isn't guaranteed to be pool-derived
          // duplicates, per this function's own doc comment above.
          this.renderColorChecklistRows(remaining, 'other', false, false);
        }
      },

      // Builds one group's label row: a "select all" checkbox (see
      // toggleColorGroup) plus the group's name, spanning the full width of
      // the checklist's flex-wrap row so the next group's checkboxes start
      // on a fresh line.
      _buildColorGroupHeader(groupKey, label) {
        return `
      <div class="d-flex align-items-center gap-2 mt-2 mb-1" style="flex: 1 0 100%;">
        <input type="checkbox" class="form-check-input" data-group-master="${escapeHtml(groupKey)}" onchange="App.Production.toggleColorGroup(this, '${escapeHtml(groupKey)}')" title="Select all colors in this group">
        <span class="text-muted small fw-bold">${escapeHtml(label)}</span>
      </div>`;
      },

      // Same as _buildColorGroupHeader, but for a Color Axis group (see
      // renderGroupedColorChecklist's axis-mode branch) — adds a "Primary"
      // radio next to the "select all" checkbox so the operator can pick
      // (or change) which axis's checked quantities become this lot's total
      // right here, instead of only in the Process editor. See
      // setPrimaryColorAxisChoice — the choice also gets submitted with the
      // lot (saveProduction) and persisted back onto the process for future
      // lots, closing the gap where a multi-axis process with no primary
      // configured yet would silently fall back to summing every group.
      _buildColorAxisGroupHeader(axis, isPrimary) {
        return `
      <div class="d-flex align-items-center gap-2 mt-2 mb-1" style="flex: 1 0 100%;">
        <input type="checkbox" class="form-check-input" data-group-master="${escapeHtml(axis.key)}" onchange="App.Production.toggleColorGroup(this, '${escapeHtml(axis.key)}')" title="Select all colors in this group">
        <span class="text-muted small fw-bold axis-group-label" data-axis-label="${escapeHtml(axis.label)}">${escapeHtml(axis.label)}${isPrimary ? ' (Primary)' : ''}</span>
        <label class="form-check form-check-inline mb-0 ms-2 small text-muted" title="This group's checked quantities become the lot's total output quantity">
          <input type="radio" class="form-check-input" name="productionPrimaryAxisPick" value="${escapeHtml(axis.key)}" data-axis-label="${escapeHtml(axis.label)}"
            ${isPrimary ? 'checked' : ''} onchange="App.Production.setPrimaryColorAxisChoice(this)">
          Primary
        </label>
      </div>`;
      },

      // Fired when the operator picks/changes which axis group is Primary
      // directly on the Production Lot form (see _buildColorAxisGroupHeader).
      // Re-tags every row's data-primary in place (no re-render, so already-
      // entered checkboxes/quantities are untouched) and refreshes whatever
      // depends on the primary total. The actual value only reaches the
      // process's own saved default once this lot is submitted — see the
      // productionForm submit handler, which reads the checked radio into
      // formData.primaryColorAxis; saveProduction uses it for THIS lot's
      // quantity and persists it back onto the process for future lots.
      setPrimaryColorAxisChoice(radioEl) {
        const axisKey = radioEl.value;
        $$('#productionColorChecklist .production-color-row[data-group]').forEach(row => {
          row.dataset.primary = row.dataset.group === axisKey ? 'true' : 'false';
        });
        document.querySelectorAll('#productionColorChecklist .axis-group-label').forEach(labelEl => {
          const ownRadio = labelEl.closest('div')?.querySelector('input[name="productionPrimaryAxisPick"]');
          const label = labelEl.dataset.axisLabel || labelEl.textContent;
          labelEl.textContent = label + (ownRadio?.checked ? ' (Primary)' : '');
        });
        const warning = document.getElementById('productionPrimaryAxisWarning');
        if (warning) warning.remove();
        this.refreshCommonSuggestedQty();
        this.refreshPayableHint();
      },

      // Keeps a group's "select all" checkbox in sync with its rows' actual
      // checked state — checked when every row is checked, indeterminate
      // when only some are, unchecked when none are. Fired after any
      // individual color checkbox in a group is toggled (see
      // handleColorCheckToggle), so the master box never goes stale.
      _syncColorGroupMasterCheckbox(groupKey) {
        if (!groupKey) return;
        const master = $$('#productionColorChecklist [data-group-master]').find(el => el.dataset.groupMaster === groupKey);
        if (!master) return;
        const rows = $$('#productionColorChecklist .production-color-row').filter(row => row.dataset.group === groupKey);
        const checkedCount = rows.filter(row => row.querySelector('.production-color-check')?.checked).length;
        master.checked = rows.length > 0 && checkedCount === rows.length;
        master.indeterminate = checkedCount > 0 && checkedCount < rows.length;
      },

      // Lets the operator manually switch a process with no auto-detected
      // color sub-groups (no per-color recipe rows, no Warehouse Pool color
      // history yet — e.g. a brand-new process) over to the multi-color
      // checklist for just this one lot, using the full Color Master list.
      async enableManualColors() {
        const processId = document.getElementById('productionProcessId').value;
        if (!processId) return;
        const seq = ++this._compLoadSeq;
        this._resetProcDataCache();

        await App.Color.ensureLoaded();
        const colors = (App.State.globalColors || []).map(c => c.name).filter(Boolean);
        if (colors.length === 0) {
          App.Utils.showToast('No colors configured yet — add one via Manage Color Master first.', true);
          return;
        }

        const wrapper = document.getElementById('productionColorWrapper');
        const checklistEl = document.getElementById('productionColorChecklist');
        const qtyWrapper = document.getElementById('productionQtyWrapper');
        const qtyInput = document.getElementById('productionQty');
        const sectionLabel = document.getElementById('productionComponentsSectionLabel');
        if (!wrapper || !checklistEl) return;

        checklistEl.innerHTML = '';
        this.renderColorChecklistRows(colors);

        if (qtyWrapper) qtyWrapper.style.display = 'none';
        if (qtyInput) { qtyInput.required = false; qtyInput.value = ''; }
        wrapper.style.display = '';
        if (sectionLabel) sectionLabel.innerText = 'Common Components';
        this.showColorMatrix();

        this.clearComponentsTable();
        this.clearColorMatrix();
        await this.populateCommonComponentsFromProcess(processId, seq);
        if (seq !== this._compLoadSeq) return;

        const addBtn = document.getElementById('productionAddColorsBtn');
        if (addBtn) addBtn.style.display = 'none';
        const revertBtn = document.getElementById('productionRevertColorsBtn');
        if (revertBtn) revertBtn.style.display = '';
      },

      // Undoes enableManualColors() for this lot, restoring the plain Qty
      // field and that process's default (non-color-scoped) recipe.
      async revertToSingleQty() {
        const processId = document.getElementById('productionProcessId').value;
        const seq = ++this._compLoadSeq;
        this._resetProcDataCache();

        const wrapper = document.getElementById('productionColorWrapper');
        const checklistEl = document.getElementById('productionColorChecklist');
        if (checklistEl) checklistEl.innerHTML = '';
        if (wrapper) wrapper.style.display = 'none';
        this.hideColorMatrix();

        const qtyWrapper = document.getElementById('productionQtyWrapper');
        const qtyInput = document.getElementById('productionQty');
        if (qtyWrapper) qtyWrapper.style.display = '';
        if (qtyInput) qtyInput.required = true;

        const sectionLabel = document.getElementById('productionComponentsSectionLabel');
        if (sectionLabel) sectionLabel.innerText = 'Components Consumed';

        await this.populateComponentsFromProcess(processId, '', seq);
        if (seq !== this._compLoadSeq) return;

        const addBtn = document.getElementById('productionAddColorsBtn');
        if (addBtn) addBtn.style.display = processId ? '' : 'none';
        const revertBtn = document.getElementById('productionRevertColorsBtn');
        if (revertBtn) revertBtn.style.display = 'none';
      },

      // Fired when a color's checkbox is toggled — enables/clears its qty
      // and (optional) size inputs, and adds/removes that color's column in
      // the Per-Color matrix (existing rows/cells for other colors are left
      // untouched). `refreshAvailability` is false only when this is one
      // step of a primary row's auto-sync cascade (see
      // _syncMatchingNonPrimaryRows) — refreshPoolAvailability is a real
      // getProcessWipData + getStockData server round trip, not a client
      // computation, so calling it once per cascaded row (auto-checking a
      // primary color that name-matches N non-primary rows) turned one
      // checkbox click into N+1 sequential Apps Script calls and made
      // "instant" auto-selection visibly laggy. The top-level call (real
      // user click, refreshAvailability defaults true) still refreshes
      // exactly once, after its own cascade has fully settled.
      async handleColorCheckToggle(checkboxEl, refreshAvailability = true) {
        const seq = this._compLoadSeq;
        const row = checkboxEl.closest('.production-color-row');
        const color = row?.dataset.color;
        const qtyInput = row?.querySelector('.production-color-qty');
        if (qtyInput) {
          qtyInput.disabled = !checkboxEl.checked;
          if (!checkboxEl.checked) {
            qtyInput.value = '';
            if (row) delete row.dataset.autoSynced;
          } else if (row?.dataset.primary === 'false') {
            // Non-primary axis row (e.g. Mudguard Color) — default its
            // quantity from whichever ONE checked primary row it name-
            // matches (e.g. "Red" mudguard <- "Red-White" frame's own qty),
            // falling back to the primary axis's running total only when no
            // single primary color matches (e.g. a Fitted Rim always in
            // Black regardless of frame color). Still a plain editable
            // value afterward, not locked, per confirmed direction.
            const matched = this._matchingPrimaryColorQty(row.dataset.color);
            const fillQty = matched !== null ? matched : this._primaryColorAxisTotal();
            if (fillQty > 0) qtyInput.value = this.formatQty(fillQty);
            // Keep tracking afterward either way — a genuine 1:1 match or,
            // just like a real Common Component, the running grand total
            // for a row with no specific color counterpart (see
            // onColorQtyChanged for how this stays live, and toggleColorGroup
            // for the same behavior on a bulk "select all").
            row.dataset.autoSynced = 'true';
          }
        }
        this._syncColorGroupMasterCheckbox(row?.dataset.group);
        if (!color) return;

        const processId = document.getElementById('productionProcessId')?.value;
        if (checkboxEl.checked) {
          this.addMatrixColorColumn(color);
          if (processId) await this.populateColorMatrixForColors(processId, [color], seq, row?.dataset.group);
        } else {
          this.removeMatrixColorColumn(color);
          this.refreshPoolColorGroupCells(color, 0, row?.dataset.group);
        }
        this.syncPoolColorGroupColumns();
        this.refreshCommonSuggestedQty();
        this.refreshPayableHint();

        // "Mudguard colors should match frame colors" — and generally, for
        // ANY primary axis the operator picks, any secondary/non-primary
        // axis's colors should follow it: checking/unchecking a primary row
        // auto-checks/unchecks every non-primary row that name-matches it
        // (see _matchingPrimaryColorQty), instead of requiring the operator
        // to separately hunt down and toggle each corresponding row by hand.
        // Runs BEFORE the availability refresh below so the whole cascade
        // (this row + every auto-synced match) costs exactly one refresh,
        // not one per row (see this function's refreshAvailability param).
        if (row?.dataset.primary === 'true') {
          await this._syncMatchingNonPrimaryRows(color, checkboxEl.checked);
          this._refreshAutoSyncedNonPrimaryRows();
        }

        // Same top-level-only gate as refreshPoolAvailability below: this
        // must see the FULLY settled cascade (every matched non-primary row
        // checked and its column populated), so a nested call from
        // _syncMatchingNonPrimaryRows would judge half-built columns.
        if (refreshAvailability) {
          this._pruneRedundantMatrixColumns();
          await this.refreshPoolAvailability();
        }
      },

      // Re-derives every already-checked, still-auto-tracked non-primary
      // row's quantity from the current primary-axis state — its matching
      // primaries' total where it has any, else the grand total across every
      // checked primary color (a Fitted Rim used regardless of frame color,
      // exactly like a Common Component). The single shared implementation of
      // the auto-fill rule in handleColorCheckToggle/toggleColorGroup, called
      // both when a primary row is checked/unchecked and when a primary
      // row's qty is typed into (see onColorQtyChanged), since either can
      // change the number a matched row is supposed to show.
      //
      // MATCHED rows have to be refreshed here too, not just the grand-total
      // fallback ones: with several primaries matching one non-primary row
      // (Copper-Black / Metallic Green-Black / Sky Blue-Black all feeding one
      // "Black" rim), unchecking just one of them changes that row's total
      // without touching its own qty input, and this used to skip any row
      // with a match — leaving a stale figure that still counted the batch
      // the operator had just removed.
      _refreshAutoSyncedNonPrimaryRows() {
        const total = this._primaryColorAxisTotal();
        $$('#productionColorChecklist .production-color-row[data-primary="false"]')
          .filter(r => r.dataset.autoSynced === 'true' && r.querySelector('.production-color-check')?.checked)
          .forEach(r => {
            const matched = this._matchingPrimaryColorQty(r.dataset.color);
            const fillQty = matched !== null ? matched : total;
            const qi = r.querySelector('.production-color-qty');
            if (!qi) return;
            const next = fillQty > 0 ? this.formatQty(fillQty) : '';
            if (qi.value === next) return;
            qi.value = next;
            // Push the new figure through to this row's matrix/pool cells —
            // a silent .value assignment left them showing consumption for
            // the old quantity.
            this.onColorQtyChanged(r, false);
          });
      },

      // Checks/unchecks every non-primary row whose color name-matches
      // `primaryColor` (e.g. "Red" mudguard <- "Red-White" frame) to mirror
      // a primary row's own new check state, reusing handleColorCheckToggle
      // for each so matrix columns/pool cells/etc. stay consistent with a
      // manual check. Auto-synced rows are flagged data-auto-synced so
      // onColorQtyChanged can keep their quantity following the matching
      // primary row later too — UNLESS the operator edits that quantity by
      // hand, which drops the flag and leaves it alone from then on (see
      // onColorQtyChanged). A non-primary row with no matching primary
      // color at all (e.g. a Fitted Rim always in Black) is never touched
      // by this — it stays exactly as the operator left it.
      //
      // The uncheck half is deliberately asymmetric: a matched non-primary
      // row is only unchecked once NO checked primary row matches it any
      // more (_matchingPrimaryColorRows, evaluated after this primary row's
      // own checkbox has already flipped). One non-primary color can match
      // several primaries at once — the "Black" rim shared by Copper-Black,
      // Metallic Green-Black and Sky Blue-Black — and blindly mirroring the
      // uncheck silently dropped that whole shared row (and its rim
      // consumption) the moment ANY one of the three frame colors was
      // unchecked, while the other two were still being produced.
      async _syncMatchingNonPrimaryRows(primaryColor, checked) {
        const target = String(primaryColor || '').trim();
        if (!target) return;
        const matches = $$('#productionColorChecklist .production-color-row[data-primary="false"]')
          .filter(row => this._colorNamesMatch(row.dataset.color, target))
          .filter(row => checked || this._matchingPrimaryColorRows(row.dataset.color).length === 0);

        for (const row of matches) {
          const chk = row.querySelector('.production-color-check');
          if (!chk || chk.checked === checked) continue;
          chk.checked = checked;
          if (checked) row.dataset.autoSynced = 'true'; else delete row.dataset.autoSynced;
          // false: the caller (handleColorCheckToggle/toggleColorGroup) does
          // exactly one refreshPoolAvailability after this whole cascade
          // finishes, not one per matched row — see handleColorCheckToggle's
          // refreshAvailability param.
          await this.handleColorCheckToggle(chk, false);
        }
      },

      // Fired when a checked color's own Qty input changes — refreshes the
      // Common table's totals (which sum every checked color), that one
      // color's recipe-derived matrix cells, and that color's cells in every
      // Per-Process Pool Components table. Manually entered/added rows
      // (no stored qtyPerUnit) are left untouched, same as the single-Qty path.
      // `isUserEdit` is false only when THIS function is re-invoking itself
      // to propagate a primary row's change onto a matched non-primary row
      // (see below) — real typing always fires it true via the oninput=
      // handler's default, and that's the only path allowed to drop a
      // row's data-auto-synced flag (see _syncMatchingNonPrimaryRows).
      //
      // Takes the row element itself (not its color name) — two independent
      // Color Axes can share an identical literal color name (see
      // bug_axis_color_name_collision_qty in project memory: a Rim axis and
      // a Frame axis each having their own "Purple"), and re-deriving "which
      // row fired this" via `.find(r => r.dataset.color === color)` always
      // resolved to the FIRST same-named row in DOM order — so editing the
      // qty of the SECOND colliding row cleared the FIRST row's
      // data-auto-synced flag and read the FIRST row's qty instead of the
      // one actually being typed into. Passing the row directly (same
      // pattern as handleColorCheckToggle(this)) makes it unambiguous.
      onColorQtyChanged(row, isUserEdit = true) {
        this.refreshCommonSuggestedQty();
        this.refreshPayableHint();
        if (!row) return;
        const color = row.dataset.color;

        if (isUserEdit && row.dataset.primary === 'false') {
          delete row.dataset.autoSynced;
        }

        const qty = toNumber(row.querySelector('.production-color-qty')?.value) || 0;
        // A checked color only counts toward _checkedColorTokensLower once it
        // has a real qty (see that function) — a Primary-axis row has no
        // auto-filled qty on check (only non-primary rows do, see
        // handleColorCheckToggle), so its Per-Process Pool Components column
        // doesn't exist yet at check time. Re-sync columns here too, not just
        // on checkbox toggle, or a color checked-then-quantified (the normal
        // order for a Primary row) never gets its column created and
        // refreshPoolColorGroupCells below has no cell to update.
        this.syncPoolColorGroupColumns();
        this.refreshPoolColorGroupCells(color, qty, row.dataset.group);

        // Skip the shared-column update entirely while a DIFFERENT axis also
        // has this exact color name checked right now — see
        // _isColorCheckedUnderMultipleAxes: with two axes' colliding rows
        // both live, this shared column can't correctly represent both at
        // once, and updating it here would silently overwrite whichever
        // axis didn't just fire this change with the wrong basis.
        const colIndex = this.getMatrixColumnIndex(color);
        if (colIndex !== -1 && !this._isColorCheckedUnderMultipleAxes(color)) {
          document.querySelectorAll('#productionColorMatrixBody tr').forEach(matrixRow => {
            const cell = matrixRow.children[colIndex];
            const input = cell?.querySelector('.matrix-qty');
            const qtyPerUnit = input?.dataset.qtyPerUnit;
            if (input && qtyPerUnit !== undefined && qtyPerUnit !== '') {
              input.value = this.formatQty(qty * toNumber(qtyPerUnit));
            }
          });
        }

        // Keep every still-auto-tracked non-primary row's quantity following
        // this primary row's new value — either its own matching color(s)
        // (e.g. typing Red-White's qty after it's already auto-checked the
        // matching Red mudguard) or, for a row with no specific match (e.g.
        // a Fitted Rim always in Black), the running grand total, same as a
        // real Common Component would. Same shared rule the check/uncheck
        // path applies, so the two can't drift apart.
        if (row.dataset.primary === 'true') {
          this._refreshAutoSyncedNonPrimaryRows();
        }
      },

      // { color, qty, isCustom, countsTowardTotal, axisKey } for every
      // checked color with a numeric quantity entered. axisKey (this row's
      // own data-group, e.g. a true Color-Axis's key) lets saveProduction
      // identify a genuine primary-axis row by axis IDENTITY instead of by
      // color name — two independent axes can coincidentally share a color
      // name (each axis's colors come from its own pool item's independent
      // history), which previously double-counted a non-primary row whose
      // name happened to match a primary-axis color. countsTowardTotal is
      // false for a
      // true Color-Axis non-primary row (data-primary="false", never in the
      // legacy "other" group — unconditional, exactly the pre-existing
      // primaryAxisColorsLower behavior in saveProduction) and for a legacy
      // "Other" row (see renderGroupedColorChecklist) that's CURRENTLY
      // segment-matching some other checked row — both describe the same
      // physical batch as their counterpart, so must not add to the lot
      // total a second time (see _currentLotTotalQty). An "Other" row with
      // no current match still counts as its own real quantity, since that
      // bucket isn't guaranteed to be pool-derived duplicates. Submitted
      // verbatim as this lot's colorBreakdown — saveProduction sums only
      // entries with countsTowardTotal !== false when no formal Primary
      // Color Axis is configured, so this client-side flag is the actual
      // source of truth for the saved quantity, not just a display hint.
      getCheckedColorQtys() {
        return $$('#productionColorChecklist .production-color-row')
          .filter(row => row.querySelector('.production-color-check')?.checked)
          .map(row => {
            const isNonPrimary = row.dataset.primary === 'false';
            const isUnmatchedOther = isNonPrimary && row.dataset.group === 'other'
              && this._matchingPrimaryColorQty(row.dataset.color) === null;
            return {
              color: row.dataset.color,
              qty: toNumber(row.querySelector('.production-color-qty')?.value) || 0,
              isCustom: row.dataset.custom === 'true',
              countsTowardTotal: !isNonPrimary || isUnmatchedOther,
              axisKey: row.dataset.group || ''
            };
          });
      },

      // The qty that currently counts as this lot's real output total —
      // every row whose own countsTowardTotal is true, per getCheckedColorQtys'
      // comment above. Used to scale Common Components' suggested qty
      // (qtyPerUnit x this) — see populateCommonComponentsFromProcess /
      // refreshCommonSuggestedQty — so a legacy "Other" row that's
      // currently riding along as a matched duplicate doesn't inflate
      // suggested Component quantities, matching the actual submitted total.
      _currentLotTotalQty() {
        return this.getCheckedColorQtys()
          .filter(c => c.countsTowardTotal)
          .reduce((sum, c) => sum + c.qty, 0);
      },

      // Returns, for every one of this process's POOL-sourced 'COMMON'-tagged
      // recipe components, the distinct non-blank colors that item currently
      // exists in within the Warehouse Pool — Map<itemNameLower, string[]>.
      // Nothing on these components' own recipe row is tagged per-color, but
      // their live pool state still determines how they should be entered:
      // - 0 colors: a true Common item — one flat row, unaffected.
      // - exactly 1 color: this item is never actually a per-output-color
      //   choice (e.g. "Fitted Rim" is always Black regardless of which
      //   frame color is being produced) — populateCommonComponentsFromProcess
      //   keeps it in the Common table but locks its colorGroup to that one
      //   color, so the right Warehouse Pool bucket gets debited.
      // - 2+ colors: genuinely needs a per-output-color split (e.g. "Painted
      //   Frame" painted to match each output color) — routed into the
      //   Per-Color matrix, but only for the colors it actually has stock in.
      async getPoolColorAwareItemNames(processId) {
        try {
          const [compRes, poolRes] = await Promise.all([
            this._fetchProcessComponents(processId),
            this._fetchWarehousePoolData()
          ]);
          if (!compRes.success) console.error('[getPoolColorAwareItemNames] getProcessComponentsData failed:', compRes.message);
          if (!poolRes.success) console.error('[getPoolColorAwareItemNames] getWarehousePoolData failed:', poolRes.message);
          const comps = compRes.success ? (compRes.data || []) : [];
          const poolRows = poolRes.success ? (poolRes.data || []) : [];

          const commonPoolItems = new Set(
            comps
              .filter(c => c.sourceType === 'POOL' && (!c.colorGroup || App.Utils.isCommonColorGroup(c.colorGroup)))
              .map(c => (c.itemName || '').trim().toLowerCase())
          );

          const colorSets = new Map();
          poolRows.forEach(r => {
            const key = (r.outputItemName || '').trim().toLowerCase();
            if (!r.color || !commonPoolItems.has(key)) return;
            if (!colorSets.has(key)) colorSets.set(key, new Set());
            colorSets.get(key).add(r.color);
          });

          const result = new Map();
          colorSets.forEach((set, key) => result.set(key, Array.from(set).sort()));
          return result;
        } catch (err) {
          console.error('[getPoolColorAwareItemNames] falling back to no pool-color-split items:', err);
          return new Map();
        }
      },

      // Populates the COMMON (applies-to-every-color) rows of the recipe
      // into the Common Components table, suggested at qtyPerUnit x total
      // quantity across every currently checked color. A POOL-sourced
      // component that's genuinely multi-color in the Warehouse Pool (see
      // getPoolColorAwareItemNames) is instead rendered into its own
      // Per-Process Pool Components table (see renderPoolColorSplitGroups) —
      // one that has just ONE pool color (e.g. "Fitted Rim" is always Black,
      // regardless of output color) stays here as a normal row with its
      // colorGroup locked to that one color, so the debit hits the right bucket.
      async populateCommonComponentsFromProcess(processId, seq) {
        this.clearComponentsTable();
        if (!processId) return;

        try {
          const [res, poolColorMap] = await Promise.all([
            this._fetchProcessComponents(processId),
            this.getPoolColorAwareItemNames(processId)
          ]);
          if (seq !== undefined && seq !== this._compLoadSeq) return;
          const all = res.success ? (res.data || []) : [];
          const commonComps = all.filter(c => !c.colorGroup || App.Utils.isCommonColorGroup(c.colorGroup));
          const totalQty = this._currentLotTotalQty();

          const poolColorsFor = c => poolColorMap.get((c.itemName || '').trim().toLowerCase()) || [];
          const isMultiColorPoolAware = c => c.sourceType === 'POOL' && poolColorsFor(c).length > 1;
          // A Common item that's really the same physical item as an
          // explicit per-color sibling elsewhere in this recipe (see
          // _getCommonItemsWithColorOverride) is routed into the Per-Color
          // matrix instead of this flat table — populateColorMatrixForColors
          // fills its per-color quantity in as each color gets checked.
          const colorOverrideComps = this._getCommonItemsWithColorOverride(all);
          const trueCommon = commonComps.filter(c => !isMultiColorPoolAware(c) && !colorOverrideComps.includes(c));
          const poolColorSplit = commonComps.filter(isMultiColorPoolAware);

          trueCommon.forEach(c => {
            const poolColors = poolColorsFor(c);
            const singleColor = c.sourceType === 'POOL' && poolColors.length === 1 ? poolColors[0] : '';
            this.addComponentRow({
              itemName: c.itemName,
              size: c.size,
              narration: c.narration,
              sourceType: c.sourceType,
              color: singleColor,
              colorScope: singleColor || undefined,
              qty: totalQty > 0 ? totalQty * c.qtyPerUnit : c.qtyPerUnit,
              qtyPerUnit: c.qtyPerUnit,
              unit: c.unit
            });
          });

          this.renderPoolColorSplitGroups(poolColorSplit, poolColorMap);

          await this.refreshPoolAvailability();
        } catch (err) {
          App.Utils.showToast(err.message || 'Failed to load process recipe', true);
        }
      },

      // Renders one small table per distinct "color signature" among
      // pool-color-aware components — items that come from the same
      // upstream process/output item and carry the exact same set of pool
      // colors share one table (e.g. Painted Frame's 11 colors); an item
      // with a different color set (e.g. a Mudguard with only 6) gets its
      // own table instead of forcing every item onto one shared, mostly-blank
      // column set. A table's FULL color set (every color that item has
      // ever had pool stock in) is remembered on _poolColorGroupDefs, but
      // only the colors actually CHECKED right now in the Colors to Produce
      // checklist are rendered as columns — showing every historical color
      // regardless of relevance to this lot just clutters the table with
      // permanently-blank columns. addPoolColorGroupColumn/
      // removePoolColorGroupColumn keep these columns live as the operator
      // checks/unchecks colors (see handleColorCheckToggle/toggleColorGroup),
      // mirroring how addMatrixColorColumn/removeMatrixColorColumn already
      // do this for the Per-Color Components table above.
      renderPoolColorSplitGroups(poolColorSplit, poolColorMap) {
        const wrapper = document.getElementById('productionPoolColorGroupsWrapper');
        const container = document.getElementById('productionPoolColorGroupsContainer');
        if (!container) return;

        container.querySelectorAll('tr').forEach(row => this.destroyComponentItemSelect2(row));
        container.innerHTML = '';
        this._poolColorGroupDefs = [];

        if (!poolColorSplit || poolColorSplit.length === 0) {
          if (wrapper) wrapper.style.display = 'none';
          return;
        }
        if (wrapper) wrapper.style.display = '';

        const groups = new Map();
        poolColorSplit.forEach(c => {
          const colors = poolColorMap.get((c.itemName || '').trim().toLowerCase()) || [];
          const signature = colors.slice().sort((a, b) => a.localeCompare(b)).join('|').toLowerCase();
          if (!groups.has(signature)) groups.set(signature, { colors, comps: [] });
          groups.get(signature).comps.push(c);
        });

        let groupIdx = 0;
        groups.forEach(({ colors, comps }) => {
          groupIdx++;
          const tableId = `productionPoolColorGroup_${groupIdx}`;
          const axisKey = this._axisKeyForPoolItemNames(comps.map(c => c.itemName));
          this._poolColorGroupDefs.push({ tableId, colors, rows: comps, mode: 'create', axisKey });
          const visibleColors = this._checkedPoolGroupColors(colors, axisKey);
          container.insertAdjacentHTML('beforeend', this._buildPoolColorGroupTable(tableId, colors, visibleColors, comps, 'create', axisKey));
          document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => this.initComponentItemSelect2(row));
        });
      },

      // Resolves which real Color Axis (see renderGroupedColorChecklist /
      // _customColorGroupOptions) a Per-Process Pool Components table's own
      // pool item(s) belong to — so its column-visibility/qty derivation
      // below can be scoped to ONLY that axis's own checked rows, never a
      // DIFFERENT axis's same-named color. Mirrors _poolDefForCustomColor's
      // matching direction (there: group -> pool def; here: pool item names
      // -> axis key). Returns '' when unresolvable (0/1 total groups, or the
      // checklist is in flat/manual mode with no real axes at all) — every
      // caller below treats '' as "no scoping, use the legacy unscoped
      // behavior", so this is always a safe, backward-compatible no-op
      // outside true 2+-axis processes.
      // No `source` filter here — a 'pool' axis's own label is still
      // itemNames.join(', '), and a Process Color Link can now merge that
      // pool axis with a 'tag' axis into a 'merged' one (see
      // computeColorAxesForProcess/_mergeLinkedAxes, module_process.js),
      // which carries the SAME comma-joined label forward so this still
      // resolves it; a plain 'tag' axis's own label is never a pool item
      // name, so including it here is harmless (never matches).
      _axisKeyForPoolItemNames(itemNames) {
        const namesLower = (itemNames || []).map(n => String(n || '').trim().toLowerCase()).filter(Boolean);
        if (namesLower.length === 0) return '';
        const opt = (this._customColorGroupOptions || []).find(o =>
          o.label.split(',').map(s => s.trim().toLowerCase()).some(l => namesLower.includes(l)));
        return opt ? opt.key : '';
      },

      // getCheckedColorQtys(), optionally restricted to rows belonging to
      // ONE specific axis/group (dataset.group) — the fix for the class of
      // bug where a Per-Process Pool Components table (or the qty it
      // suggests) was derived from EVERY checked color in the whole
      // checklist regardless of which sub-group/axis it came from, letting
      // a same-named color from an unrelated axis "leak" a column into a
      // table it doesn't belong to, or get summed into another axis's
      // suggested consumption (silent double-counting). `axisKey` falsy
      // (unresolved, or a process with no real axes) falls back to every
      // checked row, unchanged from the original behavior.
      _axisScopedCheckedColorQtys(axisKey) {
        const all = this.getCheckedColorQtys();
        return axisKey ? all.filter(cc => cc.axisKey === axisKey) : all;
      },

      // Every checked color in the main checklist, split into its own
      // tokens and lowercased. A plain axis-mode color (e.g. "Blue-White")
      // is its own single token; a legacy composite color (e.g.
      // "BCP / Blue-White" — see COLOR_COMBO_DELIMITER in config.js, this
      // process draws from 2+ independent pool inputs at once with no
      // Color Axes opt-in) contributes each of its parts as its own token,
      // same splitting refreshPoolColorGroupCells already does for cell sums.
      // `axisKey` scopes this to one axis's own rows only — see
      // _axisScopedCheckedColorQtys.
      _checkedColorTokensLower(axisKey) {
        const tokens = new Set();
        this._axisScopedCheckedColorQtys(axisKey).filter(cc => cc.qty > 0).forEach(cc => {
          (cc.color || '').split(' / ').forEach(t => {
            const trimmed = t.trim().toLowerCase();
            if (trimmed) tokens.add(trimmed);
          });
        });
        return tokens;
      },

      // Do this table's own columns match a checked color EXACTLY? A pool
      // item's colors are whatever its upstream process credited, and since
      // composite crediting those are themselves composites ("Blue-White /
      // BCP"), identical to the checked color. Token matching must not be
      // used then: it would light up a legacy plain "Blue-White" column
      // instead of the real "Blue-White / BCP" one, and the qty would be
      // saved against a color the lot never produced — the phantom negative
      // buckets seen on the plain names.
      //
      // Token matching is still right for the ORIGINAL shape, where a pool
      // item carries plain colors and the OUTPUT color is a composite built
      // by pairing two such axes ("Blue-White" from the frame table, "BCP"
      // from the rim table). So: exact wins when it matches anything at all,
      // tokens are the fallback.
      _poolGroupColumnsMatchExactly(colors, axisKey) {
        const exact = new Set(this._axisScopedCheckedColorQtys(axisKey)
          .filter(cc => cc.qty > 0)
          .map(cc => String(cc.color || '').trim().toLowerCase()));
        return colors.some(c => exact.has(String(c).trim().toLowerCase()));
      },

      // Subset of `colors` that are currently checked (with a qty > 0) —
      // by exact color where this table's columns are the checked colors
      // themselves, otherwise as one token of a checked composite (see
      // _poolGroupColumnsMatchExactly / _checkedColorTokensLower). `axisKey`
      // (this table's own resolved axis, see _axisKeyForPoolItemNames)
      // keeps a DIFFERENT axis's same-named checked color from making this
      // table think one of its own colors is checked when it isn't.
      _checkedPoolGroupColors(colors, axisKey) {
        if (this._poolGroupColumnsMatchExactly(colors, axisKey)) {
          const exact = new Set(this._axisScopedCheckedColorQtys(axisKey)
            .filter(cc => cc.qty > 0)
            .map(cc => String(cc.color || '').trim().toLowerCase()));
          return colors.filter(c => exact.has(String(c).trim().toLowerCase()));
        }
        const tokensLower = this._checkedColorTokensLower(axisKey);
        return colors.filter(c => tokensLower.has(c.toLowerCase()));
      },

      // The qty to display in one Per-Process Pool Components cell.
      // 'create' mode (renderPoolColorSplitGroups): a suggested estimate =
      // qtyPerUnit x the SUM of every currently checked color whose own
      // tokens include this column (see _checkedColorTokensLower — a plain
      // axis color matches at most one checked row, but a composite color
      // column can be shared by several checked composites at once, e.g.
      // both "BCP / Blue-White" and "Black / Blue-White" feed the
      // "Blue-White" column). 'edit' mode (renderPoolColorGroupsFromAccum):
      // the exact saved qty from this lot's own recorded Components Consumed.
      // `axisKey` restricts the 'create'-mode sum to THIS table's own axis
      // — without it, a different axis's coincidentally same-named checked
      // color (e.g. a Rim axis's own "Purple" bleeding into a Frame axis's
      // "Purple" column) got summed in too, inflating the suggested qty
      // that's then submitted as this item's actual Warehouse Pool debit.
      _poolGroupCellValue(mode, row, color, axisKey) {
        if (mode === 'edit') {
          return row.colorsQty ? row.colorsQty[color.toLowerCase()] : undefined;
        }
        const colorLower = color.trim().toLowerCase();
        const checked = this._axisScopedCheckedColorQtys(axisKey);
        // Exact first — a composite column must draw only from the one
        // checked color it names, never from every checked color that
        // happens to share a token with it (see _poolGroupColumnsMatchExactly).
        const exactTotal = checked.reduce(
          (sum, cc) => (String(cc.color || '').trim().toLowerCase() === colorLower ? sum + cc.qty : sum), 0);
        const total = exactTotal > 0 ? exactTotal : checked.reduce((sum, cc) => {
          const tokens = (cc.color || '').split(' / ').map(t => t.trim().toLowerCase());
          return tokens.includes(colorLower) ? sum + cc.qty : sum;
        }, 0);
        return total > 0 ? total * row.qtyPerUnit : undefined;
      },

      // The qty-per-unit basis to stamp on one Per-Process Pool Components
      // CELL (both the initial render in _buildPoolColorGroupTable and a
      // later-inserted column in syncPoolColorGroupColumns) so
      // refreshPoolColorGroupCells can keep recomputing that one cell as the
      // checklist's Qty changes. Edit mode rows (see
      // populateComponentsConsumedDirect) carry a PER-COLOR ratio in
      // colorsQtyPerUnit — this item may have been consumed at a genuinely
      // different rate for one color than another (rounding, wastage,
      // partial batches), and using this color's own derived ratio (rather
      // than whichever color's ratio happened to populate the row's shared
      // `qtyPerUnit` first) keeps a later edit to THIS color's qty scaling
      // correctly instead of borrowing a different color's rate. Falls back
      // to the row's own shared `qtyPerUnit` (a create-mode row's recipe
      // ratio, or an edit-mode row's recipe-seeded default for a color this
      // lot never previously recorded any qty for at all — see the "seed a
      // table for EVERY pool-color-aware recipe item" block) when no
      // color-specific ratio exists yet.
      _poolCellQtyPerUnit(row, color) {
        if (!row) return undefined;
        const perColor = row.colorsQtyPerUnit ? row.colorsQtyPerUnit[String(color || '').toLowerCase()] : undefined;
        return perColor !== undefined ? perColor : row.qtyPerUnit;
      },

      // Builds one <table> for a pool-color group: `colors` is that group's
      // FULL real color set (stamped on the table for later column
      // add/remove lookups — see addPoolColorGroupColumn), `visibleColors`
      // (a subset, in the same order) is what actually renders as columns
      // right now. One row per item sharing this color set; each row
      // carries its own index into `rows` (data-row-idx) so a later
      // addPoolColorGroupColumn call can look up its value without
      // re-deriving it from the DOM.
      _buildPoolColorGroupTable(tableId, colors, visibleColors, rows, mode, axisKey) {
        const headHtml = visibleColors.map(col => `<th class="text-end" data-color="${escapeHtml(col)}">${escapeHtml(col)}</th>`).join('');
        const rowsHtml = rows.map((r, rowIdx) => {
          const rowId = 'prod_pool_group_row_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
          const preSelectedOption = this._buildItemPreselectOption(r.itemName, r.size || '', r.sourceType);
          const cellsHtml = visibleColors.map(col => {
            const qty = this._poolGroupCellValue(mode, r, col, axisKey);
            const display = (qty !== undefined && qty !== null) ? this.formatQty(qty) : '';
            const cellQtyPerUnit = this._poolCellQtyPerUnit(r, col);
            const qtyPerUnitAttr = (cellQtyPerUnit !== undefined) ? ` data-qty-per-unit="${cellQtyPerUnit}"` : '';
            return `<td><input type="number" class="form-control text-end matrix-qty pool-group-qty" data-color="${escapeHtml(col)}"${qtyPerUnitAttr} step="any" value="${display}"></td>`;
          }).join('');
          return `
        <tr id="${rowId}" data-row-idx="${rowIdx}">
          <td>
            <select class="form-select prod-comp-item-select" required>
              <option value=""></option>
              ${preSelectedOption}
            </select>
          </td>
          <td><input type="text" class="form-control prod-comp-size" value="${escapeHtml(r.size || '')}" placeholder="-" readonly></td>
          <td><input type="text" class="form-control prod-comp-narration" value="${escapeHtml(r.narration || '')}" placeholder="-" readonly title="From the Process recipe — Warehouse Pool output items have no Item Master entry of their own"></td>
          <td>
            <select class="form-select prod-comp-source" disabled>
              <option value="POOL" selected>Pool (Warehouse)</option>
            </select>
          </td>
          ${cellsHtml}
          <td class="text-center"><button type="button" class="btn btn-outline-danger btn-sm" onclick="App.Production.removePoolColorGroupRow('${rowId}')">✕</button></td>
        </tr>`;
        }).join('');

        // table-layout: fixed with a %-width Item/Size/Source/✕ plus a
        // fixed-px width per color <th> (see .prod-color-table CSS) only
        // grows the table past 100% (letting .table-responsive scroll)
        // when the TABLE's own min-width demands it — a %-width column has
        // no floor of its own and gets crushed toward 0 instead, once
        // enough color columns are added, rather than the table growing.
        // So the table's min-width is computed here from the real column
        // count and set inline, matching PROD_COLOR_TABLE_COLOR_COL_PX in
        // .prod-color-table th[data-color].
        const minWidthPx = this.PROD_COLOR_TABLE_FIXED_RESERVE_PX + visibleColors.length * this.PROD_COLOR_TABLE_COLOR_COL_PX;
        const hidden = visibleColors.length === 0;

        return `
      <div class="mb-3" id="${tableId}_wrapper"${hidden ? ' style="display:none;"' : ''}>
        <div class="table-responsive">
          <table class="table table-bordered bg-white shadow-sm mb-0 prod-color-table" id="${tableId}" data-all-colors="${escapeHtml(colors.join('|'))}" data-axis-key="${escapeHtml(axisKey || '')}" style="min-width: ${minWidthPx}px;">
            <thead class="table-light">
              <tr>
                <th style="width: 18%;">Item / Pool Name</th>
                <th style="width: 7%;">Size</th>
                <th style="width: 13%;">Narration</th>
                <th style="width: 11%;">Source</th>
                ${headHtml}
                <th style="width: 3%;" class="text-center">✕</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      </div>`;
      },

      // Re-derives which columns SHOULD be visible in every Per-Process
      // Pool Components table from the CURRENT checked-color state (see
      // _checkedColorTokensLower), and adds/removes columns to match —
      // called after every checkbox toggle (see handleColorCheckToggle/
      // toggleColorGroup), mirroring how addMatrixColorColumn/
      // removeMatrixColorColumn keep the Per-Color Components table above
      // in sync. A full resync (rather than a single add/remove per toggled
      // color) is needed because a composite checked color contributes a
      // column to EACH of its own axis tables at once (e.g.
      // "BCP / Blue-White" needs both the Rim table's "BCP" column and the
      // Painted Frame table's "Blue-White" column), and a column must stay
      // as long as ANY currently-checked color still references it — two
      // composites can share one token (e.g. "BCP / Blue-White" and
      // "Black / Blue-White" both need "Blue-White"), so a single
      // one-color-in-one-color-out toggle can't safely decide removal on
      // its own. Existing columns/values are left untouched; only the
      // add/remove diff against the current DOM is applied.
      syncPoolColorGroupColumns() {
        (this._poolColorGroupDefs || []).forEach(def => {
          const table = document.getElementById(def.tableId);
          if (!table) return;
          const headerRow = table.querySelector('thead tr');
          if (!headerRow) return;

          // Must use the SAME exact-wins-then-tokens rule the first render
          // used (_checkedPoolGroupColors), not raw token matching. Token
          // matching alone is wrong whenever this pool item's own colors are
          // already composites ("Blue-White / BCP") — the checked color IS
          // the column name, but splitting it yields {"blue-white", "bcp"},
          // neither of which equals the full column string, so every real
          // composite column was dropped here and only a legacy plain
          // column that happened to equal one token (e.g. "Pink-White")
          // survived. Since this resync runs after every checkbox toggle, it
          // overwrote the correct initial render: a 4-composite lot rendered
          // one unrelated single column.
          //
          // Scoping to THIS def's own axis (see _axisKeyForPoolItemNames)
          // still applies — without it a DIFFERENT axis's coincidentally
          // same-named checked color (e.g. a Rim axis's own "Purple" while
          // this table is Frame's) slides an unrelated column in here.
          const wantLower = new Set(
            this._checkedPoolGroupColors(def.colors, def.axisKey).map(c => c.toLowerCase()));

          Array.from(headerRow.querySelectorAll('th[data-color]')).forEach(th => {
            if (wantLower.has(th.dataset.color.toLowerCase())) return;
            const idx = Array.from(headerRow.children).indexOf(th);
            th.remove();
            table.querySelectorAll('tbody tr').forEach(tr => {
              const td = tr.children[idx];
              if (td) td.remove();
            });
          });

          def.colors.forEach(matchColor => {
            const colorLower = matchColor.toLowerCase();
            if (!wantLower.has(colorLower)) return;
            if (Array.from(headerRow.querySelectorAll('th[data-color]')).some(th => th.dataset.color.toLowerCase() === colorLower)) return;

            const fullIdx = def.colors.indexOf(matchColor);
            const colorThs = Array.from(headerRow.querySelectorAll('th[data-color]'));
            let insertBeforeEl = colorThs.find(th => def.colors.indexOf(th.dataset.color) > fullIdx) || null;
            if (!insertBeforeEl) insertBeforeEl = headerRow.lastElementChild; // the "✕" header

            // Index must be read BEFORE inserting into headerRow — insertBeforeEl's
            // own position shifts by +1 the moment the new <th> lands before it,
            // but each <tr> hasn't received its matching <td> yet, so indexing
            // tr.children with the POST-insertion header index runs one slot past
            // the end of every row and silently appends after the "✕" button
            // instead of before it (every column then reads one slot right of its
            // own header, with the ✕ button landing in the first color's cell).
            const insertIdx = Array.from(headerRow.children).indexOf(insertBeforeEl);

            const th = document.createElement('th');
            th.className = 'text-end';
            th.dataset.color = matchColor;
            th.textContent = matchColor;
            headerRow.insertBefore(th, insertBeforeEl);

            table.querySelectorAll('tbody tr').forEach(tr => {
              const rowObj = def.rows[Number(tr.dataset.rowIdx)];
              const qty = rowObj ? this._poolGroupCellValue(def.mode, rowObj, matchColor, def.axisKey) : undefined;
              const display = (qty !== undefined && qty !== null) ? this.formatQty(qty) : '';
              // Stamped for BOTH modes (see _poolCellQtyPerUnit) — an edit-
              // mode row's own per-color ratio (or its recipe-seeded
              // fallback) lets refreshPoolColorGroupCells keep recomputing
              // this newly-added column as the checklist's Qty changes,
              // same as every column already visible when the table first
              // rendered. Previously gated to 'create' only, which left a
              // color newly checked mid-edit permanently stuck blank no
              // matter what qty the operator typed into the checklist.
              const cellQtyPerUnit = rowObj ? this._poolCellQtyPerUnit(rowObj, matchColor) : undefined;
              const qtyPerUnitAttr = (cellQtyPerUnit !== undefined) ? ` data-qty-per-unit="${cellQtyPerUnit}"` : '';
              const td = document.createElement('td');
              td.innerHTML = `<input type="number" class="form-control text-end matrix-qty pool-group-qty" data-color="${escapeHtml(matchColor)}"${qtyPerUnitAttr} step="any" value="${display}">`;
              tr.insertBefore(td, tr.children[insertIdx] || null);
            });
          });

          this._syncPoolGroupTableMinWidth(table);
        });
      },

      // Keeps a Per-Process Pool Components table's inline min-width
      // matching its actual visible color column count (see
      // _buildPoolColorGroupTable's comment on why table-layout: fixed
      // needs this set explicitly), and hides its wrapper entirely once no
      // color columns remain visible — same idea as _syncMatrixTableMinWidth.
      _syncPoolGroupTableMinWidth(table) {
        const colorCount = table.querySelectorAll('thead th[data-color]').length;
        table.style.minWidth = (this.PROD_COLOR_TABLE_FIXED_RESERVE_PX + colorCount * this.PROD_COLOR_TABLE_COLOR_COL_PX) + 'px';
        const wrapper = document.getElementById(table.id + '_wrapper');
        if (wrapper) wrapper.style.display = colorCount === 0 ? 'none' : '';
      },

      // Removes one row from a Per-Process Pool Components table — if that
      // was the table's last row, the whole (now-empty) table is removed too.
      removePoolColorGroupRow(rowId) {
        const row = document.getElementById(rowId);
        if (!row) return;
        const table = row.closest('table');
        this.destroyComponentItemSelect2(row);
        row.remove();
        if (table && !table.querySelector('tbody tr')) {
          table.closest('.mb-3')?.remove();
        }
      },

      // Recomputes the Common table's recipe-derived rows' suggested qty
      // (qtyPerUnit x total quantity across every checked color) whenever the
      // checked-color set or any color's qty changes. Manually added rows
      // (no stored qtyPerUnit) are never touched, so they survive every
      // checklist interaction instead of being wiped on the next recompute.
      refreshCommonSuggestedQty() {
        // A Common Component applies once per REAL unit produced — see
        // _currentLotTotalQty/getCheckedColorQtys for what counts: in axis
        // mode that's the primary axis's total (summing every axis's
        // checked rows would reintroduce the same double-count the
        // primary-axis quantity fix addresses server-side, see
        // saveProduction); in legacy grouping it's every checked row except
        // an "Other" row currently riding along as a matched duplicate; on a
        // fully flat checklist (no grouping at all) it's just everything.
        this._applyQtyPerUnit('#productionComponentsBody tr', this._currentLotTotalQty());
        this._updateColorCombinationPreview();
      },

      // Live preview of this lot's own combined output identity, mirroring
      // EXACTLY the same unambiguous-pairing rule recalculateWarehousePool's
      // Pass 1 (module_warehouse.js) uses server-side to decide the actual
      // saved/credited Warehouse Pool bucket color — shown here so the
      // operator sees "Blue-White / Black / BCP" while still filling in the
      // form, not just after saving. A redundant axis (its checked value
      // name-matches the primary, e.g. Mudguard "Red" against Frame
      // "Red-White") is excluded from the combination the same way the
      // backend excludes it. Any number of independent axes combine as
      // long as each contributes exactly one checked color; if some axis
      // has 2+ (no way to tell which pairs with which), this shows each
      // axis's own colors instead of guessing at one combined string —
      // exactly the cases the backend itself falls back on.
      _updateColorCombinationPreview() {
        const el = document.getElementById('productionColorCombinationPreview');
        if (!el) return;

        const checked = this.getCheckedColorQtys().filter(c => c.qty > 0 && c.color);
        const primaryEntries = checked.filter(c => c.countsTowardTotal !== false);
        const otherEntries = checked.filter(c => c.countsTowardTotal === false);

        if (primaryEntries.length === 0) {
          el.style.display = 'none';
          el.innerText = '';
          return;
        }

        const primaryColors = primaryEntries.map(e => e.color);
        // An entry that exactly equals one segment of a COMPOSITE primary is
        // an inherited-segment collision, not a mirror — it belongs to a
        // different axis that merely shares the name. Everything else that
        // name-matches a primary color is the same batch described twice.
        // Mirrors module_warehouse.js's Pass 1 exactly.
        const inheritedSegments = new Set();
        primaryColors.forEach(pc => {
          const segs = String(pc || '').split(' / ').map(s => s.trim()).filter(Boolean);
          if (segs.length < 2) return;
          segs.forEach(s => inheritedSegments.add(s.toLowerCase()));
        });
        const independent = otherEntries.filter(e => {
          if (inheritedSegments.has(String(e.color || '').trim().toLowerCase())) return true;
          return !primaryColors.some(pc => this._colorNamesMatch(pc, e.color));
        });

        const axisCounts = new Map();
        independent.forEach(e => {
          const key = String(e.axisKey || '').trim().toLowerCase() || '__no_axis_key__';
          axisCounts.set(key, (axisCounts.get(key) || 0) + 1);
        });
        const ambiguous = Array.from(axisCounts.values()).some(c => c > 1);

        el.style.display = '';
        if (ambiguous) {
          el.innerText = `Now producing: ${primaryColors.join(', ')} — plus ${independent.length} other color(s) tracked separately (can't combine unambiguously)`;
        } else {
          // One combined identity per primary color, each listing its axes
          // in the order this process's recipe declares them — the checklist
          // renders axes in that same order, so reading the checked rows top
          // to bottom reproduces exactly what the backend will credit.
          const axisPos = new Map();
          $$('#productionColorChecklist .production-color-row').forEach((row, i) => {
            const k = String(row.dataset.group || '').trim().toLowerCase();
            if (k && !axisPos.has(k)) axisPos.set(k, i);
          });
          const posOf = (e) => {
