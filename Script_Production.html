<script>
  'use strict';
  // Script_Production.html -- App.Production

    // ==========================================
    // PRODUCTION LOT NAMESPACE
    // ==========================================
    App.State.globalProduction = [];
    App.State.filteredProduction = [];
    App.State.selectedProduction = [];
    App.State.productionColumnFilters = { process: [], outputItem: [], productTag: [], assignedBy: [], assignedTo: [], status: [] };

    App.Production = {
      STATUS_OPTIONS: ['Pending', 'In Progress', 'Completed', 'Cancelled'],

      // The Production Sheet print palette, shared by BOTH renderers: the live
      // single-sheet one (renderProductionSheetTables' fit loop) and the
      // self-contained bulk-print page builder
      // (buildProductionSheetPrintPageHtml, which also feeds the html2canvas
      // "Download PDF" path). Each used to declare its own copy of these
      // literals and they drifted — the bulk page was left on the original
      // header tint and on ZEBRA '#f6f8f6', the value that turned out to be
      // invisible once printed and was replaced on the live sheet only. One
      // definition means a readability change lands on both paths or neither.
      //
      // The Item Name cannot use bold (see bodyCell), so hierarchy is carried
      // by size + ink instead: near-black names against deliberately muted grey
      // Size/Narration, so the eye lands on the item first and the supporting
      // columns recede. ZEBRA is a real, visible band; RULE is a light hairline
      // so the banding, not a heavy grid, does the row tracking; GRID_STRONG
      // outlines the table so columns stay anchored.
      PRINT_PALETTE: Object.freeze({
        HEAD_BG: '#cfe8d5',
        HEAD_INK: '#0b5132',
        ZEBRA: '#eef4ef',
        RULE: '#c8d3ca',
        GRID_STRONG: '#8fae99',
        INK_PRIMARY: '#111',
        INK_MUTED: '#5b6b60'
      }),

      // Shared with the .prod-color-table CSS (Styles.html) and with every
      // place below that sets/adjusts a prod-color-table's inline
      // min-width — see _buildPoolColorGroupTable's comment for why the
      // table needs an explicit min-width at all.
      PROD_COLOR_TABLE_FIXED_RESERVE_PX: 478, // Item/Pool Name + Size + Narration + Source + ✕ columns
      PROD_COLOR_TABLE_COLOR_COL_PX: 88, // matches .prod-color-table th[data-color]

      // Bumped at the start of every handleProcessChange/openEditModal/
      // enableManualColors/revertToSingleQty call. Each of those awaits 1+
      // Apps Script round-trips before painting into the shared
      // #productionColorChecklist / #productionComponentsBody /
      // #productionColorMatrixBody / #productionPoolColorGroupsContainer DOM —
      // re-selecting Size/Model/Process Type/Process again (or opening a
      // different lot for edit) before the previous chain's awaits resolve
      // must not let that now-stale response paint over the newer
      // selection's data. Every continuation that paints is guarded by
      // re-checking this counter right after its await (mirrors
      // App.Process._modalLoadSeq).
      _compLoadSeq: 0,

      // Per-load cache for getProcessComponentsData/getWarehousePoolData,
      // reset every time _compLoadSeq is bumped (see _resetProcDataCache).
      // Without it, one Edit Lot open fired the same getProcessComponentsData
      // call for the same processId 3-4x and getWarehousePoolData 2x — each
      // a full-sheet read plus its own google.script.run round-trip — because
      // populateColorChecklist, getPoolColorAwareItemNames (called from two
      // different places) and populateComponentsConsumedDirect each fetched
      // independently. Caching them for the duration of one load (they only
      // ever change between loads, not within one) collapses that down to a
      // single fetch per sheet.
      _procDataCache: null,

      _resetProcDataCache() {
        this._procDataCache = { components: new Map(), pool: null };
      },

      _fetchProcessComponents(processId) {
        if (!this._procDataCache) this._resetProcDataCache();
        const key = processId || '';
        if (!this._procDataCache.components.has(key)) {
          this._procDataCache.components.set(key, Api.call('getProcessComponentsData', processId));
        }
        return this._procDataCache.components.get(key);
      },

      _fetchWarehousePoolData() {
        if (!this._procDataCache) this._resetProcDataCache();
        if (!this._procDataCache.pool) {
          this._procDataCache.pool = Api.call('getWarehousePoolData');
        }
        return this._procDataCache.pool;
      },

      // Set while openEditModal is prefilling the (locked) Size/Model/Process
      // Type selects from a saved lot's own values. Those selects' Select2
      // widgets need a plain DOM 'change' event to refresh their displayed
      // text after a raw `.value =` assignment (see openEditModal) — but that
      // native event also runs the same element's onchange="" cascade
      // handler (handleSizeChange/handleModelChange/handleProcessTypeChange),
      // since jQuery's `.trigger('change.select2')` namespacing only filters
      // jQuery-bound listeners, not the native onchange attribute. Left
      // unguarded, that cascade resets the Process select back to blank and
      // burns several `_compLoadSeq` increments while openEditModal's own
      // awaits are still in flight, so its final `seq !== this._compLoadSeq`
      // check fails and the function returns before ever showing the modal —
      // the Edit Lot button silently does nothing. These handlers no-op
      // while this flag is set so the prefill can't trigger its own cascade.
      _suppressCascade: false,

      // Maps a status value to the inline background/text color of its row select,
      // mirroring the badge colors the status used to render as.
      statusStyleFor(status) {
        switch (status) {
          case 'Pending': return 'background-color:#ffc107;color:#000;';
          case 'In Progress': return 'background-color:#0dcaf0;color:#fff;';
          case 'Completed': return 'background-color:#198754;color:#fff;';
          case 'Cancelled': return 'background-color:#dc3545;color:#fff;';
          default: return 'background-color:#6c757d;color:#fff;';
        }
      },

      // Changes a lot's status directly from its table row, without opening the Edit Lot modal.
      async updateStatus(selectEl) {
        const idx = Number(selectEl.dataset.rowIdx);
        const p = App.State.globalProduction[idx];
        if (!p) return;

        const newStatus = selectEl.value;
        const previousStatus = p.status;
        if (newStatus === previousStatus) return;

        selectEl.disabled = true;
        try {
          const res = await Api.call('updateProductionStatus', p.rowIdx, p.qty, newStatus);
          App.Utils.showToast(res.message, !res.success);
          if (res.success) {
            p.status = newStatus;
            selectEl.setAttribute('style', this.statusStyleFor(newStatus));
          } else {
            selectEl.value = previousStatus;
          }
        } catch (err) {
          selectEl.value = previousStatus;
          App.Utils.showToast(err.message || 'Failed to update status', true);
        } finally {
          selectEl.disabled = false;
        }
      },

      async loadData() {
        const tbody = document.getElementById('productionTableBody');
        if (tbody) tbody.innerHTML = '<tr><td colspan="10" class="text-center p-4">Loading Production Logs...</td></tr>';

        try {
          // Items Master is needed for more than the item pickers: component
          // narration and Base Unit are resolved live against globalItems at
          // render time (_resolveDisplayNarration / _resolveDisplayUnit), so
          // without it every component falls back to its stored narration and
          // a blanket 'Pcs' unit.
          const [, , , response] = await Promise.all([
            App.Process.ensureLoaded(),
            App.Color.ensureLoaded(),
            App.Item.ensureLoaded(),
            Api.call('getProductionData')
          ]);
          if (!response.success) {
            App.Utils.showToast(response.message, true);
            return;
          }
          App.State.globalProduction = response.data;
          App.State.productionCurrentPage = 1;
          App.State.productionSortBy = App.State.productionSortBy || 'dateDesc';
          App.State.selectedProduction = [];
          this.updateColumnFilterIcons();
          this.filterData(App.State.productionSearchTerm || '');
          this.renderAllActivity();
        } catch (err) {
          App.Utils.showToast(err.message || 'Failed to load production logs', true);
        }
      },

      switchSubTab(id) {
        $$('.production-sub-tab').forEach(t => t.style.display = 'none');
        const target = document.getElementById(id);
        if (target) target.style.display = 'block';

        $$('#productionSubTabs .nav-link').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + id)?.classList.add('active');

        if (id === 'issuedStockSubTab' && typeof App.Issue !== 'undefined' && !App.State.globalIssues.length) {
          App.Issue.loadData();
        }
        if (id === 'productionAllSubTab') {
          const needsIssues = typeof App.Issue !== 'undefined' && !App.State.globalIssues.length;
          Promise.resolve(needsIssues ? App.Issue.loadData() : null).then(() => this.renderAllActivity());
        }
      },

      // Normalizes Production Log lots + Issued Stock entries into one
      // shape so the "All Activity" sub-tab can list both chronologically,
      // each tagged with its own sub-group badge.
      buildAllActivityRows() {
        const prodRows = (App.State.globalProduction || []).map(p => ({
          dateRaw: p.dateRaw,
          date: p.date,
          typeBadge: '<span class="badge bg-success">Production</span>',
          id: p.lotNumber || '—',
          details: p.outputItemName || '',
          qty: p.qty,
          extra: p.status || '',
          searchText: `${p.lotNumber || ''} ${p.outputItemName || ''} ${p.assignedBy || ''} ${p.assignedTo || ''} ${p.status || ''}`
        }));

        const issueRows = (App.State.globalIssues || []).map(iss => ({
          dateRaw: iss.dateRaw,
          date: iss.date,
          typeBadge: '<span class="badge bg-dark">Stock Issue</span>',
          id: iss.issueId,
          details: (iss.items || []).map(it => `${it.name}${it.size ? ` (${it.size})` : ''} ×${it.qty}`).join(', '),
          qty: iss.totalQty,
          extra: iss.issuedTo || '',
          searchText: `${iss.issueId || ''} ${iss.issuedTo || ''} ${iss.reference || ''} ${(iss.items || []).map(it => it.name).join(' ')}`
        }));

        return [...prodRows, ...issueRows].sort(
          (a, b) => parseRecordDate(b.dateRaw, b.date) - parseRecordDate(a.dateRaw, a.date)
        );
      },

      filterAllActivity(term) {
        App.State.productionAllSearchTerm = String(term || '');
        this.renderAllActivity();
      },

      renderAllActivity() {
        const tbody = document.getElementById('productionAllTableBody');
        if (!tbody) return;

        const term = (App.State.productionAllSearchTerm || '').toLowerCase().trim();
        let rows = this.buildAllActivityRows();
        if (term) rows = rows.filter(r => App.Utils.matchesKeywords(r.searchText, term));

        const emptyState = document.getElementById('productionAllEmptyState');
        if (!rows.length) {
          tbody.innerHTML = '';
          if (emptyState) emptyState.style.display = 'block';
          return;
        }
        if (emptyState) emptyState.style.display = 'none';

        tbody.innerHTML = rows.map(r => `
          <tr>
            <td>${escapeHtml(r.date || '')}</td>
            <td>${r.typeBadge}</td>
            <td><strong>${escapeHtml(String(r.id || ''))}</strong></td>
            <td>${escapeHtml(r.details || '')}</td>
            <td class="text-center fw-bold">${escapeHtml(String(r.qty ?? ''))}</td>
            <td>${escapeHtml(r.extra || '')}</td>
          </tr>`).join('');
      },

      // Opens the generic Issue Stock modal from inside the Production
      // form, pre-filling Reference with the current lot's number (falling
      // back to its Output Item Name for a still-unsaved lot). Purely
      // informational — never touches this lot's own Components Consumed.
      openIssueStockForLot() {
        const lotNumber = document.getElementById('productionLotNumber')?.value?.trim();
        const outputItem = document.getElementById('productionOutputItemName')?.value?.trim();
        App.Issue.openIssueModal(lotNumber || outputItem || '');
      },

      filterData(searchTerm) {
        App.State.productionSearchTerm = searchTerm || '';
        const term = String(searchTerm || '').toLowerCase().trim();
        const base = term
          ? App.State.globalProduction.filter(p => {
            const haystack = [p.date, p.lotNumber, p.outputItemName, p.color, p.productId, p.productName, p.status, p.assignedBy, p.assignedTo, p.remarks].join(' ');
            return App.Utils.matchesKeywords(haystack, term);
          })
          : App.State.globalProduction;
        App.State.filteredProduction = this.applyColumnFilters(base);
        this.sortFiltered();
        App.State.productionCurrentPage = 1;
        this.renderTable();
      },

      // Computes the value list for a column's filter dropdown. Status uses
      // the fixed STATUS_OPTIONS list (so a status can appear even if no
      // currently loaded lot has it yet); Process/Output Item/Product
      // Tag/Assigned By/To are derived from whatever's actually loaded.
      // Process is looked up through globalProcesses the same way rowHtml
      // resolves its label, so the filter option and the row's own display
      // text can never drift apart.
      getColumnFilterOptions(key) {
        if (key === 'status') return this.STATUS_OPTIONS.map(s => ({ value: s, label: s }));

        const values = new Set();
        (App.State.globalProduction || []).forEach(p => {
          if (key === 'process') {
            const process = (App.State.globalProcesses || []).find(pr => pr.processId === p.processId);
            values.add(process ? process.processName : (p.processId || 'Uncategorized'));
          } else if (key === 'outputItem') {
            if (p.outputItemName) values.add(p.outputItemName);
          } else if (key === 'productTag') {
            if (p.productId) values.add(p.productId);
          } else if (key === 'assignedBy') {
            if (p.assignedBy) values.add(p.assignedBy);
          } else if (key === 'assignedTo') {
            if (p.assignedTo) values.add(p.assignedTo);
          }
        });

        return [...values]
          .sort((a, b) => a.localeCompare(b))
          .map(v => ({ value: v, label: v }));
      },

      // Updates the funnel icon's active state in each header cell to
      // reflect whether that column currently has a filter applied. Scoped
      // to the Production Log sub-tab so it never touches another module's
      // same-named .th-filter-btn buttons (see Item Master's own version,
      // which is unscoped since it's the only user of that class today).
      updateColumnFilterIcons() {
        document.querySelectorAll('#productionLogSubTab .th-filter-btn').forEach(btn => {
          const key = btn.dataset.filterKey;
          const active = (App.State.productionColumnFilters[key] || []).length > 0;
          btn.classList.toggle('active', active);
        });
      },

      // Opens (or closes, if already open for this column) the Excel-style
      // checklist dropdown anchored under the clicked header's funnel icon.
      toggleColumnFilter(evt, key) {
        evt.stopPropagation();
        let panel = document.getElementById('productionColFilterPanel');

        if (panel && panel.dataset.key === key) {
          panel.remove();
          return;
        }
        if (panel) panel.remove();

        const btn = evt.currentTarget;
        panel = document.createElement('div');
        panel.id = 'productionColFilterPanel';
        panel.className = 'col-filter-panel';
        panel.dataset.key = key;
        panel.innerHTML = `
          <div class="po-ms-search-wrap">
            <input type="text" class="form-control form-control-sm" placeholder="Search...">
          </div>
          <div class="col-filter-actions">
            <button type="button" data-action="select-all">Select All</button>
            <button type="button" data-action="clear">Clear</button>
          </div>
          <ul class="po-ms-options"></ul>`;
        document.body.appendChild(panel);

        const rect = btn.getBoundingClientRect();
        panel.style.top = `${rect.bottom + window.scrollY + 4}px`;
        panel.style.left = `${Math.min(rect.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 250)}px`;

        const searchInput = panel.querySelector('input');
        const optionsList = panel.querySelector('.po-ms-options');

        const renderOptions = (term) => {
          const allOptions = this.getColumnFilterOptions(key);
          const selected = App.State.productionColumnFilters[key] || [];
          const t = (term || '').toLowerCase().trim();
          const visible = allOptions.filter(o => !t || o.label.toLowerCase().includes(t));

          optionsList.innerHTML = visible.map(o => {
            const on = selected.includes(o.value);
            return `<li class="po-ms-option${on ? ' checked' : ''}" data-value="${escapeHtml(o.value)}">
              <span class="po-ms-check">${on ? '✓' : ''}</span>
              <span>${escapeHtml(o.label)}</span>
            </li>`;
          }).join('') || '<li class="po-ms-empty">No values found</li>';
        };

        searchInput.addEventListener('input', () => renderOptions(searchInput.value));
        searchInput.addEventListener('click', e => e.stopPropagation());
        panel.addEventListener('click', e => e.stopPropagation());

        panel.querySelector('[data-action="select-all"]').addEventListener('click', () => {
          const t = searchInput.value;
          const visibleValues = this.getColumnFilterOptions(key)
            .filter(o => !t.trim() || o.label.toLowerCase().includes(t.toLowerCase()))
            .map(o => o.value);
          App.State.productionColumnFilters[key] = [...new Set([...(App.State.productionColumnFilters[key] || []), ...visibleValues])];
          this.onColumnFilterChange(key);
          renderOptions(t);
        });

        panel.querySelector('[data-action="clear"]').addEventListener('click', () => {
          App.State.productionColumnFilters[key] = [];
          this.onColumnFilterChange(key);
          renderOptions(searchInput.value);
        });

        optionsList.addEventListener('click', e => {
          const li = e.target.closest('.po-ms-option');
          if (!li) return;
          const val = li.dataset.value;
          const sel = App.State.productionColumnFilters[key] || (App.State.productionColumnFilters[key] = []);
          const idx = sel.indexOf(val);
          if (idx === -1) sel.push(val);
          else sel.splice(idx, 1);
          this.onColumnFilterChange(key);
          renderOptions(searchInput.value);
        });

        renderOptions('');
        requestAnimationFrame(() => searchInput.focus());

        if (!document.body.dataset.productionColFilterOutsideClickBound) {
          document.body.dataset.productionColFilterOutsideClickBound = '1';
          document.addEventListener('click', e => {
            const openPanel = document.getElementById('productionColFilterPanel');
            if (openPanel && !openPanel.contains(e.target) && !e.target.closest('.th-filter-btn')) {
              openPanel.remove();
            }
          });
        }
      },

      onColumnFilterChange(key) {
        this.updateColumnFilterIcons();
        App.State.productionCurrentPage = 1;
        this.filterData(App.State.productionSearchTerm || '');
      },

      clearColumnFilters() {
        App.State.productionColumnFilters = { process: [], outputItem: [], productTag: [], assignedBy: [], assignedTo: [], status: [] };
        document.getElementById('productionColFilterPanel')?.remove();
        this.updateColumnFilterIcons();
        App.State.productionCurrentPage = 1;
        this.filterData(App.State.productionSearchTerm || '');
      },

      // Narrows a base list down to rows matching every active per-column
      // filter (AND across columns, OR within a column's checked values).
      applyColumnFilters(items) {
        const { process, outputItem, productTag, assignedBy, assignedTo, status } = App.State.productionColumnFilters;
        if (!process.length && !outputItem.length && !productTag.length && !assignedBy.length && !assignedTo.length && !status.length) return items;

        return items.filter(p => {
          if (process.length) {
            const proc = (App.State.globalProcesses || []).find(pr => pr.processId === p.processId);
            const label = proc ? proc.processName : (p.processId || 'Uncategorized');
            if (!process.includes(label)) return false;
          }
          if (outputItem.length && !outputItem.includes(p.outputItemName || '')) return false;
          if (productTag.length && !productTag.includes(p.productId || '')) return false;
          if (assignedBy.length && !assignedBy.includes(p.assignedBy || '')) return false;
          if (assignedTo.length && !assignedTo.includes(p.assignedTo || '')) return false;
          if (status.length && !status.includes(p.status || '')) return false;
          return true;
        });
      },

      // Field/direction combos selectable via the "Sort by" dropdown
      // (View_Production.html#productionSortBy). Applied to filteredProduction
      // after every filter/search pass, before the pagination slice in renderTable.
      SORT_COMPARATORS: {
        dateDesc: (a, b) => parseRecordDate(b.dateRaw, b.date) - parseRecordDate(a.dateRaw, a.date),
        dateAsc: (a, b) => parseRecordDate(a.dateRaw, a.date) - parseRecordDate(b.dateRaw, b.date),
        outputItemAsc: (a, b) => String(a.outputItemName || '').localeCompare(String(b.outputItemName || '')),
        outputItemDesc: (a, b) => String(b.outputItemName || '').localeCompare(String(a.outputItemName || '')),
        qtyDesc: (a, b) => (b.qty || 0) - (a.qty || 0),
        qtyAsc: (a, b) => (a.qty || 0) - (b.qty || 0),
        statusAsc: (a, b) => String(a.status || '').localeCompare(String(b.status || ''))
      },

      sortFiltered() {
        const cmp = this.SORT_COMPARATORS[App.State.productionSortBy];
        if (cmp) App.State.filteredProduction.sort(cmp);
      },

      sortBy(value) {
        App.State.productionSortBy = value;
        this.sortFiltered();
        App.State.productionCurrentPage = 1;
        this.renderTable();
      },

      changePage(page) {
        App.State.productionCurrentPage = App.Utils.clampPage(page, App.State.filteredProduction.length, App.State.productionRowsPerPage);
        this.renderTable();
      },

      // Opens the Colorwise Production Summary modal, populating the Process
      // filter from already-loaded process master data (no extra server call).
      // presetProcessId (optional) overrides the filter's last-used value —
      // used by the Dashboard's pipeline drill-down to jump straight to one process.
      openColorwiseSummaryModal(presetProcessId) {
        const select = document.getElementById('colorwiseSummaryProcessFilter');
        if (select) {
          if (window.jQuery?.fn?.select2 && window.jQuery(select).data('select2'))
            window.jQuery(select).select2('destroy');
          const current = presetProcessId !== undefined ? presetProcessId : select.value;
          const options = (App.State.globalProcesses || [])
            .slice()
            .sort((a, b) => (a.sequence || 0) - (b.sequence || 0))
            .map(p => `<option value="${escapeHtml(p.processId)}">${escapeHtml(p.processName)} (Seq ${p.sequence})</option>`)
            .join('');
          select.innerHTML = '<option value="">All Processes</option>' + options;
          select.value = current;
          if (window.jQuery?.fn?.select2) {
            const $s = window.jQuery(select);
            $s.select2({
              placeholder: 'All Processes',
              width: '100%',
              allowClear: true,
              matcher: App.Utils.select2Matcher,
              dropdownParent: App.Utils.select2DropdownParent($s)
            });
          }
        }
        const statusSelect = document.getElementById('colorwiseSummaryStatusFilter');
        if (statusSelect && window.jQuery?.fn?.select2 && !window.jQuery(statusSelect).data('select2')) {
          const $ss = window.jQuery(statusSelect);
          $ss.select2({
            placeholder: 'All Statuses',
            width: '100%',
            allowClear: true,
            matcher: App.Utils.select2Matcher,
            dropdownParent: App.Utils.select2DropdownParent($ss)
          });
        }
        this.renderColorwiseSummary();
        const modalEl = document.getElementById('colorwiseSummaryModal');
        if (modalEl && typeof bootstrap !== 'undefined') new bootstrap.Modal(modalEl).show();
      },

      // Aggregates qty per color across all production lots (using each lot's
      // colorBreakdown when present, else its single Color field with full
      // lot qty), split by status, honoring the Process/Status filters. Reads
      // purely from already-loaded App.State.globalProduction — no server call.
      renderColorwiseSummary() {
        const tbody = document.getElementById('colorwiseSummaryBody');
        const emptyState = document.getElementById('colorwiseSummaryEmptyState');
        if (!tbody) return;

        const processFilter = (document.getElementById('colorwiseSummaryProcessFilter') || {}).value || '';
        const statusFilter = (document.getElementById('colorwiseSummaryStatusFilter') || {}).value || '';

        // Bucketed by color+axisKey, not color alone — two independent Color
        // Axes can legitimately share a literal color name (e.g. a Frame
        // axis and a separate Mudguard axis both having their own "Purple" —
        // see computeColorAxesForProcess in module_process.js: each axis's
        // colors come from its own pool item/tag history with no cross-axis
        // uniqueness guarantee). Bucketing on the color string alone summed
        // those two unrelated component quantities into one inflated total
        // for that name — the same class of bug the axisKey fix in
        // saveProduction's own Lot Qty derivation addresses for a single
        // lot (see its comment), just resurfacing here in this aggregate
        // report. A blank axisKey (legacy/no-axis lots) still merges
        // together as before, since every such entry shares the same ''.
        const totals = {}; // "color||axisKey" -> { color, axisKey, Pending, 'In Progress', Completed, Cancelled, lots }
        const ensure = (color, axisKey) => {
          const key = color + '||' + (axisKey || '');
          if (!totals[key]) totals[key] = { color, axisKey: axisKey || '', Pending: 0, 'In Progress': 0, Completed: 0, Cancelled: 0, lots: 0 };
          return totals[key];
        };

        (App.State.globalProduction || []).forEach(p => {
          if (processFilter && p.processId !== processFilter) return;
          if (statusFilter && p.status !== statusFilter) return;

          const entries = (p.colorBreakdown && p.colorBreakdown.length > 0)
            ? p.colorBreakdown
            : (p.color ? [{ color: p.color, qty: p.qty }] : [{ color: 'Uncolored', qty: p.qty }]);

          entries.forEach(e => {
            const bucket = ensure(e.color || 'Uncolored', e.axisKey);
            bucket.lots += 1;
            if (bucket[p.status] !== undefined) bucket[p.status] += (Number(e.qty) || 0);
          });
        });

        const rows = Object.values(totals).sort((a, b) =>
          a.color.localeCompare(b.color) || a.axisKey.localeCompare(b.axisKey));
        if (rows.length === 0) {
          tbody.innerHTML = '';
          if (emptyState) emptyState.style.display = 'block';
          return;
        }
        if (emptyState) emptyState.style.display = 'none';

        // A color name split across 2+ rows only because different axes
        // share it needs its axis shown alongside, or those rows look like
        // an unexplained duplicate; a color used by just one axis (the
        // overwhelming common case) renders exactly as before.
        const colorRowCounts = {};
        rows.forEach(t => { colorRowCounts[t.color] = (colorRowCounts[t.color] || 0) + 1; });

        tbody.innerHTML = rows.map(t => {
          const total = t.Pending + t['In Progress'] + t.Completed + t.Cancelled;
          const qualifier = colorRowCounts[t.color] > 1 ? this._axisQualifierLabel(t.axisKey) : '';
          const label = qualifier
            ? `${escapeHtml(t.color)} <small class="text-muted">(${escapeHtml(qualifier)})</small>`
            : escapeHtml(t.color);
          return `<tr>
        <td class="fw-bold">${label}</td>
        <td class="text-center">${t.lots}</td>
        <td class="text-center">${this.formatQty(t.Pending)}</td>
        <td class="text-center">${this.formatQty(t['In Progress'])}</td>
        <td class="text-center fw-bold text-success">${this.formatQty(t.Completed)}</td>
        <td class="text-center text-muted">${this.formatQty(t.Cancelled)}</td>
        <td class="text-center fw-bold">${this.formatQty(total)}</td>
      </tr>`;
        }).join('');
      },

      // Human-readable qualifier for an axisKey, used only to disambiguate
      // two different axes that happen to produce the exact same color name
      // (see renderColorwiseSummary) — strips the "pool:"/"tag:"/"merged:"
      // prefix computeColorAxesForProcess adds (module_process.js) and falls
      // back to the raw key for anything else (a legacy grouping's
      // "group_N" / "other" / "custom" bucket).
      _axisQualifierLabel(axisKey) {
        const key = String(axisKey || '').trim();
        if (!key) return '';
        const m = key.match(/^(pool|tag|merged):(.+)$/i);
        return m ? m[2] : key;
      },

      renderTable() {

          App.Utils.renderPagination('productionPagination', 0, 1, App.State.productionRowsPerPage, 'production-page', 'Production Lots');
          this.updateBulkButtons();
          return;
        }
        if (emptyState) emptyState.style.display = 'none';

        const { filteredProduction, productionCurrentPage: cur, productionRowsPerPage: rpp } = App.State;
        const start = (cur - 1) * rpp;
        const pageItems = filteredProduction.slice(start, start + rpp);

        const selectAllChk = document.getElementById('selectAllProduction');
        if (selectAllChk) {
          selectAllChk.checked = pageItems.length > 0 &&
            pageItems.every(p => App.Selection.isSelected(App.State.selectedProduction, String(p.rowIdx)));
        }

        let html = '';
        pageItems.forEach(p => {
          const idx = App.State.globalProduction.indexOf(p);
          html += this.rowHtml(p, idx);

      rowHtml(p, idx) {

        return `<tr data-row-key="${escapeHtml(key)}">

      // Patches one already-loaded row's data + its rendered <tr> after an
      // Edit Lot save, instead of the old approach (loadData(): a full
      // getProductionData round-trip + rebuilding every row's HTML), which
      // flashed "Loading Production Logs..." over the whole table and reset
      // scroll position on every single-row edit.
      //
      // Mutates the SAME row object already sitting in globalProduction (and
      // therefore filteredProduction too — filterData() derives it via
      // .filter(), which holds the same object references, not copies) so
      // nothing else needs re-pointing; mirrors the in-place mutation
      // updateStatus() above already does for the status field alone.
      //
      // Trade-off accepted for this: no re-sort/re-filter happens here, so if
      // the edit changed a value the active Sort/Search depends on (e.g. its
      // Date under "Sort by Date"), the row keeps its old position/visibility
      // until the next natural full reload (tab switch, filter, refresh).
      //
      // Returns false — so the caller can fall back to loadData() — when the
      // row isn't currently loaded (stale local state) or isn't on the
      // currently displayed page (nothing in the DOM to patch).
      patchRowInPlace(freshRow) {
        const key = String(freshRow.rowIdx);
        const existing = App.State.globalProduction.find(r => String(r.rowIdx) === key);
        if (!existing) return false;

        Object.assign(existing, freshRow);

        const tr = document.querySelector(`#productionTableBody tr[data-row-key="${key}"]`);
        if (!tr) return false;

        const idx = App.State.globalProduction.indexOf(existing);
        tr.outerHTML = this.rowHtml(existing, idx);
        return true;
      },

      async bulkDelete() {
        const selected = App.State.selectedProduction.slice();
        if (selected.length === 0) return;

        // Same shifted/modified-row guard as the single-row delete() below —
        // lets the server skip (not blindly delete) any row that no longer
        // matches what was on screen when it was selected.
        const expectedRows = (App.State.globalProduction || [])
          .filter(p => App.Selection.isSelected(selected, String(p.rowIdx)))
          .map(p => ({ rowIdx: p.rowIdx, expectedProductId: p.productId, expectedQty: p.qty }));

        App.Utils.confirmAction(
          `Are you sure you want to permanently delete ${selected.length} selected production record(s)?`,
          async () => {
            try {
              const res = await Api.call('deleteProductionBulk', selected, expectedRows);
              App.Utils.showToast(res.message, !res.success);
              if (res.success) {
                App.State.selectedProduction = [];
                await this.loadData();
              }
            } catch (err) {
              App.Utils.showToast(err.message || 'Failed to delete production records', true);
            }
          }
        );

      // Populates the optional Product-tag dropdown (only shown/used for

      populateProductSelect() {

        const currentValue = select.value;

        let html = '<option value="">— Untagged (stays in Warehouse Pool only) —</option>';

      handleProductChange(productId) {
        const nameHiddenInput = document.getElementById('productionProductNameHidden');
        const idHiddenInput = document.getElementById('productionProductIdHidden');

        if (!productId) {
          if (nameHiddenInput) nameHiddenInput.value = '';
          if (idHiddenInput) idHiddenInput.value = '';
          return;
        }

        const matchedBOM = (App.State.globalBOMs || []).find(b => b.productId === productId);
        if (idHiddenInput) idHiddenInput.value = productId;
        if (nameHiddenInput) nameHiddenInput.value = matchedBOM ? matchedBOM.productName : '';
      },

      // Builds the Size dropdown from every distinct size found across active
      // processes' Output Item Names (12/14/16/20/24/26 inch, else 'General') —
      // the Process picker is filtered to this choice once one is made.
      populateSizeSelect() {
        const select = document.getElementById('productionSize');
        if (!select) return;

        if (window.jQuery?.fn?.select2 && window.jQuery(select).data('select2'))
          window.jQuery(select).select2('destroy');

        const currentValue = select.value;

        const sizesPresent = new Set(
          (App.State.globalProcesses || [])
            .filter(p => p.active)
            .map(p => App.Utils.getSizeFromOutputItemName(p.outputItemName))
        );
        const ordered = App.Utils.PROCESS_SIZE_LIST.filter(s => sizesPresent.has(s));
        if (sizesPresent.has('General')) ordered.push('General');

        let html = '<option value="">Choose a Size...</option>';
        ordered.forEach(s => {
          html += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`;
        });

        select.innerHTML = html;
        select.value = currentValue;
        App.Utils.autoSelectOnlyOption(select);

        if (window.jQuery?.fn?.select2) {
          const $s = window.jQuery(select);
          $s.select2({
            placeholder: 'Choose a Size...',
            width: '100%',
            matcher: App.Utils.select2Matcher,
            dropdownParent: App.Utils.select2DropdownParent($s)
          });
        }
      },

      // Fired when Size changes: re-scopes the Model dropdown to that size
      // and clears the Model + Process Type + Process choices, since they
      // belonged to the old size — unless the new Size narrows Model down to
      // exactly one option, in which case autoSelectOnlyOption picks it and
      // the cascade continues from that value instead of stopping blank.
      handleSizeChange(size) {
        if (this._suppressCascade) return;
        this.populateModelSelect(size);

        const modelSelect = document.getElementById('productionModel');
        if (modelSelect) {
          // Suppressed: Select2 fires a real 'change' (which hits this
          // select's own onchange="handleModelChange(...)" attribute, not
          // just Select2's internal listener) whenever its value is set via
          // trigger('change.select2') — including from inside
          // autoSelectOnlyOption below, which promises callers it does NOT
          // dispatch a change event but does so anyway once Select2 is
          // attached. Without this guard, that stray re-entrant call to
          // handleModelChange() raced the explicit one two lines down,
          // fanning out into a runaway Model->Process Type->Process cascade
          // that burned through _compLoadSeq for seconds after the user
          // moved on — corrupting the seq guard for the next unrelated
          // openCreateModal/openEditModal call and silently aborting it
          // right before its own modal.show() (see bug memory for this fix).
          this._suppressCascade = true;
          try {
            modelSelect.disabled = !size;
            modelSelect.value = '';
            if (window.jQuery?.fn?.select2 && window.jQuery(modelSelect).data('select2'))
              window.jQuery(modelSelect).trigger('change.select2');
            if (size) App.Utils.autoSelectOnlyOption(modelSelect);
          } finally {
            this._suppressCascade = false;
          }
        }
        return this.handleModelChange(modelSelect ? modelSelect.value : '');
      },

      // Builds the Model dropdown from every distinct Model Master name found
      // in active processes' Output Item Names matching sizeFilter ('General'
      // for processes whose output mentions no known model, last) — mirrors
      // populateProcessTypeSelect's pattern but keyed off
      // App.Utils.getModelFromOutputItemName/App.State.globalModels instead
      // of processType.
      populateModelSelect(sizeFilter) {
        const select = document.getElementById('productionModel');
        if (!select) return;

        if (window.jQuery?.fn?.select2 && window.jQuery(select).data('select2'))
          window.jQuery(select).select2('destroy');

        const currentValue = select.value;
        const matches = (App.State.globalProcesses || [])
          .filter(p => p.active)
          .filter(p => !sizeFilter || App.Utils.getSizeFromOutputItemName(p.outputItemName) === sizeFilter);

        const modelsPresent = new Set(matches.map(p => App.Utils.getModelFromOutputItemName(p.outputItemName)));
        const modelNames = (App.State.globalModels || []).map(m => m.name);
        const ordered = modelNames.filter(m => modelsPresent.has(m));
        if (modelsPresent.has('General')) ordered.push('General');

        let html = sizeFilter ? '<option value="">Choose a Model...</option>' : '<option value="">Choose a Size first...</option>';
        ordered.forEach(m => {
          html += `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`;
        });

        select.innerHTML = html;
        select.value = currentValue;
        App.Utils.autoSelectOnlyOption(select);

        if (window.jQuery?.fn?.select2) {
          const $s = window.jQuery(select);
          $s.select2({
            placeholder: sizeFilter ? 'Choose a Model...' : 'Choose a Size first...',
            width: '100%',
            matcher: App.Utils.select2Matcher,
            dropdownParent: App.Utils.select2DropdownParent($s)
          });
        }
      },

      // Fired when Model changes: re-scopes the Process Type dropdown to
      // that size+model and clears the Process Type + Process choices,
      // since they belonged to the old model — unless the new Model narrows
      // Process Type down to exactly one option (see handleSizeChange).
      handleModelChange(model) {
        if (this._suppressCascade) return;
        const size = document.getElementById('productionSize')?.value || '';
        this.populateProcessTypeSelect(size, model);

        const typeSelect = document.getElementById('productionProcessType');
        if (typeSelect) {
          // Suppressed: see handleSizeChange's matching guard — same
          // Select2-fires-a-real-change-event hazard, one level down.
          this._suppressCascade = true;
          try {
            typeSelect.disabled = !model;
            typeSelect.value = '';
            if (window.jQuery?.fn?.select2 && window.jQuery(typeSelect).data('select2'))
              window.jQuery(typeSelect).trigger('change.select2');
            if (model) App.Utils.autoSelectOnlyOption(typeSelect);
          } finally {
            this._suppressCascade = false;
          }
        }
        return this.handleProcessTypeChange(typeSelect ? typeSelect.value : '');
      },

      // Builds the Process Type dropdown from every distinct processType
      // found across active processes matching sizeFilter+modelFilter
      // ('General' for untyped processes, last) — mirrors
      // populateSizeSelect's pattern but ordered by
      // App.State.globalProcessTypes instead of a fixed list.
      populateProcessTypeSelect(sizeFilter, modelFilter) {
        const select = document.getElementById('productionProcessType');
        if (!select) return;

        if (window.jQuery?.fn?.select2 && window.jQuery(select).data('select2'))
          window.jQuery(select).select2('destroy');

        const currentValue = select.value;
        const matches = (App.State.globalProcesses || [])
          .filter(p => p.active)
          .filter(p => !sizeFilter || App.Utils.getSizeFromOutputItemName(p.outputItemName) === sizeFilter)
          .filter(p => !modelFilter || App.Utils.getModelFromOutputItemName(p.outputItemName) === modelFilter);

        // Case-insensitive: a process's own stored processType can differ in
        // casing from Process Type Master's row (legacy/imported data) — a
        // raw Set.has() would then silently drop that type from the
        // dropdown entirely, even though matching processes exist.
        const typesPresent = new Set(matches.map(p => String(p.processType || 'General').trim().toLowerCase()));
        const typeNames = (App.State.globalProcessTypes || []).map(t => t.name);
        const ordered = typeNames.filter(t => typesPresent.has(t.trim().toLowerCase()));
        if (typesPresent.has('general')) ordered.push('General');

        let html = modelFilter ? '<option value="">Choose a Process Type...</option>' : '<option value="">Choose a Model first...</option>';
        ordered.forEach(t => {
          html += `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`;
        });

        select.innerHTML = html;
        select.value = currentValue;
        App.Utils.autoSelectOnlyOption(select);

        if (window.jQuery?.fn?.select2) {
          const $s = window.jQuery(select);
          $s.select2({
            placeholder: modelFilter ? 'Choose a Process Type...' : 'Choose a Model first...',
            width: '100%',
            matcher: App.Utils.select2Matcher,
            dropdownParent: App.Utils.select2DropdownParent($s)
          });
        }
      },

      // Fired when Process Type changes: re-scopes the Process dropdown to
      // that size+model+type and clears any process-dependent fields, since
      // the previously chosen process (if any) belonged to the old type —
      // unless the new Process Type narrows Process down to exactly one
      // option (see handleSizeChange). initProcessSelect2 is (re)built AFTER
      // the value/auto-select is settled, so the Select2 widget's displayed
      // text reflects the auto-picked option from the moment it appears,
      // instead of rendering blank and only "really" being selected
      // underneath.
      handleProcessTypeChange(type) {
        if (this._suppressCascade) return;
        const size = document.getElementById('productionSize')?.value || '';
        const model = document.getElementById('productionModel')?.value || '';

        // Suppressed: see handleSizeChange's matching guard — same
        // Select2-fires-a-real-change-event hazard, one level down.
        // handleProcessChange itself also needs to honor this flag (see its
        // own guard) since, unlike the other cascade levels, it isn't
        // re-armed by a later populateXSelect() call in this function.
        // Unlike populateModelSelect/populateProcessTypeSelect (which each
        // destroy their own Select2 instance before calling
        // autoSelectOnlyOption, so it's a no-op there), populateProcessSelect
        // does NOT manage Select2 itself — initProcessSelect2() does that
        // separately below — so its own internal autoSelectOnlyOption call
        // hits an already-live Select2 instance and needs the same guard.
        const processSelect = document.getElementById('productionProcessId');
        this._suppressCascade = true;
        try {
          this.populateProcessSelect(size, type, model);
          if (processSelect) {
            processSelect.disabled = !type;
            processSelect.value = '';
            if (type) App.Utils.autoSelectOnlyOption(processSelect);
          }
          this.initProcessSelect2();
        } finally {
          this._suppressCascade = false;
        }

        return this.handleProcessChange(processSelect ? processSelect.value : '');
      },

      // Populates the Process dropdown, scoped to a Size (the Output Item
      // Name substring from PROCESS_SIZE_LIST), a Model (the Output Item
      // Name substring matched against Model Master, 'General' if none), and
      // a Process Type (the process's own processType field, 'General' for
      // untyped). Called with no filters for the pre-selection placeholder
      // state, where the dropdown is disabled anyway. Once scoped, options
      // are grouped into <optgroup>s by Sequence ("Stage N") — multiple
      // parallel processes can share a stage (e.g. Rim Fitting and Mudguard
      // Paint both at Stage 1 for the same size+model+type), so grouping by
      // stage gives an organized view instead of one flat alphabetical-ish
      // list.
      populateProcessSelect(sizeFilter, typeFilter, modelFilter) {
        const select = document.getElementById('productionProcessId');
        if (!select) return;

        const currentValue = select.value;
        const matches = (App.State.globalProcesses || [])
          .filter(p => p.active)
          .filter(p => !sizeFilter || App.Utils.getSizeFromOutputItemName(p.outputItemName) === sizeFilter)
          .filter(p => !modelFilter || App.Utils.getModelFromOutputItemName(p.outputItemName) === modelFilter)
          .filter(p => !typeFilter || App.Utils.sameText(p.processType || 'General', typeFilter));

        let html = typeFilter ? '<option value="">Choose a Process...</option>' : '<option value="">Choose a Process Type first...</option>';

        if (typeFilter) {
          const byStage = new Map();
          matches.forEach(p => {
            if (!byStage.has(p.sequence)) byStage.set(p.sequence, []);
            byStage.get(p.sequence).push(p);
          });
          [...byStage.keys()].sort((a, b) => a - b).forEach(seq => {
            html += `<optgroup label="Stage ${escapeHtml(String(seq))}">`;
            byStage.get(seq).forEach(p => {
              html += `<option value="${escapeHtml(p.processId)}">${escapeHtml(p.processName)}</option>`;
            });
            html += '</optgroup>';
          });
        } else {
          matches.forEach(p => {
            html += `<option value="${escapeHtml(p.processId)}">${escapeHtml(p.processName)} (Seq ${escapeHtml(String(p.sequence))})</option>`;
          });
        }

        select.innerHTML = html;
        select.value = currentValue;
        App.Utils.autoSelectOnlyOption(select);
      },

      // Searchable Select2 on the Process dropdown — picks from the existing
      // option list populated by populateProcessSelect (no free-text tags,
      // since Process must reference a real Process Master row). Select2's
      // own MutationObserver keeps it in sync when the select is later
      // enabled/disabled (e.g. locked on Edit).
      initProcessSelect2() {
        const selectEl = document.getElementById('productionProcessId');
        if (!selectEl || !window.jQuery?.fn?.select2) return;

        const $select = window.jQuery(selectEl);
        if ($select.data('select2')) $select.select2('destroy');

        $select.select2({
          placeholder: 'Choose a Process...',
          width: '100%',
          matcher: App.Utils.select2Matcher,
          dropdownParent: App.Utils.select2DropdownParent($select)
        });
      },

      // When the Process changes: show/hide the optional Product-tag field
      // (only meaningful for final-stage processes), populate the Output Item
      // Name readout, and decide which Quantity UI applies:
      //  - no color sub-groups configured: the single Qty field (legacy path).
      //  - color sub-groups exist: the interactive multi-color checklist —
      //    Common Components populates immediately; the Per-Color matrix
      //    fills in as colors get checked. Used for both Create and Edit —
      //    a saved multi-color batch is always a single Production row.
      async handleProcessChange(processId) {
        if (this._suppressCascade) return;
        const seq = ++this._compLoadSeq;
        this._resetProcDataCache();

        const tagWrapper = document.getElementById('productionProductTagWrapper');
        const outputEl = document.getElementById('productionOutputItemName');
        const process = (App.State.globalProcesses || []).find(p => p.processId === processId);

        if (outputEl) outputEl.value = process ? (process.outputItemName || '') : '';

        if (tagWrapper) tagWrapper.style.display = (process && process.isFinalStage) ? '' : 'none';
        if (!process || !process.isFinalStage) {
          const select = document.getElementById('productionProductId');
          if (select) select.value = '';
          this.handleProductChange('');
        }

        const colors = await this.populateColorChecklist(processId, seq);
        if (seq !== this._compLoadSeq) return;

        const addColorsBtn = document.getElementById('productionAddColorsBtn');
        const revertColorsBtn = document.getElementById('productionRevertColorsBtn');
        if (revertColorsBtn) revertColorsBtn.style.display = 'none';
        if (colors.length === 0) {
          await this.populateComponentsFromProcess(processId, '', seq);
          if (seq !== this._compLoadSeq) return;
          if (addColorsBtn) addColorsBtn.style.display = processId ? '' : 'none';
        } else {
          this.clearComponentsTable();
          this.clearColorMatrix();
          await this.populateCommonComponentsFromProcess(processId, seq);
          if (seq !== this._compLoadSeq) return;
          if (addColorsBtn) addColorsBtn.style.display = 'none';
        }
        this.refreshPayableHint();
      },

      // Populates the interactive Colors-to-Produce checklist with this
      // process's configured color sub-groups (see getProcessColorGroups).
      // Shows the checklist + Per-Color matrix (hiding the single Qty field)
      // only when at least one color exists — a process with none only ever
      // needs the single Qty field, exactly as before this feature existed.
      // Returns the list of colors.
      async populateColorChecklist(processId, seq) {
        const wrapper = document.getElementById('productionColorWrapper');
        const checklistEl = document.getElementById('productionColorChecklist');
        const qtyWrapper = document.getElementById('productionQtyWrapper');
        const qtyInput = document.getElementById('productionQty');
        const sectionLabel = document.getElementById('productionComponentsSectionLabel');
        if (!wrapper || !checklistEl) return [];

        checklistEl.innerHTML = '';
        // Reset for this (re)load — repopulated by renderGroupedColorChecklist
        // as it renders each real group, then used by _refreshCustomColorGroupSelect
        // to offer addCustomColorRow a "which group is this?" choice once 2+
        // real groups exist for this process.
        this._customColorGroupOptions = [];

        let colors = [];
        if (processId) {
          try {
            const res = await Api.call('getProcessColorGroups', processId);
            colors = res.success ? (res.data || []) : [];
          } catch (err) {
            colors = [];
          }
        }
        // A newer call (re-selected Process, or a different lot opened for
        // edit) has since bumped the counter — stop before painting anything
        // from this now-stale response.
        if (seq !== undefined && seq !== this._compLoadSeq) return colors;

        if (colors.length === 0) {
          wrapper.style.display = 'none';
          if (qtyWrapper) qtyWrapper.style.display = '';
          if (qtyInput) qtyInput.required = true;
          if (sectionLabel) sectionLabel.innerText = 'Components Consumed';
          this.hideColorMatrix();
          this._refreshCustomColorGroupSelect();
          return [];
        }

        if (qtyWrapper) qtyWrapper.style.display = 'none';
        if (qtyInput) { qtyInput.required = false; qtyInput.value = ''; }
        wrapper.style.display = '';
        if (sectionLabel) sectionLabel.innerText = 'Common Components';
        this.showColorMatrix();

        await this.renderGroupedColorChecklist(processId, colors, seq);
        if (seq === undefined || seq === this._compLoadSeq) {
          this._refreshCustomColorGroupSelect();
          // Paint the per-color "avail." hints as soon as the rows exist,
          // rather than waiting for the components tables further down to
          // finish loading — this reads only already-cached data (see
          // refreshColorChecklistAvailability), and refreshPoolAvailability
          // re-runs it afterward once Stock has landed too.
          await this.refreshColorChecklistAvailability(processId, seq);
        }

        return colors;
      },

      // Populates (or hides, if fewer than 2 real groups exist) the "which
      // group is this?" picker addCustomColorRow offers — see
      // _customColorGroupOptions, filled in by renderGroupedColorChecklist
      // as it renders each real axis/pool-item group. A process with 0 or 1
      // group has no ambiguity to ask about, so the whole picker stays
      // hidden and a custom color falls back to the old flat "Custom"
      // bucket (always an independent extra color).
      _refreshCustomColorGroupSelect() {
        const sel = document.getElementById('productionCustomColorGroupSelect');
        if (!sel) return;
        const options = this._customColorGroupOptions || [];
        if (options.length < 2) {
          sel.style.display = 'none';
          sel.innerHTML = '';
          return;
        }
        sel.style.display = '';
        sel.innerHTML = '<option value="">Independent extra color (adds to lot total)</option>'
          + options.map(o => `<option value="${escapeHtml(o.key)}">${escapeHtml(o.label)}${o.isPrimary ? ' (Primary)' : ''}</option>`).join('');
      },

      // Appends one checkbox+qty row per color name to the checklist —
      // shared by the auto-detected path above and the manual "Add Colors"
      // path below, which sources its color list from the full Color Master
      // instead of a process's recipe/pool-derived sub-groups. Does NOT
      // clear the checklist first, so renderGroupedColorChecklist can call
      // this once per sub-group to build several labeled blocks in a row.
      // `groupKey`, when set, tags each row so a group's "select all"
      // checkbox (see toggleColorGroup) can find exactly its own rows.
      // `isCustom`, when true, tags the row so getCheckedColorQtys can flag
      // it to the server (see addCustomColorRow) — it wasn't derived from
      // this process's recipe/pool colors, so saveProduction's normal
      // "is this a configured color sub-group" check must be skipped for it.
      // `isPrimary`, when this process has 2+ independent Color Axes (see
      // renderGroupedColorChecklist's axis-mode branch), marks whether this
      // row's group is the one whose checked quantities sum to the lot's
      // total (true/false) — omitted entirely for legacy single-axis/flat
      // processes, which have no primary/non-primary distinction at all.
      // One color checkbox row's markup — pulled out of renderColorChecklistRows
      // so addCustomColorRow can insert a single row at an arbitrary DOM
      // position (right after its chosen group's last row) instead of only
      // ever being able to append at the very end of the checklist.
      _colorRowHtml(color, groupKey, isCustom, isPrimary) {
        const groupAttr = groupKey ? ` data-group="${escapeHtml(groupKey)}"` : '';
        const customAttr = isCustom ? ' data-custom="true"' : '';
        const primaryAttr = isPrimary === undefined ? '' : ` data-primary="${isPrimary ? 'true' : 'false'}"`;
        return `
        <div class="form-check d-flex align-items-center gap-2 production-color-row" data-color="${escapeHtml(color)}"${groupAttr}${customAttr}${primaryAttr}>
          <input class="form-check-input production-color-check" type="checkbox" onchange="App.Production.handleColorCheckToggle(this)">
          <label class="form-check-label fw-bold mb-0">${escapeHtml(color)}</label>
          <input type="number" class="form-control form-control-sm production-color-qty" style="width:100px;" step="any" placeholder="Qty" disabled oninput="App.Production.onColorQtyChanged(this.closest('.production-color-row'))">
          <span class="small text-muted production-color-avail"></span>
        </div>`;
      },

      renderColorChecklistRows(colors, groupKey, isCustom, isPrimary) {
        const checklistEl = document.getElementById('productionColorChecklist');
        if (!checklistEl) return;
        colors.forEach(color => {
          checklistEl.insertAdjacentHTML('beforeend', this._colorRowHtml(color, groupKey, isCustom, isPrimary));
        });
      },

      // Live Warehouse Pool availability, keyed the same way the server's
      // own getPoolAvailableQtyMap keys it (module_warehouse.js): untagged
      // (intermediate WIP) rows only — a tagged bucket is already committed
      // to a packed product and can't be drawn on by a new lot — summed per
      // item name, then per color bucket within it.
      // Map<itemNameLower, Map<colorLower, qty>>.
      _poolAvailByItemColor(poolRows) {
        const byItem = new Map();
        (poolRows || []).forEach(r => {
          if (r.productTag) return;
          const item = String(r.outputItemName || '').trim().toLowerCase();
          if (!item) return;
          if (!byItem.has(item)) byItem.set(item, new Map());
          const colors = byItem.get(item);
          const color = String(r.color || '').trim().toLowerCase();
          colors.set(color, (colors.get(color) || 0) + (Number(r.availableQty) || 0));
        });
        return byItem;
      },

      // One item's available qty in one color. Exact bucket first; failing
      // that, every COMPOSITE bucket this color is one token of (see
      // COLOR_COMBO_DELIMITER in config.js — a process drawing on 2+
      // independent pool inputs at once keys its buckets by the joined
      // combination, e.g. "BCP / Blue-White"), mirroring the same
      // single-token -> composite-bucket resolution getPoolAvailableQtyMap
      // does server-side so this hint agrees with what a save would actually
      // find. Unlike the server's "exactly one source" rule, every matching
      // composite is summed here: those buckets are disjoint physical stock,
      // so their total really is how much of this color exists. Returns 0
      // (not null) for an item that has pool history but no bucket for this
      // color at all — that's a real "none available", not an unknown.
      _poolAvailForColor(colorMap, color) {
        if (!colorMap) return null;
        const key = String(color || '').trim().toLowerCase();
        if (!key) return null;
        if (colorMap.has(key)) return colorMap.get(key);
        let total = 0;
        colorMap.forEach((qty, bucket) => {
          // ' / ' literal, not the server-side COLOR_COMBO_DELIMITER constant
          // (config.js is not shipped to the client) — same literal
          // _checkedColorTokensLower already splits composite colors on.
          if (bucket.split(' / ').map(t => t.trim()).includes(key)) total += qty;
        });
        return total;
      },

      // Which real inputs feed one checklist group — i.e. what actually
      // limits how much of that group's colors this lot can produce.
      // Two shapes, matching the two ways a group is built in
      // renderGroupedColorChecklist:
      //   - a 'pool'/'merged' axis (and every legacy pool-item group) is
      //     labeled with its own pool item name(s), joined by ', ' — so the
      //     label resolves straight back to this recipe's POOL-sourced
      //     components (same matching direction _axisKeyForPoolItemNames
      //     uses in reverse).
      //   - a 'tag' axis is labeled with its COLOR_AXIS name instead, and is
      //     fed by whichever recipe rows carry that axis label; those rows
      //     name their own color in colorGroup, so each color's inputs are
      //     found per-color rather than per-group.
      // The 'other'/'custom' buckets have no configured source at all and
      // resolve to nothing — deliberately blank rather than a misleading
      // "0 avail." (see _colorRowAvailability).
      _groupInputSources(groupKey, comps) {
        const opt = (this._customColorGroupOptions || []).find(o => o.key === groupKey);
        if (!opt) return { poolItems: [], tagComps: [] };

        const labelParts = opt.label.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
        const poolItems = comps.filter(c =>
          c.sourceType === 'POOL' && labelParts.includes(String(c.itemName || '').trim().toLowerCase()));

        const axisLabel = opt.label.trim().toLowerCase();
        const tagComps = comps.filter(c =>
          String(c.colorAxis || '').trim().toLowerCase() === axisLabel && axisLabel);

        return { poolItems, tagComps };
      },

      // The availability hint for ONE checklist row: the smallest available
      // quantity across every input that color needs, since the scarcest one
      // is the real ceiling. Returns null when this row's group has no
      // resolvable input (Other/Custom, or a tag axis whose recipe rows
      // don't name this color) so the caller can leave the row blank instead
      // of asserting a zero it can't back up.
      // `parts` carries the per-input breakdown for the tooltip, which is
      // what makes a multi-input group's single min number interpretable.
      _colorRowAvailability(color, groupKey, ctx) {
        const { poolItems, tagComps } = this._groupInputSources(groupKey, ctx.comps);
        const parts = [];

        const addPool = (itemName) => {
          const colorMap = ctx.poolAvail.get(String(itemName || '').trim().toLowerCase());
          const qty = this._poolAvailForColor(colorMap, color);
          if (qty !== null) parts.push({ label: itemName, qty });
        };

        poolItems.forEach(c => addPool(c.itemName));

        tagComps
          // Token match, not whole-string: a tag row scoped to "Blue-White"
          // is genuinely consumed by a lot producing the composite
          // "Blue-White / BCP", so its stock constrains that row's
          // availability. Same rule the Per-Color Components table and
          // saveProduction use (see _matchedColorToken).
          .filter(c => this._matchedColorToken(c.colorGroup, color))
          .forEach(c => {
            if (c.sourceType === 'POOL') {
              addPool(c.itemName);
              return;
            }
            const name = String(c.itemName || '').trim().toLowerCase();
            const size = String(c.size || '').trim().toLowerCase();
            const entry = (ctx.stock || []).find(s =>
              String(s.name || '').trim().toLowerCase() === name
              && (!size || String(s.size || '').trim().toLowerCase() === size));
            if (entry) parts.push({ label: c.itemName, qty: Number(entry.currentStock) || 0 });
          });

        if (parts.length === 0) return null;
        return {
          qty: parts.reduce((min, p) => Math.min(min, p.qty), Infinity),
          parts
        };
      },

      // Shows, next to every color in the Colors to Produce checklist, how
      // much of that color is actually available to build from right now —
      // the Warehouse Pool balance of the upstream item(s) that group is
      // driven by (see _groupInputSources), or plain Stock for an
      // ITEM-sourced tag-axis input. This is the producible ceiling for that
      // color, the same question the per-row "avail." hints in the
      // Components tables answer for their own rows (see
      // refreshPoolAvailability) — just surfaced at the point the operator
      // actually decides which colors and how many to put in the lot,
      // instead of only after scrolling down to the component tables.
      //
      // Purely client-side over the two per-load cached reads the checklist
      // already made (_fetchProcessComponents/_fetchWarehousePoolData) plus
      // whatever Stock refreshPoolAvailability last loaded, so this costs no
      // extra server round trip and is safe to call after any re-render.
      async refreshColorChecklistAvailability(processId, seq) {
        const rows = $$('#productionColorChecklist .production-color-row');
        if (rows.length === 0) return;

        let comps = [];
        let poolRows = [];
        try {
          const [compRes, poolRes] = await Promise.all([
            this._fetchProcessComponents(processId),
            this._fetchWarehousePoolData()
          ]);
          if (seq !== undefined && seq !== this._compLoadSeq) return;
          comps = compRes.success ? (compRes.data || []) : [];
          poolRows = poolRes.success ? (poolRes.data || []) : [];
        } catch (err) {
          // Ignored — availability hints are advisory, not blocking (same
          // stance as refreshPoolAvailability).
          return;
        }

        const ctx = {
          comps,
          poolAvail: this._poolAvailByItemColor(poolRows),
          stock: App.State.globalStock || []
        };

        // Re-read the rows: the awaits above can only have resolved from
        // cache or a same-load fetch (seq-guarded), but a custom color row
        // may have been added in between.
        $$('#productionColorChecklist .production-color-row').forEach(row => {
          const availEl = row.querySelector('.production-color-avail');
          if (!availEl) return;
          const result = this._colorRowAvailability(row.dataset.color, row.dataset.group, ctx);
          if (!result) {
            availEl.innerText = '';
            availEl.title = '';
            availEl.classList.remove('text-danger', 'fw-bold');
            availEl.classList.add('text-muted');
            return;
          }
          availEl.innerText = `${this.formatQty(result.qty)} avail.`;
          // Only worth spelling out when several inputs feed this color and
          // the single min number alone doesn't say which one is the binding
          // constraint.
          availEl.title = result.parts.length > 1
            ? result.parts.map(p => `${p.label}: ${this.formatQty(p.qty)}`).join('  •  ')
            : `${result.parts[0].label}: ${this.formatQty(result.parts[0].qty)} available`;
          // Nothing (or less than nothing) available is the whole point of
          // showing this, and is far too easy to miss as plain gray text —
          // flagged the same way refreshPoolAvailability flags a negative
          // component balance. Producing it anyway is still allowed (see
          // the deliberate zero/negative-stock decision) — this only warns.
          const empty = result.qty <= 0;
          availEl.classList.toggle('text-danger', empty);
          availEl.classList.toggle('fw-bold', empty);
          availEl.classList.toggle('text-muted', !empty);
        });
      },

      // Sum of every currently checked PRIMARY-axis row's quantity — the
      // fallback a non-primary axis row auto-fills from when it's checked
      // AND no single primary row's own color name-matches it (see
      // _matchingPrimaryColorQty) — i.e. a genuinely shared/common
      // non-primary row like a Fitted Rim always in Black regardless of
      // frame color, where "the total across every checked primary color"
      // really is the right default. Zero (not blank) on any process
      // without an explicit primary axis, since only axis-mode rows ever
      // carry data-primary.
      _primaryColorAxisTotal() {
        return $$('#productionColorChecklist .production-color-row[data-primary="true"]')
          .filter(row => row.querySelector('.production-color-check')?.checked)
          .reduce((sum, row) => sum + (toNumber(row.querySelector('.production-color-qty')?.value) || 0), 0);
      },

      // Two color names are treated as "the same underlying color, tagged
      // two different ways" if they're identical, or if the shorter one
      // occupies one whole delimiter-bounded segment of the longer one —
      // e.g. "Red" inside "Red-White", "Sea Green" inside "Sea Green-White",
      // and (per the "Pink"/"Pink / BCP / Pink-White" case reported live)
      // "Pink" inside the old cross-product-joined "Pink / BCP / Pink-White".
      // Delimiters are "-", "/" and whitespace, matching every real
      // multi-color naming scheme this app produces (hyphenated pairs, the
      // legacy " / "-joined combo strings). Originally just a hyphen-prefix
      // check; broadened to full segment matching so it also covers a
      // manually-tagged component color or a legacy grouping's "Other"
      // leftover matching a composite Primary row's name, not only a
      // Primary row's own hyphenated compound. A short, generic word (e.g.
      // "White") can incidentally segment-match an unrelated "X-White"
      // compound — accepted the same way the no-match grand-total fallback
      // below already accepts ambiguity, since a false match still lands on
      // a real, currently-checked color's own quantity, never a fabricated one.
      _colorNamesMatch(a, b) {
        const x = String(a || '').trim().toLowerCase();
        const y = String(b || '').trim().toLowerCase();
        if (!x || !y) return false;
        if (x === y) return true;
        const shorter = x.length <= y.length ? x : y;
        const longer = x.length <= y.length ? y : x;
        const escaped = shorter.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return new RegExp(`(^|[-/\\s])${escaped}($|[-/\\s])`).test(longer);
      },

      // Is this group name a real COLOR group, or a sub-group that merely
      // travels down the same channel? A lot's "colors" list is whatever the
      // recipe tagged its components with, and that legitimately includes
      // packing/variant buckets which are not colors at all — the reported
      // case was 'KIT BAG 20"' and 'SMALL KIT 20"' sitting alongside
      // Blue-White and Black. Turning those into color-matrix columns made
      // the print matrix 10 columns / 901px wide against a 748px page, and
      // html2canvas silently dropped everything past the edge — including the
      // one column that carried nearly every quantity on the sheet.
      //
      // The test is compositional, not a lookup: a color group's name is built
      // ENTIRELY out of Color Master colors, allowing the same "-", "/" and
      // whitespace delimiters the rest of the color code uses. So
      // "Blue-White" and "B/T Green-Orange" classify as colors (every segment
      // resolves), while 'SMALL KIT 20"' does not (nothing resolves). Longest
      // match wins, matching the established convention elsewhere in this file
      // — otherwise a short color would consume the head of a longer one and
      // strand the remainder ("Sea Green" losing to "Sea").
      _isColorGroupName(name) {
        let rest = String(name || '').trim().toLowerCase();
        if (!rest) return false;
        if (App.Utils.isCommonColorGroup(rest)) return false;

        const master = (App.State.globalColors || [])
          .map(c => String(c.name || '').trim().toLowerCase())
          .filter(Boolean)
          .sort((a, b) => b.length - a.length);
        // With no Color Master loaded there is nothing to judge against;
        // treat every group as a color so the sheet keeps its old shape
        // rather than dumping every column into the sub-group table.
        if (master.length === 0) return true;

        let matchedAny = false;
        while (rest) {
          const withoutDelim = rest.replace(/^[-/\s]+/, '');
          if (withoutDelim !== rest) { rest = withoutDelim; continue; }
          const hit = master.find(m => rest.startsWith(m));
          if (!hit) return false;
          rest = rest.slice(hit.length);
          matchedAny = true;
        }
        return matchedAny;
      },

      // Every currently checked primary-axis row whose color name
      // segment-matches this non-primary color (see _colorNamesMatch).
      // Usually one — a "Red" mudguard under a "Red-White" frame — but a
      // generic second-position color legitimately matches SEVERAL at once
      // (the reported live case: a "Black" Fitted Rim under Copper-Black,
      // Metallic Green-Black and Sky Blue-Black frames all checked
      // together), so callers must handle N, not assume 1.
      _matchingPrimaryColorRows(nonPrimaryColor) {
        const target = String(nonPrimaryColor || '').trim();
        if (!target) return [];
        return $$('#productionColorChecklist .production-color-row[data-primary="true"]')
          .filter(row => row.querySelector('.production-color-check')?.checked)
          .filter(row => this._colorNamesMatch(row.dataset.color, target));
      },

      // The quantity a non-primary axis row should carry: the SUM of every
      // checked primary row whose color name segment-matches it (see
      // _matchingPrimaryColorRows) — so checking a mudguard color that
      // visibly corresponds to one specific frame color auto-fills THAT
      // color's own qty, not the grand total across every frame color
      // checked. Returns null when NO primary row's name matches (so the
      // caller falls back to _primaryColorAxisTotal instead — the right
      // default for a genuinely shared component with no per-color
      // counterpart).
      //
      // Summing, not first-match-wins: this used to return the first
      // matching row's own qty and stop, which was correct only while
      // exactly one primary color could ever match. With a lot of
      // Copper-Black 5 / Metallic Green-Black 4 / SeaGreen-Red 5 / Sky
      // Blue-Black 4, the shared "Black" rim row auto-filled 5 — the first
      // match alone — instead of the 13 units that actually get a black
      // rim, silently under-debiting that axis's own Per-Process Pool
      // Components consumption by the other two batches. Note this is still
      // NOT the grand total (18): SeaGreen-Red carries no black rim, and
      // rolling it in would over-consume by exactly the amount the operator
      // is expected to record against BCP instead.
      _matchingPrimaryColorQty(nonPrimaryColor) {
        const rows = this._matchingPrimaryColorRows(nonPrimaryColor);
        if (rows.length === 0) return null;
        return rows.reduce((sum, row) => sum + (toNumber(row.querySelector('.production-color-qty')?.value) || 0), 0);
      },

      // Lets the operator tack on a one-off custom-named color/sub-group at
      // production-record time — e.g. a variant this process's recipe
      // doesn't define yet — instead of only picking from Color Master or
      // the recipe's own auto-detected color sub-groups. Auto-checked so the
      // operator only has to fill in its quantity.
      //
      // When this process has 2+ real groups (see _customColorGroupOptions /
      // _refreshCustomColorGroupSelect), the operator must also say which
      // one this belongs to — that choice, not just the fact that it's
      // custom, decides whether its quantity adds to the lot total: a color
      // placed in the Primary group (or left "Independent") is a genuine
      // extra output batch and counts, same as saveProduction's qty
      // derivation now respects for a custom entry (see its comment); a
      // color placed in a NON-primary group describes the SAME batch a
      // different way — same rule real (non-custom) rows in that group
      // already follow — and must NOT also add to the total, or it would
      // double-count exactly like the original pre-Color-Axes bug this
      // whole feature was built to fix. With fewer than 2 groups there's no
      // such ambiguity, so it falls back to the old flat "Custom" bucket
      // (always an independent extra color).
      addCustomColorRow() {
        const input = document.getElementById('productionCustomColorInput');
        const name = (input?.value || '').trim();
        if (!name) return;

        const checklistEl = document.getElementById('productionColorChecklist');
        if (!checklistEl) return;

        const exists = $$('#productionColorChecklist .production-color-row')
          .some(row => (row.dataset.color || '').toLowerCase() === name.toLowerCase());
        if (exists) {
          App.Utils.showToast(`"${name}" is already in this lot's checklist.`, true);
          return;
        }

        const groupSelect = document.getElementById('productionCustomColorGroupSelect');
        const selectedKey = (groupSelect && groupSelect.style.display !== 'none') ? groupSelect.value : '';
