            const k = String(e.axisKey || '').trim().toLowerCase();
            return axisPos.has(k) ? axisPos.get(k) : Number.MAX_SAFE_INTEGER;
          };
          const combos = primaryEntries.map(pe =>
            [pe].concat(independent).sort((a, b) => posOf(a) - posOf(b))
              .map(e => e.color).join(' / '));
          el.innerText = `Now producing: ${combos.join(', ')}`;
        }
      },

      // Loads the process's component recipe — Common rows plus, if colorGroup
      // is set, that color's sub-group rows too — and renders it into the
      // Components Consumed table, with suggested qty = qtyPerUnit x lot qty.
      // Used only by the legacy single-Qty path (no color sub-groups).
      async populateComponentsFromProcess(processId, colorGroup = '', seq) {
        this.clearComponentsTable();
        if (!processId) return;

        try {
          const res = await this._fetchProcessComponents(processId);
          if (seq !== undefined && seq !== this._compLoadSeq) return;
          const all = res.success ? (res.data || []) : [];
          const components = all.filter(c => !c.colorGroup || App.Utils.isCommonColorGroup(c.colorGroup) || App.Utils.sameText(c.colorGroup, colorGroup));
          const lotQty = toNumber(document.getElementById('productionQty')?.value) || 0;
          components.forEach(c => this.addComponentRow({
            itemName: c.itemName,
            size: c.size,
            narration: c.narration,
            sourceType: c.sourceType,
            qty: lotQty > 0 ? lotQty * c.qtyPerUnit : c.qtyPerUnit,
            qtyPerUnit: c.qtyPerUnit,
            unit: c.unit
          }));
          await this.refreshPoolAvailability();
        } catch (err) {
          if (seq === undefined || seq === this._compLoadSeq) App.Utils.showToast(err.message || 'Failed to load process recipe', true);
        }
      },

      // Recomputes recipe-derived rows' suggested qty (qtyPerUnit x multiplier)
      // for every row carrying a data-qty-per-unit, in the given tbody-scoped
      // selector. Manually added rows (no stored qtyPerUnit) are left untouched.
      _applyQtyPerUnit(rowSelector, multiplier) {
        document.querySelectorAll(rowSelector).forEach(row => {
          const qtyPerUnit = row.dataset.qtyPerUnit;
          if (qtyPerUnit === undefined || qtyPerUnit === '') return;
          const qtyInput = row.querySelector('.prod-comp-qty');
          if (qtyInput) qtyInput.value = this.formatQty(multiplier * toNumber(qtyPerUnit));
        });
      },

      // Recomputes recipe-derived rows' suggested qty (qtyPerUnit x lot qty)
      // whenever the lot Quantity field changes. Manually added rows (with no
      // stored qtyPerUnit) are left untouched.
      refreshSuggestedComponentQty() {
        const lotQty = toNumber(document.getElementById('productionQty')?.value) || 0;
        this._applyQtyPerUnit('#productionComponentsBody tr', lotQty);
      },

      // The lot-total multiplier currently in effect — the plain Qty field
      // in single-color mode, or the running total across checked colors
      // (see _currentLotTotalQty) once the multi-color checklist is active.
      // Used to give a freshly added manual component row (see
      // addComponentRow) an immediate, correctly-scaled starting qty instead
      // of leaving it blank until the next unrelated qty/color edit happens
      // to trigger a recompute.
      _currentComponentQtyMultiplier() {
        const wrapper = document.getElementById('productionColorWrapper');
        const isMultiColor = !!wrapper && wrapper.style.display !== 'none';
        return isMultiColor ? this._currentLotTotalQty() : (toNumber(document.getElementById('productionQty')?.value) || 0);
      },

      // Destroys Select2 instances on all component rows and empties the table.
      clearComponentsTable() {
        const tbody = document.getElementById('productionComponentsBody');
        if (!tbody) return;
        tbody.querySelectorAll('tr').forEach(row => this.destroyComponentItemSelect2(row));
        tbody.innerHTML = '';
      },

      // Builds the pre-selected <option> markup for a component row's item
      // picker from a saved {itemName, size, sourceType} — shared by the
      // Common table's addComponentRow and the Per-Color matrix's addMatrixItemRow.
      _buildItemPreselectOption(itemName, size, sourceType) {
        if (!itemName) return '';
        if (sourceType === 'POOL') {
          return `<option value="pool:${escapeHtml(itemName)}" selected data-name="${escapeHtml(itemName)}">${escapeHtml(itemName)}</option>`;
        }
        const items = App.State.globalItems || [];
        const matchIdx = items.findIndex(item =>
          App.Utils.sameText(item.name, itemName) && (App.Utils.sameText(size || '', item.size || '') || (!size && !item.size))
        );
        if (matchIdx >= 0) {
          const item = items[matchIdx];
          const label = `${item.name}${item.size ? ` [${item.size}]` : ''}`;
          return `<option value="${matchIdx}" selected data-name="${escapeHtml(item.name)}">${escapeHtml(label)}</option>`;
        }
        const label = `${itemName}${size ? ` [${size}]` : ''}`;
        return `<option value="custom:${escapeHtml(itemName)}" selected data-name="${escapeHtml(itemName)}">${escapeHtml(label)}</option>`;
      },

      // `comp.colorScope`, when set, locks this row's Color field to a
      // single real Color Master name (e.g. a Pool-sourced item that only
      // ever exists in one color, like "Fitted Rim" -> "Black") so the row
      // debits that exact Warehouse Pool bucket instead of the blank/COMMON
      // one — see _readProdComponentRow, which reads it via dataset.colorScope.
      addComponentRow(comp = null) {
        const tbody = document.getElementById('productionComponentsBody');
        if (!tbody) return;

        const rowId = 'prod_comp_row_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        const itemName = (comp && comp.itemName) || '';
        const size = (comp && comp.size) || '';
        const narration = (comp && comp.narration) || '';
        const sourceType = (comp && comp.sourceType === 'POOL') ? 'POOL' : 'ITEM';
        const color = (comp && comp.color) || '';
        const colorScope = (comp && comp.colorScope) || '';
        // comp === null means a brand-new row from "+ Add Component" — no
        // recipe or saved data behind it. Assume it consumes 1 unit of
        // itself per unit of lot output (same shape as a qtyPerUnit=1
        // recipe row) so it starts pre-filled at the current lot qty/color
        // total instead of blank, and keeps auto-tracking that total
        // afterward via _applyQtyPerUnit — same as every recipe-derived row.
        // Any other caller passing a comp object (even with qtyPerUnit
        // undefined, e.g. a saved lot's recorded consumption) keeps its
        // exact prior blank/fixed-qty behavior; that data is real and must
        // not be silently overwritten by a recompute.
        const qtyPerUnit = comp === null ? 1 : (comp && comp.qtyPerUnit);
        const manualMultiplier = comp === null ? this._currentComponentQtyMultiplier() : 0;
        const qty = comp === null
          ? this.formatQty(manualMultiplier > 0 ? manualMultiplier * qtyPerUnit : qtyPerUnit)
          : (comp && comp.qty !== undefined ? this.formatQty(comp.qty) : '');
        const qtyPerUnitAttr = (qtyPerUnit !== undefined) ? `data-qty-per-unit="${qtyPerUnit}"` : '';
        // Blank/undefined means "already in the item's own Base Unit" — see
        // _readProdComponentRow and module_stock.js#_getBilledAndConsumedQtyMaps.
        const unitAttr = (comp && comp.unit) ? ` data-unit="${escapeHtml(comp.unit)}"` : '';
        const colorScopeAttr = colorScope ? ` data-color-scope="${escapeHtml(colorScope)}"` : '';
        const preSelectedOption = this._buildItemPreselectOption(itemName, size, sourceType);
        const colorReadonlyAttrs = colorScope ? ' readonly title="This item only exists in this one Warehouse Pool color — fixed automatically"' : '';

        const rowHtml = `
      <tr id="${rowId}" ${qtyPerUnitAttr}${unitAttr}${colorScopeAttr}>
        <td>
          <select class="form-select prod-comp-item-select" required>
            <option value=""></option>
            ${preSelectedOption}
          </select>
        </td>
        <td><input type="text" class="form-control prod-comp-size" value="${escapeHtml(size)}" placeholder="-" onchange="App.Production.handleProdSizeChange(this)"></td>
        <td><input type="text" class="form-control prod-comp-narration" value="${escapeHtml(narration)}" placeholder="-"></td>
        <td><input type="text" class="form-control prod-comp-color" list="colorList" value="${escapeHtml(color)}" placeholder="All colors"${colorReadonlyAttrs}></td>
        <td>
          <select class="form-select prod-comp-source" onchange="App.Production.handleSourceChange(this)">
            <option value="ITEM" ${sourceType === 'ITEM' ? 'selected' : ''}>Item (Stock)</option>
            <option value="POOL" ${sourceType === 'POOL' ? 'selected' : ''}>Pool (Warehouse)</option>
          </select>
        </td>
        <td><input type="number" class="form-control text-end prod-comp-qty" step="any" value="${qty}" required></td>
        <td class="prod-comp-available text-muted small">-</td>
        <td class="text-center"><button type="button" class="btn btn-outline-danger btn-sm" onclick="App.Production.removeComponentRow('${rowId}')">✕</button></td>
      </tr>
    `;
        tbody.insertAdjacentHTML('beforeend', rowHtml);
        this.initComponentItemSelect2(document.getElementById(rowId));
      },

      removeComponentRow(rowId) {
        const row = document.getElementById(rowId);
        if (row) {
          this.destroyComponentItemSelect2(row);
          row.remove();
        }
      },

      // ── Per-Color Components matrix ──────────────────────────────────────
      // One row per item slot, one quantity column per color in the current
      // batch. Columns are added/removed only when the checked-color SET
      // changes (handleColorCheckToggle) — existing rows/cells for other
      // colors, and any manually added row, are never wiped out by it.

      showColorMatrix() {
        const el = document.getElementById('productionColorMatrixWrapper');
        if (el) el.style.display = '';
      },

      hideColorMatrix() {
        const el = document.getElementById('productionColorMatrixWrapper');
        if (el) el.style.display = 'none';
        const groupsEl = document.getElementById('productionPoolColorGroupsWrapper');
        if (groupsEl) groupsEl.style.display = 'none';
        this.clearColorMatrix();
      },

      clearColorMatrix() {
        const tbody = document.getElementById('productionColorMatrixBody');
        if (tbody) {
          tbody.querySelectorAll('tr').forEach(row => this.destroyComponentItemSelect2(row));
          tbody.innerHTML = '';
        }
        const groupsContainer = document.getElementById('productionPoolColorGroupsContainer');
        if (groupsContainer) {
          groupsContainer.querySelectorAll('tr').forEach(row => this.destroyComponentItemSelect2(row));
          groupsContainer.innerHTML = '';
        }
        const headerRow = document.getElementById('productionColorMatrixHeaderRow');
        if (headerRow) {
          Array.from(headerRow.querySelectorAll('th[data-color]')).forEach(th => th.remove());
        }
        this._syncMatrixTableMinWidth();
      },

      // Keeps the Per-Color Components table's inline min-width matching
      // its actual color column count — see _buildPoolColorGroupTable's
      // comment for why table-layout: fixed needs this set explicitly
      // instead of just growing on its own.
      _syncMatrixTableMinWidth() {
        const headerRow = document.getElementById('productionColorMatrixHeaderRow');
        const table = headerRow?.closest('table');
        if (!table) return;
        const colorCount = headerRow.querySelectorAll('th[data-color]').length;
        table.style.minWidth = (this.PROD_COLOR_TABLE_FIXED_RESERVE_PX + colorCount * this.PROD_COLOR_TABLE_COLOR_COL_PX) + 'px';
      },

      // [{ color, index }] for every color column currently in the matrix header.
      getMatrixColors() {
        const headerRow = document.getElementById('productionColorMatrixHeaderRow');
        if (!headerRow) return [];
        return Array.from(headerRow.children)
          .map((th, index) => ({ color: th.dataset.color, index }))
          .filter(c => c.color);
      },

      getMatrixColumnIndex(color) {
        const headerRow = document.getElementById('productionColorMatrixHeaderRow');
        if (!headerRow) return -1;
        return Array.from(headerRow.children).findIndex(th => App.Utils.sameColor(th.dataset.color, color));
      },

      // The Per-Color matrix's column identity is color-string-only, shared
      // across every Color Axis (see getMatrixColumnIndex/addMatrixColorColumn
      // above) — a real composite (axis, color) column identity would close
      // this for good, but is a much larger refactor (~10 more call sites,
      // real regression risk — see bug_pool_table_color_leak_and_double_count
      // in project memory). This detects the one genuinely ambiguous
      // situation — two independent axes both having this exact color name
      // CHECKED at the same time — so onColorQtyChanged can back off instead
      // of overwriting the shared column with the wrong axis's basis.
      _isColorCheckedUnderMultipleAxes(color) {
        const colorLower = String(color || '').toLowerCase();
        const axisKeys = new Set();
        this.getCheckedColorQtys().forEach(cc => {
          if ((cc.color || '').toLowerCase() === colorLower) axisKeys.add(cc.axisKey || '');
        });
        return axisKeys.size > 1;
      },

      // Builds one color cell's contents for a matrix row: a merged row gets
      // its own item picker + qty input (since this color's real item is
      // independent of every other color's), a manual (select-driven) row
      // just gets a plain qty input (its one item-select already applies to
      // every color cell).
      _buildMatrixColorCell(isMerged) {
        const td = document.createElement('td');
        if (isMerged) {
          td.innerHTML = '<select class="form-select form-select-sm prod-comp-item-select mb-1"><option value=""></option></select>'
            + '<input type="number" class="form-control form-control-sm text-end matrix-qty" step="any" value="">';
        } else {
          const input = document.createElement('input');
          input.type = 'number';
          input.className = 'form-control text-end matrix-qty';
          input.step = '0.0001';
          td.appendChild(input);
        }
        return td;
      },

      // Header TEXT for the Per-Color Components columns. The column stays
      // KEYED by the full composite (th.dataset.color) — that is the lot's
      // real color identity, what gets saved as each component's Color
      // Sub-Group and what the matrix is re-matched against when the lot is
      // reopened — but the operator does not need to read the parts that
      // every column shares. With Blue-White / BCP, Pink-White / BCP,
      // Purple-White / BCP and Red-White / BCP all checked, "BCP" is
      // context, not identity: the columns read Blue-White, Pink-White,
      // Purple-White, Red-White, and the full composite stays available on
      // hover. Nothing is dropped from the data, only from the label.
      //
      // Recomputed on every add/remove because which segments are shared
      // depends on the whole checked set. A single column has nothing to
      // differentiate against, so it keeps its full composite.
      _refreshMatrixColumnLabels() {
        const headerRow = document.getElementById('productionColorMatrixHeaderRow');
        if (!headerRow) return;
        const ths = Array.from(headerRow.querySelectorAll('th[data-color]'));
        const segLists = ths.map(th => String(th.dataset.color || '')
          .split(' / ').map(x => x.trim()).filter(Boolean));
        const commonLower = new Set();
        if (segLists.length > 1) {
          segLists[0].forEach(seg => {
            const segLower = seg.toLowerCase();
            if (segLists.every(list => list.some(x => x.toLowerCase() === segLower))) commonLower.add(segLower);
          });
        }
        ths.forEach((th, i) => {
          const kept = segLists[i].filter(x => !commonLower.has(x.toLowerCase()));
          th.textContent = kept.length > 0 ? kept.join(' / ') : String(th.dataset.color || '');
          th.title = String(th.dataset.color || '');
        });
      },

      addMatrixColorColumn(color) {
        if (this.getMatrixColumnIndex(color) !== -1) return;
        const headerRow = document.getElementById('productionColorMatrixHeaderRow');
        if (!headerRow) return;

        const th = document.createElement('th');
        th.dataset.color = color;
        th.style.textAlign = 'right';
        th.textContent = color;
        headerRow.insertBefore(th, headerRow.lastElementChild);

        document.querySelectorAll('#productionColorMatrixBody tr').forEach(row => {
          const isMerged = row.dataset.merged === 'true';
          const td = this._buildMatrixColorCell(isMerged);
          row.insertBefore(td, row.lastElementChild);
          if (isMerged) this.initMergedCellItemSelect2(td.querySelector('.prod-comp-item-select'));
        });
        this._refreshMatrixColumnLabels();
        this._syncMatrixTableMinWidth();
      },

      removeMatrixColorColumn(color) {
        // Another axis's own same-named color may still be checked (two
        // independent axes can legitimately share a literal color name,
        // e.g. a Rim axis and a Frame axis both having "Purple") — this
        // matrix's column is shared (keyed by color string only, see
        // getMatrixColumnIndex), so removing it here whenever THIS axis's
        // row gets unchecked would wipe cells still in use by that other,
        // still-checked axis. By the time this fires, the row that was just
        // unchecked no longer shows up in getCheckedColorQtys(), so "still
        // checked" here can only mean a different row/axis needs it.
        const colorLower = String(color || '').toLowerCase();
        const stillCheckedElsewhere = this.getCheckedColorQtys().some(cc => (cc.color || '').toLowerCase() === colorLower);
        if (stillCheckedElsewhere) return;

        this._removeMatrixColumnAt(this.getMatrixColumnIndex(color));
      },

      // Raw "drop column N" — no still-checked-elsewhere guard, so callers
      // that have already decided a column must go (removeMatrixColorColumn
      // above, _pruneRedundantMatrixColumns below) share one implementation.
      _removeMatrixColumnAt(idx) {
        if (idx === -1) return;
        const headerRow = document.getElementById('productionColorMatrixHeaderRow');
        if (headerRow?.children[idx]) headerRow.children[idx].remove();
        document.querySelectorAll('#productionColorMatrixBody tr').forEach(row => {
          const cell = row.children[idx];
          if (!cell) return;
          const selectEl = cell.querySelector('.prod-comp-item-select');
          if (selectEl && window.jQuery?.fn?.select2 && window.jQuery(selectEl).data('select2')) {
            window.jQuery(selectEl).select2('destroy');
          }
          cell.remove();
        });
        this._refreshMatrixColumnLabels();
        this._syncMatrixTableMinWidth();
      },

      // A non-primary Color Axis row that segment-matches a checked primary
      // row (e.g. a "Blue" mudguard auto-checked by a "Blue-White / BCP"
      // frame — see _syncMatchingNonPrimaryRows) describes the SAME physical
      // units as its primary counterpart. It must not also get its own
      // Per-Color Components column: the operator is left staring at one
      // duplicate column per matched color, and anything typed into one
      // debits stock a second time for units the primary column already
      // accounts for.
      //
      // Their real consumption lives in that axis's own Per-Process Pool
      // Components table instead. But a non-primary axis CAN still carry
      // genuinely color-specific non-pool recipe rows — a recipe row tagged
      // colorGroup "Blue" only ever matches a plain "Blue" column, never the
      // composite (see _matchedColorToken) — so this prunes only columns
      // that came back COMPLETELY empty from populateColorMatrixForColors:
      // no item picked, no quantity in any row. A column the recipe (or the
      // operator) actually put something in is always left alone.
      _pruneRedundantMatrixColumns() {
        const checked = $$('#productionColorChecklist .production-color-row')
          .filter(row => row.querySelector('.production-color-check')?.checked);

        checked
          .filter(row => row.dataset.primary === 'false')
          .map(row => row.dataset.color)
          // A primary row — or a flat/legacy row, which carries no
          // data-primary at all (see renderColorChecklistRows) — owning this
          // same column name means the column is genuinely that row's, so
          // it stays no matter what this non-primary row is doing.
          .filter(color => !checked.some(r =>
            r.dataset.primary !== 'false' && App.Utils.sameColor(r.dataset.color, color)))
          .filter(color => this._matchingPrimaryColorQty(color) !== null)
          .forEach(color => {
            const idx = this.getMatrixColumnIndex(color);
            if (idx === -1) return;
            const used = $$('#productionColorMatrixBody tr').some(row => {
              const cell = row.children[idx];
              if (!cell) return false;
              const qtyEl = cell.querySelector('.matrix-qty');
              const itemEl = cell.querySelector('.prod-comp-item-select');
              return !!(qtyEl && String(qtyEl.value).trim()) || !!(itemEl && itemEl.value);
            });
            if (!used) this._removeMatrixColumnAt(idx);
          });
      },

      // Finds an existing MERGED row (see addMergedMatrixRow) for the given
      // stripped display name + size (case-insensitive).
      findMatrixRowByDisplayName(displayName, size) {
        const key = `${displayName}|${size || ''}`.toLowerCase();
        return $$('#productionColorMatrixBody tr').find(row => {
          if (row.dataset.merged !== 'true') return false;
          const rowName = row.querySelector('.prod-comp-display-name')?.value.trim() || '';
          const rowSize = row.querySelector('.prod-comp-size')?.value.trim() || '';
          return `${rowName}|${rowSize}`.toLowerCase() === key;
        });
      },

      // Adds a "merged" item-slot row for a color-specific recipe component
      // whose color name has been stripped from its display name (see
      // _stripColorSubstring) — used so the same physical component recurring
      // across colors under different literal item names (e.g.
      // "Frame---Red" / "Frame---Blue") collapses into a single row instead
      // of one per color. The Item/Pool Name column is just a read-only
      // label for the row; each color cell gets its OWN real item picker
      // (Select2) + qty input, since each color secretly uses a different
      // literal item — see _setMergedCellItem for how a cell's picker gets
      // pre-selected. Contrast with addMatrixItemRow, used for manually
      // added rows that ARE one real item the operator explicitly picked
      // and that applies to every color cell.
      addMergedMatrixRow(comp = null) {
        const tbody = document.getElementById('productionColorMatrixBody');
        if (!tbody) return null;

        const rowId = 'prod_matrix_row_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        const itemName = (comp && comp.itemName) || '';
        const size = (comp && comp.size) || '';
        const narration = (comp && comp.narration) || '';
        const sourceType = (comp && comp.sourceType === 'POOL') ? 'POOL' : 'ITEM';
        const colors = this.getMatrixColors();

        const colorCellsHtml = colors
          .map(() => '<td><select class="form-select form-select-sm prod-comp-item-select mb-1"><option value=""></option></select>'
            + '<input type="number" class="form-control form-control-sm text-end matrix-qty" step="any" value=""></td>')
          .join('');

        const rowHtml = `
      <tr id="${rowId}" data-merged="true">
        <td><input type="text" class="form-control prod-comp-display-name" value="${escapeHtml(itemName)}" readonly title="Merged across colors — each color cell below has its own item picker"></td>
        <td><input type="text" class="form-control prod-comp-size" value="${escapeHtml(size)}" placeholder="-"></td>
        <td><input type="text" class="form-control prod-comp-narration" value="${escapeHtml(narration)}" placeholder="-" title="Shared across this row's colors, even though each color cell may secretly use a different literal item"></td>
        <td>
          <select class="form-select prod-comp-source" onchange="App.Production.handleMergedSourceChange(this)">
            <option value="ITEM" ${sourceType === 'ITEM' ? 'selected' : ''}>Item (Stock)</option>
            <option value="POOL" ${sourceType === 'POOL' ? 'selected' : ''}>Pool (Warehouse)</option>
          </select>
        </td>
        ${colorCellsHtml}
        <td class="text-center"><button type="button" class="btn btn-outline-danger btn-sm" onclick="App.Production.removeMatrixRow('${rowId}')">✕</button></td>
      </tr>
    `;
        tbody.insertAdjacentHTML('beforeend', rowHtml);
        const rowEl = document.getElementById(rowId);
        colors.forEach(({ index }) => {
          this.initMergedCellItemSelect2(rowEl.children[index]?.querySelector('.prod-comp-item-select'));
        });
        return rowEl;
      },

      // Pre-selects a merged row's color cell to a specific literal item and
      // sets its quantity — `itemComp` is {itemName, size, sourceType} for
      // THIS color only (the row's Size/Source stay shared/descriptive;
      // what's actually saved per color comes from the cell's own select).
      _setMergedCellItem(cell, itemComp, qty, qtyPerUnit) {
        if (!cell) return;
        const selectEl = cell.querySelector('.prod-comp-item-select');
        const qtyInput = cell.querySelector('.matrix-qty');

        if (selectEl) {
          const sourceType = (itemComp.sourceType === 'POOL') ? 'POOL' : 'ITEM';
          const option = this._buildItemPreselectOption(itemComp.itemName || '', itemComp.size || '', sourceType);
          selectEl.innerHTML = `<option value=""></option>${option}`;
          if (window.jQuery?.fn?.select2 && window.jQuery(selectEl).data('select2')) {
            window.jQuery(selectEl).trigger('change.select2');
          }
        }
        if (qtyInput) {
          if (qtyPerUnit !== undefined) qtyInput.dataset.qtyPerUnit = qtyPerUnit;
          qtyInput.value = qty !== undefined ? this.formatQty(qty) : '';
        }
      },

      // Fired when a merged row's Source changes — Stock item names and
      // Warehouse Pool output names are different namespaces, so every
      // color cell's current picker selection is cleared (each one's list
      // depends on this same row-level Source).
      handleMergedSourceChange(selectEl) {
        const row = selectEl.closest('tr');
        row?.querySelectorAll('.prod-comp-item-select').forEach(sel => {
          if (window.jQuery?.fn?.select2) window.jQuery(sel).val(null).trigger('change');
        });
        const sizeInput = row?.querySelector('.prod-comp-size');
        if (sizeInput) sizeInput.value = '';
        const narrationInput = row?.querySelector('.prod-comp-narration');
        if (narrationInput) narrationInput.value = '';
      },

      // Manually appends a blank Per-Color row with a real item picker
      // (Select2) — unlike the recipe-populated merged rows above, this is a
      // single real item the operator explicitly chooses, used as-is for
      // every color cell they fill in (e.g. a shared trim that isn't itself
      // colored). Wired to the "+ Add Per-Color Component" button.
      addColorMatrixRow() {
        this.addMatrixItemRow();
      },

      // Adds a new item-slot row with one empty quantity cell per current color column.
      addMatrixItemRow(comp = null) {
        const tbody = document.getElementById('productionColorMatrixBody');
        if (!tbody) return null;

        const rowId = 'prod_matrix_row_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        const itemName = (comp && comp.itemName) || '';
        const size = (comp && comp.size) || '';
        const narration = (comp && comp.narration) || '';
        const sourceType = (comp && comp.sourceType === 'POOL') ? 'POOL' : 'ITEM';
        const preSelectedOption = this._buildItemPreselectOption(itemName, size, sourceType);

        const colorCellsHtml = this.getMatrixColors()
          .map(() => `<td><input type="number" class="form-control text-end matrix-qty" step="any" value=""></td>`)
          .join('');

        const rowHtml = `
      <tr id="${rowId}">
        <td>
          <select class="form-select prod-comp-item-select" required>
            <option value=""></option>
            ${preSelectedOption}
          </select>
        </td>
        <td><input type="text" class="form-control prod-comp-size" value="${escapeHtml(size)}" placeholder="-" onchange="App.Production.handleProdSizeChange(this)"></td>
        <td><input type="text" class="form-control prod-comp-narration" value="${escapeHtml(narration)}" placeholder="-"></td>
        <td>
          <select class="form-select prod-comp-source" onchange="App.Production.handleMatrixSourceChange(this)">
            <option value="ITEM" ${sourceType === 'ITEM' ? 'selected' : ''}>Item (Stock)</option>
            <option value="POOL" ${sourceType === 'POOL' ? 'selected' : ''}>Pool (Warehouse)</option>
          </select>
        </td>
        ${colorCellsHtml}
        <td class="text-center"><button type="button" class="btn btn-outline-danger btn-sm" onclick="App.Production.removeMatrixRow('${rowId}')">✕</button></td>
      </tr>
    `;
        tbody.insertAdjacentHTML('beforeend', rowHtml);
        const rowEl = document.getElementById(rowId);
        this.initComponentItemSelect2(rowEl);
        return rowEl;
      },

      removeMatrixRow(rowId) {
        const row = document.getElementById(rowId);
        if (row) {
          this.destroyComponentItemSelect2(row);
          row.remove();
        }
      },

      handleMatrixSourceChange(selectEl) {
        const row = selectEl.closest('tr');
        const itemSelect = row?.querySelector('.prod-comp-item-select');
        if (itemSelect && window.jQuery?.fn?.select2) {
          window.jQuery(itemSelect).val(null).trigger('change');
        }
        const sizeInput = row?.querySelector('.prod-comp-size');
        if (sizeInput) sizeInput.value = '';
        const narrationInput = row?.querySelector('.prod-comp-narration');
        if (narrationInput) narrationInput.value = '';
      },

      // Finds an existing non-merged matrix row (one real shared item-select
      // for the whole row, see addMatrixItemRow) for the given item name +
      // size, case-insensitive. Used to find-or-create a single row for a
      // pool-color-aware component (same literal item across every color,
      // just a different quantity per color) instead of giving it its own
      // per-cell item picker like a merged row would.
      findMatrixItemRowByName(itemName, size) {
        const key = `${(itemName || '').trim()}|${(size || '').trim()}`.toLowerCase();
        return $$('#productionColorMatrixBody tr').find(row => {
          if (row.dataset.merged === 'true') return false;
          const itemSelect = row.querySelector('.prod-comp-item-select');
          if (!itemSelect || itemSelect.value === '') return false;
          const opt = itemSelect.options[itemSelect.selectedIndex];
          const rowItemName = (opt.dataset.name || opt.textContent || '').trim();
          const rowSize = row.querySelector('.prod-comp-size')?.value.trim() || '';
          return `${rowItemName}|${rowSize}`.toLowerCase() === key;
        });
      },

      // Sets one color cell's quantity on a non-merged matrix row (plain
      // qty input, no per-cell item picker — see addMatrixItemRow).
      _setItemRowColorQty(row, colIndex, qty, qtyPerUnit) {
        const input = row?.children[colIndex]?.querySelector('.matrix-qty');
        if (!input) return;
        if (qtyPerUnit !== undefined) input.dataset.qtyPerUnit = qtyPerUnit;
        input.value = qty !== undefined ? this.formatQty(qty) : '';
      },

      // Fills/creates this color's column in the matrix from the process's
      // recipe for that color sub-group, suggested at qtyPerUnit x that
      // color's own quantity. Existing rows for other colors are untouched.
      // Single-color convenience wrapper around populateColorMatrixForColors
      // — used by the individual per-color checkbox toggle.
      async populateColorMatrixForColor(color, seq, axisKey) {
        const processId = document.getElementById('productionProcessId')?.value;
        if (!processId) return;
        await this.populateColorMatrixForColors(processId, [color], seq, axisKey);
        if (seq !== undefined && seq !== this._compLoadSeq) return;
        await this.refreshPoolAvailability();
      },

      // Same as populateColorMatrixForColor, but for several colors at once
      // (e.g. a group's "select all" checkbox) — fetches the recipe ONCE and
      // fills every given color's column/cells from it, instead of repeating
      // a full round-trip per color (which is what caused the visible lag
      // when toggling a whole group). Pool-color-aware components (genuinely
      // multi-color in the Warehouse Pool) live in their own Per-Process Pool
      // Components tables instead (see renderPoolColorSplitGroups) —
      // refreshPoolColorGroupCells updates their suggested qty for each
      // color without touching the main matrix at all. Caller is
      // responsible for the (single) refreshPoolAvailability afterward.
      // Which part of `color` a recipe row's Color Sub-Group names, or null
      // if it names none of it. A checked color is often a COMPOSITE of the
      // axes this lot combines ("Blue-White / BCP"), while a recipe's
      // color-specific rows are tagged with ONE axis's own color
      // ("Blue-White", or "BCP"). Matching the whole composite string
      // against colorGroup therefore never hit, so checking a composite
      // color added its column to the Per-Color Components table and then
      // populated nothing into it — the table looked like it emptied itself
      // whenever the colors changed.
      //
      // Both tokens of a composite legitimately apply at once: a lot
      // producing "Blue-White / BCP" consumes the frame-color-specific parts
      // AND the rim-color-specific parts. This mirrors saveProduction's own
      // rule server-side, which already accepts a component scoped to any
      // single axis token of a breakdown color (module_production.js).
      //
      // Returns the matched token rather than a boolean so the caller can
      // strip THAT token from the item's display name (see
      // _stripColorSubstring) instead of the full composite, which would
      // never be found inside an item name like "Frame---Blue-White".
      _matchedColorToken(colorGroup, color) {
        const cg = String(colorGroup || '').trim();
        if (!cg) return null;
        if (App.Utils.sameColor(cg, color)) return String(color || '').trim();
        const segments = String(color || '').split(' / ').map(x => x.trim()).filter(Boolean);
        return segments.find(seg => App.Utils.sameColor(seg, cg)) || null;
      },

      async populateColorMatrixForColors(processId, colors, seq, axisKey) {
        if (!processId || !colors || colors.length === 0) return;

        try {
          const res = await this._fetchProcessComponents(processId);
          // A newer call (Process switched, or a different lot opened for
          // edit) has since bumped the counter — stop before painting this
          // stale response's items/qtys into whatever now occupies the
          // shared matrix DOM (see _compLoadSeq's doc comment).
          if (seq !== undefined && seq !== this._compLoadSeq) return;
          const all = res.success ? (res.data || []) : [];
          const commonOverrideComps = this._getCommonItemsWithColorOverride(all);
          const sharedItemKeys = this._sharedItemSlotKeys(all);

          colors.forEach(color => {
            const colIndex = this.getMatrixColumnIndex(color);
            // Scoped to THIS axis (see _axisScopedCheckedColorQtys) — a bare
            // `.find(c => c.color === color)` over EVERY checked row always
            // resolved to the FIRST same-named row regardless of axis (see
            // bug_axis_color_name_collision_qty in project memory), so
            // toggling/quantifying one axis's color could silently populate
            // recipe quantities from a DIFFERENT axis's coincidentally
            // same-named row instead.
            const thisColorQty = (this._axisScopedCheckedColorQtys(axisKey).find(c => App.Utils.sameColor(c.color, color)) || {}).qty || 0;

            if (colIndex !== -1) {
              // Explicitly color-tagged recipe rows may be genuinely
              // different literal items per color (e.g. "Frame---Red" /
              // "Frame---Blue") — keep those on merged rows, one real item
              // picker per color cell.
              const colorComps = all
                .map(c => ({ comp: c, token: this._matchedColorToken(c.colorGroup, color) }))
                .filter(x => x.token)
                .map(({ comp, token }) => ({
                  ...comp,
                  displayName: sharedItemKeys.has(this._itemSlotKey(comp.itemName, comp.size))
                    ? (comp.itemName || '').trim()
                    : this._stripColorSubstring(comp.itemName || '', token)
                }));

              colorComps.forEach(c => {
                let row = this.findMatrixRowByDisplayName(c.displayName, c.size || '');
                if (!row) row = this.addMergedMatrixRow({ itemName: c.displayName, size: c.size, sourceType: c.sourceType, narration: c.narration });
                const cell = row.children[colIndex];
                const qty = thisColorQty > 0 ? thisColorQty * c.qtyPerUnit : c.qtyPerUnit;
                this._setMergedCellItem(cell, { itemName: c.itemName, size: c.size, sourceType: c.sourceType }, qty, c.qtyPerUnit);
              });

              // A Common item that's the same physical item as one of this
              // color's siblings elsewhere in the recipe (see
              // _getCommonItemsWithColorOverride) gets ITS OWN per-color
              // quantity here too, for every color that doesn't already have
              // an explicit override above — instead of being left as a
              // separate flat Common Components row.
              const overriddenKeys = new Set(colorComps.map(c => this._itemSlotKey(c.displayName, c.size)));
              commonOverrideComps.forEach(c => {
                if (overriddenKeys.has(this._itemSlotKey(c.itemName, c.size))) return;
                let row = this.findMatrixRowByDisplayName(c.itemName, c.size || '');
                if (!row) row = this.addMergedMatrixRow({ itemName: c.itemName, size: c.size, sourceType: c.sourceType, narration: c.narration });
                const cell = row.children[colIndex];
                const qty = thisColorQty > 0 ? thisColorQty * c.qtyPerUnit : c.qtyPerUnit;
                this._setMergedCellItem(cell, { itemName: c.itemName, size: c.size, sourceType: c.sourceType }, qty, c.qtyPerUnit);
              });
            }

            this.refreshPoolColorGroupCells(color, thisColorQty, axisKey);
          });
        } catch (err) {
          App.Utils.showToast(err.message || 'Failed to load process recipe', true);
        }
      },

      // Updates every Per-Process Pool Components table's cell for one
      // color (a column only exists there if that group's item set actually
      // has stock in that color — see renderPoolColorSplitGroups), to
      // qtyPerUnit x the SUM of every checked color sharing that column.
      // Fired on checkbox toggle and on that color's own Qty input changing.
      // `color` may be a composite of 2+ independent pool axes (e.g.
      // "BCP / Blue-White" — see COLOR_COMBO_DELIMITER in config.js) when
      // this process draws from multiple independently-colored pool inputs
      // at once; each axis table only ever has columns for its OWN literal
      // colors (e.g. just BCP/Black for a Fitted Rim), so one column (e.g.
      // "Blue-White") is shared by every composite color that pairs it with
      // a different value on the other axis (both "BCP / Blue-White" and
      // "Black / Blue-White" draw from the same Blue-White pool bucket).
      // The cell must therefore be the SUM of every currently checked color
      // whose own tokens include that column, not just whichever single
      // color triggered this refresh — otherwise checking/editing a later
      // color overwrites the total instead of adding to it.
      //
      // `axisKey` (the row that actually changed — see onColorQtyChanged/
      // handleColorCheckToggle/toggleColorGroup) scopes this per TABLE, via
      // each table's own stamped data-axis-key (see _buildPoolColorGroupTable/
      // _axisKeyForPoolItemNames): a table whose resolved axis differs from
      // the changed row's axis is skipped entirely, and the sum for a table
      // that IS touched only ever draws from ITS OWN axis's checked rows.
      // Without this, editing e.g. a Rim axis's "Purple" qty summed a
      // coincidentally same-named Frame axis "Purple" row into BOTH tables'
      // cells — silently inflating the suggested (and, if unnoticed,
      // actually submitted) Warehouse Pool consumption for whichever table
      // was touched. A table with no resolved axis (legacy/single-axis
      // process) is never skipped and stays fully unscoped, unchanged from
      // the original behavior.
      refreshPoolColorGroupCells(color, colorQty, axisKey) {
        const container = document.getElementById('productionPoolColorGroupsContainer');
        if (!container) return;
        const changedLower = String(color || '').trim().toLowerCase();
        const tokensLower = (color || '').split(' / ').map(t => t.trim().toLowerCase()).filter(Boolean);
        container.querySelectorAll('table.prod-color-table').forEach(table => {
          const tableAxisKey = table.dataset.axisKey || '';
          if (axisKey && tableAxisKey && axisKey !== tableAxisKey) return;
          const checkedColorQtys = this._axisScopedCheckedColorQtys(tableAxisKey);
          table.querySelectorAll('.pool-group-qty').forEach(input => {
            const inputColorLower = (input.dataset.color || '').trim().toLowerCase();
            // A column naming the changed color exactly is the one to update
            // when this table's columns ARE the checked colors; otherwise
            // fall back to the token relationship (see _poolGroupCellValue).
            const isExactColumn = inputColorLower === changedLower;
            if (!isExactColumn && !tokensLower.includes(inputColorLower)) return;
            const qtyPerUnit = input.dataset.qtyPerUnit;
            if (qtyPerUnit === undefined || qtyPerUnit === '') return;
            const exactTotal = checkedColorQtys.reduce(
              (sum, cc) => (String(cc.color || '').trim().toLowerCase() === inputColorLower ? sum + cc.qty : sum), 0);
            const total = exactTotal > 0 ? exactTotal : checkedColorQtys.reduce((sum, cc) => {
              const ccTokens = (cc.color || '').split(' / ').map(t => t.trim().toLowerCase()).filter(Boolean);
              return ccTokens.includes(inputColorLower) ? sum + cc.qty : sum;
            }, 0);
            input.value = total > 0 ? this.formatQty(total * toNumber(qtyPerUnit)) : '';
          });
        });
      },

      // Reads the Per-Color matrix into flat {itemName, size, color, sourceType,
      // qty, colorGroup} entries — one per non-blank cell — for submission
      // alongside the Common table's serializeComponentsConsumed() output.
      // A merged row (see addMergedMatrixRow) has no single item identity:
      // each color cell has its OWN item-select, read independently here, so
      // Stock/Pool still debits the correct literal item per color despite
      // the rows being collapsed for display. A manual row (addMatrixItemRow)
      // uses its one real item-select for every color cell, same as before.
      serializeColorMatrix() {
        const components = [];
        const headerColors = this.getMatrixColors();
        document.querySelectorAll('#productionColorMatrixBody tr').forEach(row => {
          const isMerged = row.dataset.merged === 'true';
          const size = row.querySelector('.prod-comp-size')?.value.trim() || '';
          // One shared Narration per row, even for a merged row whose color
          // cells are secretly different literal items — same simplification
          // as the row's own read-only display name (see addMergedMatrixRow).
          const narration = row.querySelector('.prod-comp-narration')?.value.trim() || '';
          const sourceType = row.querySelector('.prod-comp-source')?.value === 'POOL' ? 'POOL' : 'ITEM';

          let rowItemName = '';
          if (!isMerged) {
            const itemSelect = row.querySelector('.prod-comp-item-select');
            if (!itemSelect || itemSelect.value === '') return;
            const itemOpt = itemSelect.options[itemSelect.selectedIndex];
            rowItemName = (itemOpt.dataset.name || itemOpt.textContent || '').trim();
            if (!rowItemName) return;
          }

          headerColors.forEach(({ color, index }) => {
            const cell = row.children[index];
            const qtyInput = cell?.querySelector('.matrix-qty');
            // An untouched cell (blank) is skipped, not counted as an
            // explicit zero — toNumber('') is 0, indistinguishable from a
            // typed "0", so the skip decision must be made on the raw text
            // instead. A typed 0 or negative value IS kept (correction/
            // reversal consumption, mirroring the output qty's own
            // zero/negative handling).
            if (!qtyInput || qtyInput.value.trim() === '') return;
            const qty = toNumber(qtyInput.value);

            let itemName = rowItemName;
            if (isMerged) {
              const cellSelect = cell?.querySelector('.prod-comp-item-select');
              if (!cellSelect || cellSelect.value === '') return;
              const cellOpt = cellSelect.options[cellSelect.selectedIndex];
              itemName = (cellOpt.dataset.name || cellOpt.textContent || '').trim();
            }
            if (!itemName) return;
            components.push({ itemName, size, narration, color: '', sourceType, qty, colorGroup: color });
          });
        });
        return components;
      },

      // Reads every Per-Process Pool Components table (see
      // renderPoolColorSplitGroups) into the same flat
      // {itemName, size, color, sourceType, qty, colorGroup} shape as
      // serializeColorMatrix — one entry per non-blank cell, colorGroup set
      // to that cell's column color so the save path debits the matching
      // Warehouse Pool bucket.
      serializePoolColorGroups() {
        const components = [];
        document.querySelectorAll('#productionPoolColorGroupsContainer tbody tr').forEach(row => {
          const itemSelect = row.querySelector('.prod-comp-item-select');
          if (!itemSelect || itemSelect.value === '') return;
          const itemOpt = itemSelect.options[itemSelect.selectedIndex];
          const itemName = (itemOpt.dataset.name || itemOpt.textContent || '').trim();
          if (!itemName) return;
          const size = row.querySelector('.prod-comp-size')?.value.trim() || '';
          const narration = row.querySelector('.prod-comp-narration')?.value.trim() || '';

          row.querySelectorAll('.pool-group-qty').forEach(input => {
            // See serializeColorMatrix's matching comment — blank is
            // skipped, but a typed 0 or negative value is kept.
            if (input.value.trim() === '') return;
            const qty = toNumber(input.value);
            const color = input.dataset.color || '';
            if (!color) return;
            components.push({ itemName, size, narration, color: '', sourceType: 'POOL', qty, colorGroup: color });
          });
        });
        return components;
      },

      // Populates the Common table + Per-Color matrix directly from a saved
      // lot's actual recorded Components Consumed (not recipe defaults) —
      // used when editing an existing multi-color batch. A legacy lot saved
      // before this item was recognized as pool-color-aware (one combined
      // Common-tagged row, e.g. "Painted Frame" at the full lot qty) is
      // upgraded on the fly: its quantity is split evenly across this lot's
      // colors as a starting point in the matrix instead of staying flat —
      // the operator should adjust each color's cell to what was actually
      // used, then re-save to fix this lot's stored data going forward.
      async populateComponentsConsumedDirect(components, breakdown) {
        // `breakdown` is a colorBreakdown array — {color, qty} objects, NOT
        // color-name strings. filter(Boolean) because an entry can legitimately
        // reach here with no color name (the same guard the caller applies when
        // it builds breakdownColors): such an entry can't be matched by any
        // component's colorGroup and can't be rendered as a column, so it must
        // not become an `undefined` matrix column. lotTotalQty deliberately
        // still counts every entry — it is the lot's total quantity, and
        // dropping a malformed entry's qty from it would silently change the
        // COMMON ratios of an already-suspect lot rather than surface it.
        const colors = (breakdown || []).map(b => b.color).filter(Boolean);
        const lotTotalQty = (breakdown || []).reduce((sum, b) => sum + (b.countsTowardTotal !== false ? (b.qty || 0) : 0), 0);

        this.clearComponentsTable();
        this.clearColorMatrix();
        colors.forEach(c => this.addMatrixColorColumn(c));

        const processId = document.getElementById('productionProcessId')?.value;
        const poolColorMap = processId ? await this.getPoolColorAwareItemNames(processId) : new Map();
        let upgradedAny = false;
        let upgradedCommonOverride = false;
        const poolGroupAccum = new Map();

        // A legacy lot saved before Common-vs-per-color-override items were
        // merged (see _getCommonItemsWithColorOverride) still has one flat
        // 'COMMON' row for an item that's really the same physical part as
        // one of its own explicit per-color siblings — checked against THIS
        // lot's own saved components, not the current recipe (which may have
        // since changed).
        const commonOverrideComps = this._getCommonItemsWithColorOverride(components || []);
        const sharedItemKeys = this._sharedItemSlotKeys(components || []);

        (components || []).forEach(c => {
          const colorGroup = c.colorGroup || 'COMMON';
          
          let derivedQtyPerUnit = 1;
          if (App.Utils.isCommonColorGroup(colorGroup)) {
            derivedQtyPerUnit = lotTotalQty > 0 ? (c.qty / lotTotalQty) : 0;
          } else {
            // sameColor, not raw .toLowerCase() === : that crashed outright on a
            // breakdown entry with no color (see the filter above), and bypassed
            // the one place color equality is allowed to be decided. sameColor
            // is null-safe, so a malformed entry now simply fails to match
            // instead of taking down the whole Edit-Lot reopen.
            const b = (breakdown || []).find(entry => App.Utils.sameColor(entry.color, colorGroup));
            const colorQty = b ? b.qty : 0;
            derivedQtyPerUnit = colorQty > 0 ? (c.qty / colorQty) : 0;
          }

          // Pool-color-aware (multi-color split) applies whether this row's
          // colorGroup is still the legacy 'COMMON' (saved before this item
          // was recognized as multi-color) or already a real color name
          // (saved correctly by the current Create-form matrix) — either way
          // it's the SAME literal item across colors, so it always belongs in
          // its own Per-Process Pool Components table (see
          // renderPoolColorGroupsFromAccum), never a merged per-cell-dropdown
          // row. An item with only ONE pool color isn't a real per-color
          // choice (see getPoolColorAwareItemNames) — it falls through to the
          // Common-table branch below instead.
          const isPoolColorAware = c.sourceType === 'POOL'
            && (poolColorMap.get((c.itemName || '').trim().toLowerCase()) || []).length > 1;

          if (isPoolColorAware) {
            const key = `${(c.itemName || '').toLowerCase()}|${(c.size || '').toLowerCase()}`;
            let entry = poolGroupAccum.get(key);
            if (!entry) {
              // colorsQtyPerUnit holds each color's OWN derived ratio (see
              // _poolCellQtyPerUnit) — the shared `qtyPerUnit` alongside it
              // is only ever a fallback for a color this lot has no history
              // for yet (a brand-new column checked mid-edit), not the
              // value actually used to redisplay/recompute any color that
              // DOES have its own entry below.
              entry = { itemName: c.itemName, size: c.size, narration: c.narration, sourceType: c.sourceType, colorsQty: {}, colorsQtyPerUnit: {}, qtyPerUnit: derivedQtyPerUnit };
              poolGroupAccum.set(key, entry);
            } else if (entry.qtyPerUnit === undefined) {
              entry.qtyPerUnit = derivedQtyPerUnit;
            }

            if (App.Utils.isCommonColorGroup(colorGroup)) {
              // Legacy shape: one combined qty — split evenly across colors
              // as a starting point for the operator to correct and re-save.
              upgradedAny = true;
              const perColorQty = colors.length > 0 ? c.qty / colors.length : c.qty;
              colors.forEach(color => {
                entry.colorsQty[color.toLowerCase()] = perColorQty;
                entry.colorsQtyPerUnit[color.toLowerCase()] = derivedQtyPerUnit;
              });
              entry.qtyPerUnit = derivedQtyPerUnit;
            } else {
              // Already a correctly saved per-color quantity. colorGroup is
              // this item's own literal axis color (e.g. "BCP"), which won't
              // appear verbatim in `colors` when the lot's output color is a
              // multi-axis composite (e.g. "BCP / Blue-White" — see
              // COLOR_COMBO_DELIMITER in config.js), so no membership check
              // against `colors` here: any non-COMMON colorGroup on a
              // pool-color-aware row is by construction one of this item's
              // real pool colors.
              entry.colorsQty[colorGroup.toLowerCase()] = c.qty;
              // This color's OWN ratio (c.qty / this color's own breakdown
              // qty), not whichever color happened to create `entry` first
              // — two colors of the same pool item can legitimately have
              // been consumed at different rates (rounding, partial
              // batches), and a shared row-level ratio previously made
              // editing one color's checklist Qty silently recompute using
              // a DIFFERENT color's rate.
              entry.colorsQtyPerUnit[colorGroup.toLowerCase()] = derivedQtyPerUnit;
            }
            return;
          }

          if (commonOverrideComps.includes(c)) {
            // Split this lot's one combined saved qty evenly across every
            // color that doesn't have its own explicit override entry (the
            // ones that DO are handled by their own row further down this
            // same forEach) — a starting point for the operator to correct.
            upgradedCommonOverride = true;
            const overriddenColors = new Set(
              (components || [])
                .filter(o => o.colorGroup && !App.Utils.isCommonColorGroup(o.colorGroup) &&
                  this._itemSlotKey(this._stripColorSubstring(o.itemName || '', o.colorGroup), o.size) === this._itemSlotKey(c.itemName, c.size))
                .map(o => o.colorGroup)
            );
            const fallbackColors = colors.filter(col => !overriddenColors.has(col));
            const perColorQty = fallbackColors.length > 0 ? c.qty / fallbackColors.length : c.qty;
            let row = this.findMatrixRowByDisplayName(c.itemName, c.size || '');
            if (!row) row = this.addMergedMatrixRow({ itemName: c.itemName, size: c.size, sourceType: c.sourceType, narration: c.narration });
            fallbackColors.forEach(col => {
              const colIndex = this.getMatrixColumnIndex(col);
              if (colIndex === -1) return;
              const cell = row.children[colIndex];
              this._setMergedCellItem(cell, { itemName: c.itemName, size: c.size, sourceType: c.sourceType }, perColorQty, derivedQtyPerUnit);
            });
            return;
          }

          if (App.Utils.isCommonColorGroup(colorGroup) || !colors.some(c => App.Utils.sameColor(c, colorGroup))) {
            // A saved row whose colorGroup is a real single pool color (not
            // 'COMMON', and not one of this lot's own output colors) is the
            // single-pool-color case — re-lock it the same way addComponentRow
            // does for a freshly populated recipe row.
            const isLockedPoolColor = c.sourceType === 'POOL' && !App.Utils.isCommonColorGroup(colorGroup);
            this.addComponentRow({
              itemName: c.itemName,
              size: c.size,
              narration: c.narration,
              sourceType: c.sourceType,
              qty: c.qty,
              qtyPerUnit: derivedQtyPerUnit,
              color: isLockedPoolColor ? colorGroup : c.color,
              colorScope: isLockedPoolColor ? colorGroup : undefined,
              unit: c.unit
            });
            return;
          }
          // Explicitly color-tagged, not pool-color-aware: a genuinely
          // different literal item per color (e.g. "Frame---Red" /
          // "Frame---Blue") — keep on a merged row, one real item picker
          // per color cell.
          const displayName = sharedItemKeys.has(this._itemSlotKey(c.itemName, c.size))
            ? (c.itemName || '').trim()
            : this._stripColorSubstring(c.itemName || '', colorGroup);
          let row = this.findMatrixRowByDisplayName(displayName, c.size || '');
          if (!row) row = this.addMergedMatrixRow({ itemName: displayName, size: c.size, sourceType: c.sourceType, narration: c.narration });
          const colIndex = this.getMatrixColumnIndex(colorGroup);
          const cell = row.children[colIndex];
          this._setMergedCellItem(cell, { itemName: c.itemName, size: c.size, sourceType: c.sourceType }, c.qty, derivedQtyPerUnit);
        });

        // Seed a table for EVERY pool-color-aware recipe item (see
        // getPoolColorAwareItemNames), not just ones this saved lot
        // happened to use before — otherwise checking a color belonging to
        // an axis/item this lot never used previously (e.g. adding
        // Mudguard usage to a lot that originally only used Painted Frame)
        // has no table to land in at all: the checkbox gets checked, but
        // there's nowhere to record its actual component consumption. Left
        // blank (no colorsQty entries) for an item this lot didn't already
        // use — renderPoolColorGroupsFromAccum still shows a column for any
        // color the operator newly checks via its own checked-state check.
        if (processId) {
          const recipeRes = await this._fetchProcessComponents(processId);
          const recipeComps = recipeRes.success ? (recipeRes.data || []) : [];
          recipeComps
            .filter(c => c.sourceType === 'POOL' && (!c.colorGroup || App.Utils.isCommonColorGroup(c.colorGroup)))
            .forEach(c => {
              const itemColors = poolColorMap.get((c.itemName || '').trim().toLowerCase()) || [];
              if (itemColors.length <= 1) return;
              const key = `${(c.itemName || '').toLowerCase()}|${(c.size || '').toLowerCase()}`;
              if (!poolGroupAccum.has(key)) {
                // No qty history at all for this item on this lot yet — fall
                // back to the recipe's own qtyPerUnit (same basis Create mode
                // suggests) so a color checked mid-edit still gets a useful
                // starting estimate via _poolCellQtyPerUnit's row-level
                // fallback, instead of staying permanently blank until the
                // operator types directly into the pool cell.
                poolGroupAccum.set(key, { itemName: c.itemName, size: c.size, narration: c.narration, sourceType: c.sourceType, colorsQty: {}, colorsQtyPerUnit: {}, qtyPerUnit: c.qtyPerUnit });
              }
            });
        }

        this.renderPoolColorGroupsFromAccum(Array.from(poolGroupAccum.values()), poolColorMap);

        if (upgradedAny && upgradedCommonOverride) {
          App.Utils.showToast('This lot had a pool item and a Common item now tracked per-color, both split evenly across colors as a starting point — adjust each color\'s quantity to match what was actually used, then save.', false);
        } else if (upgradedAny) {
          App.Utils.showToast('This lot had a pool item now tracked per-color split evenly across colors as a starting point — adjust each color\'s quantity to match what was actually used, then save.', false);
        } else if (upgradedCommonOverride) {
          App.Utils.showToast('This lot had a Common item that\'s really the same part as one of its per-color siblings — merged into one row, split evenly across colors as a starting point; adjust each color\'s quantity to match what was actually used, then save.', false);
        }
      },

      // Same grouping/rendering as renderPoolColorSplitGroups, but for the
      // Edit Lot path: cells show this lot's actual saved qty per
      // (item, color) instead of a recipe-suggested estimate. `entries` is
      // [{ itemName, size, sourceType, colorsQty: { colorLower: qty } }],
      // built by populateComponentsConsumedDirect from the saved
      // Components Consumed array.
      renderPoolColorGroupsFromAccum(entries, poolColorMap) {
        const wrapper = document.getElementById('productionPoolColorGroupsWrapper');
        const container = document.getElementById('productionPoolColorGroupsContainer');
        if (!container) return;

        container.querySelectorAll('tr').forEach(row => this.destroyComponentItemSelect2(row));
        container.innerHTML = '';
        this._poolColorGroupDefs = [];

        if (!entries || entries.length === 0) {
          if (wrapper) wrapper.style.display = 'none';
          return;
        }
        if (wrapper) wrapper.style.display = '';

        const groups = new Map();
        entries.forEach(entry => {
          const itemColors = poolColorMap.get((entry.itemName || '').trim().toLowerCase()) || [];
          const signature = itemColors.slice().sort((a, b) => a.localeCompare(b)).join('|').toLowerCase();
          if (!groups.has(signature)) groups.set(signature, { colors: itemColors, entries: [] });
          groups.get(signature).entries.push(entry);
        });

        let groupIdx = 0;
        groups.forEach(({ colors: groupColors, entries: groupEntries }) => {
          groupIdx++;
          const tableId = `productionPoolColorGroup_${groupIdx}`;
          const axisKey = this._axisKeyForPoolItemNames(groupEntries.map(e => e.itemName));
          this._poolColorGroupDefs.push({ tableId, colors: groupColors, rows: groupEntries, mode: 'edit', axisKey });
          // A color is visible if it's checked right now (scoped to THIS
          // table's own axis — see _axisKeyForPoolItemNames/
          // syncPoolColorGroupColumns's comment on the same leak) OR this
          // lot already has a saved value for it — so reopening an existing
          // lot doesn't hide one of its own already-recorded columns just
          // because something upstream changed since it was saved.
          //
          // Must use the exact-wins-then-tokens rule (_checkedPoolGroupColors),
          // NOT raw token matching: once this pool item's own colors are
          // composites ("Blue-White / Black"), splitting each checked color
          // into tokens lights up a column for every SEGMENT too
          // ("Blue-White", "Black"), none of which was ever checked. Those
          // columns can never hold a value (_poolGroupCellValue's exact
          // branch wins for the composite), so reopening a 6-composite lot
          // rendered 13 columns, 7 permanently blank — and the first
          // checkbox toggle then dropped them again, since
          // syncPoolColorGroupColumns already used the exact-wins rule.
          const checkedLower = new Set(
            this._checkedPoolGroupColors(groupColors, axisKey).map(c => c.toLowerCase()));
          const savedLower = new Set();
          groupEntries.forEach(e => Object.keys(e.colorsQty || {}).forEach(c => savedLower.add(c)));
          const visibleColors = groupColors.filter(c => checkedLower.has(c.toLowerCase()) || savedLower.has(c.toLowerCase()));
          container.insertAdjacentHTML('beforeend', this._buildPoolColorGroupTable(tableId, groupColors, visibleColors, groupEntries, 'edit', axisKey));
          document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => this.initComponentItemSelect2(row));
        });
      },

      // Fired when a row's Source select changes between ITEM/POOL — Stock
      // item names and Warehouse Pool output names are different namespaces,
      // so the previously picked item is cleared before refreshing availability.
      handleSourceChange(selectEl) {
        const row = selectEl.closest('tr');
        const itemSelect = row?.querySelector('.prod-comp-item-select');
        if (itemSelect && window.jQuery?.fn?.select2) {
          window.jQuery(itemSelect).val(null).trigger('change');
        }
        const sizeInput = row?.querySelector('.prod-comp-size');
        if (sizeInput) sizeInput.value = '';
        const narrationInput = row?.querySelector('.prod-comp-narration');
        if (narrationInput) narrationInput.value = '';
        this.refreshPoolAvailability();
      },

      // Fired when a component row's Size is typed/changed by hand (the Item
      // picker itself only carries a name — see _wireItemSelect2 — so Size
      // is this row's own free-text field, not a per-item dropdown like
      // Process's). Re-syncs Narration to Item Master for this exact
      // item+size, same as picking the item fresh would (see
      // _refillNarrationForRow), then refreshes the availability hint as before.
      handleProdSizeChange(input) {
        this._refillNarrationForRow(input?.closest('tr'));
        this.refreshPoolAvailability();
      },

      // Looks up this row's current item+size in Item Master and syncs its
      // Narration field to match — mirrors App.Process.handleComponentSizeChange.
      // No-ops for a Pool-sourced row (Warehouse Pool output items have no
      // Item Master entry/narration of their own) and for a row with no
      // narration input at all (e.g. a Per-Process Pool Components row).
      // `itemSelect`, if given, is used instead of the row's own (first)
      // item-select — required for a merged matrix row (see
      // addMergedMatrixRow), where every color cell has its OWN item-select
      // but they all share this one row-level Narration field; without it,
      // picking the 2nd+ color cell's item would always re-derive Narration
      // from the 1st cell instead of the one actually just changed.
      _refillNarrationForRow(row, itemSelect) {
        if (!row) return;
        const narrationInput = row.querySelector('.prod-comp-narration');
        if (!narrationInput) return;
        const sourceSel = row.querySelector('.prod-comp-source');
        if (sourceSel && sourceSel.value === 'POOL') return;

        const selectEl = itemSelect || row.querySelector('.prod-comp-item-select');
        const itemOpt = selectEl ? selectEl.options[selectEl.selectedIndex] : null;
        const itemName = (itemOpt?.dataset.name || itemOpt?.textContent || '').trim();
        if (!itemName) return;

        const size = row.querySelector('.prod-comp-size')?.value.trim() || '';
        const match = (App.State.globalItems || []).find(it =>
          App.Utils.sameText(it.name, itemName) && App.Utils.sameText(it.size || '', size));
        narrationInput.value = (match && match.narration) || '';
      },

      // Searchable Select2 for a component row's item picker (Common table,
      // or a manually added matrix row — one item for the whole row).
      initComponentItemSelect2(rowEl) {
        this._wireItemSelect2(rowEl?.querySelector('.prod-comp-item-select'));
      },

      // Searchable Select2 for ONE color cell's item picker inside a merged
      // matrix row (see addMergedMatrixRow) — every color column gets its
      // own picker since each color secretly uses a different real item.
      initMergedCellItemSelect2(selectEl) {
        this._wireItemSelect2(selectEl);
      },

      // Shared Select2 wiring for one item-name <select> element. Source
      // list switches with the row's Source select: ITEM -> App.State.globalItems
      // (Stock), POOL -> distinct Output Item Names from Process Master
      // (Warehouse Pool). tags:true still lets the operator free-type a name
      // that isn't in either list.
      _wireItemSelect2(selectEl) {
        if (!selectEl || !window.jQuery?.fn?.select2) return;

        const $select = window.jQuery(selectEl);
        const PAGE_SIZE = 40;

        $select.select2({
          placeholder: 'Search or type an item/pool name...',
          width: '100%',
          tags: true,
          dropdownParent: App.Utils.select2DropdownParent($select),
          ajax: {
            delay: 150,
            data(params) {
              return { q: params.term || '', page: params.page || 1 };
            },
            transport(params, success) {
              const q = (params.data.q || '').trim();
              const page = params.data.page || 1;
              const isPool = selectEl.closest('tr')?.querySelector('.prod-comp-source')?.value === 'POOL';
              const items = isPool
                ? App.Process.getDistinctOutputItemNames().map(name => ({ name, size: '' }))
                : (App.State.globalItems || []);
              const start = (page - 1) * PAGE_SIZE;

              const pool = q
                ? items.map((item, idx) => ({ idx, item })).filter(({ item }) =>
                  App.Utils.matchesKeywords(`${item.name} ${item.size || ''}`, q))
                : items.map((item, idx) => ({ idx, item }));

              const pageItems = pool.slice(start, start + PAGE_SIZE);
              success({
                results: pageItems.map(({ idx, item }) => ({
                  id: (isPool ? 'pool:' : 'item:') + idx,
                  text: `${item.name}${item.size ? ` [${item.size}]` : ''}`,
                  _itemName: item.name, _size: item.size || ''
                })),
                pagination: { more: (start + PAGE_SIZE) < pool.length }
              });
            },
            processResults(data) { return data; }
          },
          createTag(params) {
            const term = (params.term || '').trim();
            if (!term) return null;
            // Resolve to an existing Item Master / Warehouse Pool name
            // differing only by case/whitespace, matching whichever
            // namespace this row's current Source is set to.
            const isPool = selectEl.closest('tr')?.querySelector('.prod-comp-source')?.value === 'POOL';
            const items = isPool
              ? App.Process.getDistinctOutputItemNames().map(name => ({ name, size: '' }))
              : (App.State.globalItems || []);
            const existing = items.find(it => App.Utils.sameText(it.name, term));
            if (existing) {
              return {
                id: (isPool ? 'pool:' : 'item:') + existing.name, text: `${existing.name}${existing.size ? ` [${existing.size}]` : ''}`,
                _itemName: existing.name, _size: existing.size || ''
              };
            }
            return { id: 'custom:' + term, text: term, newTag: true, _itemName: term, _size: '' };
          }
        });

        $select.on('select2:select', function (e) {
          const data = e.params.data;
          const opt = selectEl.options[selectEl.selectedIndex];
          if (opt) opt.dataset.name = data._itemName || data.text;

          const row = selectEl.closest('tr');
          const sizeInput = row?.querySelector('.prod-comp-size');
          if (sizeInput && !sizeInput.value) sizeInput.value = data._size || '';
          // Narration is shown/autofilled from Item Master for this exact
          // item+size, matching what App.Process does for a recipe's own
          // component rows — see _refillNarrationForRow. No-ops for a Pool
          // row (no Item Master entry to look up). selectEl (not just the
          // row) is passed explicitly since a merged row's color cells each
          // have their own item-select sharing one row-level Narration field.
          App.Production._refillNarrationForRow(row, selectEl);
          App.Production.refreshPoolAvailability();
        });
      },

      // Destroys every item-picker Select2 instance in a row — a Common
      // table row or manual matrix row has exactly one, but a merged matrix
      // row (see addMergedMatrixRow) has one per color cell.
      destroyComponentItemSelect2(rowEl) {
        if (!rowEl || !window.jQuery?.fn?.select2) return;
        rowEl.querySelectorAll('.prod-comp-item-select').forEach(selectEl => {
          const $select = window.jQuery(selectEl);
          if ($select.data('select2')) $select.select2('destroy');
        });
      },

      // Fetches current availability for every component row and shows it
      // inline, so the operator sees the ceiling before saving: "Pool"
      // sources check the Warehouse Pool, "Item" sources check Stock.
      async refreshPoolAvailability() {
        const processId = document.getElementById('productionProcessId')?.value;

        try {
          const [wipRes, stockRes] = await Promise.all([
            processId ? Api.call('getProcessWipData', processId) : Promise.resolve({ success: true, data: [] }),
            Api.call('getStockData')
          ]);
          const wip = wipRes.success ? (wipRes.data || []) : [];
          const stock = stockRes.success ? (stockRes.data || []) : [];
          if (stockRes.success) {
            App.State.globalStock = stock;
            App.State.filteredStock = [...stock];
          }

          document.querySelectorAll('#productionComponentsBody tr').forEach(row => {
            const sourceSel = row.querySelector('.prod-comp-source');
            const availEl = row.querySelector('.prod-comp-available');
            if (!sourceSel || !availEl) return;

            const itemSelect = row.querySelector('.prod-comp-item-select');
            const itemOpt = itemSelect ? itemSelect.options[itemSelect.selectedIndex] : null;
            const itemName = (itemOpt?.dataset.name || itemOpt?.textContent || '').trim().toLowerCase();
            const size = row.querySelector('.prod-comp-size')?.value.trim().toLowerCase();

            let qty = 0;
            if (sourceSel.value === 'POOL') {
              const entry = wip.find(w => w.outputItemName.toLowerCase() === itemName);
              qty = entry ? entry.availableQty : 0;
              availEl.innerText = entry ? `${this.formatQty(entry.availableQty)} avail. (Pool)` : '0 avail. (Pool)';
            } else {
              const entry = stock.find(s =>
                s.name.toLowerCase() === itemName && (!size || (s.size || '').toLowerCase() === size)
              );
              qty = entry ? entry.currentStock : 0;
              availEl.innerText = entry ? `${this.formatQty(entry.currentStock)} avail.` : '0 avail.';
            }
            // Negative available stock/pool is allowed to save (see
            // saveProduction), but easy to miss as plain gray text — flag it
            // in red so the operator sees it before committing, instead of
            // discovering it later via a summary elsewhere that nets it
            // against an unrelated color/tag bucket (see Warehouse Pool's
            // per-Process Total Available column).
            availEl.classList.toggle('text-danger', qty < 0);
            availEl.classList.toggle('fw-bold', qty < 0);
            availEl.classList.toggle('text-muted', qty >= 0);
          });
        } catch (err) {
          // Ignored — availability hints are advisory, not blocking.
        }

        // Same advisory hint, one level up: the Colors to Produce checklist's
        // own per-color availability. Kept here (rather than only at render
        // time) so it stays in step with the component rows' hints, and so a
        // checklist row backed by a plain ITEM input picks up the Stock this
        // call just loaded. Never throws — see its own catch.
        await this.refreshColorChecklistAvailability(processId);
      },

      // Reads one row from the Common Components table into a plain object.
      // Most rows here are colorGroup 'COMMON' (applies to every color in the
      // batch) — including manually added rows via "+ Add Component", which
      // have no dataset.colorScope at all and must still default to COMMON
      // rather than an empty string, so they're never silently dropped from a
      // multi-color batch. A row for a single-pool-color item (see
      // addComponentRow's colorScope param) instead carries that one real
      // color name as its colorGroup, so it debits the correct Warehouse
      // Pool bucket. Per-color matrix rows live separately (see
      // serializeColorMatrix). Shared by serializeComponentsConsumed.
      _readProdComponentRow(row) {
        const itemSelect = row.querySelector('.prod-comp-item-select');
        if (!itemSelect || itemSelect.value === '') return null;
        const itemOpt = itemSelect.options[itemSelect.selectedIndex];
        const itemName = (itemOpt.dataset.name || itemOpt.textContent || '').trim();
        if (!itemName) return null;

        return {
          itemName,
          size: row.querySelector('.prod-comp-size')?.value.trim() || '',
          narration: row.querySelector('.prod-comp-narration')?.value.trim() || '',
