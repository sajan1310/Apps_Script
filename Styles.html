<style>
  /**
   * ═══════════════════════════════════════════���═══════════════════════════
   * styles.html — Maharaja BIKES Purchase Order System
   * 
   * Scope & Principles:
   * ─────────────────────────────────────────────────────────────────────
   * 1. Application UI styling only
   * 2. Print/PDF layout is owned entirely by inline styles in View_Print.html
   *    (ensures html2pdf and window.print() share one canonical source)
   * 3. @media print rules handle visibility switches ONLY
   * 4. No print-specific layout overrides here (all in View_Print.html)
   * 5. Design tokens centralized in :root for maintainability
   * 
   * Color Scheme:
   * - Primary (Dark):    #0f172a (navigation, headings)
   * - Secondary (Brand): #6366f1 (PO title, accents)
   * - Background:        #f8fafc (subtle light gray)
   * - Success:           #10b981
   * - Danger:            #ef4444
   * - Info:              #0ea5e9
   * ═══════════════════════════════════════════════════════════════════════
   */

  /* ─────────────────────────────────────────────────────────────────────
     DESIGN TOKENS
     ───────────────────────────────────────────────────────────────────── */
  :root {
    --primary-color:      #0f172a;
    --primary-light:      #334155;
    --primary-dark:       #020617;
    
    --secondary-color:    #6366f1;
    --secondary-light:    #818cf8;
    --secondary-dark:     #4f46e5;
    
    --brand-peach:        #fee2e2;
    --brand-dark-brown:   #450a0a;
    
    --bg-color:           #f8fafc;
    --bg-light:           #ffffff;
    
    --success-color:      #28a745;
    --warning-color:      #ffc107;
    --danger-color:       #dc3545;
    --info-color:         #17a2b8;
    
    --shadow-sm:          0 2px 4px rgba(0, 0, 0, 0.04);
    --shadow-md:          0 4px 12px rgba(0, 0, 0, 0.08);
    --shadow-lg:          0 8px 24px rgba(0, 0, 0, 0.12);
    
    --transition-fast:    150ms ease-in-out;
    --transition-base:    250ms ease-in-out;
    --transition-slow:    350ms ease-in-out;
    
    --border-radius:      8px;
    --border-radius-sm:   4px;
    --border-radius-lg:   12px;
    
    --text-primary:       #1e293b;
    --text-secondary:     #64748b;
    --text-muted:         #94a3b8;
    
    --bg-muted:           #f1f5f9;
    
    --border-color:       #e2e8f0;
    --border-light:       #f1f5f9;
  }

  /* ─────────────────────────────────────────────────────────────────────
     DARK MODE TOKENS
     ───────────────────────────────────────────────────────────────────── */
  [data-theme="dark"] {
    --primary-color:    #818cf8;
    --primary-light:    #a5b4fc;
    --primary-dark:     #4f46e5;

    --secondary-color:  #a78bfa;
    --secondary-light:  #c4b5fd;
    --secondary-dark:   #7c3aed;

    --bg-color:         #0d1117;
    --bg-light:         #161b27;
    --bg-muted:         #1e2736;

    --text-primary:     #e2e8f0;
    --text-secondary:   #94a3b8;
    --text-muted:       #6e8299;

    --success-color:    #34d399;
    --warning-color:    #fbbf24;
    --danger-color:     #f87171;
    --info-color:       #38bdf8;

    --border-color:     #253044;
    --border-light:     #1a2438;

    --shadow-sm:        0 2px 4px rgba(0,0,0,0.4);
    --shadow-md:        0 4px 12px rgba(0,0,0,0.5);
    --shadow-lg:        0 8px 24px rgba(0,0,0,0.65);
  }

  [data-theme="dark"] body {
    background-image: radial-gradient(circle at top right, rgba(79, 70, 229, 0.08), transparent 45%),
                      radial-gradient(circle at bottom left, rgba(99, 102, 241, 0.05), transparent 45%);
  }

  [data-theme="dark"] .app-header {
    background: rgba(13, 17, 23, 0.95) !important;
    border-bottom-color: rgba(255, 255, 255, 0.06) !important;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45) !important;
  }

  [data-theme="dark"] .nav-link.active {
    background-color: rgba(129, 140, 248, 0.15) !important;
    color: var(--primary-light) !important;
    box-shadow: inset 0 0 0 1px rgba(129, 140, 248, 0.25) !important;
  }

  [data-theme="dark"] .nav-link:hover {
    background-color: rgba(255, 255, 255, 0.05) !important;
    color: var(--text-primary) !important;
  }

  [data-theme="dark"] .table-container {
    background: rgba(22, 27, 39, 0.95);
    border-color: rgba(255, 255, 255, 0.05);
  }

  [data-theme="dark"] .modal-content {
    background: rgba(22, 27, 39, 0.99) !important;
    border-color: rgba(255, 255, 255, 0.08) !important;
  }

  [data-theme="dark"] .modal-body {
    background-color: var(--bg-light);
  }

  [data-theme="dark"] .modal-footer {
    background-color: var(--bg-light);
    border-top-color: var(--border-color);
  }

  [data-theme="dark"] .card {
    background-color: var(--bg-light);
    border-color: var(--border-color);
  }

  [data-theme="dark"] .card-header,
  [data-theme="dark"] .card-footer {
    background-color: var(--bg-muted);
    border-color: var(--border-color);
  }

  [data-theme="dark"] .po-multiselect-dropdown {
    background: var(--bg-light);
    border-color: var(--border-color);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }

  [data-theme="dark"] .po-ms-search-wrap {
    border-bottom-color: var(--border-color);
  }

  [data-theme="dark"] .po-ms-check {
    background: var(--bg-muted);
    border-color: var(--border-color);
  }

  [data-theme="dark"] .po-ms-option:hover {
    background: var(--bg-muted);
  }

  [data-theme="dark"] .po-ms-option.checked {
    background: rgba(99, 102, 241, 0.15);
    color: var(--secondary-light);
  }

  [data-theme="dark"] .po-ms-option.checked:hover {
    background: rgba(99, 102, 241, 0.25);
  }

  [data-theme="dark"] .po-ms-empty {
    color: var(--text-muted);
  }

  [data-theme="dark"] .select2-container .select2-selection--single {
    background-color: var(--bg-light);
    border-color: var(--border-color);
  }

  [data-theme="dark"] .select2-container .select2-selection--single .select2-selection__rendered {
    color: var(--text-primary);
  }

  [data-theme="dark"] .select2-dropdown {
    background-color: var(--bg-light);
    border-color: var(--border-color);
  }

  [data-theme="dark"] .select2-results__option {
    color: var(--text-primary);
    background-color: var(--bg-light);
  }

  [data-theme="dark"] .select2-results__option--highlighted {
    background-color: var(--primary-dark) !important;
    color: #fff !important;
  }

  [data-theme="dark"] .select2-search--dropdown .select2-search__field {
    background-color: var(--bg-muted);
    border-color: var(--border-color);
    color: var(--text-primary);
  }

  /* ── Bill form: Goods vs Labor Job column toggle (see App.Bill.setBillType) ── */
  #billItemsTable .labor-col { display: none; }
  #billItemsTable.labor-mode .labor-col { display: table-cell; }
  #billItemsTable.labor-mode .goods-col { display: none; }

  /* ── Excel-style column filter icon in table headers (Items Master) ── */
  .th-filter-btn {
    border: none;
    background: transparent;
    color: inherit;
    opacity: 0.7;
    padding: 0 2px;
    margin-left: 2px;
    cursor: pointer;
    font-size: 0.8rem;
    line-height: 1;
    vertical-align: middle;
  }

  .th-filter-btn:hover {
    opacity: 1;
  }

  .th-filter-btn.active {
    opacity: 1;
    color: var(--info-color, #0dcaf0);
  }

  .col-filter-panel {
    position: absolute;
    z-index: 99999;
    width: 240px;
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-sm);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
  }

  .col-filter-actions {
    display: flex;
    justify-content: space-between;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border-color);
  }

  .col-filter-actions button {
    border: none;
    background: transparent;
    color: var(--primary-color);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 2px 4px;
  }

  .col-filter-actions button:hover {
    text-decoration: underline;
  }

  [data-theme="dark"] .col-filter-panel {
    background-color: var(--bg-light);
    border-color: var(--border-color);
  }

  [data-theme="dark"] .col-filter-actions {
    border-color: var(--border-color);
  }

  [data-theme="dark"] .toast {
    background-color: var(--bg-light);
    border-color: var(--border-color);
    color: var(--text-primary);
  }

  [data-theme="dark"] .page-link {
    background-color: var(--bg-light);
    border-color: var(--border-color);
    color: var(--text-primary);
  }

  [data-theme="dark"] .btn-outline-dark {
    border-color: var(--text-secondary);
    color: var(--text-secondary);
  }

  [data-theme="dark"] .btn-outline-dark:hover:not(:disabled) {
    background-color: var(--text-secondary);
    color: var(--bg-color);
  }

  [data-theme="dark"] .btn-outline-brand {
    background-color: var(--bg-light);
    border-color: var(--border-color);
    color: var(--text-secondary);
  }

  [data-theme="dark"] thead {
    border-bottom-color: var(--border-color);
  }

  [data-theme="dark"] .text-dark {
    color: var(--text-primary) !important;
  }

  /* Bootstrap's .text-muted/.text-secondary ship with their own
     !important + CSS variables (--bs-secondary-color etc.), which are
     never recolored for our custom dark theme. Without these overrides
     item-list previews (PO/Bill "Items" columns, BOM component preview,
     helper text) render in Bootstrap's near-black default and become
     unreadable on dark backgrounds. */
  [data-theme="dark"] .text-muted {
    color: var(--text-muted) !important;
  }

  [data-theme="dark"] .text-secondary {
    color: var(--text-secondary) !important;
  }

  /* Same problem for the semantic color utilities: Bootstrap's raw
     palette (e.g. #198754 green, #0d6efd blue) sits around 3.8:1 on our
     dark backgrounds — readable-ish but below AA. Swap in the brighter
     dark-mode tokens already used for badges/buttons for consistency. */
  [data-theme="dark"] .text-primary {
    color: var(--primary-color) !important;
  }

  [data-theme="dark"] .text-success {
    color: var(--success-color) !important;
  }

  [data-theme="dark"] .text-danger {
    color: var(--danger-color) !important;
  }

  [data-theme="dark"] .text-warning {
    color: var(--warning-color) !important;
  }

  [data-theme="dark"] .text-info {
    color: var(--info-color) !important;
  }

  /* Headings: use near-white for legibility, not indigo accent */
  [data-theme="dark"] h1,
  [data-theme="dark"] h2,
  [data-theme="dark"] h3,
  [data-theme="dark"] h4,
  [data-theme="dark"] h5,
  [data-theme="dark"] h6 {
    color: var(--text-primary);
  }

  /* btn-primary: deep indigo so white text passes WCAG AA (~6.2:1) */
  [data-theme="dark"] .btn-primary {
    background-color: #4f46e5;
  }

  [data-theme="dark"] .btn-primary:hover:not(:disabled) {
    background-color: #4338ca;
    box-shadow: 0 4px 14px rgba(79, 70, 229, 0.45);
  }

  /* Pagination active: indigo bg with dark text for contrast */
  [data-theme="dark"] .page-item.active .page-link {
    background-color: var(--primary-color);
    border-color: var(--primary-color);
    color: #0d1117;
  }

  /* Badges: soft tint style so colored text reads on dark bg */
  [data-theme="dark"] .badge.bg-primary {
    background-color: rgba(99, 102, 241, 0.22);
    color: var(--primary-light);
  }

  [data-theme="dark"] .badge.bg-secondary {
    background-color: rgba(167, 139, 250, 0.2);
    color: var(--secondary-light);
  }

  [data-theme="dark"] .badge.bg-info {
    background-color: rgba(56, 189, 248, 0.18);
    color: #7dd3fc;
  }

  [data-theme="dark"] .badge.bg-success {
    background-color: rgba(52, 211, 153, 0.18);
    color: #6ee7b7;
  }

  [data-theme="dark"] .badge.bg-danger {
    background-color: rgba(248, 113, 113, 0.18);
    color: #fca5a5;
  }

  [data-theme="dark"] .badge.bg-warning {
    background-color: rgba(251, 191, 36, 0.18);
    color: #fde68a;
  }

  [data-theme="dark"] .badge.bg-dark {
    background-color: var(--bg-muted);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
  }

  /* Toasts: match new semantic colors. Solid/opaque on purpose — these
     used to be rgba(...,0.12) "tinted glass" backgrounds, which read as
     a see-through/washed-out notification against busy page content
     behind it, so they were switched to fully opaque fills. */
  [data-theme="dark"] .toast.bg-success {
    background-color: #064e3b !important;
    border-color: #065f46 !important;
    color: #a7f3d0 !important;
  }

  [data-theme="dark"] .toast.bg-danger {
    background-color: #450a0a !important;
    border-color: #7f1d1d !important;
    color: #fca5a5 !important;
  }

  /* Focus rings: more visible with indigo glow */
  [data-theme="dark"] input:focus,
  [data-theme="dark"] textarea:focus,
  [data-theme="dark"] select:focus,
  [data-theme="dark"] .form-control:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.22);
  }

  /* Multiselect placeholder */
  [data-theme="dark"] .po-ms-placeholder {
    color: var(--text-muted);
  }

  /* Table row hover: subtle indigo tint instead of flat muted */
  [data-theme="dark"] tbody tr:hover {
    background-color: rgba(99, 102, 241, 0.07);
  }

  /* Scrollbar: match dark surface */
  [data-theme="dark"] ::-webkit-scrollbar-track {
    background-color: var(--bg-color);
  }

  [data-theme="dark"] ::-webkit-scrollbar-thumb {
    background-color: var(--border-color);
  }

  [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
    background-color: var(--text-muted);
  }

  /* ─────────────────────────────────────────────────────────────────────
     DARK MODE ADDITIONAL OVERRIDES (ACCESSIBILITY & USABILITY)
     ───────────────────────────────────────────────────────────────────── */
  
  /* Transition utility for smooth theme transitions */
  body.theme-transitioning,
  body.theme-transitioning * {
    transition: background-color var(--transition-base), color var(--transition-base), border-color var(--transition-base), box-shadow var(--transition-base) !important;
  }

  /* Global utility class adjustments to prevent Bootstrap overrides */
  [data-theme="dark"] .bg-white {
    background-color: var(--bg-light) !important;
  }
  [data-theme="dark"] .bg-light {
    background-color: var(--bg-muted) !important;
  }
  [data-theme="dark"] .text-dark {
    color: var(--text-primary) !important;
  }
  
  /* Navigation Tabs line correction */
  .nav-tabs {
    border-bottom: none !important;
  }

  /* Soften general borders */
  [data-theme="dark"] .border,
  [data-theme="dark"] .border-top,
  [data-theme="dark"] .border-bottom,
  [data-theme="dark"] .border-start,
  [data-theme="dark"] .border-end {
    border-color: var(--border-color) !important;
  }

  /* Soften Bootstrap tables and cell borders.
     NOTE: Bootstrap applies --bs-table-bg/--bs-table-color directly per
     cell (not just on the <table>), so every variant must be overridden
     here or cells silently keep their white bg / dark text. */
  [data-theme="dark"] table.table-bordered,
  [data-theme="dark"] table.table-bordered th,
  [data-theme="dark"] table.table-bordered td {
    border-color: var(--border-color) !important;
  }
  [data-theme="dark"] .table-light {
    --bs-table-bg: var(--bg-muted) !important;
    --bs-table-color: var(--text-primary) !important;
    border-color: var(--border-color) !important;
  }
  [data-theme="dark"] table.table {
    --bs-table-bg: transparent !important;
    --bs-table-color: var(--text-primary) !important;
    --bs-table-striped-bg: rgba(255, 255, 255, 0.02) !important;
    --bs-table-striped-color: var(--text-primary) !important;
    --bs-table-active-bg: rgba(255, 255, 255, 0.1) !important;
    --bs-table-active-color: var(--text-primary) !important;
    --bs-table-hover-bg: rgba(255, 255, 255, 0.04) !important;
    --bs-table-hover-color: var(--text-primary) !important;
    color: var(--text-primary) !important;
  }

  /* Accessible solid button states (avoiding low contrast pastel colors) */
  [data-theme="dark"] .btn-success {
    background-color: #059669 !important;
    color: #ffffff !important;
  }
  [data-theme="dark"] .btn-success:hover:not(:disabled) {
    background-color: #047857 !important;
  }
  [data-theme="dark"] .btn-danger {
    background-color: #dc2626 !important;
    color: #ffffff !important;
  }
  [data-theme="dark"] .btn-danger:hover:not(:disabled) {
    background-color: #b91c1c !important;
  }
  [data-theme="dark"] .btn-warning {
    background-color: #d97706 !important;
    color: #ffffff !important;
  }
  [data-theme="dark"] .btn-warning:hover:not(:disabled) {
    background-color: #b45309 !important;
  }
  [data-theme="dark"] .btn-info {
    background-color: #0284c7 !important;
    color: #ffffff !important;
  }
  [data-theme="dark"] .btn-info:hover:not(:disabled) {
    background-color: #0369a1 !important;
  }

  /* Accessible outline buttons (pastels with dark text on hover) */
  [data-theme="dark"] .btn-outline-primary:hover:not(:disabled) {
    background-color: var(--primary-color) !important;
    color: #0d1117 !important;
  }
  [data-theme="dark"] .btn-outline-success:hover:not(:disabled) {
    background-color: var(--success-color) !important;
    color: #0d1117 !important;
  }
  [data-theme="dark"] .btn-outline-danger:hover:not(:disabled) {
    background-color: var(--danger-color) !important;
    color: #0d1117 !important;
  }
  [data-theme="dark"] .btn-outline-brand:hover:not(:disabled) {
    border-color: var(--secondary-color) !important;
    color: var(--secondary-color) !important;
    background-color: rgba(99, 102, 241, 0.1) !important;
  }

  /* Premium modal headers with gradients */
  [data-theme="dark"] .modal-header.bg-primary {
    background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%) !important;
    color: #ffffff !important;
  }
  [data-theme="dark"] .modal-header.bg-warning {
    background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%) !important;
    color: #ffffff !important;
  }
  [data-theme="dark"] .modal-header.bg-info {
    background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%) !important;
    color: #ffffff !important;
  }
  [data-theme="dark"] .modal-header.bg-success {
    background: linear-gradient(135deg, #059669 0%, #10b981 100%) !important;
    color: #ffffff !important;
  }
  [data-theme="dark"] .modal-header.bg-dark {
    background: var(--bg-muted) !important;
    border-bottom: 1px solid var(--border-color) !important;
    color: var(--text-primary) !important;
  }
  [data-theme="dark"] .modal-header .btn-close {
    filter: invert(1) brightness(2) !important;
  }

  /* Cohesive alert overrides for dark mode readability */
  [data-theme="dark"] .alert-info {
    background-color: rgba(56, 189, 248, 0.1) !important;
    border-color: rgba(56, 189, 248, 0.2) !important;
    color: #38bdf8 !important;
  }
  [data-theme="dark"] .alert-warning {
    background-color: rgba(251, 191, 36, 0.1) !important;
    border-color: rgba(251, 191, 36, 0.2) !important;
    color: #fbbf24 !important;
  }
  [data-theme="dark"] .alert-success {
    background-color: rgba(52, 211, 153, 0.1) !important;
    border-color: rgba(52, 211, 153, 0.2) !important;
    color: #34d399 !important;
  }
  [data-theme="dark"] .alert-danger {
    background-color: rgba(248, 113, 113, 0.1) !important;
    border-color: rgba(248, 113, 113, 0.2) !important;
    color: #f87171 !important;
  }

  /* Dropdown and Form element indicators */
  [data-theme="dark"] .po-multiselect-trigger {
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e") !important;
  }
  [data-theme="dark"] .select2-container .select2-selection--single .select2-selection__arrow b {
    border-color: var(--text-secondary) transparent transparent transparent !important;
  }
  [data-theme="dark"] .select2-container .select2-selection--single.select2-container--open .select2-selection__arrow b {
    border-color: transparent transparent var(--text-secondary) transparent !important;
  }
  [data-theme="dark"] .form-check-input {
    background-color: var(--bg-light) !important;
    border-color: var(--border-color) !important;
  }
  [data-theme="dark"] .form-check-input:checked {
    background-color: var(--primary-color) !important;
    border-color: var(--primary-color) !important;
  }

  /* Dark mode toggle button */
  .dark-mode-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition-base);
    padding: 0;
  }

  .dark-mode-toggle:hover {
    border-color: var(--secondary-color);
    color: var(--secondary-color);
    background-color: rgba(99, 102, 241, 0.08);
    transform: translateY(-1px);
  }

  .dark-mode-toggle svg {
    width: 16px;
    height: 16px;
  }

  /* Notification bell + history panel — every showToast() call is kept
     here (App.Notify) so a 3s-autohide toast can still be reviewed later. */
  .notif-wrap {
    position: relative;
  }

  .notif-bell-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition-base);
    padding: 0;
    position: relative;
    font-size: 16px;
  }

  .notif-bell-btn:hover {
    border-color: var(--secondary-color);
    color: var(--secondary-color);
    background-color: rgba(99, 102, 241, 0.08);
    transform: translateY(-1px);
  }

  .notif-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: var(--danger-color);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    line-height: 16px;
    text-align: center;
  }

  .notif-panel {
    position: absolute;
    top: 44px;
    right: 0;
    z-index: 99999;
    width: 320px;
    max-height: 420px;
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-sm);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    overflow: hidden;
  }

  .notif-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-color);
    font-weight: 600;
    font-size: 13px;
    color: var(--text-primary);
  }

  .notif-panel-header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .notif-clear-btn {
    border: none;
    background: transparent;
    color: var(--primary-color);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 2px 4px;
  }

  .notif-clear-btn:hover {
    text-decoration: underline;
  }

  .notif-clear-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    text-decoration: none;
  }

  .notif-item-remove {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
    opacity: 0.4;
    transition: opacity 150ms ease, color 150ms ease;
  }

  .notif-item-remove:hover {
    opacity: 1;
    color: var(--danger-color);
  }

  .notif-list {
    overflow-y: auto;
    max-height: 360px;
  }

  .notif-empty {
    padding: 24px 12px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
  }

  .notif-item {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
  }

  .notif-item:last-child {
    border-bottom: none;
  }

  .notif-item-dot {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    margin-top: 5px;
    border-radius: 50%;
    background: var(--success-color);
  }

  .notif-item.notif-error .notif-item-dot {
    background: var(--danger-color);
  }

  .notif-item-body {
    flex: 1;
    min-width: 0;
  }

  .notif-item-msg {
    color: var(--text-primary);
    word-break: break-word;
  }

  .notif-item-time {
    margin-top: 2px;
    color: var(--text-secondary);
    font-size: 11px;
  }

  .notif-item-clickable {
    cursor: pointer;
    transition: background-color 120ms ease;
  }

  .notif-item-clickable:hover,
  .notif-item-clickable:focus-visible {
    background-color: var(--bg-hover, rgba(0, 0, 0, 0.04));
    outline: none;
  }

  .notif-item.notif-unread {
    background-color: rgba(13, 110, 253, 0.06);
  }

  .notif-item-go {
    flex-shrink: 0;
    align-self: center;
    color: var(--text-secondary);
    font-size: 13px;
    opacity: 0.6;
  }

  .notif-list-modal {
    max-height: 60vh;
  }

  .notif-detail-body {
    white-space: pre-line;
    word-break: break-word;
    font-size: 14px;
    color: var(--text-primary);
  }

  [data-theme="dark"] .notif-panel {
    background-color: var(--bg-light);
    border-color: var(--border-color);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  [data-theme="dark"] .notif-item {
    border-color: var(--border-color);
  }

  [data-theme="dark"] .notif-item-clickable:hover,
  [data-theme="dark"] .notif-item-clickable:focus-visible {
    background-color: rgba(255, 255, 255, 0.06);
  }

  [data-theme="dark"] .notif-item.notif-unread {
    background-color: rgba(13, 110, 253, 0.12);
  }

  /* ─────────────────────────────────────────────────────────────────────
     RESET & BASE STYLES
     ───────────────────────────────────────────────────────────────────── */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
    font-size: 16px;
  }

  body {
    padding: 20px;
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.05), transparent 40%),
                      radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.05), transparent 40%);
    background-attachment: fixed;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-primary);
    overflow-x: hidden;
  }

  /* ─────────────────────────────────────────────────────────────────────
     TYPOGRAPHY
     ───────────────────────────────────────────────────────────────────── */
  h1, h2, h3, h4, h5, h6 {
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    line-height: 1.3;
    color: var(--primary-color);
    margin-bottom: 12px;
  }

  h1 { font-size: 28px; }
  h2 { font-size: 24px; }
  h3 { font-size: 20px; }
  h4 { font-size: 18px; }
  h5 { font-size: 16px; }
  h6 { font-size: 14px; }

  p {
    margin-bottom: 12px;
    color: var(--text-secondary);
  }

  small {
    font-size: 12px;
    color: var(--text-muted);
  }

  strong {
    font-weight: 600;
    color: var(--text-primary);
  }

  /* ─────────────────────────────────────────────────────────────────────
     LINKS
     ───────────────────────────────────────────────────────────────────── */
  a {
    color: var(--secondary-color);
    text-decoration: none;
    transition: color var(--transition-fast);
  }

  a:hover {
    color: var(--secondary-light);
    text-decoration: underline;
  }

  /* ─────────────────────────────────────────────────────────────────────
     SIDEBAR + MAIN BODY LAYOUT
     ───────────────────────────────────────────────────────────────────── */
  .app-body {
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }

  /* Without this, #content shrinks to fit whichever tab is currently
     visible (flex items default to their content's intrinsic width),
     so the content column's width — and the whitespace around it —
     would change from tab to tab instead of staying constant. */
  .tab-content-wrapper {
    flex: 1 1 0%;
    min-width: 0;
  }

  .sidebar-toggle-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    background: var(--bg-light);
    color: var(--text-secondary);
    font-size: 18px;
    cursor: pointer;
    transition: all var(--transition-fast);
  }

  .sidebar-toggle-btn:hover {
    color: var(--primary-color);
    background-color: var(--bg-muted);
  }

  .app-sidebar {
    width: 240px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background-color: var(--bg-muted);
    border-radius: var(--border-radius-lg);
    padding: 10px;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
    position: sticky;
    top: 96px;
    max-height: calc(100vh - 116px);
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    transition: width var(--transition-base);
  }

  .app-sidebar.collapsed {
    width: 68px;
  }

  .app-sidebar .nav-link {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    width: 100%;
    padding: 10px 14px;
    margin: 0;
    border: none;
    border-radius: var(--border-radius);
    background: transparent;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
  }

  .app-sidebar .nav-link i {
    font-size: 16px;
    width: 18px;
    flex-shrink: 0;
    text-align: center;
  }

  .app-sidebar .nav-link .nav-label {
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .app-sidebar.collapsed .nav-link {
    justify-content: center;
    padding: 10px 0;
  }

  .app-sidebar.collapsed .nav-link .nav-label {
    display: none;
  }

  .sidebar-backdrop {
    display: none;
  }

  /* ─────────────────────────────────────────────────────────────────────
     NAVIGATION TABS
     ───────────────────────────────────────────────────────────────────── */
  .nav-tabs {
    display: flex;
    flex-wrap: nowrap;
    border-bottom: none;
    background-color: var(--bg-muted);
    padding: 6px;
    border-radius: var(--border-radius-lg);
    margin-bottom: 24px;
    gap: 4px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .nav-tabs::-webkit-scrollbar {
    display: none;
  }

  .nav-link {
    padding: 10px 20px;
    margin: 0;
    border: none;
    border-radius: var(--border-radius);
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all var(--transition-base);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .nav-link:hover {
    color: var(--primary-color);
    background-color: rgba(0,0,0,0.02);
  }

  .nav-link.active {
    color: var(--primary-color);
    font-weight: 600;
    background-color: white;
    box-shadow: var(--shadow-sm);
  }

  /* ─────────────────────────────────────────────────────────────────────
     FORM ELEMENTS
     ───────────────────────────────────────────────────────────────────── */
  input,
  textarea,
  select,
  .form-control {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-sm);
    font-family: inherit;
    font-size: 14px;
    color: var(--text-primary);
    background-color: var(--bg-light);
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }

  input:focus,
  textarea:focus,
  select:focus,
  .form-control:focus {
    outline: none;
    border-color: var(--secondary-color);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }

  input:disabled,
  textarea:disabled,
  select:disabled,
  .form-control:disabled {
    background-color: var(--bg-muted);
    color: var(--text-muted);
    cursor: not-allowed;
    opacity: 0.7;
  }

  textarea {
    resize: vertical;
    min-height: 80px;
    font-family: 'Courier New', monospace;
  }

  /* ─────────────────────────────────────────────────────────────────────
     LABELS & FORM GROUPS
     ───────────────────────────────────────────────────────────────────── */
  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
    color: var(--text-primary);
    cursor: pointer;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    margin-bottom: 8px;
  }

  /* ─────────────────────────────────────────────────────────────────────
     BUTTONS
     ───────────────────────────────────────────────────────────────────── */
  button,
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    border: none;
    border-radius: var(--border-radius-sm);
    font-size: 14px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all var(--transition-base);
    white-space: nowrap;
    user-select: none;
    text-decoration: none;
  }

  button:disabled,
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  button:active,
  .btn:active {
    transform: translateY(1px);
  }

  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  /* Button variants */
  .btn-primary {
    background-color: var(--primary-color);
    color: white;
  }

  .btn-primary:hover:not(:disabled) {
    background-color: var(--primary-dark);
    box-shadow: var(--shadow-md);
  }

  .btn-success {
    background-color: var(--success-color);
    color: white;
  }

  .btn-success:hover:not(:disabled) {
    background-color: #218838;
  }

  .btn-danger {
    background-color: var(--danger-color);
    color: white;
  }

  .btn-danger:hover:not(:disabled) {
    background-color: #c82333;
  }

  .btn-warning {
    background-color: var(--warning-color);
    color: #212529;
  }

  .btn-warning:hover:not(:disabled) {
    background-color: #e0a800;
  }

  .btn-info {
    background-color: var(--info-color);
    color: white;
  }

  .btn-info:hover:not(:disabled) {
    background-color: #138496;
  }

  /* Outline buttons */
  .btn-outline-dark {
    border: 1px solid var(--text-primary);
    background-color: transparent;
    color: var(--text-primary);
  }

  .btn-outline-dark:hover:not(:disabled) {
    background-color: var(--text-primary);
    color: white;
  }

  .btn-outline-primary {
    border: 1px solid var(--primary-color);
    background-color: transparent;
    color: var(--primary-color);
  }

  .btn-outline-primary:hover:not(:disabled) {
    background-color: var(--primary-color);
    color: white;
  }

  .btn-outline-success {
    border: 1px solid var(--success-color);
    background-color: transparent;
    color: var(--success-color);
  }

  .btn-outline-success:hover:not(:disabled) {
    background-color: var(--success-color);
    color: white;
  }

  .btn-outline-danger {
    border: 1px solid var(--danger-color);
    background-color: transparent;
    color: var(--danger-color);
  }

  .btn-outline-danger:hover:not(:disabled) {
    background-color: var(--danger-color);
    color: white;
  }

  /* Brand Toggle and Outline Button Styling */
  .btn-outline-brand {
    border: 1px solid var(--border-color);
    background-color: var(--bg-light);
    color: var(--text-secondary);
    transition: all var(--transition-base);
  }

  .btn-outline-brand:hover:not(:disabled) {
    border-color: var(--secondary-light);
    color: var(--secondary-color);
    background-color: rgba(99, 102, 241, 0.05);
  }

  .btn-check:checked + .btn-outline-brand {
    background-color: var(--secondary-color) !important;
    border-color: var(--secondary-color) !important;
    color: white !important;
    box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
  }


  /* Button sizes */
  .btn-sm {
    padding: 6px 12px;
    font-size: 12px;
  }

  .btn-lg {
    padding: 12px 28px;
    font-size: 16px;
  }

  /* ─────────────────────────────────────────────────────────────────────
     CARDS & CONTAINERS
     ───────────────────────────────────────────────────────────────────── */
  .card {
    background-color: var(--bg-light);
    border: 1px solid var(--border-light);
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: box-shadow var(--transition-base);
  }

  .card:hover {
    box-shadow: var(--shadow-md);
  }

  .card-header {
    padding: 16px;
    background-color: var(--bg-muted);
    border-bottom: 1px solid var(--border-light);
    font-weight: 600;
    color: var(--text-primary);
  }

  .card-body {
    padding: 20px;
  }

  .card-footer {
    padding: 16px;
    background-color: var(--bg-muted);
    border-top: 1px solid var(--border-light);
  }

  /* ─────────────────────────────────────────────────────────────────────
     DASHBOARD
     ───────────────────────────────────────────────────────────────────── */
  .dash-kpi-card {
    position: relative;
    background: var(--bg-light);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 14px 16px;
    height: 100%;
    cursor: pointer;
    overflow: hidden;
    transition: transform var(--transition-fast), box-shadow var(--transition-fast);
  }

  .dash-kpi-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .dash-kpi-goto {
    position: absolute;
    top: 10px;
    right: 10px;
    color: var(--text-muted);
    font-size: 13px;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity var(--transition-fast), transform var(--transition-fast);
  }

  .dash-kpi-card:hover .dash-kpi-goto {
    opacity: 1;
    transform: translateX(0);
  }

  .dash-kpi-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    padding-right: 16px;
  }

  .dash-kpi-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    flex-shrink: 0;
  }

  .dash-kpi-value {
    font-family: 'Outfit', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
  }

  .dash-kpi-label {
    font-size: 11.5px;
    color: var(--text-secondary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    line-height: 1.25;
  }

  .dash-kpi-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .dash-action-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 16px 8px;
    font-weight: 700;
    font-size: 13px;
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-sm);
    transition: transform var(--transition-fast), box-shadow var(--transition-fast);
  }

  .dash-action-tile i {
    font-size: 21px;
  }

  .dash-action-tile:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .dash-quick-secondary {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border-light);
  }

  .dash-setup-label {
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .dash-section {
    background: var(--bg-light);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 20px;
  }

  .dash-section-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--text-primary);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 16px;
  }

  .dash-pipeline {
    display: flex;
    align-items: stretch;
    flex-wrap: wrap;
    gap: 4px;
  }

  .dash-pipeline-stage {
    flex: 1 1 200px;
    background: var(--bg-muted);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    padding: 14px;
    text-align: left;
    min-width: 180px;
  }

  .dash-pipeline-name {
    font-size: 13px;
    color: var(--text-primary);
    font-weight: 700;
    font-family: 'Outfit', sans-serif;
    text-align: center;
  }

  .dash-pipeline-total {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 2px;
    margin-bottom: 10px;
  }

  .dash-pipeline-groups {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 180px;
    overflow-y: auto;
  }

  .dash-pipeline-group-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--bg-light);
    border: 1px solid var(--border-light);
    border-radius: var(--border-radius-sm);
    padding: 5px 8px;
  }

  .dash-pipeline-group-title {
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dash-pipeline-group-qty {
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--secondary-color);
    flex-shrink: 0;
  }

  .dash-pipeline-empty {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    padding: 8px 0;
  }

  .dash-pipeline-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    flex: 0 0 auto;
    padding: 0 4px;
  }

  .dash-pipeline-clickable {
    cursor: pointer;
    transition: transform var(--transition-fast), box-shadow var(--transition-fast);
  }

  .dash-pipeline-clickable:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .dash-kpi-delta {
    color: var(--text-muted);
  }

  .dash-table-footer {
    font-size: 12px;
    color: var(--text-muted);
    padding: 8px 4px 0;
  }

  .dash-refresh-spinning i {
    animation: dash-refresh-spin 0.8s linear infinite;
  }

  @keyframes dash-refresh-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ─────────────────────────────────────────────────────────────────────
     TABLE STYLES
     ───────────────────────────────────────────────────────────────────── */
  .table-container {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 24px;
    border-radius: var(--border-radius-lg);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: var(--shadow-lg);
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    color: var(--text-primary);
  }

  thead {
    background-color: transparent;
    border-bottom: 2px solid var(--border-color);
  }

  /* Sticky header for the 3 biggest ledgers (PO, Bill, Stock) -- long lists
     otherwise lose column context while scrolling. thead's own background
     is transparent (rule above), so an opaque one is set here too, or
     scrolled rows would show through the stuck header text. */
  #poLedger .table-responsive thead th,
  #billLedger .table-responsive thead th,
  #stockTab .table-responsive thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background-color: var(--bg-light);
  }

  th {
    padding: 14px 12px;
    text-align: left;
    font-weight: 600;
    font-family: 'Outfit', sans-serif;
    color: var(--text-secondary);
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  td {
    padding: 12px;
    border-bottom: 1px solid var(--border-light);
    vertical-align: middle;
  }

  tbody tr {
    transition: background-color var(--transition-fast), transform var(--transition-fast);
  }

  tbody tr:hover {
    background-color: var(--bg-muted);
    transform: scale(1.001);
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  /* Low Stock row highlight (Stock list) — bold white text on a dark
     background so understocked items jump out at a glance. Bootstrap's
     text-* utility classes (text-dark/text-danger/text-success) ship with
     !important, so they need matching !important here to be overridden. */
  .low-stock-row,
  .low-stock-row td {
    background-color: #1a1a1a !important;
    color: #fff !important;
    font-weight: 700 !important;
  }

  .low-stock-row td strong,
  .low-stock-row td .text-danger,
  .low-stock-row td .text-success {
    color: #fff !important;
  }

  .low-stock-row:hover,
  .low-stock-row:hover td {
    background-color: #000 !important;
  }

  /* ─────────────────────────────────────────────────────────────────────
     BADGES & LABELS
     ───────────────────────────────────────────────────────────────────── */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge.bg-dark {
    background-color: var(--text-primary);
    color: white;
  }

  .badge.bg-primary {
    background-color: var(--primary-color);
    color: white;
  }

  .badge.bg-secondary {
    background-color: var(--secondary-color);
    color: white;
  }

  .badge.bg-success {
    background-color: var(--success-color);
    color: white;
  }

  .badge.bg-danger {
    background-color: var(--danger-color);
    color: white;
  }

  .badge.bg-warning {
    background-color: var(--warning-color);
    color: #212529;
  }

  .badge.bg-info {
    background-color: var(--info-color);
    color: white;
  }

  /* ─────────────────────────────────────────────────────────────────────
     SELECT2 OVERRIDE
     ───────────────────────────────────────────────────────────────────── */
  .select2-container {
    width: 100% !important;
    z-index: 99999 !important;
  }

  .select2-container .select2-selection--single {
    height: 38px;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-sm);
    background-color: var(--bg-light);
    padding: 4px;
  }

  .select2-container .select2-selection--single .select2-selection__rendered {
    line-height: 30px;
    color: var(--text-primary);
    padding: 0 10px;
  }

  .select2-container .select2-selection--single .select2-selection__arrow {
    height: 30px;
    right: 4px;
    color: var(--text-secondary);
  }

  .select2-container.select2-container--focus .select2-selection--single {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.1);
  }

  .select2-dropdown {
    border-color: var(--border-color);
    border-radius: var(--border-radius-sm);
    z-index: 99999 !important;
  }

  .select2-results__option--highlighted {
    background-color: var(--primary-color);
  }

  .select2-results__options {
    max-height: 220px;
    list-style: none;
    overflow-y: auto;
  }

  .select2-results__options--nested {
    list-style: none;
  }

  /* The global `* { margin: 0; padding: 0; }` reset above strips Select2's
     own internal row spacing, which it relies on to keep dropdown rows
     (and bold optgroup labels) from visually overlapping — restore it
     explicitly here, scoped to Select2's own classes only.

     Select2's own CSS (select2.min.css, Index.html) is lazy-loaded via the
     media="print" -> "all" swap trick so it doesn't block first paint. If a
     modal's dropdown is opened before that swap finishes, none of Select2's
     base structural rules are active yet — in particular, an <optgroup>
     label renders as a bare <strong> (inline by default) instead of the
     block-level element Select2's own CSS turns it into. Padding on an
     inline element doesn't reserve real vertical space, so the bold label
     visually paints on top of neighboring rows instead of pushing them
     down — exactly the overlap this whole block exists to prevent. `display:
     block` here removes that race entirely, regardless of load timing. */
  .select2-results__option {
    display: block;
    padding: 6px;
    list-style: none;
  }

  .select2-results__options--nested .select2-results__option {
    padding-left: 1em;
  }

  .select2-results__group {
    display: block;
    padding: 6px;
    font-weight: bold;
  }

  /* ── Custom PO multi-select dropdown (replaces Select2 multiple) ─────── */
  .po-multiselect {
    position: relative;
    width: 100%;
  }
  .po-multiselect-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 38px;
    padding: 0.375rem 2.25rem 0.375rem 0.75rem;
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.5;
    color: var(--text-primary);
    background-color: var(--bg-light);
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23343a40' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 0.75rem center;
    background-size: 16px 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-sm);
    cursor: pointer;
    text-align: left;
    appearance: none;
    transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    white-space: nowrap;
    overflow: hidden;
  }
  .po-multiselect-trigger:focus,
  .po-multiselect-trigger.open {
    border-color: var(--primary-color);
    outline: none;
    box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.1);
  }
  .po-ms-placeholder {
    color: #6c757d;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .po-ms-selected-text {
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .po-multiselect-dropdown {
    position: absolute;
    top: calc(100% + 2px);
    left: 0;
    right: 0;
    z-index: 99999;
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-sm);
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    min-width: 100%;
  }
  .po-ms-search-wrap {
    padding: 8px;
    border-bottom: 1px solid var(--border-color);
  }
  .po-ms-options {
    list-style: none;
    margin: 0;
    padding: 4px 0;
    max-height: 260px;
    overflow-y: auto;
  }
  .po-ms-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    color: var(--text-primary);
    font-size: 14px;
    transition: background 0.1s;
    user-select: none;
  }
  .po-ms-option:hover {
    background: #f1f5f9;
  }
  .po-ms-option.checked {
    background: #f0f4ff;
    font-weight: 500;
    color: var(--primary-color);
  }
  .po-ms-option.checked:hover {
    background: #e5eaff;
  }
  .po-ms-check {
    width: 17px;
    height: 17px;
    flex-shrink: 0;
    border: 1.5px solid #adb5bd;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    background: #fff;
    color: transparent;
    transition: background 0.1s, border-color 0.1s;
  }
  .po-ms-option.checked .po-ms-check {
    background: var(--primary-color);
    border-color: var(--primary-color);
    color: #fff;
  }
  .po-ms-empty {
    padding: 14px 12px;
    text-align: center;
    color: #6c757d;
    font-size: 14px;
    list-style: none;
  }

  /* ─────────────────────────────────────────────────────────────────────
     MODALS
     ───────────────────────────────────────────────────────────────────── */
  .modal-content {
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: var(--border-radius-lg);
    box-shadow: var(--shadow-lg);
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .modal-header {
    background: #dc3545 !important;
    color: #ffffff !important;
    border-bottom: none;
    border-radius: var(--border-radius-lg) var(--border-radius-lg) 0 0;
    padding: 20px 24px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .modal-header > div.d-flex {
    flex-wrap: wrap;
    gap: 6px;
  }

  .modal-header * {
    color: #ffffff !important;
  }

  .modal-header .btn-close {
    filter: invert(1) brightness(2);
    opacity: 0.85;
    transition: opacity var(--transition-fast);
  }
  
  .modal-header .btn-close:hover {
    opacity: 1;
  }

  .modal-body {
    padding: 24px;
    max-height: 82vh;
    overflow-y: auto;
  }

  .modal-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border-light);
    background-color: transparent;
  }

  .modal-xl {
    max-width: 95% !important;
  }

  /* Component recipe table on the Edit Process modal — fixed min-widths per
     column so the qty spinner, source caret, and remarks text never get
     crushed by the table squeezing to fit a narrow modal. */
  .proc-comp-table {
    min-width: 1000px;
  }
  .proc-comp-table td,
  .proc-comp-table th {
    vertical-align: middle;
  }

  /* Production Lot's Per-Color Components matrix + Per-Process Pool
     Components tables — a color column is added per color in the batch, so
     an unconstrained table (table-layout: auto) lets each one grow to fit
     its Select2/qty-input content, which forces the whole table wider than
     the modal (horizontal scroll) while starving the Item/Pool Name column
     down to a sliver. table-layout: fixed instead sizes every column from
     the header row: Item/Pool Name, Size, Source and ✕ keep the explicit %
     widths below, and each color <th> gets its own fixed width (rather
     than splitting whatever's left equally) so a batch with many colors
     doesn't crush every header into an unreadable, mid-word-wrapped
     sliver.
     A %-width column has no floor of its own though — table-layout: fixed
     crushes it toward 0 (not grow the table) once enough fixed-width color
     <th>s are added, and a collapsed cell's overflowing text visually
     smears into the next column instead of wrapping. So the table's own
     min-width is computed from its real color count and set inline (see
     App.Production's PROD_COLOR_TABLE_FIXED_RESERVE_PX/
     PROD_COLOR_TABLE_COLOR_COL_PX, _buildPoolColorGroupTable and
     _syncMatrixTableMinWidth in Script.html) — only once that sum exceeds
     the modal's width does the table grow past 100% and the surrounding
     .table-responsive wrapper scroll horizontally; a batch with only 1-2
     colors stays compact instead of stretching those columns to fill the
     leftover space. overflow: hidden below is just a safety net so any
     still-too-narrow column clips instead of smearing into its neighbor. */
  .prod-color-table {
    table-layout: fixed;
    width: 100%;
    min-width: 378px;
  }
  .prod-color-table th[data-color] {
    white-space: normal;
    overflow-wrap: break-word;
    word-break: normal;
    width: 88px;
    min-width: 88px;
    font-size: 0.74rem;
    line-height: 1.25;
    vertical-align: middle;
    padding-left: 4px;
    padding-right: 4px;
  }
  .prod-color-table th,
  .prod-color-table td {
    overflow: hidden;
  }
  .prod-color-table td {
    padding: 6px 4px;
  }
  .prod-color-table td.text-center .btn {
    padding-left: 6px;
    padding-right: 6px;
  }
  .prod-color-table input.matrix-qty {
    font-size: 0.85rem;
    padding: 4px 6px;
  }
  .prod-color-table .prod-comp-display-name,
  .prod-color-table .prod-comp-size,
  .prod-color-table .prod-comp-narration {
    font-size: 0.8rem;
    padding-left: 6px;
    padding-right: 6px;
    text-overflow: ellipsis;
  }
  .prod-color-table .prod-comp-source {
    font-size: 0.78rem;
    padding-left: 6px;
    padding-right: 22px;
  }


  /* Modal Animation */
  .modal.fade .modal-dialog {
    transform: scale(0.95) translateY(20px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .modal.show .modal-dialog {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  /* ─────────────────────────────────────────────────────────────────────
     TOASTS & ALERTS
     ───────────────────────────────────────────────────────────────────── */
  .toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    pointer-events: none;
  }

  .toast {
    background-color: var(--bg-light) !important;
    opacity: 1 !important;
    border: 1px solid var(--border-light);
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-lg);
    padding: 16px;
    margin-bottom: 12px;
    min-width: 300px;
    animation: slideInRight var(--transition-base) ease-in-out;
    pointer-events: auto;
  }

  /* !important: Bootstrap's own .bg-success/.bg-danger utility classes
     (also !important) would otherwise win the opaque-but-wrong-color
     fight and paint these solid Bootstrap green/red instead of the
     app's pastel notification colors. */
  .toast.bg-success {
    background-color: #d4edda !important;
    border-color: #c3e6cb !important;
    color: #155724 !important;
  }

  .toast.bg-danger {
    background-color: #f8d7da !important;
    border-color: #f5c6cb !important;
    color: #721c24 !important;
  }

  @keyframes slideInRight {
    from {
      transform: translateX(400px);
      opacity: 0;
    }
    to {
      transform: translateX(0);
      opacity: 1;
    }
  }

  /* ─────────────────────────────────────────────────────────────────────
     ACTION BUTTONS (Row actions in tables)
     ───────────────────────────────────────────────────────────────────── */
  .btn-action {
    margin-bottom: 4px;
    border-radius: var(--border-radius-sm);
    font-size: 12px;
    padding: 6px 12px;
  }

  .btn-action:last-child {
    margin-bottom: 0;
  }

  /* ─────────────────────────────────────────────────────────────────────
     PAGINATION
     ───────────────────────────────────────────────────────────────────── */
  .pagination {
    display: flex;
    gap: 4px;
    justify-content: center;
    list-style: none;
    margin-top: 20px;
  }

  .page-item {
    margin: 0;
  }

  .page-link {
    padding: 8px 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-sm);
    color: var(--text-primary);
    background-color: var(--bg-light);
    cursor: pointer;
    font-size: 13px;
    transition: all var(--transition-fast);
  }

  .page-link:hover:not(.disabled) {
    background-color: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
  }

  .page-item.active .page-link {
    background-color: var(--info-color);
    border-color: var(--info-color);
    color: white;
  }

  .page-item.disabled .page-link {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ─────────────────────────────────────────────────────────────────────
     UTILITY CLASSES
     ───────────────────────────────────────────────────────────────────── */
  .text-primary { color: var(--primary-color); }
  .text-secondary { color: var(--secondary-color); }
  .text-success { color: var(--success-color); }
  .text-danger { color: var(--danger-color); }
  .text-warning { color: var(--warning-color); }
  .text-info { color: var(--info-color); }
  .text-muted { color: var(--text-muted); }

  .bg-primary { background-color: var(--primary-color); }
  .bg-light { background-color: var(--bg-light); }
  .bg-muted { background-color: var(--bg-muted); }

  .fw-bold { font-weight: 600; }
  .fw-normal { font-weight: 400; }

  .text-center { text-align: center; }
  .text-end { text-align: right; }

  .fs-6 { font-size: 14px; }
  .fs-5 { font-size: 16px; }

  .m-0 { margin: 0; }
  .mt-20 { margin-top: 20px; }
  .mb-20 { margin-bottom: 20px; }

  .p-4 { padding: 20px; }

  .w-100 { width: 100%; }

  .shadow-sm { box-shadow: var(--shadow-sm); }
  .shadow-md { box-shadow: var(--shadow-md); }

  /* ─────────────────────────────────────────────────────────────────────
     SCROLLBAR CUSTOMIZATION (Webkit browsers)
     ───────────────────────────────────────────────────────────────────── */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  ::-webkit-scrollbar-track {
    background-color: var(--bg-muted);
  }

  ::-webkit-scrollbar-thumb {
    background-color: var(--border-color);
    border-radius: 4px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background-color: var(--text-muted);
  }

  /* ═════════════════════════════════════════════════════════════════════
     @media print — VISIBILITY SWITCHES ONLY
     
     Principles:
     ──────────────────────────────────────────────────────────────────────
     - Show/hide elements for print output
     - NO layout changes here (all handled in View_Print.html)
     - NO typography changes (all in View_Print.html)
     - NO color/background overrides (all in View_Print.html)
     - Preserve inline styles from View_Print.html untouched
     ═════════════════════════════════════════════════════════════════════ */

  /* A4 portrait page geometry — 6mm margins match the html2pdf jsPDF
     margin (set in Script_PO.html downloadPDF) so window.print() and the
     downloaded PDF line up identically. Also mirrored in Mobile_Styles.html
     and the Production Sheet fit-engine's PAGE_MARGIN_MM (Script_Production.html) —
     change all three together. */
  @page {
    size: A4 portrait;
    margin: 6mm;
  }

  @media print {
    /* Reset body for printing */
    body {
      background-color: white !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: visible !important;
    }

    /* Hide all UI chrome */
    #app-container,
    .modal,
    .modal-backdrop,
    .toast-container,
    .toast,
    .nav-tabs,
    .pagination,
    .btn-action,
    nav,
    header,
    footer,
    .d-none,
    [style*="display: none"],
    [style*="visibility: hidden"] {
      display: none !important;
      visibility: hidden !important;
    }

    /* Hide all print containers by default during printing */
    #print-po-container,
    #print-item-ledger-container,
    #print-vendor-ledger-container,
    #print-contractor-ledger-container,
    #print-production-sheet-container,
    #print-low-stock-container {
      display: none !important;
    }

    /* Only show the active print container */
    #print-po-container.active-print,
    #print-item-ledger-container.active-print,
    #print-vendor-ledger-container.active-print,
    #print-contractor-ledger-container.active-print,
    #print-production-sheet-container.active-print,
    #print-low-stock-container.active-print {
      display: block !important;
      visibility: visible !important;
      width: 100% !important;
      margin: 0 !important;
    }

    /* Preserve all inline styles from View_Print.html.
       The color adjust rule ensures headers, backgrounds, and accent bars print with exact colors. */
    #print-po-container *,
    #print-item-ledger-container *,
    #print-vendor-ledger-container *,
    #print-contractor-ledger-container *,
    #print-production-sheet-container *,
    #print-low-stock-container * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Style copied table cells inside print templates to ensure proper borders and padding */
    #print-item-ledger-container td,
    #print-vendor-ledger-container td,
    #print-contractor-ledger-container td,
    #print-production-sheet-container td {
      border: 1px solid #999 !important;
      padding: 6px 8px !important;
      font-size: 11px !important;
      word-break: break-word !important;
    }


    /* Ensure proper page breaks for multi-page item tables:
       let the table itself break across pages, repeat the header row
       on each page, and never split a single item row in half. */
    #print-po-container thead,
    #print-item-ledger-container thead,
    #print-vendor-ledger-container thead,
    #print-contractor-ledger-container thead,
    #print-production-sheet-container thead,
    #print-low-stock-container thead {
      display: table-header-group;
    }

    #print-po-container tfoot,
    #print-item-ledger-container tfoot,
    #print-vendor-ledger-container tfoot,
    #print-contractor-ledger-container tfoot,
    #print-production-sheet-container tfoot,
    #print-low-stock-container tfoot {
      display: table-footer-group;
    }

    #print-po-container tr,
    #print-item-ledger-container tr,
    #print-vendor-ledger-container tr,
    #print-contractor-ledger-container tr,
    #print-production-sheet-container tr,
    #print-low-stock-container tr {
      page-break-inside: avoid;
      break-inside: avoid;
    }

    /* Optimize text for printing */
    a {
      text-decoration: none;
      color: inherit;
    }

    /* Hide scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }
  }

  /* ─────────────────────────────────────────────────────────────────────
     @media (max-width: 768px) — RESPONSIVE ADJUSTMENTS
     ───────────────────────────────────────────────────────────────────── */
  @media (max-width: 768px) {
    /* iOS Safari auto-zooms the whole page when focusing a form field whose
       computed font-size is below 16px. The viewport meta tag no longer
       locks zoom (see main.js#doGet), so this is the correct way to stop
       that auto-zoom instead: keep inputs themselves at >=16px on mobile
       widths, while leaving the 14px desktop size (Styles.html ~919)
       untouched above this breakpoint. */
    input,
    textarea,
    select,
    .form-control {
      font-size: 16px;
    }

    body {
