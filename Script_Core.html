    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    // Lazily injects a third-party <script> tag and caches the load promise so
    // heavy libraries (PDF export, spreadsheet parsing) don't block initial
    // page render and are only downloaded when the feature is actually used.
    const _scriptLoadPromises = {};
    function loadScript(src) {
      if (!_scriptLoadPromises[src]) {
        _scriptLoadPromises[src] = new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = () => resolve();
          script.onerror = () => {
            delete _scriptLoadPromises[src];
            reject(new Error(`Failed to load script: ${src}`));
          };
          document.head.appendChild(script);
        });
      }
      return _scriptLoadPromises[src];
    }

    const HTML_ESCAPE_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    function escapeHtml(value = '') {
      return String(value).replace(/[&<>"']/g, ch => HTML_ESCAPE_MAP[ch]);
    }

    // Renders a PO/Bill line-item list as an HTML preview string. Handles
    // both structured item objects and legacy plain-string item entries.
    function formatItemsPreview(items) {
      if (!Array.isArray(items)) return '';
      return items
        .map(i =>
          typeof i === 'object' && i !== null
            ? `${escapeHtml(i.name)}${i.size ? ` [${escapeHtml(i.size)}]` : ''} (${escapeHtml(i.qty)} ${escapeHtml(i.unit || 'Pcs')})`
            : escapeHtml(i)
        )
        .join('<br>');
    }

    function toNumber(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function formatCurrency(value) {
      return `\u20B9${toNumber(value).toFixed(2)}`;
    }

    function todayIso() {
      const d = new Date();
      return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, '0'),
        String(d.getDate()).padStart(2, '0')
      ].join('-');
    }

    // Converts a record's raw ISO timestamp (preferred) or DD/MM/YYYY display
    // date into the YYYY-MM-DD format <input type="date"> expects/produces.
    function dateToInputValue(rawIso, displayDate) {
      if (rawIso) {
        const iso = String(rawIso).split('T')[0];
        if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
      }

      const d = String(displayDate || '');

      if (d.includes('/')) {
        const [day, month, year] = d.split('/');
        if (day && month && year?.length === 4) {
          return `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
        }
      }

      if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;

      return '';
    }

    function normalizeDateForInput(po) {
      if (!po) return '';
      return dateToInputValue(po.poDateRaw, po.poDate);
    }

    // Resolves a sortable Date from a record's ISO timestamp, falling back
    // to its DD/MM/YYYY display date (e.g. PO/Bill poDate, billDate fields).
    function parseRecordDate(rawIso, displayDate) {
      if (rawIso) {
        const fromRaw = new Date(rawIso);
        if (!isNaN(fromRaw.getTime())) return fromRaw;
      }

      const parts = String(displayDate || '').split('/');
      if (parts.length === 3) {
        return new Date(parts.reverse().join('-'));
      }

      return new Date(NaN);
    }

    function safeModalShow(id) {
      const el = document.getElementById(id);
      if (!el || typeof bootstrap === 'undefined') return;

      // Called from inside an already-open modal (e.g. Production's own
      // "Issue Stock" button, or a "Manage Color Master" link on a form
      // modal) — every Bootstrap modal shares the same z-index, so ties are
      // broken by DOM order, not by which was opened last. Whichever modal
      // happens to sit later in the page's markup would render on top
      // regardless of which one the user actually just opened, and a second
      // backdrop:static modal also freezes the page (same class of bug
      // App.Utils.confirmAction already works around — mirrors its fix:
      // drop this modal's own backdrop/keyboard-close and lift it above the
      // modal(s) already open, same z-index confirmModal uses for this).
      //
      // Must exclude `el` itself from that check — a flow that re-shows the
      // SAME modal while it's still open (e.g. Bill's "record another"
      // re-opening #receiveBillModal right after a successful save, before
      // its own confirmAction's confirmation dialog has finished its
      // fade-out) would otherwise see its own '.show' class as "another
      // modal is open", bump ITS OWN z-index to 1070 (tying with
      // #confirmModal's static 1070), and then lose that tie to DOM order —
      // #confirmModal sits earlier in Modals.html than most form modals, so
      // every confirmation dialog for the rest of that "keep adding" session
      // would render behind the form instead of on top of it.
      const isNested = Array.from(document.querySelectorAll('.modal.show')).some(m => m !== el);
      if (isNested) {
        const existing = bootstrap.Modal.getInstance(el);
        if (existing) existing.dispose();
        el.style.zIndex = 1070;
        new bootstrap.Modal(el, { backdrop: false, keyboard: true }).show();
      } else {
        el.style.zIndex = '';
        bootstrap.Modal.getOrCreateInstance(el).show();
      }
    }

    function safeModalHide(id) {
      const el = document.getElementById(id);
      if (el && typeof bootstrap !== 'undefined') {
        bootstrap.Modal.getOrCreateInstance(el).hide();
      }
    }

    // Bootstrap 5 doesn't support real nested modals: each modal's own
    // hide() unconditionally strips <body>'s scroll-lock state (the
    // 'modal-open' class plus the overflow/padding-right it applies) as
    // soon as THAT modal finishes closing, regardless of whether another
    // modal (opened on top of it via safeModalShow's isNested branch, e.g.
    // Manage Color Master / Process Type Master from inside Edit Process)
    // is still showing. That can leave the background page scrollable
    // behind a still-open modal, or leave it stuck if cleanup ever races
    // with a fast re-open. Re-sync the lock to reality every time any
    // modal finishes hiding, instead of trusting Bootstrap's per-instance
    // bookkeeping.
    document.addEventListener('hidden.bs.modal', () => {
      const stillOpen = document.querySelectorAll('.modal.show').length;
      if (stillOpen === 0) {
        document.body.classList.remove('modal-open');
        document.body.style.removeProperty('overflow');
        document.body.style.removeProperty('padding-right');
        document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
      } else {
        document.body.classList.add('modal-open');
      }
    });

      Selection: {
        toggle(arr, key, isSelected) {
          const idx = arr.indexOf(key);
          if (isSelected) {
            if (idx === -1) arr.push(key);

        // Renders a "Showing X-Y of Z" label + Bootstrap pagination control into containerId.
        // actionName is the data-action value dispatched by the delegated click handler.
        renderPagination(containerId, totalItems, currentPage, rowsPerPage, actionName, label = 'Records') {
          const container = document.getElementById(containerId);
          if (!container) return;

          if (!totalItems) {
            container.innerHTML = '';
            return;
          }

          const totalPages = Math.ceil(totalItems / rowsPerPage);
          const startItem = (currentPage - 1) * rowsPerPage + 1;
          const endItem = Math.min(currentPage * rowsPerPage, totalItems);

          let html = `<span class="text-secondary fw-bold">Showing ${startItem}–${endItem} of ${totalItems} ${label}</span>`;

          if (totalPages > 1) {
            html += `<ul class="pagination pagination-sm mb-0 shadow-sm">
            <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
              <button class="page-link text-dark" data-action="${actionName}" data-page="${currentPage - 1}">Prev</button>
            </li>`;

            let ellipsisLeft = false;
            let ellipsisRight = false;

            for (let i = 1; i <= totalPages; i++) {
              if (
                i === 1 ||
                i === totalPages ||
                (i >= currentPage - 1 && i <= currentPage + 1)
              ) {
                const active = currentPage === i;
                html += `<li class="page-item ${active ? 'active' : ''}">
                <button class="page-link ${active ? 'bg-info border-info text-dark' : 'text-dark'}"
                        data-action="${actionName}" data-page="${i}">${i}</button>
              </li>`;
              } else if (currentPage > i && !ellipsisLeft) {
                html +=
                  '<li class="page-item disabled"><span class="page-link text-muted">…</span></li>';
                ellipsisLeft = true;
              } else if (i > currentPage && !ellipsisRight && totalPages > i) {
                html +=
                  '<li class="page-item disabled"><span class="page-link text-muted">…</span></li>';
                ellipsisRight = true;
              }
            }

            html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <button class="page-link text-dark" data-action="${actionName}" data-page="${currentPage + 1}">Next</button>
          </li></ul>`;
          }

          container.innerHTML = html;

        clampPage(page, totalItems, rowsPerPage) {
          const totalPages = Math.max(1, Math.ceil(totalItems / rowsPerPage));

        // Case/whitespace-insensitive equality for name-like fields (item,
        // vendor, contractor, color, model, process type, client names,
        // sizes, etc.) — "SEAT", "seat" and "Seat" must all resolve to the
        // same record wherever the app looks one up by name, not just where
        // it happens to already lowercase both sides. Use this instead of
        // === any time two user-typed/stored strings are compared for
        // "is this the same real-world thing", as opposed to programmatic
        // IDs/enums (status, sourceType, colorGroup) which stay as-typed.
        sameText(a, b) {
          return String(a == null ? '' : a).trim().toLowerCase() === String(b == null ? '' : b).trim().toLowerCase();
        },

        // Keyword search: splits the search term on whitespace and checks that every
        // resulting keyword appears somewhere in the haystack, regardless of order.
        matchesKeywords(haystack, term) {
          const keywords = String(term || '').toLowerCase().trim().split(/\s+/).filter(Boolean);
          if (!keywords.length) return true;
          const text = String(haystack || '').toLowerCase();
          return keywords.every(kw => text.includes(kw));
        },

        // Select2 matcher using keyword search — pass as `matcher:` in any Select2 config
        // to replace the default substring match with multi-word keyword matching.
        select2Matcher(params, data) {
          if (!params.term) return data;
          return App.Utils.matchesKeywords(data.text, params.term) ? data : null;
        },

        // Sizes that actually exist for a given item name in Item Master, so PO/Bill
        // size pickers can be filtered to valid sizes for the item just entered
        // (e.g. a "Handle" used only in 14"/16" cycles shouldn't offer every size
        // in the system). Returns [] if the name doesn't match any known item.
        getSizesForItemName(name) {
          const nameLower = String(name || '').trim().toLowerCase();
          if (!nameLower) return [];
          const sizes = new Set();
          (App.State.globalItems || []).forEach(item => {
            if (String(item.name || '').trim().toLowerCase() === nameLower && item.size) {
              sizes.add(item.size);

        // reused as the Output Size choices on Production's Colors-to-Produce
        // checklist (no separate Size Master; Item Master is already the
        // source of truth for size values in this app).
        getAllDistinctSizes() {
          const sizes = new Set();
          (App.State.globalItems || []).forEach(item => {
            if (item.size) sizes.add(item.size);

          return [...sizes].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
        },

        // Fixed bicycle-size categories a Process's Output Item Name may embed
        // (e.g. "Painted Frame Ford 14 inch D/Gaddi"). Used to group/filter the
        // Production form's Process picker by size — Output Item Name is the
        // only place size is recorded on a Process, so it's matched as a
        // substring rather than read from a dedicated column.
        PROCESS_SIZE_LIST: ['12 inch', '14 inch', '16 inch', '20 inch', '24 inch', '26 inch'],

        // Returns the size token found in text (e.g. a Process's Output Item
        // Name), or 'General' if none of PROCESS_SIZE_LIST appears in it.
        getSizeFromOutputItemName(text) {
          const lower = String(text || '').toLowerCase();
          return this.PROCESS_SIZE_LIST.find(s => lower.includes(s)) || 'General';
        },

        // Returns the Model Master name found in text (e.g. a Process's Output
        // Item Name), or 'General' if none of the current models appears in it.
        // Models are read live from App.State.globalModels (not a fixed list
        // like PROCESS_SIZE_LIST) since new models can be added in Model Master
        // at any time. Longest name first, so a multi-word model (e.g. "Eagle
        // Pro") wins over a shorter one that's also a substring of it (e.g.
        // "Eagle") — mirrors module_tags.js's _matchProcessTypeInName, which
        // hit the same ambiguity for Process Type matching. Without this, a
        // process misclassified under the shorter model silently disappears
        // from the Production form's Process dropdown once the correct
        // (longer) model is selected.
        getModelFromOutputItemName(text) {
          const lower = String(text || '').toLowerCase();
          const models = [...(App.State.globalModels || [])].sort((a, b) => String(b.name || '').length - String(a.name || '').length);
          const match = models.find(m => m.name && lower.includes(String(m.name).toLowerCase()));
          return match ? match.name : 'General';
        },

        // Auto-selects a <select>'s only remaining real option (any option
        // besides a blank-value placeholder like "Choose a Process...") once
        // filtering/cascading has narrowed it down to exactly one choice —
        // saves a redundant click on every filtered/cascading picker in the
        // app (Production's Size/Model/Process Type/Process chain, Warehouse
        // Opening's Process/Color, BOM Process Group imports, Dispatch's
        // Client/Order pickers, etc.). Never overrides a value the select
        // already holds (a preserved prior selection, or an Edit-mode
        // prefill), and intentionally does NOT dispatch a 'change' event —
        // callers that need to cascade into a dependent dropdown read
        // select.value right after calling this and pass it along
        // themselves, so programmatic prefill flows that populate a select
        // directly (without going through a user-driven handler) are
        // unaffected. Returns true if it changed the value.
        autoSelectOnlyOption(selectEl) {
          if (!selectEl || selectEl.value) return false;
          const realOptions = Array.from(selectEl.options).filter(o => o.value !== '');
          if (realOptions.length !== 1) return false;
          selectEl.value = realOptions[0].value;
          if (window.jQuery?.fn?.select2 && window.jQuery(selectEl).data('select2'))
            window.jQuery(selectEl).trigger('change.select2');
          return true;
        },

        // Filters a row's per-row size <datalist> to the sizes valid for the entered
        // item name, falling back to the full size list for unrecognized item names
        // (so registering a brand-new item via PO/Bill still works). Auto-fills the
        // size input when only one valid size exists.
        applyDependentSizeList(nameInput, sizeListSelector) {
          const row = nameInput.closest('tr');
          if (!row) return;
          const sizeInput = row.querySelector(sizeListSelector);
          const datalist = row.querySelector('datalist.row-size-list');
          if (!sizeInput || !datalist) return;

          const name = nameInput.value.trim();
          let sizes = App.Utils.getSizesForItemName(name);
          if (!sizes.length) {
            sizes = [...new Set((App.State.globalItems || []).map(i => i.size).filter(Boolean))];
          }

          datalist.innerHTML = sizes.map(s => `<option value="${escapeHtml(s)}">`).join('');
          if (sizes.length === 1 && !sizeInput.value.trim()) sizeInput.value = sizes[0];
        },

        // Defaults a PO/Bill row's Unit field to the matched item's Purchase
        // Unit (e.g. 'Gross') so the market-quoted unit is pre-selected
        // instead of the generic 'Pcs' placeholder every row starts with.
        // Only overwrites when the field still holds that generic default —
        // never clobbers a unit the user already picked deliberately.
        // `triggerEl` may be the row's name OR size field — the row's own
        // name/size inputs are always looked up fresh via the selectors.
        applyDefaultPurchaseUnit(triggerEl, nameSelector, sizeSelector, unitSelector) {
          const row = triggerEl.closest('tr');
          if (!row) return;
          const unitInput = row.querySelector(unitSelector);
          const nameInput = row.querySelector(nameSelector);
          if (!unitInput || !nameInput) return;

          const name = nameInput.value.trim();
          const sizeInput = row.querySelector(sizeSelector);
          const size = sizeInput ? sizeInput.value.trim() : '';
          if (!name) return;

          const item = (App.State.globalItems || []).find(i =>
            String(i.name || '').trim().toLowerCase() === name.toLowerCase() &&
            String(i.size || '').trim().toLowerCase() === size.toLowerCase()
          );
          if (!item) return;

          const purchaseUnit = item.purchaseUnit || item.baseUnit || 'Pcs';
          const current = unitInput.value.trim();
          if (!current || current === 'Pcs') {
            unitInput.value = purchaseUnit;
          }
        },

        // Aggregates outstanding (ordered - billed) quantity per item (name+size)
        // across all open POs, so Item Master / Item Ledger / search can all share
        // one source of truth instead of recomputing this per call site.
        // Returns a Map keyed by "name|size" (lowercased) -> { qty, poNumbers: Set }.
        getPendingByItem() {
          const map = new Map();
          (App.State.globalPOs || []).forEach(po => {
            (po.items || []).forEach(line => {
              const name = String(line.name || '').trim();
              if (!name) return;
              const size = String(line.size || '').trim();
              // Base-unit qty, not the raw entered qty — a PO ordered in one
              // purchase unit (e.g. "Gross") and billed in another (e.g.
              // "Pcs") must be compared in the same unit, exactly like the
              // server's own _aggregateBilledBaseQtyByPo/suggestPoAllocations
              // reconciliation (module_bill.js/module_po.js) already does.
              const ordered = Number(line.baseQty) || 0;
              if (ordered <= 0) return;

              const billed = App.Bill._getBilledQty(po.poNumber, name, size, line.narration);
              const pending = ordered - billed;
              if (pending <= 0.0001) return;

              const key = `${name.toLowerCase()}|${size.toLowerCase()}`;
              const entry = map.get(key) || { qty: 0, poNumbers: new Set() };
              entry.qty += pending;
              entry.poNumbers.add(String(po.poNumber));
              map.set(key, entry);
            });
          });
          return map;
        }
      },

      // ── Logo Management ──────────────────────────────────────────
      Logo: {
        async load() {
          try {
            const res = await Api.call('getLogo');
            if (res?.success && res.data) {
              App.companyLogo = res.data;
              App.Print.injectLogo();
              this._updateHeaderUI(res.data);
            }
          } catch (e) {
            console.warn('[Logo] Failed to load saved logo:', e);
          }
        },

        upload(file) {
          if (!file || !file.type.startsWith('image/')) {
            App.Utils.showToast('Please select an image file.', true);
            return;
          }
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              // Compress to max 300px wide, JPEG 0.75 to keep chunks small
              const MAX_W = 300;
              const scale = Math.min(1, MAX_W / img.width);
              const canvas = document.createElement('canvas');
              canvas.width = Math.round(img.width * scale);
              canvas.height = Math.round(img.height * scale);
              canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
              const dataUrl = canvas.toDataURL('image/png');

              // Split into 8000-char chunks (safely under the 9KB property limit)
              const CHUNK = 8000;
              const chunks = [];
              for (let i = 0; i < dataUrl.length; i += CHUNK) chunks.push(dataUrl.slice(i, i + CHUNK));

              Api.call('saveLogo', chunks)
                .then(res => {
                  if (res?.success) {
                    App.companyLogo = dataUrl;
                    App.Print.injectLogo();
                    this._updateHeaderUI(dataUrl);
                    App.Utils.showToast('Logo saved — all print templates updated.');
                  } else {
                    App.Utils.showToast(res?.message || 'Failed to save logo.', true);
                  }
                })
                .catch(err => App.Utils.showToast(err.message || 'Failed to save logo.', true));
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        },

        clear() {
          Api.call('clearLogo')
            .then(res => {
              if (res?.success) {
                App.companyLogo = null;
                App.Print.injectLogo();
                this._updateHeaderUI(null);
                App.Utils.showToast('Logo removed.');
              } else {
                App.Utils.showToast(res?.message || 'Failed to remove logo.', true);
              }
            })
            .catch(err => App.Utils.showToast(err.message || 'Failed to remove logo.', true));
        },

        _updateHeaderUI(dataUrl) {
          const container = document.getElementById('brand-icon-container');
          const svg = document.getElementById('brand-icon-svg');
          const logoImg = document.getElementById('brand-icon-logo');
          const clearBtn = document.getElementById('logo-clear-btn');

          if (dataUrl) {
            if (svg) svg.style.display = 'none';
            if (logoImg) { logoImg.src = dataUrl; logoImg.style.display = 'block'; }
            if (container) container.style.background = 'transparent';
          } else {
            if (svg) svg.style.display = '';
            if (logoImg) { logoImg.src = ''; logoImg.style.display = 'none'; }
            if (container) container.style.background = 'linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%)';
          }

          if (clearBtn) clearBtn.style.display = dataUrl ? 'inline-flex' : 'none';
        }
      },


      async Init() {
        // Load persisted company logo (non-blocking, best-effort)
        this.Logo.load();

        // Only load data needed for the default tab (Dashboard, plus PO for its
        // shared form dropdowns) up front. Bill, Stock, BOM, Production are
        // deferred until the user first clicks their tab (Navigation.showTab
        // already triggers loadData on each tab visit).
        const labels = ['PO', 'Item'];
        const promises = [
          this.PO.loadData(),
          this.Item.loadData()
        ];

        if (this.Dashboard) {
          labels.push('Dashboard');
          promises.push(this.Dashboard.loadData());
          this.Dashboard.startAutoRefresh();
        }

        if (this.Vendor) {
          labels.push('Vendor');
          promises.push(this.Vendor.loadData());
        }

        if (this.Unit) {
          labels.push('Unit');
          promises.push(this.Unit.ensureLoaded());
        }

        const results = await Promise.allSettled(promises);

        // A rejected initial load used to only log to the console -- invisible
        // to the user, who'd see an empty tab with no indication anything was
        // ever wrong until they happened to click in and hit the SAME failure
        // again. Mark the corresponding nav tab (where one exists) with a
        // warning icon + explanatory tooltip instead, and summarize every
        // failure in one toast, so a rejected module degrades visibly instead
        // of silently -- the tab stays clickable so the user can retry.
        const TAB_IDS = { PO: 'poLedger', Item: 'itemMaster', Dashboard: 'dashboardTab', Vendor: 'vendorMaster' };
        const failedLabels = [];

        results.forEach((r, i) => {
          if (r.status !== 'rejected') return;
          const label = labels[i];
          failedLabels.push(label);
          console.error(`[Init] ${label} data load failed:`, r.reason);

          const tabId = TAB_IDS[label];
          const navBtn = tabId && document.getElementById('btn-' + tabId);
          if (navBtn && !navBtn.querySelector('.init-load-failed-icon')) {
            const warnIcon = document.createElement('i');
            warnIcon.className = 'bi bi-exclamation-triangle-fill text-warning init-load-failed-icon';
            warnIcon.style.marginLeft = '4px';
            navBtn.appendChild(warnIcon);
            navBtn.title = `${navBtn.title} — failed to load on startup, click to retry`;
          }
        });

        if (failedLabels.length > 0) {
          this.Utils.showToast(
            `Some data failed to load on startup: ${failedLabels.join(', ')}. Affected tabs are marked with a warning icon -- click one to retry.`,
            true
          );
        }

        if (this.PO && this.PO.populateVendorSelects) {
          this.PO.populateVendorSelects();
        }
      }
    };

    window.App = App;

    // ================================================================
    // EVENT BINDING
    // ================================================================
    function bindEnhancements() {
      // Logo upload input handler
      const logoInput = document.getElementById('logo-upload-input');
      if (logoInput) {
        logoInput.addEventListener('change', function () {
          if (this.files?.[0]) {

          }
        });
      }

      // Print Preview Toggles Preference & Dynamic Eye Icons
      const ratesToggle = document.getElementById('printWithRates');
      const totalToggle = document.getElementById('printWithTotal');

      // Safe localStorage accessor to prevent DOMException crashes in Google Apps Script iframes
      const safeGetItem = (key) => {
        try {
          return localStorage.getItem(key);
        } catch (e) {
          console.warn('[Storage] localStorage.getItem access denied:', e);
          return null;
        }
      };

      const safeSetItem = (key, val) => {
        try {
          localStorage.setItem(key, val);
        } catch (e) {
          console.warn('[Storage] localStorage.setItem access denied:', e);
        }
      };

      function updateToggleIcon(toggle) {
        if (!toggle) return;
        const icon = toggle.nextElementSibling?.querySelector('.bi');
        if (icon) {
          if (toggle.checked) {
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
          } else {
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
          }
        }
      }

      if (ratesToggle) {
        const savedRates = safeGetItem('printWithRates');
        ratesToggle.checked = savedRates === null ? true : (savedRates === 'true');
        updateToggleIcon(ratesToggle);

        ratesToggle.addEventListener('change', () => {
          safeSetItem('printWithRates', ratesToggle.checked);
          updateToggleIcon(ratesToggle);
        });
      }

      if (totalToggle) {
        const savedTotal = safeGetItem('printWithTotal');
        totalToggle.checked = savedTotal === null ? true : (savedTotal === 'true');

          case 'item-ledger':
            App.Item.openLedgerModal(
              decodeURIComponent(btn.dataset.name || ''),
              decodeURIComponent(btn.dataset.size || '')
            );
            break;
          case 'item-edit':
            App.Item.openEditModal(
              decodeURIComponent(btn.dataset.name || ''),
              decodeURIComponent(btn.dataset.size || '')
            );
            break;
          case 'item-delete':
            App.Item.delete(
              decodeURIComponent(btn.dataset.name || ''),
              decodeURIComponent(btn.dataset.size || '')
            );
            break;
          case 'item-page':
            App.Item.changePage(toNumber(btn.dataset.page, 1));
            break;
          case 'po-page':
            App.PO.changePage(toNumber(btn.dataset.page, 1));
            break;
          case 'bill-page':
            App.Bill.changePage(toNumber(btn.dataset.page, 1));
            break;
          case 'vendor-page':
            App.Vendor.changePage(toNumber(btn.dataset.page, 1));
            break;
          case 'stock-page':
            App.Stock.changePage(toNumber(btn.dataset.page, 1));
            break;
          case 'bom-page':
            App.BOM.changePage(toNumber(btn.dataset.page, 1));
            break;
          case 'production-page':
            App.Production.changePage(toNumber(btn.dataset.page, 1));
            break;
          case 'client-page':
            App.Client.changeClientsPage(toNumber(btn.dataset.page, 1));
            break;
          case 'order-page':
            App.Client.changeOrdersPage(toNumber(btn.dataset.page, 1));
            break;
          case 'dispatch-page':
            App.Dispatch.changeDispatchPage(toNumber(btn.dataset.page, 1));
            break;
        }
      });

      // Rate comparison on item-name or item-size blur (capture phase)
      document.addEventListener(
        'blur',
        e => {
          if (e.target.matches('.item-name') || e.target.matches('.item-size'))
            App.PO.checkRate(e.target);
        },
        true
      );

      // Filter each PO row's size choices to sizes valid for the entered item name,
      // suggest a Narration from this item + size's PO/Bill history, default the
      // row's Unit to that item's Purchase Unit, and auto-fill the Unit Price
      // from the last known rate for this item + size + vendor.
      document.addEventListener('input', e => {
        if (e.target.matches('#itemsBody .item-name')) {
          App.Utils.applyDependentSizeList(e.target, '.item-size');
          App.Utils.applyDefaultPurchaseUnit(e.target, '.item-name', '.item-size', '.item-unit');
          App.PO.refreshNarrationList(e.target.closest('tr'));
          App.PO.autoFillRate(e.target.closest('tr'));
        }
        if (e.target.matches('#itemsBody .item-size')) {
          App.Utils.applyDefaultPurchaseUnit(e.target, '.item-name', '.item-size', '.item-unit');
          App.PO.refreshNarrationList(e.target.closest('tr'));
          App.PO.autoFillRate(e.target.closest('tr'));
        }
        if (e.target.matches('#itemsBody .item-narration')) {
          App.PO.autoFillRate(e.target.closest('tr'));
        }
      });

      // Form submit handlers
      document.getElementById('poForm')?.addEventListener('submit', async e => {
        e.preventDefault();
        const { formData, items } = App.PO.serializeForm();

        // Select2 hides the native <select>, so the browser's "required"
        // validation never fires on the vendor field — check it explicitly.
        if (!String(formData.vendor || '').trim()) {
          App.Utils.showToast('Please select a vendor.', true);
          return;
        }
        if (!items.length) {
          App.Utils.showToast(
            'Please add at least one item to the PO.',
            true
          );
          return;
        }

        const isEdit = !!formData.existingPoNumber;
        setDisabled('poSubmitBtn', true);
        try {
          const res = await Api.call('savePO', formData);
          if (res?.success) await App.PO.loadData();
          if (res?.success && !isEdit) {
            App.PO.openCreateModal();
          } else {
            safeModalHide('editPoModal');
          }
          App.Utils.showToast(res?.message || 'PO saved.', !res?.success);
        } catch (err) {
          App.Utils.showToast(err.message || 'Failed to save PO.', true);
        } finally {
          setDisabled('poSubmitBtn', false);
        }
      });

      document
        .getElementById('billForm')
        ?.addEventListener('submit', async e => {
          e.preventDefault();
          // Flush any pending/in-flight PO auto-match first — otherwise a
          // fast submit right after editing an item field can read
          // dataset.po/allocs from BEFORE the debounced suggestion (or one
          // already in flight) has applied, saving a stale split. See
          // App.Bill.flushPendingAutoMatch().
          setDisabled('billSubmitBtn', true);
          try {
            await App.Bill.flushPendingAutoMatch();
          } finally {
            setDisabled('billSubmitBtn', false);
          }
          const { formData, items } = App.Bill.serializeForm();
          if (!items.length) {
            App.Utils.showToast(
              'Please add at least one item to the bill.',
              true
            );
            return;
          }

          const isEdit = !!formData.existingBillNumber;
          const confirmMsg = isEdit
            ? `Are you sure you want to update Bill #${formData.billNumber} and automatically update the Items and Vendors master lists?`
            : `Are you sure you want to record Bill #${formData.billNumber} and automatically update the Items and Vendors master lists?`;

          App.Utils.confirmAction(
            confirmMsg,
            async () => {
              setDisabled('billSubmitBtn', true);
              try {
                const res = await Api.call('saveBill', formData);
                if (res?.success) {
                  await App.Bill.loadData();
                }
                if (res?.success && !isEdit) {
                  App.Bill.openReceiveModal();
                } else {
                  safeModalHide('receiveBillModal');
                }
                App.Utils.showToast(res?.message || 'Bill saved.', !res?.success);
              } catch (err) {
                App.Utils.showToast(err.message || 'Failed to save bill.', true);
              } finally {
                setDisabled('billSubmitBtn', false);
              }
            }
          );
        });

      document
        .getElementById('returnForm')
        ?.addEventListener('submit', e => {
          e.preventDefault();
          const { formData, items } = App.Return.serializeForm();
          if (!items.length) {
            App.Utils.showToast(
              'Please add at least one item to the return.',
              true
            );
            return;
          }

          const isEdit = !!formData.existingReturnNumber;
          const confirmMsg = isEdit
            ? `Are you sure you want to update Return #${formData.returnNumber}?`
            : `Are you sure you want to record Return #${formData.returnNumber}? This will be debited from Stock.`;

          App.Utils.confirmAction(
            confirmMsg,
            async () => {
              setDisabled('returnSubmitBtn', true);
              try {
                const res = await Api.call('saveReturn', formData);
                if (res?.success) {
                  await App.Return.loadData();
                }
                if (res?.success && !isEdit) {
                  App.Return.openReturnModal();
                } else {
                  safeModalHide('returnGoodsModal');
                }
                App.Utils.showToast(res?.message || 'Return saved.', !res?.success);
              } catch (err) {
                App.Utils.showToast(err.message || 'Failed to save return.', true);
              } finally {
                setDisabled('returnSubmitBtn', false);
              }
            }
          );
        });

      document
        .getElementById('wastageForm')
        ?.addEventListener('submit', e => App.Wastage.submit(e));

      document
        .getElementById('issueStockForm')
        ?.addEventListener('submit', e => App.Issue.submit(e));

      document
        .getElementById('itemForm')
        ?.addEventListener('submit', async e => {
          e.preventDefault();
          const { formData } = App.Item.serializeForm();

          setDisabled('itemSubmitBtn', true);
          try {
            const res = await Api.call('saveItem', formData);

            if (!res?.success && res?.data?.mergeable) {
              const { targetName, targetSize, targetStock, targetVendorCount } = res.data;
              App.Utils.confirmAction(
                `Item "${targetName}" (size: ${targetSize || '-'}) already exists with ` +
                `Stock: ${targetStock} and ${targetVendorCount} vendor(s) mapped. ` +
                `Merge this edit into it? Stock will combine and this edit's vendors will be added.`,
                async () => {
                  setDisabled('itemSubmitBtn', true);
                  try {
                    const mergeRes = await Api.call('mergeItemEdit', formData);
                    safeModalHide('itemModal');
                    App.Utils.showToast(mergeRes?.message || 'Item merged.', !mergeRes?.success);
                    if (mergeRes?.success) {
                      App.State.globalStock = [];
                      await App.Item.loadData();
                    }
                  } catch (mergeErr) {
                    App.Utils.showToast(mergeErr.message || 'Failed to merge item.', true);
                  } finally {
                    setDisabled('itemSubmitBtn', false);
                  }
                }
              );
              return;
            }

            const isEdit = !!formData.originalName;
            if (res?.success) {
              const thresholdInput = document.getElementById('formItemThreshold');
              const thresholdVal = thresholdInput ? parseInt(thresholdInput.value, 10) : NaN;
              if (!isNaN(thresholdVal) && thresholdVal >= 0) {
                const savedName = formData.itemName?.trim() || '';
                const savedSize = formData.itemSize?.trim() || '';
                try {
                  await Api.call('updateThreshold', savedName, savedSize, thresholdVal);
                } catch (_) {}
              }
              App.State.globalStock = [];
              await App.Item.loadData();
            }
            if (res?.success && !isEdit) {
              App.Item.openCreateModal();
            } else {
              safeModalHide('itemModal');
            }
            App.Utils.showToast(res?.message || 'Item saved.', !res?.success);
          } catch (err) {
            App.Utils.showToast(err.message || 'Failed to save item.', true);
          } finally {
            setDisabled('itemSubmitBtn', false);
          }
        });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      bindEnhancements();
      await App.Init();
    });
</script>
