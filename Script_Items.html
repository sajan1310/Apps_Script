        async mergeDuplicates() {
          App.Utils.confirmAction(
            'Scan Item Master for duplicates? This will: (1) auto-fix rows whose name is an unambiguous truncated/typo prefix of another row with the same size (renaming, merging stock, and re-pointing PO/Bill/BOM references), then (2) merge any remaining rows that share the exact same Name + Size (combining their remarks/narration/spec and vendor rates). This cannot be undone.',
            async () => {
              const btn = document.getElementById('btnMergeDuplicates');
              try {
                if (btn) { btn.disabled = true; btn.innerHTML = '<i class="bi bi-magic"></i> Merging…'; }
                const res = await Api.call('runScheduledItemCleanup');
                App.Utils.showToast(res?.message || 'Merge complete.', !res?.success);
                if (res?.success) {
                  App.State.globalStock = [];
                  await this.loadData();
                }
              } catch (err) {
                App.Utils.showToast(err.message || 'Merge failed.', true);
              } finally {
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-magic"></i> Merge Duplicates'; }
              }
            }
          );
        },

        // Groups raw getItemIdentityDriftReport() findings (one per
        // referencing row) into one entry per distinct stale (name, size) —
        // the Fix action operates on the whole identity at once (every sheet
        // that names it), not row-by-row.
        _groupDriftFindings(drift) {
          const groups = new Map();
          drift.forEach(d => {
            const key = d.itemName.toLowerCase() + '|' + (d.size || '').toLowerCase();
            if (!groups.has(key)) {
              groups.set(key, { itemName: d.itemName, size: d.size || '', sheets: new Map() });
            }
            const group = groups.get(key);
            const contexts = group.sheets.get(d.sheet) || [];
            contexts.push(d.context);
            group.sheets.set(d.sheet, contexts);
          });
          return Array.from(groups.values());
        },

        // Deduped, sorted current-Items-Master list shared by every drift
        // group's "repoint to" picker, cached on `this._driftTargetItems`
        // (indexed by array position — fixDriftReference looks the chosen
        // option back up by that index, same convention as the ajax `id` in
        // initItemSelect2 below). Just builds the cache; rendering is done
        // lazily per-dropdown by _initDriftTargetSelects's ajax transport,
        // NOT by dumping every item as a static <option> into every select —
        // with hundreds/thousands of items and several stale groups open at
        // once, that duplicated the full list N times over and made Select2
        // render its entire unfiltered results list on every open, which is
        // exactly what made the dropdown hang.
        _buildDriftTargetItems() {
          const seen = new Set();
          this._driftTargetItems = (App.State.globalItems || [])
            .filter(it => {
              const key = (it.name || '').toLowerCase() + '|' + (it.size || '').toLowerCase();
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            })
            .sort((a, b) => a.name.localeCompare(b.name) || a.size.localeCompare(b.size));
        },

        // Destroys any Select2 instances currently attached to
        // ".drift-target-select" elements before the modal body markup gets
        // thrown away and rebuilt — every OTHER Select2 usage in this file
        // destroys before re-init/removal (see destroyItemSelect2,
        // initCostContractorSelect2); skipping it here left Select2's own
        // document-level listeners attached to detached DOM nodes on every
        // checkReferenceIntegrity() re-render, which piles up across a
        // realistic session of "open → fix a few → re-check" cycles.
        _destroyDriftTargetSelects() {
          if (!window.jQuery?.fn?.select2) return;
          document.querySelectorAll('.drift-target-select').forEach(el => {
            const $el = window.jQuery(el);
            if ($el.data('select2')) $el.select2('destroy');
          });
        },

        // Turns every rendered ".drift-target-select" into a searchable,
        // paginated Select2 — same ajax/local-transport pattern as
        // initItemSelect2 (App.BOM's component item picker) so opening the
        // dropdown only ever renders one page (PAGE_SIZE) of results
        // regardless of how large Items Master is, instead of the whole
        // list at once.
        //
        // dropdownParent is the modal root (#itemDriftModal), NOT
        // document.body — Bootstrap's modal focus trap (tabindex="-1")
        // steals focus from any element outside the modal, which made
        // Select2's search input uneditable when the dropdown was
        // parented to body. The modal root is not itself scrollable
        // (only .modal-body scrolls), so Select2's position math is
        // reliable. This matches the pattern used by every other
        // Select2-in-a-modal in this file (see initItemSelect2,
        // initCostContractorSelect2, etc.).
        _initDriftTargetSelects() {
          if (!window.jQuery?.fn?.select2) return;
          const PAGE_SIZE = 40;
          const items = this._driftTargetItems || [];

          document.querySelectorAll('.drift-target-select').forEach(el => {
            const $el = window.jQuery(el);
            $el.select2({
              placeholder: 'Repoint to…',
              width: '100%',
              dropdownParent: App.Utils.select2DropdownParent($el),
              ajax: {
                delay: 150,
                data(params) {
                  return { q: params.term || '', page: params.page || 1 };
                },
                transport(params, success) {
                  const q = (params.data.q || '').trim();
                  const page = params.data.page || 1;
                  const start = (page - 1) * PAGE_SIZE;

                  const pool = q
                    ? items.map((it, idx) => ({ idx, it })).filter(({ it }) => App.Utils.matchesKeywords(`${it.name} ${it.size || ''}`, q))
                    : items.map((it, idx) => ({ idx, it }));

                  const pageSlice = pool.slice(start, start + PAGE_SIZE);
                  success({
                    results: pageSlice.map(({ idx, it }) => ({
                      id: String(idx),
                      text: `${it.name}${it.size ? ' (' + it.size + ')' : ''}`
                    })),
                    pagination: { more: (start + PAGE_SIZE) < pool.length }
                  });
                },
                processResults(data) { return data; }
              }
            }).on('change', function() {
              const fixBtn = this.closest('tr')?.querySelector('.drift-fix-btn');
              if (fixBtn) fixBtn.disabled = !this.value;
            });
          });
        },

        // Read-only diagnostic (module_items.js#getItemIdentityDriftReport) —
        // verifies that every Item Name/Size reference in Bill/PO/BOM/Process
        // Components/Return/Wastage/Issue/Production still resolves to a
        // current Items Master row, so a rename/merge cascade gap (past or
        // newly introduced) surfaces instead of silently corrupting Stock
        // math. Each distinct stale identity gets a "repoint to" picker and a
        // Fix button (see fixDriftReference) — nothing is changed just by
        // running the check itself.
        async checkReferenceIntegrity() {
          const btn = document.getElementById('btnCheckItemRefIntegrity');
          const originalBtnHtml = btn?.innerHTML;
          try {
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="bi bi-clipboard-check"></i> Checking…'; }
            const res = await Api.call('getItemIdentityDriftReport');
            if (!res?.success) {
              App.Utils.showToast(res?.message || 'Failed to check reference integrity.', true);
              return;
            }
            const drift = res.data || [];
            this._destroyDriftTargetSelects();
            if (drift.length === 0) {
              App.Utils.showToast(res.message || 'No drift found — every reference resolves to a current Items Master row.');
              safeModalHide('itemDriftModal');
              return;
            }

            const groups = this._groupDriftFindings(drift);
            this._buildDriftTargetItems();
            this._driftGroups = groups;

            const rowsHtml = groups.map((g, i) => {
              const sheetsHtml = Array.from(g.sheets.entries())
                .map(([sheet, contexts]) => `<div><strong>${escapeHtml(sheet)}</strong> (${contexts.length}): <span class="text-muted">${escapeHtml(contexts.slice(0, 3).join(', '))}${contexts.length > 3 ? ', …' : ''}</span></div>`)
                .join('');
              return `
                <tr>
                  <td>${escapeHtml(g.itemName)}${g.size ? ' <small class="text-muted">(' + escapeHtml(g.size) + ')</small>' : ''}</td>
                  <td>${sheetsHtml}</td>
                  <td style="min-width: 220px;">
                    <select class="form-select form-select-sm drift-target-select" id="driftTarget_${i}"></select>
                  </td>
                  <td>
                    <button type="button" class="btn btn-sm btn-warning fw-bold drift-fix-btn" disabled onclick="App.Item.fixDriftReference(${i})">Fix</button>
                  </td>
                </tr>`;
            }).join('');

            const body = document.getElementById('itemDriftModalBody');
            if (body) {
              body.innerHTML = `
                <p class="text-muted small" id="itemDriftSummary">These ${groups.length} distinct item identit${groups.length === 1 ? 'y' : 'ies'} (${drift.length} reference${drift.length === 1 ? '' : 's'} total) name an Item Name/Size that no longer exists in Items Master — most likely left behind by a rename or merge from before this check existed. Pick the item it should now resolve to and click Fix to repoint every reference to it at once. Nothing changes until you click Fix.</p>
                <div class="table-responsive">
                  <table class="table table-sm table-bordered align-middle">
                    <thead class="table-light">
                      <tr>
                        <th style="width: 20%;">Stale Item Referenced</th>
                        <th style="width: 40%;">Used In</th>
                        <th style="width: 30%;">Repoint To</th>
                        <th style="width: 10%;"></th>
                      </tr>
                    </thead>
                    <tbody>${rowsHtml}</tbody>
                  </table>
                </div>`;
            }
            // Select2 measures its container's width/position at init time —
            // doing that while the modal is still `display:none` (before
            // Bootstrap's fade-in finishes) reads bogus zero/stale layout
            // values and can leave a dropdown mispositioned or unable to
            // open correctly the first time. Wait for the modal to actually
            // be shown (laid out, fully visible) before initializing.
            // Guard: remove any stale listener from a previous
            // checkReferenceIntegrity() call that hasn't fired yet (user
            // re-ran the check before the modal finished opening).
            const driftModal = document.getElementById('itemDriftModal');
            if (driftModal) {
              if (this._driftShownHandler) driftModal.removeEventListener('shown.bs.modal', this._driftShownHandler);
              this._driftShownHandler = () => this._initDriftTargetSelects();
              driftModal.addEventListener('shown.bs.modal', this._driftShownHandler, { once: true });
            }
            safeModalShow('itemDriftModal');
          } catch (err) {
            App.Utils.showToast(err.message || 'Failed to check reference integrity.', true);
          } finally {
            if (btn) { btn.disabled = false; if (originalBtnHtml) btn.innerHTML = originalBtnHtml; }
          }
        },

        // Repoints one drift group (see checkReferenceIntegrity) to the
        // Items Master row the user picked in its "Repoint to" dropdown.
        // Removes just that row from the already-open modal on success
        // instead of re-running the whole check — a full re-fetch +
        // re-render would rebuild every OTHER row's Select2 too (discarding
        // any in-progress picks) just to reflect one row disappearing,
        // which is unnecessary: fixing (staleName, staleSize) deterministically
        // repoints every reference to it, so the group cannot reappear.
        async fixDriftReference(groupIndex) {
          const group = this._driftGroups?.[groupIndex];
          const select = document.getElementById(`driftTarget_${groupIndex}`);
          const picked = select?.value;
          const target = (picked !== undefined && picked !== '') ? this._driftTargetItems?.[Number(picked)] : null;
          if (!group || !target) {
            App.Utils.showToast('Pick an item to repoint to first.', true);
            return;
          }

          const btn = select?.closest('tr')?.querySelector('.drift-fix-btn');
          try {
            if (btn) { btn.disabled = true; btn.textContent = 'Fixing…'; }
            const res = await Api.call('fixItemIdentityDriftReference', group.itemName, group.size, target.name, target.size || '');
            App.Utils.showToast(res?.message || (res?.success ? 'Fixed.' : 'Failed to fix reference.'), !res?.success);
            if (res?.success) {
              this._removeDriftRow(groupIndex);
            }
          } catch (err) {
            App.Utils.showToast(err.message || 'Failed to fix reference.', true);
          } finally {
            if (btn) { btn.disabled = false; btn.textContent = 'Fix'; }
          }
        },

        // Removes one fixed group's row from the still-open drift modal
        // without touching any other row's Select2 instance, and updates the
        // remaining-count summary. Closes the modal once nothing is left.
        _removeDriftRow(groupIndex) {
          const select = document.getElementById(`driftTarget_${groupIndex}`);
          if (window.jQuery?.fn?.select2 && select && window.jQuery(select).data('select2')) {
            window.jQuery(select).select2('destroy');
          }
          select?.closest('tr')?.remove();
          if (this._driftGroups) this._driftGroups[groupIndex] = null;

          const remaining = document.querySelectorAll('#itemDriftModalBody tbody tr').length;
          if (remaining === 0) {
            safeModalHide('itemDriftModal');
            return;
          }
          const summary = document.getElementById('itemDriftSummary');
          if (summary) {
            summary.textContent = `${remaining} distinct item identit${remaining === 1 ? 'y' : 'ies'} remaining. Pick the item each should now resolve to and click Fix to repoint every reference to it at once.`;
          }
        },

        serializeForm() {
          const form = document.getElementById('itemForm');
          const formData = Object.fromEntries(new FormData(form));
          const vendors = [];

          $$('#itemVendorsBody tr').forEach(row => {
            const vendor = $('.item-vendor-name', row)?.value?.trim();
            if (vendor)
              vendors.push({
                vendor,
                rate: toNumber($('.item-vendor-rate', row)?.value)
              });
          });

          formData.vendors = JSON.stringify(vendors);
          formData.originalName =
            document.getElementById('originalItemName')?.value || '';
          formData.originalSize =
            document.getElementById('originalItemSize')?.value || '';
          return { formData, vendors };
        }
      };


    // ==========================================
    // BOM MASTER NAMESPACE
    // ==========================================
    App.State.globalBOMs = [];
    App.State.filteredBOMs = [];
    App.State.selectedBOMs = [];

    // Default suggested cost categories pre-filled when opening the BOM modal
    const DEFAULT_COST_CATEGORIES = ['Labor - Fitting', 'Rim Fitting', 'Paint Cost', 'General Office Expenses'];

    // ==========================================
    // PRODUCTS & PROCESSES NAMESPACE (merged tab)
    // Thin wrapper that owns the sub-tab switching between the Processes
    // sub-tab (App.Process) and the Products/BOM sub-tab (App.BOM).
    // ==========================================
    App.Products = {
      async enterTab() {
        this.switchSubTab('processTab');
      },

      switchSubTab(id) {
        $$('.products-sub-tab').forEach(t => t.style.display = 'none');
        const target = document.getElementById(id);
        if (target) target.style.display = 'block';

        $$('#productsSubTabs .nav-link').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + id)?.classList.add('active');

        if (id === 'processTab' && typeof App.Process !== 'undefined') {
          App.Process.loadData();
          // Process table groups by Model and Process Type (see
          // App.Process.renderTable) — both masters need to be loaded even
          // when landing on this sub-tab directly, not just via the BOM
          // sub-tab's own enterTab().
          App.Model.ensureLoaded();
          App.ProcessType.ensureLoaded();
        }
        if (id === 'bomTab' && typeof App.BOM !== 'undefined') App.BOM.enterTab();
      }
    };

    App.BOM = {
      // ── Access control (password-protected BOM data) ────────────────
      BOM_TOKEN_KEY: 'bomAccessToken',

      getToken() {
        return sessionStorage.getItem(this.BOM_TOKEN_KEY) || '';
      },

      setToken(token) {
        sessionStorage.setItem(this.BOM_TOKEN_KEY, token);
      },

      clearToken() {
        sessionStorage.removeItem(this.BOM_TOKEN_KEY);
      },

      // Called whenever the BOM tab is opened.
      enterTab() {
        App.Process.ensureLoaded();
        App.Contractor.ensureLoaded();
        App.Color.ensureLoaded();
        App.Model.ensureLoaded();
        App.ProcessType.ensureLoaded();
        if (this.getToken()) {
          this.loadData();
        } else {
          this.showLockedState();
          this.promptForAccess();
        }
      },

      showLockedState() {
        const tbody = document.getElementById('bomTableBody');
        if (tbody) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center p-5">
        <i class="bi bi-lock-fill fs-1 text-muted d-block mb-3"></i>
        <h5 class="fw-bold text-dark">Password Protected</h5>
        <p class="text-muted mb-3">This section contains confidential cost and pricing data.</p>
        <button class="btn btn-primary fw-bold" onclick="App.BOM.promptForAccess()">Enter Password</button>
      </td></tr>`;
        }
        const emptyState = document.getElementById('bomEmptyState');
        if (emptyState) emptyState.style.display = 'none';
        const pagination = document.getElementById('bomPagination');
        if (pagination) pagination.innerHTML = '';
      },

      promptForAccess() {
        const errorEl = document.getElementById('bomAccessError');
        const input = document.getElementById('bomAccessPassword');
        if (errorEl) errorEl.style.display = 'none';
        if (input) input.value = '';

        const modalEl = document.getElementById('bomAccessModal');
        if (modalEl && typeof bootstrap !== 'undefined') {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
          setTimeout(() => input?.focus(), 300);
        }
      },

      async submitAccessPassword() {
        const input = document.getElementById('bomAccessPassword');
        const errorEl = document.getElementById('bomAccessError');
        const submitBtn = document.getElementById('bomAccessSubmitBtn');
        const password = input ? input.value : '';

        if (submitBtn) submitBtn.disabled = true;

        try {
          const response = await Api.call('verifyBOMAccess', password);
          if (response.success) {
            this.setToken(response.data.token);
            const modalEl = document.getElementById('bomAccessModal');
            if (modalEl && typeof bootstrap !== 'undefined') {
              bootstrap.Modal.getInstance(modalEl)?.hide();
            }
            await this.loadData();
          } else if (errorEl) {
            errorEl.textContent = response.message;
            errorEl.style.display = 'block';
          }
        } catch (err) {
          if (errorEl) {
            errorEl.textContent = err.message || 'Failed to verify password.';
            errorEl.style.display = 'block';
          }
        } finally {
          if (submitBtn) submitBtn.disabled = false;
        }
      },

      // ── Data loading ──────────────────────────────────────────────
      // Loads the full BOM dataset (with costs/rates) for the BOM tab.
      // Requires a valid access token; re-prompts if missing/expired.
      async loadData() {
        const token = this.getToken();
        if (!token) {
          this.promptForAccess();
          return;
        }

        const tbody = document.getElementById('bomTableBody');
        if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4">Loading BOM Database...</td></tr>';

        try {
          const response = await Api.call('getBOMData', token);
          if (!response.success) {
            if (response.message && response.message.indexOf('password-protected') !== -1) {
              this.clearToken();
              this.promptForAccess();
              return;
            }
            App.Utils.showToast(response.message, true);
            return;
          }
          App.State.globalBOMs = response.data;
          App.State.filteredBOMs = response.data;
          App.State.bomCurrentPage = 1;
          App.State.selectedBOMs = [];
          this.renderTable();

          // Update Product ID dropdowns in Production tab
          if (App.Production && App.Production.populateProductSelect) {
            App.Production.populateProductSelect();
          }
        } catch (err) {
          App.Utils.showToast(err.message || 'Failed to load BOM database', true);
        }
      },

      // Loads a cost-free product list (no rates/costs) on app startup so the
      // Production tab's Product dropdown and production sheets work for all
      // users, even before the BOM password has been entered.
      async loadProductionData() {
        try {
          const response = await Api.call('getBOMProductionData');
          if (!response.success) {
            console.error('[BOM] ', response.message);
            return;
          }
          App.State.globalBOMs = response.data;
          App.State.filteredBOMs = response.data;

          if (App.Production && App.Production.populateProductSelect) {
            App.Production.populateProductSelect();
          }
        } catch (err) {
          console.error('[BOM] Failed to load product list:', err.message);
        }
      },

      filterData(searchTerm) {
        const term = searchTerm.toLowerCase().trim();
        if (!term) {
          App.State.filteredBOMs = App.State.globalBOMs;
        } else {
          App.State.filteredBOMs = App.State.globalBOMs.filter(bom => {
            const haystack = [
              bom.productId,
              bom.productName,
              ...bom.components.map(c => `${c.itemName} ${c.size || ''} ${c.color || ''} ${c.vendor} ${c.processId} ${c.processGroup}`)
            ].join(' ');
            return App.Utils.matchesKeywords(haystack, term);
          });
        }
        App.State.bomCurrentPage = 1;
        this.renderTable();
      },

      changePage(page) {
        App.State.bomCurrentPage = App.Utils.clampPage(page, App.State.filteredBOMs.length, App.State.bomRowsPerPage);
        this.renderTable();
      },

      renderTable() {
        const tbody = document.getElementById('bomTableBody');
        if (!tbody) return;

        const emptyState = document.getElementById('bomEmptyState');
        if (App.State.filteredBOMs.length === 0) {
          tbody.innerHTML = '';
          if (emptyState) emptyState.style.display = 'block';
          App.Utils.renderPagination('bomPagination', 0, 1, App.State.bomRowsPerPage, 'bom-page', 'Products');
          this.updateBulkButtons();
          return;
        }
        if (emptyState) emptyState.style.display = 'none';

        // Drag-and-drop reordering (and the "show everything on one page so
        // dragging isn't limited to the current page") only makes sense in
        // the default, unfiltered view — once searching, normal pagination
        // and a static order both resume.
        const searchEl = document.getElementById('searchBOM');
        const isFiltered = !!(searchEl && searchEl.value.trim());
        const dragEnabled = !isFiltered;

        const { filteredBOMs, bomCurrentPage: cur, bomRowsPerPage: pagedRpp } = App.State;
        const rpp = isFiltered ? pagedRpp : Math.max(filteredBOMs.length, 1);
        const start = (cur - 1) * rpp;
        const pageItems = filteredBOMs.slice(start, start + rpp);

        const selectAllChk = document.getElementById('selectAllBOMs');
        if (selectAllChk) {
          selectAllChk.checked = pageItems.length > 0 &&
            pageItems.every(bom => App.Selection.isSelected(App.State.selectedBOMs, bom.productId));
        }

        let html = '';
        pageItems.forEach(bom => {
          html += this.rowHtml(bom, dragEnabled);
        });

        tbody.innerHTML = html;

        App.Utils.renderPagination('bomPagination', filteredBOMs.length, cur, rpp, 'bom-page', 'Products');
        this.updateBulkButtons();
      },

      // Renders one <tr> for a BOM product. Shared by renderTable's full
      // rebuild and patchRowInPlace's single-row swap below.
      rowHtml(bom, dragEnabled) {
        const idx = App.State.globalBOMs.indexOf(bom);
        const key = String(bom.productId);
        const checked = App.Selection.isSelected(App.State.selectedBOMs, key) ? 'checked' : '';

        // Build a flat list of component lines, with a small group badge when
        // the BOM spans more than one process group.
        const groupOrder = [];
        const groupMap = {};
        bom.components.forEach(c => {
          const groupName = c.processGroup || 'General';
          if (!groupMap[groupName]) { groupMap[groupName] = []; groupOrder.push(groupName); }
          groupMap[groupName].push(c);
        });

        const multiGroup = groupOrder.length > 1;
        const componentLines = bom.components.map(c => {
          const groupBadge = multiGroup
            ? `<span class="badge bg-secondary me-1" style="font-size:0.65em;vertical-align:middle;">${escapeHtml(c.processGroup || 'General')}</span>`
            : '';
          const colorBadge = c.color
            ? `<span class="badge bg-info text-dark me-1" style="font-size:0.65em;vertical-align:middle;">${escapeHtml(c.color)}</span>`
            : '';
          return `${groupBadge}${colorBadge}• ${escapeHtml(c.itemName)} [${escapeHtml(c.size || '-')}] (${escapeHtml(String(c.qtyPerProduct))} qty @ ${formatCurrency(c.rate)} from ${escapeHtml(c.vendor || 'Custom')})`;
        });

        const PREVIEW_LIMIT = 3;
        const needsToggle = componentLines.length > PREVIEW_LIMIT;
        const previewId = `bom_cpreview_${key}`;

        let componentsCell;
        if (!needsToggle) {
          componentsCell = componentLines.join('<br>');
        } else {
          const visibleHtml = componentLines.slice(0, PREVIEW_LIMIT).join('<br>');
          const allHtml = componentLines.join('<br>');
          const remaining = componentLines.length - PREVIEW_LIMIT;
          componentsCell = `
          <div class="bom-preview-collapsed">
            ${visibleHtml}
            <br><a href="#" class="text-primary small fw-bold mt-1 d-inline-block" onclick="event.preventDefault();App.BOM.toggleComponents('${key}',true)">&#9660; Show ${remaining} more</a>
          </div>
          <div class="bom-preview-expanded" style="display:none">
            ${allHtml}
            <br><a href="#" class="text-muted small fw-bold mt-1 d-inline-block" onclick="event.preventDefault();App.BOM.toggleComponents('${key}',false)">&#9650; Show less</a>
          </div>`;
        }

        const rowAttrs = dragEnabled
          ? `draggable="true" ondragstart="App.BOM.onDragStart(event,'${escapeHtml(bom.productId)}')" ondragover="App.BOM.onDragOver(event)" ondrop="App.BOM.onDrop(event,'${escapeHtml(bom.productId)}')" ondragend="App.BOM.onDragEnd(event)"`
          : '';
        const handleCell = dragEnabled
          ? '<td class="text-center text-muted" style="cursor:grab;"><i class="bi bi-grip-vertical"></i></td>'
          : '<td></td>';

        return `<tr ${rowAttrs} data-bom-key="${escapeHtml(key)}">
        ${handleCell}
        <td class="text-center"><input type="checkbox" class="form-check-input bom-select-chk" data-key="${escapeHtml(key)}" ${checked} onchange="App.BOM.onRowSelectChange()"></td>
        <td><span class="badge bg-dark fs-6 shadow-sm">${escapeHtml(bom.productId)}</span></td>
        <td><strong class="text-primary">${escapeHtml(bom.productName)}</strong></td>
        <td id="${previewId}"><small class="text-muted" style="line-height: 1.6;">${componentsCell}</small></td>
        <td class="text-end fw-bold text-success"${
          (bom.colorCosts || []).length > 1
            ? ` title="Cost by color — ${escapeHtml((bom.colorCosts || []).map(c => `${c.color}: ${formatCurrency(c.totalCost)}`).join(', '))} (headline total shown is for ${escapeHtml(bom.colorCosts[0].color)})"`
            : ''
        }>${formatCurrency(bom.grandTotal ?? bom.totalCost)}</td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-primary btn-action w-100 mb-1" onclick="App.BOM.openEditModal('${idx}')">Edit BOM</button>
          <button class="btn btn-sm btn-outline-dark btn-action w-100 mb-1" onclick="App.BOM.openDuplicateModal('${idx}')">Duplicate BOM</button>
          <button class="btn btn-sm btn-danger btn-action w-100" onclick="App.BOM.delete('${escapeHtml(bom.productId)}')">Delete</button>
        </td>
      </tr>`;
      },

      // Patches one already-loaded product's data + its rendered <tr> after
      // an edit save, instead of a full loadData() reload — see
      // App.Production.patchRowInPlace's doc comment (Script_Production.html)
      // for the full rationale/trade-offs this mirrors. productId is
      // server-assigned and never user-editable, so this is a safe stable
      // key. Any expanded "Show more" component preview on this row resets
      // to collapsed (its state lives in the DOM, not JS state) — cosmetic,
      // same as a fresh render. Drag-and-drop's dragEnabled flag isn't
      // known here (only renderTable computes it from the search box), so
      // this re-derives it the same way. Returns false — caller should fall
      // back to loadData() — if the product isn't currently loaded or isn't
      // on the displayed page (e.g. mid-search).
      patchRowInPlace(freshProduct) {
        const key = String(freshProduct.productId);
        const existing = App.State.globalBOMs.find(b => String(b.productId) === key);
        if (!existing) return false;

        Object.assign(existing, freshProduct);

        const tr = document.querySelector(`#bomTableBody tr[data-bom-key="${key}"]`);
        if (!tr) return false;

        const searchEl = document.getElementById('searchBOM');
        const dragEnabled = !(searchEl && searchEl.value.trim());
        tr.outerHTML = this.rowHtml(existing, dragEnabled);
        return true;
      },

      // Drag-and-drop manual reorder (default unfiltered view only — see
      // renderTable's dragEnabled check). _dragSrcId tracks which row is
      // currently being dragged between dragstart and drop.
      _dragSrcId: null,

      onDragStart(e, productId) {
        this._dragSrcId = productId;
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', productId); } catch (err) { /* ignored */ }
        }
      },

      onDragOver(e) {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      },

      async onDrop(e, targetProductId) {
        e.preventDefault();
        const srcId = this._dragSrcId;
        this._dragSrcId = null;
        if (!srcId || srcId === targetProductId) return;

        const order = [...App.State.globalBOMs].sort((a, b) => a.sequence - b.sequence).map(b => b.productId);
        const fromIdx = order.indexOf(srcId);
        if (fromIdx === -1 || order.indexOf(targetProductId) === -1) return;
        order.splice(fromIdx, 1);
        const toIdx = order.indexOf(targetProductId);
        order.splice(toIdx, 0, srcId);

        try {
          const res = await Api.call('reorderBOM', order, this.getToken());
          if (!res.success) {
            App.Utils.showToast(res.message, true);
            return;
          }
          this.loadData();
        } catch (err) {
          App.Utils.showToast(err.message || 'Failed to reorder products', true);
        }
      },

      onDragEnd() {
        this._dragSrcId = null;
      },

      toggleSelectAll(masterChk) {
        App.Selection.toggleAll(App.State.selectedBOMs, 'bom-select-chk', masterChk);
        this.updateBulkButtons();
      },

      onRowSelectChange() {
        App.Selection.syncFromRows(App.State.selectedBOMs, 'bom-select-chk', 'selectAllBOMs');
        this.updateBulkButtons();
      },

      updateBulkButtons() {
        const count = App.State.selectedBOMs.length;
        App.Selection.updateButton('btnBulkDeleteBOMs', count, '<i class="bi bi-trash"></i> Delete Selected');
        App.Selection.updateButton('btnBulkPrintBOMs', count, '<i class="bi bi-printer"></i> Print Selected');
      },

      // Read-only diagnostic (module_bom.js#getBomProcessComponentsDrift) —
      // never blocks or changes anything, just surfaces where a product's
      // BOM costing qty and its process's actual recipe qty for the same
      // item have drifted apart, so a human can judge whether that's
      // intentional or a data-entry slip.
      async checkRecipeDrift() {
        try {
          const res = await Api.call('getBomProcessComponentsDrift');
          if (!res?.success) {
            App.Utils.showToast(res?.message || 'Failed to check recipe drift.', true);
            return;
          }
          const drift = res.data || [];
          if (drift.length === 0) {
            App.Utils.showToast(res.message || 'No drift found — BOM and process recipe quantities match everywhere they overlap.');
            return;
          }

          const rowsHtml = drift.map(d => `
            <tr>
              <td>${escapeHtml(d.productName)} <small class="text-muted">(${escapeHtml(d.productId)})</small></td>
              <td>${escapeHtml(d.itemName)}${d.size ? ' <small class="text-muted">(' + escapeHtml(d.size) + ')</small>' : ''}</td>
              <td class="text-end">${escapeHtml(String(d.bomQtyPerProduct))}</td>
              <td class="text-end">${escapeHtml(String(d.recipeQtyPerUnit))}</td>
            </tr>`).join('');

          const body = document.getElementById('bomDriftModalBody');
          if (body) {
            body.innerHTML = `
              <p class="text-muted small">These ${drift.length} item(s) have a different Qty/Product on the BOM (costing) than Qty/Unit on the process recipe (actual shop-floor consumption) — both are separately editable, so this is informational only. Nothing here is auto-fixed or blocked.</p>
              <div class="table-responsive">
                <table class="table table-sm table-bordered">
                  <thead class="table-light">
                    <tr><th>Product</th><th>Item</th><th class="text-end">BOM Qty/Product</th><th class="text-end">Recipe Qty/Unit</th></tr>
                  </thead>
                  <tbody>${rowsHtml}</tbody>
                </table>
              </div>`;
          }
          safeModalShow('bomDriftModal');
        } catch (err) {
          App.Utils.showToast(err.message || 'Failed to check recipe drift.', true);
        }
      },

      toggleComponents(productId, expand) {
        const cell = document.getElementById(`bom_cpreview_${productId}`);
        if (!cell) return;
        const collapsed = cell.querySelector('.bom-preview-collapsed');
        const expanded = cell.querySelector('.bom-preview-expanded');
        if (collapsed) collapsed.style.display = expand ? 'none' : '';
        if (expanded) expanded.style.display = expand ? '' : 'none';
      },

      async bulkDelete() {
        const selected = App.State.selectedBOMs.slice();
        if (selected.length === 0) return;

        App.Utils.confirmAction(
          `Are you sure you want to permanently delete ${selected.length} BOM definition(s)? This will permanently remove their components. BOMs currently in use by Production lots, Client Orders, or Dispatch will be skipped.`,
          async () => {
            try {
              const res = await Api.call('deleteBOMsBulk', selected, App.BOM.getToken());
              // res.message already reports both the delete count and any
              // skipped IDs with the server's real reason (see
              // deleteBOMsBulk in module_bom.js) — a second toast here would
              // just overwrite it in the shared toast element before it's
              // readable, silently dropping the delete count and mislabeling
              // every skip reason as "in use by Production".
              App.Utils.showToast(res.message, !res.success);
              if (res.success) {
                App.State.selectedBOMs = [];
                await this.loadData();
              }
            } catch (err) {
              App.Utils.showToast(err.message || 'Failed to delete BOMs', true);
            }
          }
        );
      },

      bulkPrint() {
        const selected = App.State.selectedBOMs;
        if (selected.length === 0) return;

        const boms = App.State.globalBOMs.filter(b => App.Selection.isSelected(selected, b.productId));
        if (boms.length === 0) return;

        App.Print.triggerBulk(boms, bom => this.buildBOMPrintPageHtml(bom), 'BOM_Cost_Sheets_Selected');
      },

      // Builds a fully self-contained "BOM Cost Sheet / Recipe Card" page
      // (mirrors #print-bom-container's markup/styling) for bulk printing.
      buildBOMPrintPageHtml(bom) {
        const BRAND = '#6610f2';
        const reportDate = new Date().toLocaleDateString('en-GB');

        // Group components by Process Group, preserving first-seen order.
        const groupOrder = [];
        const groupMap = {};
        (bom.components || []).forEach(c => {
          const groupName = c.processGroup || 'General';
          if (!groupMap[groupName]) {
            groupMap[groupName] = [];
            groupOrder.push(groupName);
          }
          groupMap[groupName].push(c);
        });

        let groupsHtml = '';
        groupOrder.forEach(groupName => {
          let rowsHtml = '';
          groupMap[groupName].forEach(c => {
            rowsHtml += `<tr>
          <td style="padding:6px;border:1px solid #e5e5e5;font-weight:600;">${escapeHtml(c.itemName)}</td>
          <td style="padding:6px;border:1px solid #e5e5e5;">${escapeHtml(c.size || '-')}</td>
          <td style="padding:6px;border:1px solid #e5e5e5;color:#555;">${escapeHtml(c.narration || '-')}</td>
          <td style="padding:6px;border:1px solid #e5e5e5;">${escapeHtml(c.vendor || 'Custom')}</td>
          <td style="padding:6px;border:1px solid #e5e5e5;text-align:center;">${Number(toNumber(c.qtyPerProduct).toFixed(4))}</td>
          <td style="padding:6px;border:1px solid #e5e5e5;text-align:right;">${formatCurrency(c.rate)}</td>
          <td style="padding:6px;border:1px solid #e5e5e5;text-align:right;font-weight:700;">${formatCurrency(c.lineCost)}</td>
        </tr>`;
          });

          groupsHtml += `
      <div style="margin-bottom:14px;page-break-inside:avoid;break-inside:avoid;">

        </div>

      // Destroys Select2 instances on all rows and empties the process groups container
      clearGroupsContainer() {
        const container = document.getElementById('bomGroupsContainer');
        if (!container) return;

        container.querySelectorAll('.bom-group-items-body tr').forEach(row => this.destroyItemSelect2(row));
        container.innerHTML = '';
      },

      // Groups a flat components array by Process ID and renders one group
      // card per distinct process, in order of first appearance.
      renderGroupedComponents(components) {
        if (!components || components.length === 0) {
          this.addGroup('');
          return;
        }

        const groupOrder = [];
        const groupMap = {};
        components.forEach(comp => {
          const processId = comp.processId || '';
          if (!groupMap[processId]) {
            groupMap[processId] = [];
            groupOrder.push(processId);
          }
          groupMap[processId].push(comp);
        });

        groupOrder.forEach(processId => this.addGroup(processId, groupMap[processId]));
      },

      // Builds the <option> list for a group's Process select: every active
      // Process Master entry (value = Process ID, label = Process Name), plus
      // a "— No Process —" default, plus the current value itself if it
      // doesn't match any active process (so editing an older BOM doesn't
      // silently change/lose an unrecognized reference).
      _buildProcessGroupOptionsHtml(selectedProcessId) {
        const processes = (App.State.globalProcesses || []).filter(p => p.active);
        const current = (selectedProcessId || '').trim();

        let html = `<option value="" ${!current ? 'selected' : ''}>— No Process —</option>`;
        let found = false;
        processes.forEach(p => {
          const sel = p.processId === current;
          if (sel) found = true;
          html += `<option value="${escapeHtml(p.processId)}" ${sel ? 'selected' : ''}>${escapeHtml(p.processName)}</option>`;
        });
        if (current && !found) {
          html += `<option value="${escapeHtml(current)}" selected>${escapeHtml(current)} (unrecognized)</option>`;
        }
        return html;
      },

      // Populates the "Import from Process..." picker with active Process
      // Master entries (real processes only — not the "Dispatch / Logistics"
      // virtual category, which has no component recipe to import).
      populateImportProcessSelect() {
        const select = document.getElementById('bomImportProcessSelect');
        if (!select) return;

        if (window.jQuery?.fn?.select2 && window.jQuery(select).data('select2'))
          window.jQuery(select).select2('destroy');

        let html = '<option value="">Import from Process...</option>';
        (App.State.globalProcesses || []).filter(p => p.active).forEach(p => {
          html += `<option value="${escapeHtml(p.processId)}">${escapeHtml(p.processName)}</option>`;
        });
        select.innerHTML = html;
        App.Utils.autoSelectOnlyOption(select);

        if (window.jQuery?.fn?.select2) {
          const $s = window.jQuery(select);
          $s.select2({
            placeholder: 'Import from Process...',
            width: '100%',
            matcher: App.Utils.select2Matcher,
            dropdownParent: App.Utils.select2DropdownParent($s)
          });
        }
      },

      // Imports a Process's predefined recipe (components + qty) as a new
      // component group, plus one Additional Cost row per contractor rate
      // card entry for that process — a one-time copy, not a live link, so
      // editing it here never changes the original Process recipe/rate card,
      // and editing the Process later never silently changes this BOM.
      async importProcess() {
        const select = document.getElementById('bomImportProcessSelect');
        const btn = document.getElementById('btnImportProcess');
        const processId = select?.value;
        if (!processId) return;

        const process = (App.State.globalProcesses || []).find(p => p.processId === processId);
        if (!process) return;

        // A Product Group card is keyed 1:1 to a real Process (see addGroup /
        // _buildProcessGroupOptionsHtml) — importing the same Process twice
        // creates two cards that both save under the same Process Group, which
        // then re-collapse into one card showing every component doubled the
        // next time this product's BOM is loaded. Block re-importing a Process
        // already present as a group instead of letting that happen silently.
        const alreadyImported = Array.from(document.querySelectorAll('#bomGroupsContainer .group-name-input'))
          .some(sel => sel.value === processId);
        if (alreadyImported) {
          App.Utils.showToast(`"${process.processName}" is already a Process Group on this product — remove it first if you want to re-import.`, true);
          return;
        }

        // Guards against a double-click firing this twice before the first
        // call's await resolves, which would import the same recipe twice.
        if (btn) btn.disabled = true;
        if (select) select.disabled = true;

        try {
          const [compRes, rateRes] = await Promise.all([
            Api.call('getProcessComponentsData', processId),
            Api.call('getContractorRatesData')
          ]);

          const components = compRes.success ? (compRes.data || []) : [];
          this.addGroup(process.processId, components.length > 0
            ? components.map(c => ({ itemName: c.itemName, size: c.size, narration: c.narration, qtyPerProduct: c.qtyPerUnit }))
            : null);

          const rates = rateRes.success
            ? (rateRes.data || []).filter(r => r.processName.toLowerCase() === process.processName.toLowerCase())
            : [];
          rates.forEach(r => {
            this.addCostRow({
              description: `${process.processName} - Contractor`,
              rate: r.ratePerUnit,
              processName: process.processName,
              contractorName: r.contractorName
            });
          });

          this.calculateCost();
          select.value = '';

          const costNote = rates.length > 0 ? ` and ${rates.length} contractor cost line(s)` : ' (no contractor rate card entry found for this process — add a cost line manually if needed)';
          App.Utils.showToast(`Imported "${process.processName}" recipe${costNote}.`, false);
        } catch (err) {
          App.Utils.showToast(err.message || 'Failed to import process', true);
        } finally {
          if (btn) btn.disabled = false;
          if (select) select.disabled = false;
        }
      },

      // Creates a new "Process Group" card. If `components` is provided, populates
      // it with a row per component; otherwise adds a single empty starter row.
      addGroup(groupName = '', components = null) {
        const container = document.getElementById('bomGroupsContainer');
        if (!container) return null;

        const groupId = 'bom_group_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

        const cardHtml = `
      <div class="card mb-3 border bom-group-card" id="${groupId}">
        <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2 py-2">
          <div class="d-flex align-items-center gap-2 flex-grow-1" style="min-width: 240px;">
            <span class="text-muted small fw-bold text-nowrap">Process:</span>
            <select class="form-select form-select-sm fw-bold group-name-input" style="max-width: 260px;">
              ${this._buildProcessGroupOptionsHtml(groupName)}
            </select>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span class="badge bg-light text-dark border">Subtotal: <span class="group-subtotal">₹0.00</span></span>
            <button type="button" class="btn btn-outline-danger btn-sm" onclick="App.BOM.removeGroup('${groupId}')">✕ Remove Group</button>
          </div>
        </div>
        <div class="card-body p-2">
          <div class="table-responsive">
            <table class="table table-bordered align-middle bg-white shadow-sm mb-2">
              <thead class="table-light">
                <tr>
                  <th style="width: 30%;">Component Item Selection *</th>
                  <th style="width: 10%;">Size</th>
                  <th style="width: 10%;">Narration</th>
                  <th style="width: 10%;">Color</th>
                  <th style="width: 22%;">Vendor & Negotiated Rates *</th>
                  <th style="width: 13%;">Qty Needed *</th>
                  <th style="width: 5%; text-align: center;">✕</th>
                </tr>
              </thead>
              <tbody class="bom-group-items-body" id="${groupId}_items">
                <!-- Rows appended dynamically -->
              </tbody>
            </table>
          </div>
          <button type="button" class="btn btn-outline-primary btn-sm fw-bold me-2" onclick="App.BOM.addRow('${groupId}')">+ Add Component Item</button>
          <a href="#" class="small" onclick="App.Color.openModal(); return false;">Manage Color Master &#8599;</a>
        </div>
      </div>
    `;

        container.insertAdjacentHTML('beforeend', cardHtml);

        if (components && components.length > 0) {
          components.forEach(comp => this.addRow(groupId, comp));
        } else {
          this.addRow(groupId);
        }

        return groupId;
      },

      // Removes a process group card. Requires at least one group to remain, and
      // confirms with the user if the group still has component rows.
      removeGroup(groupId) {
        const container = document.getElementById('bomGroupsContainer');
        const card = document.getElementById(groupId);
        if (!container || !card) return;

        const rows = card.querySelectorAll('.bom-group-items-body tr');
        const isLast = container.querySelectorAll('.bom-group-card').length <= 1;

        const removeNow = () => {
          rows.forEach(row => this.destroyItemSelect2(row));
          card.remove();
          if (isLast) this.addGroup();
          this.calculateCost();
        };

        const filledRows = Array.from(rows).filter(r => {
          const sel = r.querySelector('.comp-item-select');
          return sel && sel.value !== '';
        });

        if (filledRows.length > 0) {
          App.Utils.confirmAction(
            `Remove this process group and its ${filledRows.length} component(s)?`,
            removeNow
          );
        } else {
          removeNow();
        }
      },

      // Populates the Additional/Dynamic Costs table. Falls back to the default
      // suggested cost categories when no costs have been saved yet.
      populateCostRows(costs) {
        const tbody = document.getElementById('bomCostsBody');
        if (!tbody) return;

        tbody.innerHTML = '';
        const list = (costs && costs.length > 0)
          ? costs
          : DEFAULT_COST_CATEGORIES.map(description => ({ description, rate: 0 }));

        list.forEach(cost => this.addCostRow(cost));
      },

        this.clearGroupsContainer();

        this.populateCostRows();
        this.populateImportProcessSelect();

        const modalEl = document.getElementById('editBomModal');
        if (modalEl && typeof bootstrap !== 'undefined') {

          document.getElementById('bomVisibleProductId').value = 'PRD-1001';

      openEditModal(idx) {
        const bom = App.State.globalBOMs[idx];
        if (!bom) return;

        const form = document.getElementById('bomForm');
        if (form) form.reset();

        document.getElementById('bomProductId').value = bom.productId;
        document.getElementById('bomVisibleProductId').value = bom.productId;
        document.getElementById('bomProductName').value = bom.productName;
        document.getElementById('bomRemarks').value = bom.remarks || '';

      // Opens the Create modal pre-filled with another BOM's contents, but with

      delete(productId) {

          `Are you sure you want to delete the BOM definition for Product "${productId}"? This will permanently remove its components.`,
          async () => {

              const res = await Api.call('deleteBOM', productId, App.BOM.getToken());
              App.Utils.showToast(res.message, !res.success);
              if (res.success) {
                await this.loadData();

            }
          }
