<script>
  'use strict';
  // Script_Items.html -- App.Item, App.Products, App.BOM

      // ── Items Master ─────────────────────────────────────────────
      App.Item = {
        METADATA_FILTER_OPTIONS: [
          { value: 'pendingOrder', label: 'Pending Order' },
          { value: 'lowStock', label: 'Low Stock' },
          { value: 'zeroStock', label: 'Zero Stock' },
          { value: 'hasRemarks', label: 'Has Remarks' },
          { value: 'hasSpecification', label: 'Has Specification' },
          { value: 'noMetadata', label: 'No Metadata' }
        ],

        async loadData() {
          const tbody = document.getElementById('itemTableBody');
          if (tbody)
            tbody.innerHTML =
              '<tr><td colspan="7" class="text-center p-4">Fetching Items Master…</td></tr>';

          try {
            const stockNeeded = App.State.globalStock.length === 0;
            const [res, stockRes] = await Promise.all([
              Api.call('getItemsData'),
              stockNeeded ? Api.call('getStockData') : Promise.resolve(null)
            ]);

            if (stockRes?.success) {
              App.State.globalStock = Array.isArray(stockRes.data) ? stockRes.data : [];
              App.State.filteredStock = [...App.State.globalStock];
            }

            if (!res?.success) {
              App.Utils.showToast(
                res?.message || 'Failed to load items.',
                true
              );
              return;
            }

            App.State.globalItems = Array.isArray(res.data) ? res.data : [];
            App.State.selectedItems = [];
            this.updateBulkDeleteButton();

            this.populateDatalists();
            this.updateColumnFilterIcons();
            this.filterData(App.State.itemSearchTerm);
            this.renderSyncBanner();
          } catch (err) {
            App.Utils.showToast(err.message || 'Failed to load items.', true);
          }
        },

        // Items present in Item Master with no matching Stock row (by Name +
        // Size). Surfaced via the orphan banner/badge so the user can decide
        // to keep (create the missing Stock row) or discard each one —
        // mirrors the "no metadata" detection already used by getMetaInfo.
        getOrphanItems() {
          return App.State.globalItems.filter(item =>
            !App.State.globalStock.some(
              s => App.Utils.sameText(s.name, item.name) && App.Utils.sameText(s.size || '', item.size || '')
            )
          );
        },

        renderSyncBanner() {
          const orphans = this.getOrphanItems();
          const banner = document.getElementById('itemOrphanBanner');
          const bannerText = document.getElementById('itemOrphanBannerText');
          const badge = document.getElementById('itemOrphanBadge');

          if (banner && bannerText) {
            banner.classList.toggle('d-none', orphans.length === 0);
            bannerText.textContent = `${orphans.length} item(s) in Item Master have no matching Stock row.`;
          }
          if (badge) {
            badge.classList.toggle('d-none', orphans.length === 0);
            badge.textContent = orphans.length;
          }
        },

        // Stable key for an orphan row's checkbox/selection state — same
        // shape as itemKey() so it stays consistent with the rest of the app.
        orphanKey(item) {
          return `${item.name}|${item.size || ''}`;
        },

        openSyncReview() {
          const orphans = this.getOrphanItems();
          const tbody = document.getElementById('syncReviewBody');
          if (!tbody) return;

          App.State.selectedSyncReview = [];

          tbody.innerHTML = orphans.length === 0
            ? '<tr><td colspan="5" class="text-center text-success fw-bold p-4">No orphaned items. Stock and Item Master are in sync.</td></tr>'
            : orphans.map((item, idx) => `
              <tr>
                <td class="text-center"><input type="checkbox" class="form-check-input sync-review-chk" data-key="${escapeHtml(this.orphanKey(item))}" onchange="App.Item.onSyncReviewSelectChange()"></td>
                <td>${escapeHtml(item.name || '')}</td>
                <td>${escapeHtml(item.size || '')}</td>
                <td><input type="number" class="form-control form-control-sm" id="syncReviewQty${idx}" value="0" min="0" step="1"></td>
                <td class="text-center">
                  <button class="btn btn-success btn-sm fw-bold me-1" onclick="App.Item.keepOrphan('${escapeHtml(item.name || '')}', '${escapeHtml(item.size || '')}', ${idx})"><i class="bi bi-check-lg"></i> Keep</button>
                  <button class="btn btn-danger btn-sm fw-bold" onclick="App.Item.discardOrphan('${escapeHtml(item.name || '')}', '${escapeHtml(item.size || '')}')"><i class="bi bi-trash"></i> Discard</button>
                </td>
              </tr>
            `).join('');

          this.updateSyncReviewBulkButtons();

          const modalEl = document.getElementById('syncReviewModal');
          if (modalEl && typeof bootstrap !== 'undefined') {
            bootstrap.Modal.getOrCreateInstance(modalEl).show();
          }
        },

        toggleSelectAllOrphans(masterChk) {
          App.Selection.toggleAll(App.State.selectedSyncReview, 'sync-review-chk', masterChk);
          this.updateSyncReviewBulkButtons();
        },

        onSyncReviewSelectChange() {
          App.Selection.syncFromRows(App.State.selectedSyncReview, 'sync-review-chk', 'selectAllSyncReview');
          this.updateSyncReviewBulkButtons();
        },

        updateSyncReviewBulkButtons() {
          const count = App.State.selectedSyncReview.length;
          App.Selection.updateButton('btnSyncReviewKeepSelected', count, '<i class="bi bi-check-lg"></i> Keep Selected');
          App.Selection.updateButton('btnSyncReviewDiscardSelected', count, '<i class="bi bi-trash"></i> Discard Selected');
        },

        // Resolves the orphan rows currently checked in the Sync Review
        // modal, pairing each with its own per-row quantity input.
        getSelectedOrphanRows() {
          const orphans = this.getOrphanItems();
          return orphans
            .map((item, idx) => ({ item, idx }))
            .filter(({ item }) => App.Selection.isSelected(App.State.selectedSyncReview, this.orphanKey(item)))
            .map(({ item, idx }) => ({
              name: item.name || '',
              size: item.size || '',
              initialStock: Number(document.getElementById(`syncReviewQty${idx}`)?.value) || 0
            }));
        },

        async keepOrphan(name, size, idx) {
          const qtyInput = document.getElementById(`syncReviewQty${idx}`);
          const initialStock = Number(qtyInput?.value) || 0;

          try {
            const res = await Api.call('keepOrphanItem', name, size, initialStock);
            App.Utils.showToast(res?.message || 'Stock row created.', !res?.success);
            if (res?.success) {
              App.State.globalStock = [];
              await this.loadData();
              this.openSyncReview();
            }
          } catch (err) {
            App.Utils.showToast(err.message || 'Failed to create Stock row.', true);
          }
        },

        async discardOrphan(name, size) {
          App.Utils.confirmAction(
            `Discard "${name}" (size: "${size}") from Item Master? This cannot be undone.`,
            async () => {
              try {
                const res = await Api.call('deleteItem', name, size);
                App.Utils.showToast(res?.message || 'Item discarded.', !res?.success);
                if (res?.success) {
                  await this.loadData();
                  this.openSyncReview();
                }
              } catch (err) {
                App.Utils.showToast(err.message || 'Failed to discard item.', true);
              }
            }
          );
        },

        async keepSelectedOrphans() {
          const rows = this.getSelectedOrphanRows();
          if (!rows.length) return;

          try {
            setDisabled('btnSyncReviewKeepSelected', true);
            const res = await Api.call('keepOrphanItemsBulk', rows);
            App.Utils.showToast(res?.message || 'Stock rows created.', !res?.success);
            if (res?.success) {
              App.State.globalStock = [];
              await this.loadData();
              this.openSyncReview();
            }
          } catch (err) {
            App.Utils.showToast(err.message || 'Failed to create Stock rows.', true);
          } finally {
            setDisabled('btnSyncReviewKeepSelected', false);
          }
        },

        async discardSelectedOrphans() {
          const rows = this.getSelectedOrphanRows();
          if (!rows.length) return;

          App.Utils.confirmAction(
            `Discard ${rows.length} selected item(s) from Item Master? This cannot be undone.`,
            async () => {
              try {
                setDisabled('btnSyncReviewDiscardSelected', true);
                const res = await Api.call('deleteItemsBulk', rows);
                App.Utils.showToast(res?.message || 'Items discarded.', !res?.success);
                if (res?.success) {
                  await this.loadData();
                  this.openSyncReview();
                }
              } catch (err) {
                App.Utils.showToast(err.message || 'Failed to discard items.', true);
              } finally {
                setDisabled('btnSyncReviewDiscardSelected', false);
              }
            }
          );
        },

        // Computes the value list for a column's filter dropdown (Item Name /
        // Size / Narration / Vendor are derived from current data; Meta Data
        // uses the fixed METADATA_FILTER_OPTIONS list).
        getColumnFilterOptions(key) {
          if (key === 'metadata') return this.METADATA_FILTER_OPTIONS;

          const values = new Set();
          App.State.globalItems.forEach(item => {
            if (key === 'vendor') {
              (item.vendors || []).forEach(v => {
                if (v.vendor) values.add(v.vendor);
              });
            } else if (item[key]) {
              values.add(item[key]);
            }
          });

          return [...values]
            .sort((a, b) => a.localeCompare(b))
            .map(v => ({ value: v, label: v }));
        },

        // Updates the funnel icon's active state in each header cell to
        // reflect whether that column currently has a filter applied.
        updateColumnFilterIcons() {
          document.querySelectorAll('.th-filter-btn').forEach(btn => {
            const key = btn.dataset.filterKey;
            const active = (App.State.itemColumnFilters[key] || []).length > 0;
            btn.classList.toggle('active', active);
          });
        },

        // Opens (or closes, if already open for this column) the Excel-style
        // checklist dropdown anchored under the clicked header's funnel icon.
        toggleColumnFilter(evt, key) {
          evt.stopPropagation();
          let panel = document.getElementById('itemColFilterPanel');

          if (panel && panel.dataset.key === key) {
            panel.remove();
            return;
          }
          if (panel) panel.remove();

          const btn = evt.currentTarget;
          panel = document.createElement('div');
          panel.id = 'itemColFilterPanel';
          panel.className = 'col-filter-panel';
          panel.dataset.key = key;
          panel.innerHTML = `
            <div class="po-ms-search-wrap">
              <input type="text" class="form-control form-control-sm" placeholder="Search...">
            </div>
            <div class="col-filter-actions">
              <button type="button" data-action="select-all">Select All</button>
              <button type="button" data-action="clear">Clear</button>
            </div>
            <ul class="po-ms-options"></ul>`;
          document.body.appendChild(panel);

          const rect = btn.getBoundingClientRect();
          panel.style.top = `${rect.bottom + window.scrollY + 4}px`;
          panel.style.left = `${Math.min(rect.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 250)}px`;

          const searchInput = panel.querySelector('input');
          const optionsList = panel.querySelector('.po-ms-options');

          const renderOptions = (term) => {
            const allOptions = this.getColumnFilterOptions(key);
            const selected = App.State.itemColumnFilters[key] || [];
            const t = (term || '').toLowerCase().trim();
            const visible = allOptions.filter(o => !t || o.label.toLowerCase().includes(t));

            optionsList.innerHTML = visible.map(o => {
              const on = selected.includes(o.value);
              return `<li class="po-ms-option${on ? ' checked' : ''}" data-value="${escapeHtml(o.value)}">
                <span class="po-ms-check">${on ? '✓' : ''}</span>
                <span>${escapeHtml(o.label)}</span>
              </li>`;
            }).join('') || '<li class="po-ms-empty">No values found</li>';
          };

          searchInput.addEventListener('input', () => renderOptions(searchInput.value));
          searchInput.addEventListener('click', e => e.stopPropagation());
          panel.addEventListener('click', e => e.stopPropagation());

          panel.querySelector('[data-action="select-all"]').addEventListener('click', () => {
            const t = searchInput.value;
            const visibleValues = this.getColumnFilterOptions(key)
              .filter(o => !t.trim() || o.label.toLowerCase().includes(t.toLowerCase()))
              .map(o => o.value);
            App.State.itemColumnFilters[key] = [...new Set([...(App.State.itemColumnFilters[key] || []), ...visibleValues])];
            this.onColumnFilterChange(key);
            renderOptions(t);
          });

          panel.querySelector('[data-action="clear"]').addEventListener('click', () => {
            App.State.itemColumnFilters[key] = [];
            this.onColumnFilterChange(key);
            renderOptions(searchInput.value);
          });

          optionsList.addEventListener('click', e => {
            const li = e.target.closest('.po-ms-option');
            if (!li) return;
            const val = li.dataset.value;
            const sel = App.State.itemColumnFilters[key] || (App.State.itemColumnFilters[key] = []);
            const idx = sel.indexOf(val);
            if (idx === -1) sel.push(val);
            else sel.splice(idx, 1);
            this.onColumnFilterChange(key);
            renderOptions(searchInput.value);
          });

          renderOptions('');
          requestAnimationFrame(() => searchInput.focus());

          if (!document.body.dataset.itemColFilterOutsideClickBound) {
            document.body.dataset.itemColFilterOutsideClickBound = '1';
            document.addEventListener('click', e => {
              const openPanel = document.getElementById('itemColFilterPanel');
              if (openPanel && !openPanel.contains(e.target) && !e.target.closest('.th-filter-btn')) {
                openPanel.remove();
              }
            });
          }
        },

        onColumnFilterChange(key) {
          this.updateColumnFilterIcons();
          App.State.itemCurrentPage = 1;
          this.filterData(App.State.itemSearchTerm);
        },

        clearColumnFilters() {
          App.State.itemColumnFilters = { name: [], size: [], narration: [], vendor: [], metadata: [] };
          document.getElementById('itemColFilterPanel')?.remove();
          this.updateColumnFilterIcons();
          App.State.itemCurrentPage = 1;
          this.filterData(App.State.itemSearchTerm);
        },

        populateDatalists() {
          const itemNames = new Set();
          const vendorNames = new Set();
          const sizes = new Set();
          const narrations = new Set();

          App.State.globalItems.forEach(item => {
            if (item.name) itemNames.add(item.name);
            if (item.size) sizes.add(item.size);
            if (item.narration) narrations.add(item.narration);
            (item.vendors || []).forEach(v => {
              if (v.vendor) vendorNames.add(v.vendor);
            });
          });

          const fill = (id, values) => {
            const el = document.getElementById(id);
            if (el)
              el.innerHTML = [...values]
                .map(v => `<option value="${escapeHtml(v)}">`)
                .join('');
          };

          fill('itemList', itemNames);
          fill('vendorList', vendorNames);
          fill('sizeList', sizes);
          fill('narrationList', narrations);
        },

        filterData(searchTerm) {
          App.State.itemSearchTerm = searchTerm || '';
          const term = String(searchTerm || '').toLowerCase().trim();

          let base;
          if (term.includes('pending order')) {
            const pendingMap = App.Utils.getPendingByItem();
            base = App.State.globalItems.filter(item =>
              pendingMap.has(`${(item.name || '').toLowerCase()}|${(item.size || '').toLowerCase()}`)
            );
          } else if (term.includes('low stock')) {
            const stockMap = this._getStockMap();
            base = App.State.globalItems.filter(item => {
              const s = stockMap.get(this._stockKeyFor(item));
              return !!s && s.isLowStock;
            });
          } else if (term.includes('no metadata')) {
            const pendingMap = App.Utils.getPendingByItem();
            const stockMap = this._getStockMap();
            base = App.State.globalItems.filter(item => this.getMetaInfo(item, pendingMap, stockMap).parts.length === 0);
          } else if (term.includes('zero stock')) {
            const pendingMap = App.Utils.getPendingByItem();
            const stockMap = this._getStockMap();
            base = App.State.globalItems.filter(item => {
              const { stockEntry } = this.getMetaInfo(item, pendingMap, stockMap);
              return stockEntry != null && Number(stockEntry.currentStock) === 0;
            });
          } else {
            base = term
              ? App.State.globalItems.filter(item => {
                const vendorNames = (item.vendors || []).map(v => v.vendor || '').join(' ');
                return App.Utils.matchesKeywords(`${item.name || ''} ${item.size || ''} ${vendorNames}`, term);
              })
              : [...App.State.globalItems];
          }

          App.State.filteredItems = this.applyColumnFilters(base);
          App.State.itemCurrentPage = 1;
          this.renderTable();
        },

        // Computes which METADATA_FILTER_OPTIONS values apply to an item,
        // mirroring the logic getMetaInfo uses to render the Meta Data cell.
        getMetadataFlags(item, pendingMap, stockMap) {
          const { parts, stockEntry } = this.getMetaInfo(item, pendingMap, stockMap);
          const flags = new Set();

          const isPending = pendingMap.has(`${(item.name || '').toLowerCase()}|${(item.size || '').toLowerCase()}`);
          if (isPending) flags.add('pendingOrder');
          if (stockEntry?.isLowStock) flags.add('lowStock');
          if (stockEntry != null && Number(stockEntry.currentStock) === 0) flags.add('zeroStock');
          if (item.remarks) flags.add('hasRemarks');
          if (item.specification) flags.add('hasSpecification');
          if (parts.length === 0) flags.add('noMetadata');

          return flags;
        },

        // Narrows a base list down to rows matching every active per-column
        // filter (AND across columns, OR within a column's checked values).
        applyColumnFilters(items) {
          const { name, size, narration, vendor, metadata } = App.State.itemColumnFilters;
          if (!name.length && !size.length && !narration.length && !vendor.length && !metadata.length) return items;

          const pendingMap = metadata.length ? App.Utils.getPendingByItem() : null;
          const stockMap = metadata.length ? this._getStockMap() : null;

          return items.filter(item => {
            if (name.length && !name.includes(item.name || '')) return false;
            if (size.length && !size.includes(item.size || '')) return false;
            if (narration.length && !narration.includes(item.narration || '')) return false;
            if (vendor.length) {
              const itemVendors = (item.vendors || []).map(v => v.vendor || '');
              if (!vendor.some(v => itemVendors.includes(v))) return false;
            }
            if (metadata.length) {
              const flags = this.getMetadataFlags(item, pendingMap, stockMap);
              if (!metadata.some(m => flags.has(m))) return false;
            }
            return true;
          });
        },

        // Builds this item's lookup key for _getStockMap(), matching
        // App.Utils.sameText's trim+lowercase comparison semantics.
        _stockKeyFor(item) {
          return `${String(item.name || '').trim().toLowerCase()}|${String(item.size || '').trim().toLowerCase()}`;
        },

        // Map<name|size, stockEntry> built once from App.State.globalStock —
        // used by getMetaInfo/getMetadataFlags and the 'low stock'/'zero
        // stock' quick filters, instead of each doing its own
        // globalStock.find()/.some() per item (O(items x stock) over the
        // FULL item list otherwise).
        _getStockMap() {
          const map = new Map();
          (App.State.globalStock || []).forEach(s => {
            map.set(this._stockKeyFor(s), s);
          });
          return map;
        },

        // Builds a stable string key for an item row (Name + Size), mirroring
        // App.Stock.stockKey — lets selection use the shared App.Selection helpers.
        itemKey(item) {
          return `${item.name}|${item.size || ''}`;
        },

        // Shared by renderTable (display) and filterData ('no metadata' / 'zero stock')
        // so both agree on what counts as "no metadata" for an item.
        getMetaInfo(item, pendingMap, stockMap) {
          const stockEntry = (stockMap || this._getStockMap()).get(this._stockKeyFor(item));
          const stockPart = stockEntry != null
            ? `<strong>Stock:</strong> <span class="${stockEntry.isLowStock ? 'text-danger fw-bold' : 'text-success fw-bold'}">${stockEntry.currentStock}</span>${stockEntry.isLowStock ? ' <span class="badge bg-danger ms-1 py-0 px-1" style="font-size:0.65rem;">Low</span>' : ''}`
            : null;

          const pendingEntry = (pendingMap || App.Utils.getPendingByItem()).get(
            `${(item.name || '').toLowerCase()}|${(item.size || '').toLowerCase()}`
          );
          const pendingPart = pendingEntry
            ? `<strong>Pending Order:</strong> <span class="text-warning fw-bold">${Math.round(pendingEntry.qty * 100) / 100}</span> ` +
            `<small class="text-muted">(PO# ${[...pendingEntry.poNumbers].map(escapeHtml).join(', ')})</small>`
            : null;

          const parts = [
            stockPart,
            pendingPart,
            item.remarks && `<strong>Remarks:</strong> ${escapeHtml(item.remarks)}`,
            item.specification &&
            `<strong>Specification:</strong> ${escapeHtml(item.specification)}`
          ].filter(Boolean);

          return { parts, stockEntry };
        },

        renderTable() {
          const tbody = document.getElementById('itemTableBody');
          if (!tbody) return;

          const {
            filteredItems,
            itemCurrentPage: cur,
            itemRowsPerPage: rpp
          } = App.State;
          const start = (cur - 1) * rpp;
          const pageItems = filteredItems.slice(start, start + rpp);

          // Update selectAll checkbox state based on visible page items
          const selectAllChk = document.getElementById('selectAllItems');
          if (selectAllChk) {
            selectAllChk.checked = pageItems.length > 0 && pageItems.every(item =>
              App.Selection.isSelected(App.State.selectedItems, this.itemKey(item))
            );
          }

          if (!pageItems.length) {
            tbody.innerHTML = (App.State.globalItems || []).length === 0
              ? '<tr><td colspan="7" class="text-center text-muted p-4">No items yet — register one with <strong>+ Register New Item</strong>.</td></tr>'
              : '<tr><td colspan="7" class="text-center text-muted p-4">No items match your search.</td></tr>';
            this.renderPagination(filteredItems.length);
            return;
          }

          const pendingMap = App.Utils.getPendingByItem();
          const stockMap = this._getStockMap();

          tbody.innerHTML = pageItems
            .map(item => {
              const vendorsHtml = (item.vendors || [])
                .map(
                  v => `
            <span class="badge border border-secondary text-dark me-1 mb-1 fs-6 fw-normal">
              <i class="text-secondary">${escapeHtml(v.vendor)}:</i>
              <strong>${formatCurrency(v.rate)}</strong>
            </span>`
                )
                .join('');

              const { parts: metaParts } = this.getMetaInfo(item, pendingMap, stockMap);

              const encodedName = encodeURIComponent(item.name || '');
              const encodedSize = encodeURIComponent(item.size || '');
              const key = this.itemKey(item);

              const isSelected = App.Selection.isSelected(App.State.selectedItems, key);
              const checkedAttr = isSelected ? 'checked' : '';

              return `
            <tr class="item-row-clickable" style="cursor:pointer;" data-row-name="${encodedName}" data-row-size="${encodedSize}" title="Click to view Item Ledger">
              <td class="text-center">
                <input type="checkbox" class="form-check-input item-select-chk"
                       data-key="${escapeHtml(key)}"
                       ${checkedAttr} onchange="App.Item.onRowSelectChange()">
              </td>
              <td><strong class="text-primary">${escapeHtml(item.name || '')}</strong></td>
              <td>${escapeHtml(item.size || '-')}</td>
              <td>${escapeHtml(item.narration || '-')}</td>
              <td><small class="text-muted">${metaParts.join('<br>') || 'No metadata'}</small></td>
              <td>${vendorsHtml || '<span class="text-muted fst-italic">No vendors mapped</span>'}</td>
              <td>
                <button class="btn btn-sm btn-outline-info text-dark btn-action w-100 mb-1 fw-bold"
                        data-action="item-ledger"
                        data-name="${encodedName}" data-size="${encodedSize}">Item Ledger</button>
                <button class="btn btn-sm btn-outline-primary btn-action w-100 mb-1"
                        data-action="item-edit"
                        data-name="${encodedName}" data-size="${encodedSize}">Edit</button>
                <button class="btn btn-sm btn-outline-danger btn-action w-100"
                        data-action="item-delete"
                        data-name="${encodedName}" data-size="${encodedSize}">Delete</button>
              </td>
            </tr>`;
            })
            .join('');

          this.renderPagination(filteredItems.length);
        },

        renderPagination(totalItems) {
          const container = document.getElementById('itemPagination');
          if (!container) return;

          const { itemRowsPerPage: rpp, itemCurrentPage: cur } = App.State;
          const totalPages = Math.ceil(totalItems / rpp);

          if (!totalItems) {
            container.innerHTML = '';
            return;
          }

          const startItem = (cur - 1) * rpp + 1;
          const endItem = Math.min(cur * rpp, totalItems);

          let html = `<span class="text-secondary fw-bold">Showing ${startItem}–${endItem} of ${totalItems} Items</span>`;

          if (totalPages > 1) {
            html += `<ul class="pagination pagination-sm mb-0 shadow-sm">
            <li class="page-item ${cur === 1 ? 'disabled' : ''}">
              <button class="page-link text-dark" data-action="item-page" data-page="${cur - 1}">Prev</button>
            </li>`;

            let ellipsisLeft = false;
            let ellipsisRight = false;

            for (let i = 1; i <= totalPages; i++) {
              if (
                i === 1 ||
                i === totalPages ||
                (i >= cur - 1 && i <= cur + 1)
              ) {
                const active = cur === i;
                html += `<li class="page-item ${active ? 'active' : ''}">
                <button class="page-link ${active ? 'bg-info border-info text-dark' : 'text-dark'}"
                        data-action="item-page" data-page="${i}">${i}</button>
              </li>`;
              } else if (cur > i && !ellipsisLeft) {
                html +=
                  '<li class="page-item disabled"><span class="page-link text-muted">…</span></li>';
                ellipsisLeft = true;
              } else if (i > cur && !ellipsisRight && totalPages > i) {
                html +=
                  '<li class="page-item disabled"><span class="page-link text-muted">…</span></li>';
                ellipsisRight = true;
              }
            }

            html += `<li class="page-item ${cur === totalPages ? 'disabled' : ''}">
            <button class="page-link text-dark" data-action="item-page" data-page="${cur + 1}">Next</button>
          </li></ul>`;
          }

          container.innerHTML = html;
        },

        changePage(pageNumber) {
          const totalPages =
            Math.ceil(
              App.State.filteredItems.length / App.State.itemRowsPerPage
            ) || 1;
          App.State.itemCurrentPage = Math.max(1, Math.min(totalPages, toNumber(pageNumber, 1)));
          this.renderTable();
        },

        // Computes the variant comparison & transaction history tables for an
        // item (by name), shared by the on-screen modal and bulk print pages.
        getLedgerData(name) {
          const nameLower = name.toLowerCase();
          const compMap = {}; // key: size|vendor (name+size is the item identity; narration is descriptive only)

          const getCKey = (size, vendor) => {
            return `${String(size || '').trim().toLowerCase()}|${String(vendor || '').trim().toLowerCase()}`;
          };

          // A. Gather from PO history (oldest to newest) to extract latest PO rates for vendors
          const sortedPOs = [...(App.State.globalPOs || [])].sort((a, b) => {
            const ad = parseRecordDate(a.poDateRaw, a.poDate);
            const bd = parseRecordDate(b.poDateRaw, b.poDate);
            return ad - bd;
          });

          sortedPOs.forEach(po => {
            (po.items || []).forEach(line => {
              if ((line.name || '').toLowerCase() === nameLower) {
                const key = getCKey(line.size, po.vendor);
                compMap[key] = {
                  size: line.size || '-',
                  narration: line.narration || '-',
                  vendor: po.vendor,
                  masterRate: null,
                  latestPoRate: line.price
                };
              }
            });
          });

          // B. Gather from Items Master
          const itemMasterVariants = (App.State.globalItems || []).filter(i => (i.name || '').toLowerCase() === nameLower);
          itemMasterVariants.forEach(item => {
            (item.vendors || []).forEach(v => {
              const key = getCKey(item.size, v.vendor);
              if (compMap[key]) {
                compMap[key].masterRate = v.rate;
              } else {
                compMap[key] = {
                  size: item.size || '-',
                  narration: item.narration || '-',
                  vendor: v.vendor,
                  masterRate: v.rate,
                  latestPoRate: null
                };
              }
            });
          });

          // C. Render comparison table
          let compHtml = '';
          const compList = Object.values(compMap);

          // Sort by size, then vendor
          compList.sort((a, b) => {
            const sc = a.size.localeCompare(b.size);
            if (sc !== 0) return sc;
            return a.vendor.localeCompare(b.vendor);
          });

          compList.forEach(entry => {
            const vendorInfo = (App.State.globalVendors || []).find(vendor => vendor.name.toLowerCase() === entry.vendor.toLowerCase());
            const contact = vendorInfo ? (vendorInfo.contact || vendorInfo.address || '-') : '-';
            const mRateText = entry.masterRate !== null ? formatCurrency(entry.masterRate) : '-';
            const pRateText = entry.latestPoRate !== null ? formatCurrency(entry.latestPoRate) : '-';

            compHtml += `<tr>
              <td><strong>${escapeHtml(entry.size)}</strong></td>
              <td><small class="text-muted">${escapeHtml(entry.narration)}</small></td>
              <td><strong class="text-primary">${escapeHtml(entry.vendor)}</strong></td>
              <td><small>${escapeHtml(contact)}</small></td>
              <td class="text-end fw-bold">${mRateText}</td>
              <td class="text-end fw-bold text-success">${pRateText}</td>
            </tr>`;
          });

          // 2. BUILD HISTORY (LEDGER) TABLE
          let historyList = [];

          // Query POs -> these represent Ordered Qty (stock not yet received)
          (App.State.globalPOs || []).forEach(po => {
            (po.items || []).forEach(line => {
              if ((line.name || '').toLowerCase() === nameLower) {
                historyList.push({
                  dateObj: parseRecordDate(po.poDateRaw, po.poDate),
                  dateStr: po.poDate,
                  type: 'PO Issued',
                  badgeClass: 'bg-primary',
                  ref: `PO-${po.poNumber}`,
                  vendor: po.vendor,
                  size: line.size || '-',
                  narration: line.narration || '-',
                  orderQty: toNumber(line.qty),
                  incomingQty: 0,
                  outgoingQty: 0,
                  price: line.price
                });
              }
            });
          });

          // Query Bills -> these represent Incoming Qty (stock received from vendor)
          (App.State.globalBills || []).forEach(bill => {
            (bill.items || []).forEach(line => {
              const lineName = typeof line === 'object' ? line.name : String(line).split(' [')[0];
              const lineSize = typeof line === 'object' ? (line.size || '-') : '-';
              const lineQty = typeof line === 'object' ? toNumber(line.qty) : 0;
              const linePrice = typeof line === 'object' ? toNumber(line.price) : 0;

              if (lineName.toLowerCase() === nameLower) {
                historyList.push({
                  dateObj: parseRecordDate(bill.billDateRaw, bill.billDate),
                  dateStr: bill.billDate,
                  type: 'Bill Received',
                  badgeClass: 'bg-success',
                  ref: bill.billNumber,
                  vendor: bill.vendor,
                  size: lineSize,
                  narration: '-',
                  orderQty: 0,
                  incomingQty: lineQty,
                  outgoingQty: 0,
                  price: linePrice
                });
              }
            });
          });

          // Query Returns -> goods sent back to a vendor (Outgoing Qty, mirrors Bills)
          (App.State.globalReturns || []).forEach(ret => {
            (ret.items || []).forEach(line => {
              if ((line.name || '').toLowerCase() === nameLower) {
                historyList.push({
                  dateObj: parseRecordDate(ret.returnDateRaw, ret.returnDate),
                  dateStr: ret.returnDate,
                  type: 'Goods Returned',
                  badgeClass: 'bg-danger',
                  ref: ret.returnNumber,
                  vendor: ret.vendor,
                  size: line.size || '-',
                  narration: '-',
                  orderQty: 0,
                  incomingQty: 0,
                  outgoingQty: toNumber(line.qty),
                  price: toNumber(line.price)
                });
              }
            });
          });

          // Query completed Production lots -> these consume stock per the BOM (Outgoing Qty).
          // Only available once the BOM/Production data has been loaded in this session.
          (App.State.globalProduction || []).forEach(lot => {
            if (String(lot.status || '').trim().toLowerCase() !== 'completed') return;
            const bom = (App.State.globalBOMs || []).find(b => b.productId === lot.productId);
            if (!bom) return;
            (bom.components || []).forEach(comp => {
              if ((comp.itemName || '').toLowerCase() === nameLower) {
                historyList.push({
                  dateObj: parseRecordDate(lot.dateRaw, lot.date),
                  dateStr: lot.date,
                  type: 'Production Consumption',
                  badgeClass: 'bg-danger',
                  ref: lot.productId,
                  vendor: lot.productName || 'Production',
                  size: comp.size || '-',
                  narration: '-',
                  orderQty: 0,
                  incomingQty: 0,
                  outgoingQty: toNumber(lot.qty) * toNumber(comp.qtyPerProduct),
                  price: null
                });
              }
            });
          });

          // Query manual stock corrections / import-driven resets
          (App.State.globalStockAdjustments || []).forEach(adj => {
            if ((adj.itemName || '').toLowerCase() === nameLower) {
              const isReset = adj.action === 'RESET';
              const delta = adj.newValue - adj.oldValue;
              historyList.push({
                dateObj: new Date(adj.date),
                dateStr: new Date(adj.date).toLocaleDateString('en-GB'),
                type: isReset ? 'Stock Reset' : 'Manual Adjustment',
                badgeClass: isReset ? 'bg-info' : 'bg-warning text-dark',
                ref: '-',
                vendor: adj.user || 'System',
                size: adj.size || '-',
                narration: adj.reason || '-',
                orderQty: 0,
                incomingQty: delta > 0 ? delta : 0,
                outgoingQty: delta < 0 ? -delta : 0,
                price: null
              });
            }
          });

          // Sort history list chronologically (newest first)
          historyList.sort((a, b) => b.dateObj - a.dateObj);

          let histHtml = '';
          historyList.forEach(entry => {
            histHtml += `<tr>
              <td>${entry.dateStr}</td>
              <td><span class="badge ${entry.badgeClass}">${entry.type}</span></td>
              <td><strong class="text-dark">${entry.ref}</strong></td>
              <td><strong class="text-primary">${escapeHtml(entry.vendor)}</strong></td>
              <td>${escapeHtml(entry.size)}</td>
              <td><small class="text-muted">${escapeHtml(entry.narration)}</small></td>
              <td class="text-center text-primary fw-bold">${entry.orderQty || '-'}</td>
              <td class="text-center text-success fw-bold">${entry.incomingQty || '-'}</td>
              <td class="text-center text-danger fw-bold">${entry.outgoingQty || '-'}</td>
              <td class="text-end">${entry.price !== null ? formatCurrency(entry.price) : '-'}</td>
            </tr>`;
          });

          // 3. BUILD STOCK POSITION (INITIAL VS CURRENT STOCK PER VARIANT)
          const stockVariants = (App.State.globalStock || [])
            .filter(s => (s.name || '').toLowerCase() === nameLower)
            .sort((a, b) => (a.size || '').localeCompare(b.size || ''));

          const pendingMap = App.Utils.getPendingByItem();

          let stockHtml = '';
          stockVariants.forEach(s => {
            const pendingEntry = pendingMap.get(`${nameLower}|${(s.size || '').toLowerCase()}`);
            const pendingText = pendingEntry
              ? `${Math.round(pendingEntry.qty * 100) / 100} <small class="text-muted">(PO# ${[...pendingEntry.poNumbers].map(escapeHtml).join(', ')})</small>`
              : '-';

            stockHtml += `<tr>
              <td>${escapeHtml(s.size || '-')}</td>
              <td class="text-center fw-bold">${s.initialStock}</td>
              <td class="text-center fw-bold ${s.isLowStock ? 'text-danger' : 'text-success'}">${s.currentStock}</td>
              <td class="text-center fw-bold text-warning">${pendingText}</td>
            </tr>`;
          });

          return { compHtml, histHtml, stockHtml };
        },

        // Lazily fetches Bills/POs/Production/Stock-adjustment history the first
        // time a ledger is requested in this session, so the Transaction Ledger
        // History is complete even if the user hasn't visited those tabs yet.
        // (BOM data is left to its own password-gated load — not fetched here.)
        async ensureLedgerSourceDataLoaded() {
          const fetches = [];
          if (App.State.globalPOs.length === 0) {
            fetches.push(Api.call('getPOData').then(res => {
              if (res?.success) App.State.globalPOs = Array.isArray(res.data) ? res.data : [];
            }));
          }
          if (App.State.globalBills.length === 0) {
            fetches.push(Api.call('getBillData').then(res => {
              if (res?.success) App.State.globalBills = Array.isArray(res.data) ? res.data : [];
            }));
          }
          if (App.State.globalReturns.length === 0) {
            fetches.push(Api.call('getReturnData').then(res => {
              if (res?.success) App.State.globalReturns = Array.isArray(res.data) ? res.data : [];
            }));
          }
          if (App.State.globalProduction.length === 0) {
            fetches.push(Api.call('getProductionData').then(res => {
              if (res?.success) App.State.globalProduction = Array.isArray(res.data) ? res.data : [];
            }));
          }
          if (App.State.globalStockAdjustments.length === 0) {
            fetches.push(Api.call('getStockAdjustmentHistory').then(res => {
              if (res?.success) App.State.globalStockAdjustments = Array.isArray(res.data) ? res.data : [];
            }));
          }
          if (fetches.length) await Promise.all(fetches);
        },

          if (titleEl) {

          const compTableSource = document.getElementById('itemLedgerComparisonBody');

          const histTableSource = document.getElementById('itemLedgerHistoryBody');

          App.Print.trigger('print-item-ledger-container', `Item_Ledger_${name.replace(/[^a-zA-Z0-9_-]/g, '_')}`);

          const items = App.State.globalItems.filter(i => App.Selection.isSelected(selectedKeys, this.itemKey(i)));

          const names = [...new Set(items.map(i => i.name))];

          App.Print.triggerBulk(
            names,
            name => this.buildItemLedgerPrintPageHtml(name),
            'Item_Ledgers_Selected'
          );
        },

          );

          document.getElementById('itemForm')?.reset();

          const origName = document.getElementById('originalItemName');
          if (origName) origName.value = item.name || '';

          const origSize = document.getElementById('originalItemSize');
          if (origSize) origSize.value = item.size || '';

          const title = document.getElementById('itemFormTitle');
          if (title) title.innerText = 'Edit Master Item';

          const submitBtn = document.getElementById('itemSubmitBtn');
          if (submitBtn) submitBtn.innerText = 'Update Item Record';

          const stockRow = document.getElementById('initialStockRow');
          if (stockRow) stockRow.style.display = '';

          const stockHint = document.getElementById('initialStockHint');
          if (stockHint)
            stockHint.textContent = 'Only used to create a Stock entry if this item doesn\'t already have one (e.g. orphaned items). Has no effect otherwise.';

          App.Utils.setFieldValues({
            formItemName: item.name || '',
            formItemSize: item.size || '',
            formItemRemarks: item.remarks || '',
            formItemNarration: item.narration || '',
            formItemSpec: item.specification || '',
            formItemBaseUnit: item.baseUnit || 'Pcs',
            formItemPurchaseUnit: item.purchaseUnit || item.baseUnit || 'Pcs',
            formItemWeightPerBaseUnit: item.weightPerBaseUnit || ''
          });

          const stockEntry = (App.State.globalStock || []).find(
            s => (s.name || '') === (item.name || '') && (s.size || '') === (item.size || '')
          );
          const thresholdInput = document.getElementById('formItemThreshold');
          if (thresholdInput) thresholdInput.value = stockEntry ? (stockEntry.threshold ?? '') : '';

          const tbody = document.getElementById('itemVendorsBody');
          if (tbody) {
            tbody.innerHTML = (item.vendors || []).length
              ? item.vendors.map(v => this.getVendorRowHtml(v)).join('')
              : this.getVendorRowHtml();
          }

          safeModalShow('itemModal');
        },

        async delete(name, size) {
          App.Utils.confirmAction(
            `Are you sure you want to permanently delete "${name}" (${size || 'no size'}) from the Items Master?`,
            async () => {
              try {
                const res = await Api.call('deleteItem', name, size);
                App.Utils.showToast(
                  res?.message || 'Delete completed.',
                  !res?.success
                );
                if (res?.success) {
                  App.State.globalStock = [];
                  await this.loadData();
                }
              } catch (err) {
                App.Utils.showToast(
                  err.message || 'Failed to delete item.',
                  true
                );
              }
            }
          );
        },

        toggleSelectAll(masterChk) {
          App.Selection.toggleAll(App.State.selectedItems, 'item-select-chk', masterChk);
          this.updateBulkDeleteButton();
        },

        onRowSelectChange() {
          App.Selection.syncFromRows(App.State.selectedItems, 'item-select-chk', 'selectAllItems');
          this.updateBulkDeleteButton();
        },

        updateBulkDeleteButton() {
          const count = App.State.selectedItems.length;

          const btn = document.getElementById('btnBulkDeleteItems');
          if (btn) {
            if (count > 0) {
              btn.classList.remove('d-none');
              btn.innerHTML = `<i class="bi bi-trash"></i> Delete Selected (${count})`;
            } else {
              btn.classList.add('d-none');
            }
          }

          const mergeBtn = document.getElementById('btnMergeSelected');
          if (mergeBtn) mergeBtn.classList.toggle('d-none', count !== 2);

          App.Selection.updateButton('btnBulkPrintItems', count, '<i class="bi bi-printer"></i> Print Selected');
        },

        async mergeSelected() {
          const selectedKeys = App.State.selectedItems;
          if (selectedKeys.length !== 2) {
            App.Utils.showToast('Check exactly 2 items to merge.', true);
            return;
          }

          // Resolve in selection order (first checked = keep, second = remove) —
          // a plain filter() would return them in table order instead.
          const selected = selectedKeys.map(key => App.State.globalItems.find(i => this.itemKey(i) === key)).filter(Boolean);
          if (selected.length !== 2) {
            App.Utils.showToast('Selected items could not be resolved. Please refresh and try again.', true);
            return;
          }

          const [keep, remove] = selected;
          App.Utils.confirmAction(
            `Merge "${remove.name}" (${remove.size || 'no size'}) into "${keep.name}" (${keep.size || 'no size'})? ` +
            `"${keep.name}" will survive with combined stock, vendors, remarks/narration/spec, and "${remove.name}" will be deleted. ` +
            `Any PO/Bill/BOM rows referencing "${remove.name}" will be re-pointed to "${keep.name}". This cannot be undone.`,
            async () => {
              try {
                setDisabled('btnMergeSelected', true);
                const res = await Api.call('mergeSelectedItems', selected);
                App.Utils.showToast(res?.message || 'Merge complete.', !res?.success);
                if (res?.success) {
                  App.State.selectedItems = [];
                  this.updateBulkDeleteButton();
                  App.State.globalStock = [];
                  await this.loadData();
                }
              } catch (err) {
                App.Utils.showToast(err.message || 'Merge failed.', true);
              } finally {
                setDisabled('btnMergeSelected', false);
              }
            }
          );
        },

        async bulkDelete() {
          const count = App.State.selectedItems.length;
          if (count === 0) return;

          App.Utils.confirmAction(
            `Are you sure you want to permanently delete the ${count} selected item(s) from the Items Master?`,
            async () => {
              try {
                setDisabled('btnBulkDeleteItems', true);
                App.Utils.showToast('Deleting selected items...');
                const items = App.State.globalItems.filter(i => App.Selection.isSelected(App.State.selectedItems, this.itemKey(i)));
                const res = await Api.call('deleteItemsBulk', items);
                App.Utils.showToast(res?.message || 'Bulk delete completed.', !res?.success);
                if (res?.success) {
                  // Deletion also removes the matching Stock rows server-side
                  // (deleteItemsBulk -> syncStockForItem 'remove'). Reload
                  // instead of patching local arrays so the table and stock
                  // cache can't drift out of sync with what's on the sheet —
                  // clearing globalStock forces loadData() to refetch it too.
                  App.State.selectedItems = [];
                  App.State.globalStock = [];
                  await this.loadData();
                }
              } catch (err) {
                App.Utils.showToast(err.message || 'Failed to bulk delete items.', true);
              } finally {
                setDisabled('btnBulkDeleteItems', false);
              }
            }
          );
        },

        addVendorRow() {
          document
            .getElementById('itemVendorsBody')
            ?.insertAdjacentHTML('beforeend', this.getVendorRowHtml());
        },

        getVendorRowHtml(vendor = {}) {
          // Rate is quoted per Purchase Unit (set above) — show the Base Unit
          // equivalent as a hint when it differs, so it's obvious what this
          // rate actually costs per Pcs/whatever Stock/BOM track in.
          const hint = (vendor.ratePerBaseUnit && Math.abs(vendor.ratePerBaseUnit - (vendor.rate || 0)) > 0.0001)
            ? `<div class="form-text">&#8776; &#8377;${Number(vendor.ratePerBaseUnit).toFixed(4)} per Base Unit</div>`
            : '';
          return `
          <tr>
            <td><input type="text"   class="form-control item-vendor-name" list="vendorList" value="${escapeHtml(vendor.vendor || '')}" placeholder="e.g. Avon Cycles" required></td>
            <td><input type="number" class="form-control item-vendor-rate" step="0.01"        value="${escapeHtml(String(vendor.rate ?? ''))}" placeholder="0.00 (optional)" min="0">${hint}</td>
            <td><button type="button" class="btn btn-outline-danger btn-sm" data-action="remove-row">✕</button></td>
          </tr>`;
        },

        async syncFromStock() {
          App.Utils.confirmAction(
            'Import all items from the Stock sheet that are not yet in Item Master? They will be added with blank metadata — you can enrich them later via Edit.',
            async () => {
              const btn = document.getElementById('btnSyncFromStock');
              try {
                if (btn) { btn.disabled = true; btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Syncing…'; }
                const res = await Api.call('importItemsFromStock');
                App.Utils.showToast(res?.message || 'Sync complete.', !res?.success);
                if (res?.success) await this.loadData();
              } catch (err) {
                App.Utils.showToast(err.message || 'Sync failed.', true);
              } finally {
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Sync from Stock'; }
              }
            }
          );
        },

        async mergeDuplicates() {
          App.Utils.confirmAction(
            'Scan Item Master for duplicates? This will: (1) auto-fix rows whose name is an unambiguous truncated/typo prefix of another row with the same size (renaming, merging stock, and re-pointing PO/Bill/BOM references), then (2) merge any remaining rows that share the exact same Name + Size (combining their remarks/narration/spec and vendor rates). This cannot be undone.',
            async () => {
              const btn = document.getElementById('btnMergeDuplicates');
              try {
                if (btn) { btn.disabled = true; btn.innerHTML = '<i class="bi bi-magic"></i> Merging…'; }
                const res = await Api.call('runScheduledItemCleanup');
                App.Utils.showToast(res?.message || 'Merge complete.', !res?.success);
                if (res?.success) {
                  App.State.globalStock = [];
                  await this.loadData();
                }
              } catch (err) {
                App.Utils.showToast(err.message || 'Merge failed.', true);
              } finally {
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-magic"></i> Merge Duplicates'; }
              }
            }
          );
        },

        serializeForm() {
          const form = document.getElementById('itemForm');
          const formData = Object.fromEntries(new FormData(form));
          const vendors = [];

          $$('#itemVendorsBody tr').forEach(row => {
            const vendor = $('.item-vendor-name', row)?.value?.trim();
            if (vendor)
              vendors.push({
                vendor,
                rate: toNumber($('.item-vendor-rate', row)?.value)
              });
          });

          formData.vendors = JSON.stringify(vendors);
          formData.originalName =
            document.getElementById('originalItemName')?.value || '';
          formData.originalSize =
            document.getElementById('originalItemSize')?.value || '';
          return { formData, vendors };
        }
      };


    // ==========================================
    // BOM MASTER NAMESPACE
    // ==========================================
    App.State.globalBOMs = [];
    App.State.filteredBOMs = [];
    App.State.selectedBOMs = [];

    // Default suggested cost categories pre-filled when opening the BOM modal
    const DEFAULT_COST_CATEGORIES = ['Labor - Fitting', 'Rim Fitting', 'Paint Cost', 'General Office Expenses'];

    // ==========================================
    // PRODUCTS & PROCESSES NAMESPACE (merged tab)
    // Thin wrapper that owns the sub-tab switching between the Processes
    // sub-tab (App.Process) and the Products/BOM sub-tab (App.BOM).
    // ==========================================
    App.Products = {
      async enterTab() {
        this.switchSubTab('processTab');
      },

      switchSubTab(id) {
        $$('.products-sub-tab').forEach(t => t.style.display = 'none');
        const target = document.getElementById(id);
        if (target) target.style.display = 'block';

        $$('#productsSubTabs .nav-link').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + id)?.classList.add('active');

        if (id === 'processTab' && typeof App.Process !== 'undefined') {
          App.Process.loadData();
          // Process table groups by Model and Process Type (see
          // App.Process.renderTable) — both masters need to be loaded even
          // when landing on this sub-tab directly, not just via the BOM
          // sub-tab's own enterTab().
          App.Model.ensureLoaded();
          App.ProcessType.ensureLoaded();
        }
        if (id === 'bomTab' && typeof App.BOM !== 'undefined') App.BOM.enterTab();
      }
    };

    App.BOM = {
      // ── Access control (password-protected BOM data) ────────────────
      BOM_TOKEN_KEY: 'bomAccessToken',

      getToken() {
        return sessionStorage.getItem(this.BOM_TOKEN_KEY) || '';
      },

      setToken(token) {
        sessionStorage.setItem(this.BOM_TOKEN_KEY, token);
      },

      clearToken() {
        sessionStorage.removeItem(this.BOM_TOKEN_KEY);
      },

      // Called whenever the BOM tab is opened.
      enterTab() {
        App.Process.ensureLoaded();
        App.Contractor.ensureLoaded();
        App.Color.ensureLoaded();
        App.Model.ensureLoaded();
        App.ProcessType.ensureLoaded();
        if (this.getToken()) {
          this.loadData();
        } else {
          this.showLockedState();
          this.promptForAccess();
        }
      },

      showLockedState() {
        const tbody = document.getElementById('bomTableBody');
        if (tbody) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center p-5">
        <i class="bi bi-lock-fill fs-1 text-muted d-block mb-3"></i>
        <h5 class="fw-bold text-dark">Password Protected</h5>
        <p class="text-muted mb-3">This section contains confidential cost and pricing data.</p>
        <button class="btn btn-primary fw-bold" onclick="App.BOM.promptForAccess()">Enter Password</button>
      </td></tr>`;
        }
        const emptyState = document.getElementById('bomEmptyState');
        if (emptyState) emptyState.style.display = 'none';
        const pagination = document.getElementById('bomPagination');
        if (pagination) pagination.innerHTML = '';
      },

      promptForAccess() {
        const errorEl = document.getElementById('bomAccessError');
        const input = document.getElementById('bomAccessPassword');
        if (errorEl) errorEl.style.display = 'none';
        if (input) input.value = '';

        const modalEl = document.getElementById('bomAccessModal');
        if (modalEl && typeof bootstrap !== 'undefined') {
          bootstrap.Modal.getOrCreateInstance(modalEl).show();
          setTimeout(() => input?.focus(), 300);
        }
      },

      async submitAccessPassword() {
        const input = document.getElementById('bomAccessPassword');
        const errorEl = document.getElementById('bomAccessError');
        const submitBtn = document.getElementById('bomAccessSubmitBtn');
        const password = input ? input.value : '';

        if (submitBtn) submitBtn.disabled = true;

        try {
          const response = await Api.call('verifyBOMAccess', password);
          if (response.success) {
            this.setToken(response.data.token);
            const modalEl = document.getElementById('bomAccessModal');
            if (modalEl && typeof bootstrap !== 'undefined') {
              bootstrap.Modal.getInstance(modalEl)?.hide();
            }
            await this.loadData();
          } else if (errorEl) {
            errorEl.textContent = response.message;
            errorEl.style.display = 'block';
          }
        } catch (err) {
          if (errorEl) {
            errorEl.textContent = err.message || 'Failed to verify password.';
            errorEl.style.display = 'block';
          }
        } finally {
          if (submitBtn) submitBtn.disabled = false;
        }
      },

      // ── Data loading ──────────────────────────────────────────────
      // Loads the full BOM dataset (with costs/rates) for the BOM tab.
      // Requires a valid access token; re-prompts if missing/expired.
      async loadData() {
        const token = this.getToken();
        if (!token) {
          this.promptForAccess();
          return;
        }

        const tbody = document.getElementById('bomTableBody');
        if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4">Loading BOM Database...</td></tr>';

        try {
          const response = await Api.call('getBOMData', token);
          if (!response.success) {
            if (response.message && response.message.indexOf('password-protected') !== -1) {
              this.clearToken();
              this.promptForAccess();
              return;
            }
            App.Utils.showToast(response.message, true);
            return;
          }
          App.State.globalBOMs = response.data;
          App.State.filteredBOMs = response.data;
          App.State.bomCurrentPage = 1;
          App.State.selectedBOMs = [];
          this.renderTable();

          // Update Product ID dropdowns in Production tab
          if (App.Production && App.Production.populateProductSelect) {
            App.Production.populateProductSelect();
          }
        } catch (err) {
          App.Utils.showToast(err.message || 'Failed to load BOM database', true);
        }
      },

      // Loads a cost-free product list (no rates/costs) on app startup so the
      // Production tab's Product dropdown and production sheets work for all
      // users, even before the BOM password has been entered.
      async loadProductionData() {
        try {
          const response = await Api.call('getBOMProductionData');
          if (!response.success) {
            console.error('[BOM] ', response.message);
            return;
          }
          App.State.globalBOMs = response.data;
          App.State.filteredBOMs = response.data;

          if (App.Production && App.Production.populateProductSelect) {
            App.Production.populateProductSelect();
          }
        } catch (err) {
          console.error('[BOM] Failed to load product list:', err.message);
        }
      },

      filterData(searchTerm) {
        const term = searchTerm.toLowerCase().trim();
        if (!term) {
          App.State.filteredBOMs = App.State.globalBOMs;
        } else {
          App.State.filteredBOMs = App.State.globalBOMs.filter(bom => {
            const haystack = [
              bom.productId,
              bom.productName,
              ...bom.components.map(c => `${c.itemName} ${c.vendor}`)
            ].join(' ');
            return App.Utils.matchesKeywords(haystack, term);
          });
        }
        App.State.bomCurrentPage = 1;
        this.renderTable();
      },

      changePage(page) {
        App.State.bomCurrentPage = App.Utils.clampPage(page, App.State.filteredBOMs.length, App.State.bomRowsPerPage);
        this.renderTable();
      },

      renderTable() {
        const tbody = document.getElementById('bomTableBody');
        if (!tbody) return;

        const emptyState = document.getElementById('bomEmptyState');
        if (App.State.filteredBOMs.length === 0) {
          tbody.innerHTML = '';
          if (emptyState) emptyState.style.display = 'block';
          App.Utils.renderPagination('bomPagination', 0, 1, App.State.bomRowsPerPage, 'bom-page', 'Products');
          this.updateBulkButtons();
          return;
        }
        if (emptyState) emptyState.style.display = 'none';

        // Drag-and-drop reordering (and the "show everything on one page so
        // dragging isn't limited to the current page") only makes sense in
        // the default, unfiltered view — once searching, normal pagination
        // and a static order both resume.
        const searchEl = document.getElementById('searchBOM');
        const isFiltered = !!(searchEl && searchEl.value.trim());
        const dragEnabled = !isFiltered;

        const { filteredBOMs, bomCurrentPage: cur, bomRowsPerPage: pagedRpp } = App.State;
        const rpp = isFiltered ? pagedRpp : Math.max(filteredBOMs.length, 1);
        const start = (cur - 1) * rpp;
        const pageItems = filteredBOMs.slice(start, start + rpp);

        const selectAllChk = document.getElementById('selectAllBOMs');
        if (selectAllChk) {
          selectAllChk.checked = pageItems.length > 0 &&
            pageItems.every(bom => App.Selection.isSelected(App.State.selectedBOMs, bom.productId));
        }

        let html = '';
        pageItems.forEach(bom => {
          const idx = App.State.globalBOMs.indexOf(bom);
          const key = String(bom.productId);
          const checked = App.Selection.isSelected(App.State.selectedBOMs, key) ? 'checked' : '';

          // Build a flat list of component lines, with a small group badge when
          // the BOM spans more than one process group.
          const groupOrder = [];
          const groupMap = {};
          bom.components.forEach(c => {
            const groupName = c.processGroup || 'General';
            if (!groupMap[groupName]) { groupMap[groupName] = []; groupOrder.push(groupName); }
            groupMap[groupName].push(c);
          });

          const multiGroup = groupOrder.length > 1;
          const componentLines = bom.components.map(c => {
            const groupBadge = multiGroup
              ? `<span class="badge bg-secondary me-1" style="font-size:0.65em;vertical-align:middle;">${escapeHtml(c.processGroup || 'General')}</span>`
              : '';
            const colorBadge = c.color
              ? `<span class="badge bg-info text-dark me-1" style="font-size:0.65em;vertical-align:middle;">${escapeHtml(c.color)}</span>`
              : '';
            return `${groupBadge}${colorBadge}• ${escapeHtml(c.itemName)} [${escapeHtml(c.size || '-')}] (${escapeHtml(String(c.qtyPerProduct))} qty @ ${formatCurrency(c.rate)} from ${escapeHtml(c.vendor || 'Custom')})`;
          });

          const PREVIEW_LIMIT = 3;
          const needsToggle = componentLines.length > PREVIEW_LIMIT;
          const previewId = `bom_cpreview_${key}`;

          let componentsCell;
          if (!needsToggle) {
            componentsCell = componentLines.join('<br>');
          } else {
            const visibleHtml = componentLines.slice(0, PREVIEW_LIMIT).join('<br>');
            const allHtml = componentLines.join('<br>');
            const remaining = componentLines.length - PREVIEW_LIMIT;
            componentsCell = `
          <div class="bom-preview-collapsed">
            ${visibleHtml}
            <br><a href="#" class="text-primary small fw-bold mt-1 d-inline-block" onclick="event.preventDefault();App.BOM.toggleComponents('${key}',true)">&#9660; Show ${remaining} more</a>
          </div>
          <div class="bom-preview-expanded" style="display:none">
            ${allHtml}
            <br><a href="#" class="text-muted small fw-bold mt-1 d-inline-block" onclick="event.preventDefault();App.BOM.toggleComponents('${key}',false)">&#9650; Show less</a>
          </div>`;
          }

          const rowAttrs = dragEnabled
            ? `draggable="true" ondragstart="App.BOM.onDragStart(event,'${escapeHtml(bom.productId)}')" ondragover="App.BOM.onDragOver(event)" ondrop="App.BOM.onDrop(event,'${escapeHtml(bom.productId)}')" ondragend="App.BOM.onDragEnd(event)"`
            : '';
          const handleCell = dragEnabled
            ? '<td class="text-center text-muted" style="cursor:grab;"><i class="bi bi-grip-vertical"></i></td>'
            : '<td></td>';

          html += `<tr ${rowAttrs}>
        ${handleCell}
        <td class="text-center"><input type="checkbox" class="form-check-input bom-select-chk" data-key="${escapeHtml(key)}" ${checked} onchange="App.BOM.onRowSelectChange()"></td>
        <td><span class="badge bg-dark fs-6 shadow-sm">${escapeHtml(bom.productId)}</span></td>
        <td><strong class="text-primary">${escapeHtml(bom.productName)}</strong></td>
        <td id="${previewId}"><small class="text-muted" style="line-height: 1.6;">${componentsCell}</small></td>
        <td class="text-end fw-bold text-success">${formatCurrency(bom.grandTotal ?? bom.totalCost)}</td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-primary btn-action w-100 mb-1" onclick="App.BOM.openEditModal('${idx}')">Edit BOM</button>
          <button class="btn btn-sm btn-outline-dark btn-action w-100 mb-1" onclick="App.BOM.openDuplicateModal('${idx}')">Duplicate BOM</button>
          <button class="btn btn-sm btn-danger btn-action w-100" onclick="App.BOM.delete('${escapeHtml(bom.productId)}')">Delete</button>
        </td>
      </tr>`;
        });

        tbody.innerHTML = html;

        App.Utils.renderPagination('bomPagination', filteredBOMs.length, cur, rpp, 'bom-page', 'Products');
        this.updateBulkButtons();
      },

      // Drag-and-drop manual reorder (default unfiltered view only — see
      // renderTable's dragEnabled check). _dragSrcId tracks which row is
      // currently being dragged between dragstart and drop.
      _dragSrcId: null,

      onDragStart(e, productId) {
        this._dragSrcId = productId;
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', productId); } catch (err) { /* ignored */ }
        }
      },

      onDragOver(e) {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      },

      async onDrop(e, targetProductId) {
        e.preventDefault();
        const srcId = this._dragSrcId;
        this._dragSrcId = null;
        if (!srcId || srcId === targetProductId) return;

        const order = [...App.State.globalBOMs].sort((a, b) => a.sequence - b.sequence).map(b => b.productId);
        const fromIdx = order.indexOf(srcId);
        if (fromIdx === -1 || order.indexOf(targetProductId) === -1) return;
        order.splice(fromIdx, 1);
        const toIdx = order.indexOf(targetProductId);
        order.splice(toIdx, 0, srcId);

        try {
          const res = await Api.call('reorderBOM', order, this.getToken());
          if (!res.success) {
            App.Utils.showToast(res.message, true);
            return;
          }
          this.loadData();
        } catch (err) {
          App.Utils.showToast(err.message || 'Failed to reorder products', true);
        }
      },

      onDragEnd() {
        this._dragSrcId = null;
      },

      toggleSelectAll(masterChk) {
        App.Selection.toggleAll(App.State.selectedBOMs, 'bom-select-chk', masterChk);
        this.updateBulkButtons();
      },

      onRowSelectChange() {
        App.Selection.syncFromRows(App.State.selectedBOMs, 'bom-select-chk', 'selectAllBOMs');
        this.updateBulkButtons();
      },

      updateBulkButtons() {
        const count = App.State.selectedBOMs.length;
        App.Selection.updateButton('btnBulkDeleteBOMs', count, '<i class="bi bi-trash"></i> Delete Selected');
        App.Selection.updateButton('btnBulkPrintBOMs', count, '<i class="bi bi-printer"></i> Print Selected');
      },

      // Read-only diagnostic (module_bom.js#getBomProcessComponentsDrift) —
      // never blocks or changes anything, just surfaces where a product's
      // BOM costing qty and its process's actual recipe qty for the same
      // item have drifted apart, so a human can judge whether that's
      // intentional or a data-entry slip.
      async checkRecipeDrift() {
        try {
          const res = await Api.call('getBomProcessComponentsDrift');
          if (!res?.success) {
            App.Utils.showToast(res?.message || 'Failed to check recipe drift.', true);
            return;
          }
          const drift = res.data || [];
          if (drift.length === 0) {
            App.Utils.showToast(res.message || 'No drift found — BOM and process recipe quantities match everywhere they overlap.');
            return;
          }
